<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>五上P6练习一第10题，7个小正方体组合体对比</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      padding: 24px;
      gap: 24px;
      background-color: #f8fafc;
    }

    /* Left Panel: Primary Reference Model */
    .left-panel {
      flex: 0 0 38%;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .panel-header {
      position: absolute;
      top: 16px;
      left: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .question-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #0284c7;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      border-radius: 50%;
      width: 26px;
      height: 26px;
    }

    .panel-title {
      font-size: 17px;
      font-weight: 600;
      color: #334155;
      letter-spacing: 0.2px;
    }

    /* Right Panel: 2x2 Grid (A, B, C, D) */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 2.5px solid #2ba3db;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(43, 163, 219, 0.08);
    }

    .grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100%;
      height: 100%;
    }

    .grid-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 2px solid #2ba3db;
      border-bottom: 2px solid #2ba3db;
      background: #ffffff;
      cursor: grab;
      overflow: hidden;
      transition: background-color 0.15s ease;
    }

    .grid-card:hover {
      background-color: #fbfdff;
    }

    .grid-card:active,
    .left-panel:active {
      cursor: grabbing;
    }

    .grid-card:nth-child(2n) {
      border-right: none;
    }

    .grid-card:nth-child(3),
    .grid-card:nth-child(4) {
      border-bottom: none;
    }

    .model-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .card-label {
      position: absolute;
      right: 22px;
      bottom: 16px;
      font-size: 26px;
      font-weight: 700;
      color: #1e293b;
      font-family: "Times New Roman", Times, serif;
      pointer-events: none;
      z-index: 5;
    }

    /* Subtitle hint */
    .hint-bar {
      position: absolute;
      bottom: 14px;
      left: 20px;
      font-size: 12.5px;
      color: #94a3b8;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>

  <div class="app-container">
    <!-- Left: Reference Model -->
    <div class="left-panel" id="card-left">
      <div class="panel-header">
        <span class="question-badge">10</span>
        <span class="panel-title">右边的四个选项中，哪个组合体与左边的不同？</span>
      </div>
      <canvas class="model-canvas" id="canvas-left"></canvas>
      <div class="hint-bar">可单指/鼠标拖动三维观察 · 松手自动吸附对齐</div>
    </div>

    <!-- Right: 2x2 Grid (A, B, C, D) -->
    <div class="right-panel">
      <div class="grid-2x2">
        <div class="grid-card" id="card-A">

          <span class="card-label">A</span>
        </div>
        <div class="grid-card" id="card-B">
          <canvas class="model-canvas" id="canvas-B"></canvas>
          <span class="card-label">B</span>
        </div>
        <div class="grid-card" id="card-C">
          <canvas class="model-canvas" id="canvas-C"></canvas>
          <span class="card-label">C</span>

        <div class="grid-card" id="card-D">
          <canvas class="model-canvas" id="canvas-D"></canvas>
          <span class="card-label">D</span>
        </div>
      </div>
    </div>
  </div>
