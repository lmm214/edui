  </head>
  <body>
    <header class="app-header">
      <div class="identity-bar floating">
        <a class="brand" href="#workbench" aria-label="折剪工坊工作台">
          <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true">
            <rect width="44" height="44" rx="12" fill="#315cdb" />
            <path d="m6.5 18.7 12.7 1.5L31 8.5l-2.1 11.3 8.5-3.2-6.2 6.6-5.8.7-4 10.4-3.7-7.6z" fill="#fff" />
            <path d="m6.5 18.7 15.4 5.2-4.2 2.8z" fill="#b5ceff" />
            <path d="m19.2 20.2 2.7 3.7L31 8.5z" fill="#d4e3ff" />
            <path d="m21.9 23.9-.5 10.4 4-10.4z" fill="#91b4fa" />
          </svg>
          <span class="brand-name">折剪工坊<span lang="en">PAPER STUDIO</span></span>
        </a>
        <span class="bar-divider"></span>
        <nav aria-label="主导航">
          <button id="navStudio" class="nav-button selected" aria-current="page" title="创作台">
            <i data-icon="work"></i><span>创作台</span>
          </button>
          <button id="navLibrary" class="nav-button" title="作品册" aria-label="作品册">
            <i data-icon="album"></i><span>作品册</span>
          </button>
        </nav>
      </div>
      <button id="helpBtn" class="head-button floating" title="操作指南" aria-label="操作指南">
        <i data-icon="help"></i>
      </button>
    </header>
    <main id="workbench">
      <section id="studioPage" aria-label="折剪创作台">
        <h1 class="sr-only">折剪创作画布</h1>
        <div id="stage" aria-label="可平移和缩放的折剪纸画布">
          <div id="paperViewport" aria-hidden="true"></div>
          <canvas id="doodleCanvas"></canvas><canvas id="cutCanvas"></canvas>
        </div>
        <svg id="foldGuide" aria-hidden="true" hidden>
          <path class="guide-axis"></path>
          <path class="guide-curve"></path>
          <path class="guide-tip"></path>
          <circle class="guide-ring" r="9"></circle>
          <circle class="guide-dot" r="3"></circle>
        </svg>
        <div id="guideLabel" hidden>向左拖动纸边</div>

        <div id="engineNotice" role="status" hidden></div>
        <div id="tourHost" hidden></div>
        <div class="tool-dock floating" role="group" aria-label="画布工具">
          <div class="dock-items">
            <button
              data-mode="fold"
              aria-controls="toolsPanel"
              aria-expanded="false"
              aria-pressed="true"
              title="折纸工具"
              class="dock-button on"
            >
              <i data-icon="fold"></i><span>折纸</span>
            </button>
            <button
              data-mode="cut"
              aria-controls="toolsPanel"
              aria-expanded="false"
              aria-pressed="false"
              title="剪纸工具"
              class="dock-button"
            >
              <i data-icon="scissors"></i><span>剪纸</span>
            </button>
            <button
              data-mode="pen"
              aria-controls="toolsPanel"
              aria-expanded="false"
              aria-pressed="false"
              title="画笔工具"
              class="dock-button"
            >
              <i data-icon="pen"></i><span>画笔</span>
            </button>
            <button id="panBtn" aria-pressed="false" title="移动画布（也可按住空格拖动）" class="dock-button">
              <i data-icon="hand"></i><span>移动</span>
            </button>
            <span class="dock-divider" aria-hidden="true"></span>
            <button id="expandDockBtn" class="dock-button" title="展开纸张" disabled>
              <i data-icon="unfold"></i><span>展开</span>
            </button>
            <button
              id="ideasDockBtn"
              class="dock-button"
              title="窗花灵感与折剪演示"
              aria-controls="ideasPanel"
              aria-expanded="false"
            >
              <i data-icon="flower"></i><span>灵感</span>
            </button>
            <button id="undoBtn" title="撤销上一剪" aria-label="撤销上一剪" class="dock-button" disabled>
              <i data-icon="undo"></i><span>撤销</span>
            </button>
            <button id="newBtn" class="dock-button" title="更换纸张">
              <i data-icon="new"></i><span>换纸</span>
            </button>
          </div>
          <section id="toolsPanel" class="dock-flyout floating" aria-labelledby="toolsTitle" hidden>
            <div class="panel-heading">
              <h2 id="toolsTitle">折纸工具</h2>
              <button class="flyout-close" aria-label="收起工具菜单"><i data-icon="close"></i></button>
            </div>
            <div id="settingsBody" class="settings-body">
              <div id="foldTools" class="mode-body">
                <h3>折叠方式</h3>
                <div class="segmented" role="group" aria-label="折叠方式">
                  <button data-fold-mode="half" class="on" aria-pressed="true">均等对折</button>
                  <button data-fold-mode="free" aria-pressed="false">自由折叠</button>
                </div>
                <div id="quickFolds">
                  <h3>快捷对折</h3>
                  <div class="quick-grid">
                    <button data-fold="vertical"><i data-icon="vfold"></i><span>左右对折</span></button>
                    <button data-fold="horizontal"><i data-icon="hfold"></i><span>上下对折</span></button>
                    <button data-fold="diagonal"><i data-icon="dfold"></i><span>对角折</span></button>
                    <button id="sectorFold" hidden><i data-icon="sector"></i><span>扇形对折</span></button>
                  </div>
                </div>
                <p id="freeHint" class="tool-hint" hidden>拖住纸边，移到想折的位置后松手。</p>
              </div>
              <div id="cutTools" class="mode-body" hidden>
                <h3>选择剪法</h3>
                <div class="cut-grid" role="group" aria-label="剪刀工具"></div>
              </div>
              <div id="penTools" class="mode-body" hidden>
                <h3>画布标注</h3>
                <p class="tool-hint">用手指或鼠标画出对称轴，标记你的猜想。</p>
                <button id="clearPen" class="outline" aria-label="清除画笔标注">
                  <i data-icon="erase"></i>清除标注
                </button>
              </div>
              <details class="palette">
                <summary>
                  <span class="color-chip" id="activeColorChip"></span>纸色<span id="colorName" class="sr-only"
                    >朱红</span
                  >
                </summary>
                <div class="swatches" role="group" aria-label="纸张颜色"></div>
              </details>
            </div>
          </section>
          <section id="unfoldMenu" class="dock-flyout floating" aria-labelledby="unfoldTitle" hidden>
            <div class="panel-heading">
              <h2 id="unfoldTitle">展开纸张</h2>
              <button class="flyout-close" aria-label="收起展开菜单"><i data-icon="close"></i></button>
            </div>
            <div class="unfold-actions">
              <button id="oneFoldBtn" class="outline">展开一折</button
              ><button id="unfoldBtn" class="unfold-button"><i data-icon="unfold"></i>全部展开</button>
            </div>
          </section>
          <section id="ideasPanel" class="dock-flyout floating" aria-labelledby="inspireTitle" hidden>
            <div class="panel-heading">
              <h2 id="inspireTitle">窗花灵感</h2>
              <button class="flyout-close" aria-label="收起窗花灵感"><i data-icon="close"></i></button>
            </div>
            <div id="ideasBody"><div id="patternList" class="patterns"></div></div>
          </section>
        </div>
        <div class="viewbar">
          <div class="zoom-control floating" role="group" aria-label="画布视图">
            <button id="zoomOut" aria-label="缩小" title="缩小"><i data-icon="minus"></i></button>
            <output id="zoomVal">100%</output>
            <button id="zoomIn" aria-label="放大" title="放大"><i data-icon="plus"></i></button>
            <span class="bar-divider"></span>
            <button id="zoomReset" title="纸张居中并恢复大小" aria-label="纸张居中并恢复大小">
              <i data-icon="fit"></i>
            </button>
          </div>
        </div>
        <button class="primary" id="saveBtn"><i data-icon="save"></i><span>保存作品</span></button>
        <div id="cutChoice" hidden>
          <span>剪去哪一块？</span><button id="swapBtn"><i data-icon="swap"></i>互换</button
          ><button id="confirmCutBtn">确定</button>
        </div>
      </section>
      <section id="libraryPage" hidden aria-labelledby="libraryTitle">
        <div class="library-heading">
          <div>
            <h1 id="libraryTitle">我的作品册</h1>
            <p>保存在此浏览器中的折剪作品。</p>
          </div>
          <button class="primary" id="backStudio"><i data-icon="work"></i>返回创作台</button>
        </div>
        <div id="libraryList"></div>
      </section>
    </main>
    <dialog id="dialog" aria-labelledby="dialogTitle">
      <div class="dialog-heading">
        <h2 id="dialogTitle"></h2>
        <button type="button" class="icon-button" id="dialogClose" aria-label="关闭">
          <i data-icon="close"></i>
        </button>
      </div>
      <div id="dialogBody"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
