  </head>
  <body>
    <header class="app-header">
      <div class="identity-bar floating">
        <a class="brand" href="#workbench" aria-label="折剪工坊工作台">
          <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true">
            <rect width="44" height="44" rx="12" fill="#315cdb" />
            <path d="m6.5 18.7 12.7 1.5L31 8.5l-2.1 11.3 8.5-3.2-6.2 6.6-5.8.7-4 10.4-3.7-7.6z" fill="#fff" />
            <path d="m6.5 18.7 15.4 5.2-4.2 2.8z" fill="#b5ceff" />
            <path d="m19.2 20.2 2.7 3.7L31 8.5z" fill="#d4e3ff" />
            <path d="m21.9 23.9-.5 10.4 4-10.4z" fill="#91b4fa" />
          </svg>
          <span class="brand-name">折剪工坊<span lang="en">PAPER STUDIO</span></span>
        </a>
        <span class="bar-divider"></span>
        <nav aria-label="主导航">
          <button id="navStudio" class="nav-button selected" aria-current="page" title="创作台">
            <i data-icon="work"></i><span>创作台</span>
          </button>
          <button id="navLibrary" class="nav-button" title="作品册" aria-label="作品册">
            <i data-icon="album"></i><span>作品册</span>
          </button>
        </nav>
      </div>
      <div class="paper-actions">
        <details class="palette" name="paper-settings">
          <summary class="head-button floating" title="选择纸张颜色">
            <span class="color-chip" id="activeColorChip" aria-hidden="true"></span>
            <span class="palette-label">纸色</span><span id="colorName">朱红</span>
          </summary>
          <div class="swatches floating" role="group" aria-label="纸张颜色"></div>
        </details>
        <details class="paper-picker" name="paper-settings">
          <summary id="newBtn" class="head-button floating" title="更换纸张" aria-controls="paperForm">
            <i data-icon="new"></i><span>换纸</span>
          </summary>
          <form id="paperForm" class="paper-sheet floating" aria-label="更换纸张">
            <div class="paper-shapes" role="group" aria-label="纸张形状">
              <button type="button" data-shape="square" aria-pressed="true" class="on">
                <i data-icon="square"></i><span>正方形</span>
              </button>
              <button type="button" data-shape="rect" aria-pressed="false">
                <i data-icon="rect"></i><span>长方形</span>
              </button>
              <button type="button" data-shape="circle" aria-pressed="false">
                <i data-icon="circle"></i><span>圆形</span>
              </button>
            </div>
            <div class="paper-dimensions">
              <label for="widthField"><span id="widthLabel">边长</span>
                <input id="widthField" type="number" inputmode="numeric" min="10" max="60" value="24" required>
              </label>
              <label id="heightFieldWrap" for="heightField" hidden>高度
                <input id="heightField" type="number" inputmode="numeric" min="10" max="60" value="24" required disabled>
              </label>
            </div>
            <p id="newPaperNote">尺寸范围为 10–60。</p>
            <button type="submit" class="paper-apply primary">使用这张纸</button>
          </form>
        </details>
      </div>
    </header>
    <main id="workbench">
      <section id="studioPage" aria-label="折剪创作台">
        <h1 class="sr-only">折剪创作画布</h1>
        <div id="stage" aria-label="可平移和缩放的折剪纸画布">
          <div id="paperViewport" aria-hidden="true"></div>
          <canvas id="doodleCanvas"></canvas><canvas id="cutCanvas"></canvas>
        </div>
        <section id="inspirationPreview" class="pattern-demo" aria-labelledby="pattern-demo-title" hidden></section>
        <svg id="foldGuide" aria-hidden="true" hidden>
          <path class="guide-axis"></path>
          <path class="guide-curve"></path>
          <path class="guide-tip"></path>
          <circle class="guide-ring" r="9"></circle>
          <circle class="guide-dot" r="3"></circle>
        </svg>
        <div id="guideLabel" hidden>向左拖动纸边</div>

        <div id="engineNotice" role="status" hidden></div>
        <div class="tool-dock floating" role="group" aria-label="画布工具">
          <div class="dock-items">
            <button
              data-mode="fold"
              aria-controls="toolsPanel"
              aria-expanded="true"
              aria-pressed="true"
              title="折纸工具"
              class="dock-button on"
            >
              <i data-icon="fold"></i><span>折纸</span>
            </button>
            <button
              data-mode="cut"
              aria-controls="toolsPanel"
              aria-expanded="false"
              aria-pressed="false"
              title="剪纸工具"
              class="dock-button"
            >
              <i data-icon="scissors"></i><span>剪纸</span>
            </button>
            <button
              data-mode="pen"
              aria-controls="toolsPanel"
              aria-expanded="false"
              aria-pressed="false"
              title="画笔工具"
              class="dock-button"
            >
              <i data-icon="pen"></i><span>画笔</span>
            </button>
            <span class="dock-divider" aria-hidden="true"></span>
            <button
              id="expandDockBtn"
              class="dock-button"
              title="展开纸张"
              aria-controls="unfoldMenu"
              aria-expanded="false"
            >
              <i data-icon="unfold"></i><span>展开</span>
            </button>
            <button
              id="ideasDockBtn"
              class="dock-button"
              title="窗花灵感与折剪演示"
              aria-controls="ideasPanel"
              aria-expanded="false"
            >
              <i data-icon="flower"></i><span>灵感</span>
            </button>
            <button
              id="undoBtn"
              class="dock-button"
              title="撤销上一步（Ctrl/⌘ Z）"
              aria-label="撤销上一步操作"
              aria-keyshortcuts="Control+Z Meta+Z"
              disabled
            >
              <i data-icon="undo"></i><span>撤销</span>
            </button>
            <button
              id="redoBtn"
              class="dock-button"
              title="重做上一步（Ctrl/⌘ Shift Z）"
              aria-label="重做上一步操作"
              aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z"
              disabled
            >
              <i data-icon="redo"></i><span>重做</span>
            </button>
          </div>
          <section id="toolsPanel" class="dock-flyout floating" aria-labelledby="toolsTitle">
            <div class="panel-heading">
              <h2 id="toolsTitle"><i data-icon="fold"></i>折纸</h2>
            </div>
            <div id="settingsBody" class="settings-body">
              <div id="foldTools" class="mode-body">
                <h3>折叠方式</h3>
                <div class="segmented" role="group" aria-label="折叠方式">
                  <button data-fold-mode="half" class="dock-button on" aria-pressed="true">
                    <i data-icon="half"></i><span>均等对折</span>
                  </button>
                  <button data-fold-mode="free" class="dock-button" aria-pressed="false">
                    <i data-icon="freefold"></i><span>自由折叠</span>
                  </button>
                </div>
                <div id="quickFolds">
                  <h3>快捷对折</h3>
                  <div class="quick-grid">
                    <button class="dock-button" data-fold="vertical"><i data-icon="vfold"></i><span>左右对折</span></button>
                    <button class="dock-button" data-fold="horizontal"><i data-icon="hfold"></i><span>上下对折</span></button>
                    <button class="dock-button" data-fold="diagonal"><i data-icon="dfold"></i><span>对角折</span></button>
                    <button class="dock-button" id="sectorFold" hidden><i data-icon="sector"></i><span>扇形对折</span></button>
                  </div>
                </div>
                <p id="freeHint" class="tool-hint" hidden>拖住纸边，移到想折的位置后松手。</p>
              </div>
              <div id="cutTools" class="mode-body" hidden>
                <h3>选择剪法</h3>
                <div class="cut-grid" role="group" aria-label="剪刀工具"></div>
              </div>
              <div id="penTools" class="mode-body" hidden>
                <button type="button" class="dock-button on" data-pen-tool="draw" aria-pressed="true">
                  <i data-icon="pen"></i><span>绘制</span>
                </button>
                <details id="penColors">
                  <summary class="dock-button">
                    <span class="ink-chip" id="activeInkChip" aria-hidden="true"></span><span>笔色</span>
                  </summary>
                  <div id="inkChoices" role="group" aria-label="画笔颜色"></div>
                </details>
                <button type="button" class="dock-button" data-pen-tool="eraser" aria-pressed="false" title="拖动擦除经过的笔迹">
                  <i data-icon="erase"></i><span>橡皮擦</span>
                </button>
                <button type="button" id="clearPen" class="dock-button" disabled>
                  <i data-icon="trash"></i><span>清除涂鸦</span>
                </button>
              </div>
            </div>
          </section>
          <section id="unfoldMenu" class="dock-flyout floating" aria-labelledby="unfoldTitle" hidden>
            <div class="panel-heading">
              <h2 id="unfoldTitle"><i data-icon="unfold"></i>展开</h2>
            </div>
            <div class="unfold-actions">
              <button id="oneFoldBtn" class="dock-button" disabled><i data-icon="onefold"></i><span>展开一折</span></button>
              <button id="unfoldBtn" class="dock-button" disabled><i data-icon="unfold"></i><span>全部展开</span></button>
            </div>
          </section>
          <section id="ideasPanel" class="dock-flyout floating" aria-labelledby="inspireTitle" hidden>
            <div class="panel-heading">
              <h2 id="inspireTitle"><i data-icon="flower"></i>灵感</h2>
            </div>
            <div id="ideasBody"><div id="patternList" class="patterns"></div></div>
          </section>
        </div>
        <div class="viewbar">
          <div class="zoom-control floating" role="group" aria-label="画布视图">
            <button id="panBtn" aria-label="移动画布" aria-pressed="false" title="移动画布（也可按住空格拖动）">
              <i data-icon="hand"></i>
            </button>
            <span class="bar-divider"></span>
            <button id="zoomOut" aria-label="缩小" title="缩小"><i data-icon="minus"></i></button>
            <output id="zoomVal">100%</output>
            <button id="zoomIn" aria-label="放大" title="放大"><i data-icon="plus"></i></button>
            <span class="bar-divider"></span>
            <button id="zoomReset" title="纸张居中并恢复大小" aria-label="纸张居中并恢复大小">
              <i data-icon="fit"></i>
            </button>
          </div>
        </div>
        <button class="primary" id="saveBtn"><i data-icon="save"></i><span>保存作品</span></button>
        <div id="cutChoice" role="group" aria-label="选择剪除区域" hidden>
          <span>剪去哪一块？</span><button id="swapBtn"><i data-icon="swap"></i>互换</button
          ><button id="confirmCutBtn">确定</button>
        </div>
      </section>
      <section id="libraryPage" hidden aria-labelledby="libraryTitle">
        <div class="library-heading">
