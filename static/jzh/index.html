<style>

<main><section class="stage" id="stage">
<canvas id="canvas" aria-label="三维纸盒：点棱剪开或接回，拖动可展开的面，拖动空白处旋转视角。"></canvas>
<aside class="controls" aria-label="纸盒控制">
<div class="control-panel panel"><div class="tools" role="group" aria-label="视角工具"><button id="labels" aria-pressed="true">面名</button><button id="home" title="收拢、缝合并恢复默认视角与缩放">复位</button></div>
<section class="fold-panel" aria-labelledby="foldTitle"><div class="panel-heading"><h2 id="foldTitle">展开</h2><span id="fixedBadge" class="fixed-badge"></span></div><p id="foldEmpty" class="empty">剪开棱后可展开</p><div id="faceSliders" class="face-sliders" role="group" aria-label="各面展开滑杆"></div></section></div>
<div class="bottom-tools"><button class="settings panel" id="settings" aria-expanded="false" aria-controls="facePicker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="white"/><circle cx="15" cy="12" r="2" fill="white"/><circle cx="9" cy="18" r="2" fill="white"/></svg>设置</button></div>
<section class="settings-panel panel" id="facePicker" aria-labelledby="settingsTitle" hidden><div class="panel-heading settings-heading"><h2 id="settingsTitle">纸盒设置</h2><button id="closeSettings" aria-label="关闭设置">×</button></div>
<form id="dimensionForm">
<div class="dimension-row"><label for="dimW">长</label><div class="stepper"><button type="button" data-dimension="dimW" data-step="-1" aria-label="减小长">−</button><input id="dimW" type="number" inputmode="numeric" step="1" min="5" max="200" value="25" required><button type="button" data-dimension="dimW" data-step="1" aria-label="增大长">＋</button></div></div>
<div class="dimension-row"><label for="dimD">宽</label><div class="stepper"><button type="button" data-dimension="dimD" data-step="-1" aria-label="减小宽">−</button><input id="dimD" type="number" inputmode="numeric" step="1" min="5" max="200" value="20" required><button type="button" data-dimension="dimD" data-step="1" aria-label="增大宽">＋</button></div></div>
<div class="dimension-row"><label for="dimH">高</label><div class="stepper"><button type="button" data-dimension="dimH" data-step="-1" aria-label="减小高">−</button><input id="dimH" type="number" inputmode="numeric" step="1" min="5" max="200" value="30" required><button type="button" data-dimension="dimH" data-step="1" aria-label="增大高">＋</button></div></div>
<button id="restoreDims" class="apply-dims primary" type="button">恢复默认</button></form>
<h2>固定面</h2><div class="face-order" id="faceOrder" role="group" aria-label="固定面"></div><button id="reset" class="reset-box">恢复完整纸盒</button></section>
</aside><div id="toast" class="toast" role="status"></div>
</section></main>
