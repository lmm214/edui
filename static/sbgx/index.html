<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>三角形三边关系探究</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      -khtml-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-user-drag: none !important;
      outline: none !important;
      touch-action: none;
    }

    html,
    body,
    :root {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: var(--bg-base);
      font-family: var(--font-ui);
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent !important;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      outline: none !important;
      touch-action: none;
    }

    *:focus,
    *:focus-visible,
    *:focus-within,
    *:active {
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
    }

    ::selection {
      background: transparent !important;
      color: inherit !important;
    }

    ::-moz-selection {
      background: transparent !important;
      color: inherit !important;
    }

    svg,
    svg * {
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
      touch-action: none;
    }

    text,
    tspan {
      -webkit-user-select: none !important;
      user-select: none !important;
      pointer-events: none !important;
    }

    :root {
      --bg-base: #F4F3EC;
      --panel-bg: rgba(255, 255, 255, 0.92);
      --panel-border: rgba(226, 232, 240, 0.92);
      --panel-shadow: 0 10px 25px -4px rgba(15, 23, 42, 0.06), 0 4px 10px -2px rgba(15, 23, 42, 0.03);

      --text-main: #1e293b;
      --text-muted: #64748b;
      --text-sub: #94a3b8;

      --color-a: #4f46e5;
      /* 侧边 a: 柔和靛蓝 */
      --color-a-bg: rgba(79, 70, 229, 0.08);
      --color-b: #0f172a;
      /* 底边 b: 深石板色 */
      --color-b-bg: rgba(15, 23, 42, 0.08);
      --color-c: #f43f5e;
      /* 侧边 c: 珊瑚玫瑰 */
      --color-c-bg: rgba(244, 63, 94, 0.08);

      --color-valid: #10b981;
      --color-valid-bg: rgba(16, 185, 129, 0.12);
      --color-invalid: #ef4444;
      --color-invalid-bg: rgba(239, 68, 68, 0.08);

      --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      --font-math: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }


    /* 纯色背景 (#F4F3EC 纯色，无线条圆点) */
    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #F4F3EC;
      background-image: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      touch-action: none;
      cursor: grab;
    }

    .viewport.panning {
      cursor: grabbing;
    }

    svg#canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: none;
      touch-action: none;
    }

    /* 确保画布中的线段手柄及实体元素在最上层正常响应触控与拖拽 */
    #canvas-content,
    #segments-layer,
    #handles-layer {
      pointer-events: none;
    }

    #segments-layer line,
    #handles-layer .canvas-endpoint-group,
    #handles-layer circle {
      pointer-events: all;
    }

    /* 顶部材料区 (全宽横屏顶栏，无背景阴影框，下边框细分割线) */
    .material-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100px;
      box-sizing: border-box;
      z-index: 10;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 32px;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: none;
      border-bottom: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 0;
      padding: 20px 24px;
      box-shadow: none;
      touch-action: none;
      cursor: default;
      transition: background 0.18s ease, border-bottom-color 0.18s ease;
    }

    /* 拖拽线段至顶部删除区域时的红色视觉反馈 */
    .material-panel.drag-over-delete {
      border-bottom-color: rgba(239, 68, 68, 0.5) !important;
      background: rgba(239, 68, 68, 0.04) !important;
    }

    .mat-segment-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      position: relative;
      touch-action: none;
    }

    .mat-svg-container {
      position: relative;
      display: flex;
      align-items: center;
      touch-action: none;
    }

    .mat-rod-svg {
      width: 290px;
      height: 54px;
      overflow: visible;
      touch-action: none;
    }

    .mat-rod-line {
      cursor: grab;
      transition: stroke-width 0.15s ease;
    }

    .mat-drag-body-hit {
      cursor: grab;
    }

    .mat-drag-body-hit:active {
      cursor: grabbing;
    }

    .mat-endpoint-left {
      cursor: grab;
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    .mat-svg-container:hover .mat-endpoint-left,
    .mat-rod-line:hover~.mat-endpoint-left {
      opacity: 1;
    }

    .mat-resize-handle {
      cursor: ew-resize;
      touch-action: none;
      pointer-events: all;
    }

    .mat-resize-hit {
      cursor: ew-resize;
      pointer-events: all;
    }

    .mat-resize-dot {
      cursor: ew-resize;
      pointer-events: none;
      r: 0;
      transition: r 0.18s ease, stroke-width 0.18s ease, opacity 0.18s ease;
      opacity: 0;
    }

    .mat-resize-handle:hover .mat-resize-dot,
    .mat-resize-handle:active .mat-resize-dot {
      r: 5.5px;
      stroke-width: 2.5px;
      opacity: 1;
    }

    /* 长度拖拽调节浮标提示 */
    .mat-resize-tooltip {
      position: absolute;
      top: -24px;
      background: #1e293b;
      color: #ffffff;
      font-family: var(--font-math);
      font-size: 12px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      pointer-events: none;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 0.15s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      white-space: nowrap;
      z-index: 25;
    }

    .mat-resize-tooltip.visible {
      opacity: 1;
    }

    .mat-resize-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -4px;
      border-width: 4px;
      border-style: solid;
      border-color: #1e293b transparent transparent transparent;
    }

    /* SVG 内字母/数值标注：数学斜体，精准居中 */
    .mat-rod-label {
      font-family: "Cambria Math", "Times New Roman", STIXGeneral, var(--font-math);
      font-style: italic;
      font-weight: 700;
      font-size: 26px;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
      line-height: 1;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* 画布中线段端点手柄：未拖动时大幅缩小，拖动时高亮放大，保留透明大点击区 */
    .canvas-endpoint-group {
      cursor: grab;
      touch-action: none;
    }

    .canvas-endpoint-group.dragging {
      cursor: grabbing;
    }

    .endpoint-hit-area {
      cursor: grab;
    }

    .canvas-endpoint-group.dragging .endpoint-hit-area {
      cursor: grabbing;
    }

    .endpoint-visible-dot {
      transition: r 0.18s cubic-bezier(0.16, 1, 0.3, 1), stroke-width 0.18s ease, opacity 0.18s ease;
      r: 0;
      opacity: 0;
    }

    .canvas-endpoint-group.dragging .endpoint-visible-dot {
      r: 5.5px;
      stroke-width: 2.5px;
      opacity: 1;
    }

    /* 右下角“设置”控制区 */
    .settings-wrapper {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 50;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .settings-toggle-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--panel-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--panel-border);
      box-shadow: var(--panel-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      touch-action: manipulation;
    }

    .settings-toggle-btn:hover {
      background: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
      color: var(--color-a);
    }

    .settings-toggle-btn:active {
      transform: translateY(0);
    }

    .settings-toggle-btn.active {
      background: #f1f5f9;
      color: var(--color-a);
      border-color: #cbd5e1;
    }

    .settings-toggle-btn.active .gear-icon {
      transform: rotate(45deg);
    }

    .gear-icon {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 向上弹出设置面板 */
    .settings-dropdown {
      position: absolute;
      bottom: calc(100% + 10px);
      right: 0;
      min-width: 200px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 14px 34px -4px rgba(15, 23, 42, 0.12), 0 4px 12px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      gap: 4px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px) scale(0.96);
      transform-origin: bottom right;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .settings-dropdown.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .settings-header {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      padding: 6px 12px 4px 12px;
      letter-spacing: 0.5px;
    }

    .settings-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-family: var(--font-ui);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    .settings-menu-item:hover {
      background: rgba(241, 245, 249, 0.85);
    }

    .settings-menu-item.active {
      background: rgba(79, 70, 229, 0.08);
      color: var(--color-a);
    }

    .settings-menu-item.danger {
      color: var(--color-invalid);
    }

    .settings-menu-item.danger:hover {
      background: rgba(239, 68, 68, 0.08);
    }

    .menu-item-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: #e2e8f0;
      color: var(--text-muted);
      transition: all 0.15s ease;
    }

    .settings-menu-item.active .menu-item-tag {
      background: var(--color-a);
      color: #ffffff;
    }

    .settings-divider {
      height: 1px;
      background: #e2e8f0;
      margin: 4px 8px;
    }

    /* 视图缩放控制栏 */
    .settings-zoom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      margin: 2px 4px 4px 4px;
    }

    .zoom-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    .zoom-btn:hover {
      background: #f1f5f9;
      color: var(--color-a);
      border-color: var(--color-a);
    }

    .zoom-btn:active {
      transform: scale(0.95);
    }

    .zoom-val {
      font-family: var(--font-math);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      min-width: 44px;
      text-align: center;
      user-select: none;
    }

    .zoom-reset-btn {
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    .zoom-reset-btn:hover {
      background: #e2e8f0;
      color: var(--text-main);
    }

    /* 吸附光圈：虚线圈平滑旋转，平时移至屏幕外并彻底隐藏 */
    @keyframes snapRingSpin {
      to {
        stroke-dashoffset: -28;
      }
    }

    #snap-indicator {
      display: none;
      visibility: hidden;
      pointer-events: none;
    }

    #snap-ring-circle {
      animation: snapRingSpin 1s linear infinite;
    }

    /* 响应式调整 */
    @media (max-width: 1024px) {
      .material-panel {
        height: 68px;
        gap: 16px;
        padding: 6px 16px;
      }

      .mat-rod-svg {
        width: 240px;
        max-width: 28vw;
      }
    }

    @media (max-width: 768px) {
      .material-panel {
        height: 62px;
        padding: 4px 8px;
        gap: 8px;
      }

      .mat-rod-svg {
        width: 170px;
        height: 50px;
        max-width: 29vw;
      }

      .settings-wrapper {
        bottom: 16px;
        right: 16px;
      }

      .settings-toggle-btn {
        width: 38px;
        height: 38px;
      }
    }
  </style>
</head>

<body>
  <div class="viewport" id="viewport">
    <!-- 顶部线段材料栏 (三列并排显示，两头有端点，右端点可拖拽改长短，字母居下方) -->
    <div class="material-panel" id="material-panel">
      <!-- 拖拽长度时浮动的提示标签 -->
      <div class="mat-resize-tooltip" id="resize-tooltip">3</div>

      <!-- 线段 a -->
      <div class="mat-segment-row" id="row-a">
        <div class="mat-svg-container" id="container-a">
          <svg class="mat-rod-svg" id="svg-a" width="290" height="54">
            <line class="mat-rod-line" id="line-a" x1="16" y1="17" x2="82" y2="17" stroke="var(--color-a)"
              stroke-width="6" stroke-linecap="round" />
            <line class="mat-drag-body-hit" id="drag-hit-a" x1="16" y1="17" x2="68" y2="17" stroke="transparent"
              stroke-width="28" />
            <circle class="mat-endpoint-left" id="dot-left-a" cx="16" cy="17" r="3.5" fill="#ffffff"
              stroke="var(--color-a)" stroke-width="2" />
            <g class="mat-resize-handle" id="handle-a" transform="translate(82, 17)">
              <circle class="mat-resize-hit" id="resize-hit-a" r="16" fill="rgba(0,0,0,0.001)" />
              <circle class="mat-resize-dot" id="dot-right-a" r="4.5" fill="#ffffff" stroke="var(--color-a)"
                stroke-width="2.5" pointer-events="none" />
            </g>
            <text class="mat-rod-label" id="label-a" x="49" y="44" text-anchor="middle" dominant-baseline="central"
              fill="var(--color-a)">a</text>
          </svg>
        </div>
      </div>

      <!-- 线段 b -->
      <div class="mat-segment-row" id="row-b">
        <div class="mat-svg-container" id="container-b">
          <svg class="mat-rod-svg" id="svg-b" width="290" height="54">
            <line class="mat-rod-line" id="line-b" x1="16" y1="17" x2="170" y2="17" stroke="var(--color-b)"
              stroke-width="6" stroke-linecap="round" />
            <line class="mat-drag-body-hit" id="drag-hit-b" x1="16" y1="17" x2="156" y2="17" stroke="transparent"
              stroke-width="28" />
            <circle class="mat-endpoint-left" id="dot-left-b" cx="16" cy="17" r="3.5" fill="#ffffff"
              stroke="var(--color-b)" stroke-width="2" />
            <g class="mat-resize-handle" id="handle-b" transform="translate(170, 17)">
              <circle class="mat-resize-hit" id="resize-hit-b" r="16" fill="rgba(0,0,0,0.001)" />
              <circle class="mat-resize-dot" id="dot-right-b" r="4.5" fill="#ffffff" stroke="var(--color-b)"
                stroke-width="2.5" pointer-events="none" />
            </g>
            <text class="mat-rod-label" id="label-b" x="93" y="44" text-anchor="middle" dominant-baseline="central"
              fill="var(--color-b)">b</text>
          </svg>
        </div>
      </div>

      <!-- 线段 c (默认不显示，但保留三列占位) -->
      <div class="mat-segment-row" id="row-c" style="visibility: hidden; pointer-events: none;">
        <div class="mat-svg-container" id="container-c">
          <svg class="mat-rod-svg" id="svg-c" width="290" height="54">
            <line class="mat-rod-line" id="line-c" x1="16" y1="17" x2="126" y2="17" stroke="var(--color-c)"
              stroke-width="6" stroke-linecap="round" />
            <line class="mat-drag-body-hit" id="drag-hit-c" x1="16" y1="17" x2="112" y2="17" stroke="transparent"
              stroke-width="28" />
            <circle class="mat-endpoint-left" id="dot-left-c" cx="16" cy="17" r="3.5" fill="#ffffff"
              stroke="var(--color-c)" stroke-width="2" />
            <g class="mat-resize-handle" id="handle-c" transform="translate(126, 17)">
              <circle class="mat-resize-hit" id="resize-hit-c" r="16" fill="rgba(0,0,0,0.001)" />
              <circle class="mat-resize-dot" id="dot-right-c" r="4.5" fill="#ffffff" stroke="var(--color-c)"
                stroke-width="2.5" pointer-events="none" />
            </g>
            <text class="mat-rod-label" id="label-c" x="71" y="44" text-anchor="middle" dominant-baseline="central"
              fill="var(--color-c)">c</text>
          </svg>
        </div>
      </div>
    </div>

    <!-- 右下角“设置”图标按钮及控制菜单 -->
    <div class="settings-wrapper" id="settings-wrapper">
      <button class="settings-toggle-btn" id="btn-settings-toggle" title="设置" aria-label="设置">
        <svg class="gear-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
          </path>
        </svg>
      </button>

      <!-- 弹出面板 -->
      <div class="settings-dropdown" id="settings-dropdown">
        <div class="settings-header">视图缩放</div>
        <div class="settings-zoom-bar">
          <button class="zoom-btn" id="btn-zoom-out" title="缩小" aria-label="缩小">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <span class="zoom-val" id="zoom-val-text">100%</span>
          <button class="zoom-btn" id="btn-zoom-in" title="放大" aria-label="放大">
