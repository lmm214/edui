<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>大长方形的周长和面积各是多少（苏教四上P40第6题）</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* SVG stage container */
    #stage-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    svg#main-svg {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      display: block;
    }

    /* Square styles - No drop shadows or jitter transitions */
    .grid-square {
      stroke: #009fe8;
      stroke-width: 2.5;
      stroke-linejoin: miter;
    }

    /* Initial 9 squares - Only these can be dragged to clone */
    .grid-square.initial-square {
      fill: #bfe5fa;
      cursor: grab;
    }

    .grid-square.initial-square:hover {
      fill: #aeddf8;
    }

    .grid-square.initial-square:active {
      cursor: grabbing;
    }

    /* Cloned squares - Not draggable */
    .grid-square.cloned-square {
      fill: #edf7fe;
      cursor: default;
    }

    .grid-square.cloned-square:hover {
      fill: #dcf0fd;
    }

    /* Outer rectangle */
    .outer-frame {
      fill: none;
      stroke: #009fe8;
      stroke-width: 2.8;
      stroke-linejoin: miter;
    }

    /* Drag Ghost / Clone Preview - Pure opacity breathing, size stays fixed (大小不变，仅透明度呼吸) */
    #ghost-square {
      pointer-events: none;
      fill: #bfe5fa;
      stroke: #009fe8;
      stroke-width: 2.5;
      stroke-linejoin: miter;
      animation: ghostOpacityBreathe 0.85s ease-in-out infinite alternate;
    }

    @keyframes ghostOpacityBreathe {
      0% {
        opacity: 0.25;
      }
      100% {
        opacity: 0.85;
      }
    }

    /* Freehand drawing */
    .drawing-path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    /* Floating Toolbar on Right Side (Pen, Clear, Reset only) */
    .toolbar-dock {
      position: fixed;
      right: 28px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 28px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      z-index: 999;
    }

    .tool-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      outline: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #64748b;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
      position: relative;
    }

    .tool-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    .tool-btn:active {
      transform: scale(0.94);
    }

    .tool-btn.active {
      background: #009fe8;
      color: #ffffff;
    }

    .tool-btn svg {
      width: 22px;
      height: 22px;
      stroke-width: 2.2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .divider {
      width: 20px;
      height: 1px;
      background: rgba(226, 232, 240, 0.9);
      margin: 2px 0;
    }

    /* Pen mode cursor */
    body.pen-mode {
      cursor: crosshair;
    }

    body.pen-mode .grid-square {
      cursor: crosshair;
    }
  </style>
</head>
