<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>∠1 与 ∠2 相等吗？</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    svg {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* 白色长方形旋转光标 */
    #rectB {
      cursor: grab;
    }
    #rectB:active {
      cursor: grabbing;
    }

    /* 自由模式下旋转禁用，强化支点设置 */
    body.free-mode #rectB {
      cursor: default;
    }

    /* 旋转固定支点 */
    #pivotPin {
      cursor: default;
      transition: r 0.15s ease;
    }

    /* 自由模式下红点激活 */
    body.free-mode #pivotPin {
      cursor: move;
    }
    body.free-mode #pivotHalo {
      display: block;
    }

    #pivotHalo {
      display: none;
      animation: pulse 1.4s infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0% { r: 6px; opacity: 0.9; stroke-width: 2px; }
      50% { r: 18px; opacity: 0.2; stroke-width: 4px; }
      100% { r: 6px; opacity: 0.9; stroke-width: 2px; }
    }

    /* 右上角自由模式按钮 */
    .top-right-bar {
      position: absolute;
      top: 20px;
      right: 24px;
      z-index: 10;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid #eaeaea;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #4b5563;
      transition: all 0.2s ease;
      outline: none;
    }
    .icon-btn:hover {
      background: #f8fafc;
      color: #1e293b;
      transform: scale(1.05);
    }
    .icon-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
    }

    /* 随堂全屏画笔 Canvas */
    #paintCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 5;
    }
    #paintCanvas.drawing {
      pointer-events: auto;
      cursor: crosshair;
    }

    /* 右下角极简工具条 */
    .mini-bar {
      position: absolute;
      bottom: 20px;
      right: 24px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 6px 14px;
      border-radius: 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      border: 1px solid #eaeaea;
    }

    .btn {
      border: none;
      background: #f3f4f6;
      color: #374151;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .btn:hover {
      background: #e5e7eb;
    }
    .btn.active {
      background: #2563eb;
      color: #fff;
    }

    .color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px #cbd5e1;
    }
    .color-dot.active {
      box-shadow: 0 0 0 2px #2563eb;
      transform: scale(1.15);
    }
    .divider {
      width: 1px;
      height: 16px;
      background: #e5e7eb;
    }
  </style>
</head>
<body>

  <!-- 右上角：自由模式切换按钮 -->
  <div class="top-right-bar">
    <button class="icon-btn" id="btnFreeMode" onclick="toggleFreeMode()" title="重设旋转支点模式">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="5 9 2 12 5 15"></polyline>
        <polyline points="9 5 12 2 15 5"></polyline>
        <polyline points="15 19 12 22 9 19"></polyline>
        <polyline points="19 9 22 12 19 15"></polyline>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <line x1="12" y1="2" x2="12" y2="22"></line>
      </svg>
    </button>
  </div>

  <!-- SVG 主视区 -->
  <svg id="svgBoard" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- 动态裁剪蒙版：与白色长方形轮廓完全一致 -->
      <clipPath id="clipRectB">
        <polygon id="clipPolyB" />
      </clipPath>
    </defs>

    <!-- 图层 1: 底层粉色长方形 -->
    <polygon id="rectA" fill="#fcd7d0" stroke="#333333" stroke-width="2.2" stroke-linejoin="round" />

    <!-- 图层 2: 上层白色长方形 -->
    <polygon id="rectB" fill="#ffffff" stroke="#333333" stroke-width="2.2" stroke-linejoin="round" />

    <!-- 图层 3: 透视虚线层 (绝对锁定，永不闪烁) -->
    <g clip-path="url(#clipRectB)">
      <polygon id="rectADashed" fill="none" stroke="#333333" stroke-width="2.2" stroke-dasharray="7,6" stroke-linejoin="round" />
    </g>

    <!-- 图层 4: 标注 ∠1 与 ∠2 (支持任意边位置，90度转换为直角折线) -->
    <g id="annotation-group">
      <path id="arc1" fill="none" stroke="#f25f5c" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter" />
      <text id="txt1" font-size="28" font-family="'Times New Roman', serif" font-style="italic" fill="#222" text-anchor="middle">1</text>

      <path id="arc2" fill="none" stroke="#f25f5c" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter" />
      <text id="txt2" font-size="28" font-family="'Times New Roman', serif" font-style="italic" fill="#222" text-anchor="middle">2</text>
    </g>

    <!-- 图层 5: 旋转支点（限定在边上滑动） -->
    <g id="pivotGroup">
      <circle id="pivotHalo" cx="0" cy="0" r="10" fill="none" stroke="#2563eb" />
      <circle id="pivotPin" cx="0" cy="0" r="6.5" fill="#e63946" stroke="#ffffff" stroke-width="2" />
    </g>
  </svg>

  <!-- 课堂板书透明 Canvas -->
  <canvas id="paintCanvas"></canvas>

  <!-- 右下角极简工具条 -->
  <div class="mini-bar">
    <button class="btn" id="btnPen" onclick="togglePen()">✏️ 画笔</button>
    <div class="color-dot active" style="background:#e63946" onclick="setColor('#e63946', this)"></div>
    <div class="color-dot" style="background:#2563eb" onclick="setColor('#2563eb', this)"></div>
    <div class="color-dot" style="background:#059669" onclick="setColor('#059669', this)"></div>
    <button class="btn" onclick="clearPen()">🧹 清屏</button>
    <div class="divider"></div>
    <button class="btn" onclick="resetFigure()">↺ 复位</button>
    <button class="btn" onclick="toggleFull()">⛶ 全屏</button>
  </div>
