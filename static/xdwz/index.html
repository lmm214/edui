<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>相对位置</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --accent-color: #ef4444;
      --border-color: #e2e8f0;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: var(--font-sans);
      background: #f8fafc;
      user-select: none;
      /* 禁止触摸屏双指缩放与双击缩放 */
      touch-action: manipulation;
      /* 禁止 iOS Safari 长按弹出菜单 */
      -webkit-touch-callout: none;
    }

    /* 极简全屏 Viewport */
    .app-viewport {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: #ffffff;
    }

    /* SVG 容器 */
    .canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
      background: #ffffff;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      touch-action: none;
    }

    /* 画笔批注 Canvas 覆盖层 */
    #drawCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    #drawCanvas.active {
      pointer-events: auto;
      cursor: crosshair;
    }

    #drawCanvas.eraser-active {
      pointer-events: auto;
      cursor: cell;
    }

    /* 页面底部悬浮精美工具栏 */
    .floating-toolbar {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 6px 10px;
      border-radius: 36px;
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 12px 32px -4px rgba(15, 23, 42, 0.12), 0 4px 12px -2px rgba(15, 23, 42, 0.04);
    }

    /* 工具按钮 */
    .tool-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
      position: relative;
      flex-shrink: 0;
    }

    .tool-btn svg {
      width: 18px;
      height: 18px;
      display: block;
      flex-shrink: 0;
    }

    .tool-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    .tool-btn:active {
      background: #e2e8f0;
    }

    .tool-btn.active {
      background: #eff6ff;
      color: #2563eb;
      box-shadow: inset 0 0 0 1.5px #bfdbfe;
    }

    /* 颜色预览圆点按钮 */
    .color-preview-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      box-shadow: 0 0 0 1.5px rgba(0,0,0,0.18);
      flex-shrink: 0;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: #e2e8f0;
      margin: 0 2px;
      flex-shrink: 0;
    }

    /* 悬浮 Popover 弹出菜单 */
    .popover-menu {
      position: absolute;
      bottom: calc(100% + 14px);
      left: 50%;
      transform: translateX(-50%) scale(0.95);
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow: 0 16px 36px -6px rgba(15, 23, 42, 0.16);
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      min-width: 160px;
    }

    .popover-menu.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) scale(1);
    }

    /* Popover 小小箭头 */
    .popover-menu::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 12px;
      height: 12px;
      background: #ffffff;
      border-right: 1px solid rgba(226, 232, 240, 0.9);
      border-bottom: 1px solid rgba(226, 232, 240, 0.9);
    }

    .popover-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-option {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
      transition: transform 0.15s ease;
    }

    .color-option:hover {
      transform: scale(1.2);
    }

    .color-option.active {
      transform: scale(1.25);
      box-shadow: 0 0 0 2px var(--primary-color);
    }

    .size-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: #f8fafc;
      padding: 6px;
      border-radius: 12px;
    }

    .size-option {
      background: #64748b;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .size-option.size-sm { width: 8px; height: 8px; }
    .size-option.size-md { width: 14px; height: 14px; }
    .size-option.size-lg { width: 20px; height: 20px; }

    .size-option.active {
      background: var(--primary-color);
      transform: scale(1.2);
    }

    .action-row-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      width: 100%;
    }

    .action-row-btn:hover {
      background: #fee2e2;
      color: #dc2626;
      border-color: #fca5a5;
    }

    .action-row-btn.secondary:hover {
      background: #e2e8f0;
      color: #0f172a;
      border-color: #cbd5e1;
    }

    .snap-option-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #334155;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 2px;
    }

    .snap-option-label input {
      accent-color: var(--primary-color);
      cursor: pointer;
    }

    /* SVG 交互元素样式 */
    .node-handle {
      cursor: grab;
    }
    .node-handle:active, .node-handle.dragging {
      cursor: grabbing;
    }

    .node-label {
      font-size: 16px;
      font-weight: 700;
      font-family: var(--font-sans);
      pointer-events: none;
      fill: #1e293b;
    }

    .angle-text {
      font-size: 14px;
      font-weight: 800;
      fill: #ef4444;
      font-family: var(--font-sans);
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <!-- 主画板容器 -->
    <div class="canvas-container">
      <svg id="mainSvg" viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- 方向标箭头 -->
          <marker id="arrowHead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e293b"/>
          </marker>
          <!-- 坐标轴双向小箭头 -->
          <marker id="axisArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 2 L 8 5 L 0 8 z" fill="#64748b"/>
          </marker>
        </defs>

        <!-- 背景极淡网格 -->
        <g id="gridLayer" opacity="0.2">
          <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbd5e1" stroke-width="1"/>
          </pattern>
          <rect width="1000" height="650" fill="url(#gridPattern)" />
        </g>

        <!-- 坐标轴参考线层 (十字虚线/箭头) -->
        <g id="crosshairLayer"></g>

        <!-- 角度弧线与文本层 -->
        <g id="angleLayer"></g>

        <!-- 路线线段与刻度段层 -->
        <g id="routeLayer"></g>

        <!-- 节点标记层 (书店、商场、小玲家) -->
        <g id="nodeLayer"></g>

        <!-- 方向标与比例尺固定图层 -->
        <g id="legendLayer">
          <!-- 方向标 (右上角) -->
          <g transform="translate(900, 75)">
            <text x="0" y="-35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">北</text>
            <line x1="0" y1="-25" x2="0" y2="25" stroke="#1e293b" stroke-width="2.5" marker-start="url(#arrowHead)"/>
          </g>

          <!-- 比例尺 (右下角) -->
          <g transform="translate(840, 580)">
            <text x="40" y="-12" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">200m</text>
            <path d="M 0,-5 L 0,8 L 80,8 L 80,-5" fill="none" stroke="#1e293b" stroke-width="2.5"/>
          </g>
        </g>
      </svg>

      <!-- 浮动在 SVG 上方的批注 Canvas -->
      <canvas id="drawCanvas"></canvas>
    </div>

    <!-- 页面底部水平居中悬浮工具栏 -->
    <div class="floating-toolbar">

      <!-- 1. 拖拽模式 -->
      <button class="tool-btn active" id="btnModeDrag" title="移动节点" style="font-size:18px; line-height:1;">🖱️</button>

      <!-- 2. 画笔工具 -->
      <button class="tool-btn" id="btnModePen" title="画笔标注" style="font-size:18px; line-height:1;">✏️</button>

      <!-- 3. 颜色 & 粗细（圆点按钮 + 弹出 Popover） -->
      <div style="position: relative;">
        <button class="tool-btn" id="btnColorPicker" title="颜色与笔触">
          <div class="color-preview-dot" id="colorPreviewDot" style="background: #ef4444;"></div>
        </button>
        <div class="popover-menu" id="popoverColor">
          <div class="popover-title">选择颜色</div>
          <div class="color-row">
            <div class="color-option active" style="background:#ef4444;" data-color="#ef4444"></div>
            <div class="color-option" style="background:#2563eb;" data-color="#2563eb"></div>
            <div class="color-option" style="background:#10b981;" data-color="#10b981"></div>
            <div class="color-option" style="background:#f59e0b;" data-color="#f59e0b"></div>
            <div class="color-option" style="background:#1e293b;" data-color="#1e293b"></div>
          </div>
          <div class="popover-title" style="margin-top: 4px;">笔触粗细</div>
          <div class="size-row">
            <div class="size-option size-sm" data-size="3" title="细笔触"></div>
            <div class="size-option size-md active" data-size="6" title="中笔触"></div>
            <div class="size-option size-lg" data-size="12" title="粗笔触"></div>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- 4. 橡皮擦 (激活后再点 → 清屏弹窗) -->
      <div style="position: relative;">
        <button class="tool-btn" id="btnEraser" title="橡皮擦" style="font-size:18px; line-height:1;">🧹</button>
        <div class="popover-menu" id="popoverEraser">
          <button class="action-row-btn" id="btnClear">
            🗑️&nbsp; 清空画布
          </button>
        </div>
      </div>

      <div class="divider"></div>

      <!-- 5. 设置 -->
      <div style="position: relative;">
        <button class="tool-btn" id="btnSettings" title="设置" style="font-size:17px; line-height:1;">⚙️</button>
        <div class="popover-menu" id="popoverSettings">
          <div class="popover-title">智能吸附</div>
          <label class="snap-option-label">
            <input type="checkbox" id="chkSnapAngle" checked>
            <span>角度吸附 (5°)</span>
          </label>
          <label class="snap-option-label">
            <input type="checkbox" id="chkSnapDist" checked>
            <span>距离吸附 (200m)</span>
          </label>
          <button class="action-row-btn secondary" id="btnReset" style="margin-top:4px; white-space:nowrap;">
            🔄&nbsp;重置为课本原图
          </button>
        </div>
      </div>

    </div>

  </div>
