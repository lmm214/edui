<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>铺地锦 · 格子乘法</title>
  <style>
    :root {
      --bg: #F4F3EC;
      --ink: #1B2B38;
      --grid-line: #1F5F8B;
      --bright-orange: #FF6600;
      --highlight-blue: #0077B6;
      --keypad-bg: #FAF9F5;
      --color-yellow: #DEB853;
      --color-blue: #589AB6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Songti SC", "STSong", "SimSun", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", serif, sans-serif;
      color: var(--ink);
      font-weight: normal;
      touch-action: manipulation;
    }

    .app-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      padding: 1.5vh 2vw;
    }

    /* 顶部右上角重置按钮 */
    .top-actions {
      position: absolute;
      top: 18px;
      right: 22px;
      z-index: 20;
    }

    /* 底部右下角设置按钮 */
    .bottom-actions {
      position: absolute;
      bottom: 18px;
      right: 22px;
      z-index: 20;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1.5px solid rgba(31, 95, 139, 0.3);
      background: #FAF8F2;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 19px;
      font-weight: 400;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background: var(--grid-line);
      color: #FFFFFF;
      border-color: var(--grid-line);
    }

    /* 顶部算式：62 × 37 = (无粗体) */
    .header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .formula-bar {
      display: inline-flex;
      align-items: center;
      font-size: clamp(38px, 5.5vw, 68px);
      font-weight: 400;
      letter-spacing: 2px;
      color: var(--ink);
      line-height: 1;
    }

    .formula-result {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 110px;
      height: 1.2em;
      margin-left: 10px;
      border-bottom: 2.5px dashed rgba(31, 95, 139, 0.45);
      color: var(--ink);
      font-weight: 400;
      border-radius: 4px;
      padding: 0 8px;
      transition: all 0.25s ease;
      cursor: default;
    }

    .formula-result.completed {
      border-bottom: 2.5px solid var(--grid-line);
      color: var(--ink);
    }

    /* SVG 舞台 */
    .stage-wrapper {
      flex: 1;
      width: 100%;
      height: calc(100vh - 90px);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    svg#lattice-svg {
      width: min(96vw, calc(100vh - 100px));
      height: min(96vw, calc(100vh - 100px));
      max-width: 820px;
      max-height: 820px;
      overflow: visible;
      transition: max-width 0.25s ease;
    }

    /* 三位数乘两位数时支持更宽画幅 */
    svg#lattice-svg.mode-3x2 {
      width: min(96vw, calc((100vh - 100px) * 1.31));
      height: min(calc(96vw / 1.31), calc(100vh - 100px));
      max-width: 1020px;
      max-height: calc(100vh - 100px);
    }

    /* 三位数乘三位数：缩小小正方形并严格限制高度以防溢出 */
    svg#lattice-svg.mode-3x3 {
      width: min(96vw, calc((100vh - 105px) * 1.044));
      height: min(calc(96vw / 1.044), calc(100vh - 105px));
      max-width: min(835px, calc((100vh - 105px) * 1.044));
      max-height: calc(100vh - 105px);
    }

    svg#lattice-svg.mode-3x3 .num-text {
      font-size: 64px;
    }

    svg#lattice-svg.mode-3x3 .outer-factor {
      font-size: 60px;
    }

    svg#lattice-svg.mode-3x3 .carry-text {
      font-size: 22px;
    }

    /* SVG 网格线与边框 */
    .grid-border {
      stroke: var(--grid-line);
      stroke-width: 4;
      fill: none;
      stroke-linecap: square;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .grid-inner-line {
      stroke: var(--grid-line);
      stroke-width: 3.5;
      stroke-linecap: square;
      pointer-events: none;
    }

    .grid-diag-line {
      stroke: var(--grid-line);
      stroke-width: 3.5;
      stroke-linecap: round;
      pointer-events: none;
      transition: stroke 0.15s ease;
    }

    /* 选中正方形内的对角斜线高亮为橙色 */
    .square-unit.selected .grid-diag-line {
      stroke: var(--bright-orange);
      stroke-width: 4;
    }

    /* 单个小三角形路径 (支持画笔填色) */
    .tri-path {
      cursor: pointer;
      pointer-events: all;
      stroke: none;
      transition: fill 0.15s ease, opacity 0.15s ease;
    }

    .tri-path:hover {
      opacity: 0.88;
    }

    /* 小正方形高亮亮橙色边框 (原始基础) */
    .square-select-outline {
      fill: none;
      stroke: transparent;
      stroke-width: 4.5;
      stroke-linejoin: round;
      pointer-events: none;
      transition: stroke 0.15s ease;
    }

    .square-unit.selected .square-select-outline {
      stroke: var(--bright-orange);
    }

    /* 顶层激活小正方形橙色高亮边框 (置于最高层级，位于 grid-frame 之后，彻底解决被边框遮挡问题) */
    .active-square-top-outline {
      fill: none;
      stroke: var(--bright-orange);
      stroke-width: 5;
      stroke-linejoin: round;
      stroke-linecap: round;
      pointer-events: none;
    }

    /* 顶层激活小正方形对角斜线高亮橙色 */
    .active-diag-top-line {
      stroke: var(--bright-orange);
      stroke-width: 4;
      stroke-linecap: round;
      pointer-events: none;
    }

    /* 内部小三角形数字 (字号严格保持 80px，无粗体) */
    .num-text {
      text-anchor: middle;
      dominant-baseline: central;
      font-size: 80px;
      font-weight: 400;
      fill: var(--ink);
      pointer-events: none;
    }

    /* 外周乘数：上方与右方 (字号保持 72px，无粗体，支持高亮橙色) */
    .outer-factor {
      font-size: 72px;
      font-weight: 400;
      fill: var(--ink);
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      transition: fill 0.18s ease;
    }

    .outer-factor.highlight-orange {
      fill: var(--bright-orange) !important;
    }

    /* 外侧相加答案槽 */
    .result-slot-hitbox {
      fill: transparent;
      stroke: transparent;
      cursor: pointer;
      rx: 10;
      transition: stroke 0.15s ease;
    }

    /* 默认显示淡灰色虚线框，输入数字之后隐去 */
    .result-slot-hitbox.empty-dashed {
      stroke: #C5CBD0;
      stroke-width: 2;
      stroke-dasharray: 6 6;
    }

    .result-slot-hitbox:hover {
      stroke: rgba(31, 95, 139, 0.45);
      stroke-width: 2.5;
      stroke-dasharray: 6 6;
    }

    .result-slot-hitbox.selected {
      stroke: var(--bright-orange) !important;
      stroke-width: 4 !important;
      stroke-dasharray: none !important;
    }

    /* 进位小红标：斜向相加超过 10 时显示小小的红色 +1 */
    .carry-text {
      font-size: 26px;
      font-weight: 400;
      fill: #E63946;
      text-anchor: middle;
      dominant-baseline: central;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    /* 右侧极简画笔与锁定浮动栏 */
    .right-toolbar {
      position: fixed;
      right: 22px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(250, 248, 242, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid var(--grid-line);
      border-radius: 999px;
      padding: 12px 8px;
      box-shadow: 0 4px 20px rgba(27, 43, 56, 0.08);
      z-index: 100;
    }

    .tool-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1.5px solid rgba(31, 95, 139, 0.25);
      background: #FFFFFF;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 17px;
      transition: all 0.2s ease;
    }

    .tool-btn:hover:not(.disabled) {
      transform: scale(1.08);
      border-color: var(--grid-line);
    }

    .tool-btn.active {
      background: var(--grid-line);
      color: #FFFFFF;
      border-color: var(--grid-line);
    }

    .tool-btn.disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: auto;
    }

    .toolbar-divider {
      width: 20px;
      height: 1px;
      background: rgba(31, 95, 139, 0.2);
      margin: 2px 0;
    }

    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .color-swatch:hover:not(.disabled) {
      transform: scale(1.15);
    }

    .color-swatch.selected {
      border-color: var(--ink);
      box-shadow: 0 0 0 2px #FFFFFF;
    }

    .color-swatch.disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }

    .swatch-yellow {
      background-color: var(--color-yellow);
    }

    .swatch-blue {
      background-color: var(--color-blue);
    }

    .swatch-eraser {
      background-color: #FFFFFF;
      border: 1.5px dashed rgba(31, 95, 139, 0.5);
      color: var(--ink);
    }

    /* 浮动虚拟数字小键盘 */
    .keypad-popover {
      position: fixed;
      background: var(--keypad-bg);
      border: 2px solid var(--grid-line);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(27, 43, 56, 0.15);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
      transition: opacity 0.16s ease, transform 0.16s ease;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 6px;
    }

    .keypad-popover.active {
      opacity: 1;
      pointer-events: all;
      transform: scale(1);
    }

    .keypad-popover.mode-3x3 {
      padding: 4px;
      border-radius: 6px;
    }

    .keypad-popover.mode-3x3 .keypad-grid {
      gap: 3px;
    }

    .keypad-popover.mode-3x3 .keypad-btn {
      font-size: clamp(16px, 2.4vw, 24px);
      border-radius: 4px;
    }

    .keypad-popover.mode-3x3 .keypad-btn.action-btn {
      font-size: clamp(15px, 2vw, 20px);
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 5px;
      flex: 1;
      width: 100%;
      height: 100%;
    }

    button,
    input {
      font-family: inherit;
    }

    .keypad-btn {
      font-family: inherit;
      font-weight: 300 !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #FFFFFF;
      border: 1px solid rgba(31, 95, 139, 0.25);
      border-radius: 6px;
      color: var(--ink);
      font-size: clamp(20px, 3vw, 32px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, transform 0.08s;
      padding: 0;
      line-height: 1;
    }

    .keypad-btn:active {
      background: rgba(31, 95, 139, 0.15);
      transform: scale(0.95);
    }

    .keypad-btn.action-btn {
      font-family: inherit;
      font-weight: 300 !important;
      background: rgba(31, 95, 139, 0.08);
      font-size: clamp(18px, 2.6vw, 28px);
    }

    .keypad-btn.confirm-btn {
      font-family: inherit;
      font-weight: 300 !important;
      background: var(--bright-orange);
      color: #FFFFFF;
      border-color: var(--bright-orange);
    }

    /* 题目设置模态弹窗 */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(27, 43, 56, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .settings-dialog {
      width: min(92vw, 460px);
      background: #FAF8F2;
      border: 1.5px solid var(--grid-line);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 12px 36px rgba(27, 43, 56, 0.18);
      display: flex;
      flex-direction: column;
      gap: 16px;
      transform: scale(0.95);
      transition: transform 0.2s ease;
    }

    .modal-backdrop.show .settings-dialog {
      transform: scale(1);
    }

    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(31, 95, 139, 0.15);
      padding-bottom: 10px;
    }

    .dialog-title {
      font-size: 20px;
      font-weight: 400;
      color: var(--ink);
      letter-spacing: 1px;
    }

    .dialog-close {
      background: transparent;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: rgba(27, 43, 56, 0.6);
      padding: 4px;
      line-height: 1;
      transition: color 0.15s;
    }

    .dialog-close:hover {
      color: var(--bright-orange);
    }

    .settings-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-label {
      font-size: 14px;
      color: rgba(27, 43, 56, 0.7);
      font-weight: 400;
    }

    .mode-chips {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .mode-chip {
      padding: 9px 4px;
      border: 1.5px solid rgba(31, 95, 139, 0.3);
      border-radius: 8px;
      background: #FFFFFF;
      color: var(--ink);
      font-size: 13.5px;
      font-weight: 400;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    @media (max-width: 420px) {
      .mode-chip {
        font-size: 12px;
        padding: 8px 2px;
      }
    }

    .mode-chip:hover {
      border-color: var(--grid-line);
    }

    .mode-chip.active {
      background: var(--grid-line);
      color: #FFFFFF;
      border-color: var(--grid-line);
    }

    .preset-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .preset-btn {
      padding: 6px 12px;
      border: 1px solid rgba(31, 95, 139, 0.25);
      border-radius: 6px;
      background: #FFFFFF;
      color: var(--ink);
      font-size: 14px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset-btn:hover {
      border-color: var(--bright-orange);
      color: var(--bright-orange);
    }

    .inputs-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-field label {
      font-size: 12px;
      color: rgba(27, 43, 56, 0.6);
    }

    .input-field input {
      width: 100%;
      height: 38px;
      border: 1.5px solid rgba(31, 95, 139, 0.35);
      border-radius: 6px;
      padding: 0 8px;
      font-size: 18px;
      font-weight: 400;
      color: var(--ink);
      background: #FFFFFF;
      text-align: center;
      outline: none;
      transition: border-color 0.15s;
    }

    .input-field input:focus {
      border-color: var(--bright-orange);
    }

    .times-sign {
      font-size: 20px;
      color: rgba(27, 43, 56, 0.5);
      margin-top: 18px;
    }

    .dice-btn {
      margin-top: 18px;
      height: 38px;
      padding: 0 12px;
      border: 1.5px solid rgba(31, 95, 139, 0.3);
      border-radius: 6px;
      background: #FFFFFF;
      color: var(--ink);
      font-size: 14px;
      font-weight: 400;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .dice-btn:hover {
      border-color: var(--grid-line);
      background: rgba(31, 95, 139, 0.06);
    }

    .input-hint {
      font-size: 12px;
      color: rgba(27, 43, 56, 0.5);
      transition: color 0.15s;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 6px;
    }

    .dialog-btn {
      height: 38px;
      padding: 0 18px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-secondary {
      background: transparent;
      border: 1.5px solid rgba(31, 95, 139, 0.3);
      color: var(--ink);
    }

    .btn-secondary:hover {
      background: rgba(31, 95, 139, 0.05);
    }

    .btn-primary {
      background: var(--bright-orange);
      border: none;
      color: #FFFFFF;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="app-container">

    <!-- 顶部右上角重置按钮 -->
    <div class="top-actions">
      <button class="icon-btn" id="btn-reset" title="清空重新填写">↺</button>
    </div>

    <!-- 底部右下角设置按钮 -->
    <div class="bottom-actions">
      <button class="icon-btn" id="btn-settings" title="题目与位数设置">⚙</button>
    </div>

    <!-- 顶部算式 (无粗体，仅左下录入正确得数后顶上才显示结果) -->
    <header class="header">
      <div class="formula-bar">
        <span id="formula-a">62</span>
        <span style="margin: 0 8px; font-weight: 400; opacity: 0.7;">×</span>
        <span id="formula-b">37</span>
        <span style="margin: 0 8px; font-weight: 400; opacity: 0.7;">=</span>
        <span class="formula-result" id="formula-result"></span>
      </div>
    </header>

    <!-- 主 SVG：动态网格 -->
    <main class="stage-wrapper">
      <svg id="lattice-svg" viewBox="0 0 1000 1000">
        <!-- 由 JavaScript 动态渲染，支持两位数×两位数、三位数×两位数 及 三位数×三位数 -->
      </svg>
    </main>

    <!-- 右侧极简画笔与锁定浮动栏 (填满后可锁定填色) -->
    <aside class="right-toolbar">
      <!-- 锁定按钮 -->
      <button class="tool-btn disabled" id="btn-lock" title="填写全部小三角形后方可锁定着色">
        <span id="lock-icon">🔒</span>
      </button>

      <div class="toolbar-divider"></div>

      <!-- 藤黄色画笔 -->
      <div class="color-swatch swatch-yellow disabled selected" data-color="#DEB853" title="藤黄画笔"></div>
      <!-- 青黛色画笔 -->
      <div class="color-swatch swatch-blue disabled" data-color="#589AB6" title="青黛画笔"></div>
      <!-- 橡皮擦 -->
      <div class="color-swatch swatch-eraser disabled" data-color="transparent" title="橡皮擦">✕</div>
    </aside>

    <!-- 浮动虚拟数字小键盘 (尺寸动态与小正方形一致) -->
    <div class="keypad-popover" id="keypad-popover">
      <div class="keypad-grid">
        <button class="keypad-btn" data-key="1">1</button>
        <button class="keypad-btn" data-key="2">2</button>
        <button class="keypad-btn" data-key="3">3</button>
        <button class="keypad-btn" data-key="4">4</button>
        <button class="keypad-btn" data-key="5">5</button>
        <button class="keypad-btn" data-key="6">6</button>
        <button class="keypad-btn" data-key="7">7</button>
        <button class="keypad-btn" data-key="8">8</button>
        <button class="keypad-btn" data-key="9">9</button>
        <button class="keypad-btn action-btn" data-action="backspace" title="清除">⌫</button>
        <button class="keypad-btn" data-key="0">0</button>
        <button class="keypad-btn action-btn confirm-btn" data-action="close" title="确定">✓</button>
      </div>
    </div>

    <!-- 题目设置模态弹窗 -->
    <div class="modal-backdrop" id="settings-modal">
      <div class="settings-dialog">
        <div class="dialog-header">
          <div class="dialog-title">题目与位数设置</div>
