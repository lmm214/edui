<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乘积最值问题，面积模型</title>
  <style>
    :root {
      --bg-color: #f4f3ec;
      --border-dark: #1f2328;
      --text-dark: #18191b;
      --orange-accent: #ea580c;
      --orange-soft: #f97316;
      --blue-accent: #0284c7;
      --blue-soft: #38bdf8;
      --cross-bg-top: #fff7ed;
      --cross-bg-bottom: #ffedd5;
      --font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .c-orange {
      color: var(--orange-accent);
    }

    .c-blue {
      color: var(--blue-accent);
    }

    .c-op {
      color: var(--text-dark);
      margin: 0 1px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background-color: var(--bg-color);
      font-family: var(--font-family);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    /* Dual Panels Wrapper */
    .app-container {
      width: 100%;
      max-width: 1280px;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 36px;
      padding: 20px 20px 40px 20px;
      position: relative;
    }

    .panel-col {
      flex: 1;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0;
    }

    /* Subtle vertical divider between the two models on wide screens */
    .center-divider {
      width: 1px;
      height: 520px;
      background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.12) 15%, rgba(0, 0, 0, 0.12) 85%, transparent);
      align-self: flex-start;
      margin-top: 10px;
    }

    /* Top: Four Digit Inputs & Times Symbol */
    .input-equation {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      margin-top: 4px;
    }

    .digit-pair {
      display: flex;
      gap: 4px;
    }

    .digit-box {
      width: 58px;
      height: 66px;
      border: 1.5px solid var(--border-dark);
      background: #ffffff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 400;
      cursor: pointer;
      position: relative;
      transition: border-color 0.16s ease;
      box-shadow: none;
      user-select: none;
    }

    .digit-box:hover {
      box-shadow: none;
      border-color: #000;
    }

    .digit-box.tens {
      color: var(--orange-accent);
    }

    .digit-box.units {
      color: var(--blue-accent);
    }

    .digit-box.active-focus {
      outline: none;
      box-shadow: none;
      border-width: 1.5px;
    }

    .digit-box.active-focus.tens {
      border-color: var(--orange-accent);
    }

    .digit-box.active-focus.units {
      border-color: var(--blue-accent);
    }

    .digit-box.active-focus .digit-val {
      font-weight: 700;
    }

    .digit-val {
      display: inline-block;
      width: 100%;
      text-align: center;
      line-height: 1;
    }

    .op-symbol {
      font-size: 32px;
      color: var(--text-dark);
      font-weight: 400;
      padding: 0 6px;
      line-height: 1;
      user-select: none;
    }

    /* Floating Virtual Keypad */
    .virtual-keypad {
      position: absolute;
      top: calc(100% + 14px);
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      border: 1.5px solid #d1d5db;
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 18px 40px -4px rgba(0, 0, 0, 0.18), 0 8px 16px -2px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 100;
      width: 214px;
      box-sizing: border-box;
      animation: keypadPop 0.16s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .keypad-caret {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 10px;
      height: 10px;
      background: #ffffff;
      border-left: 1.5px solid #d1d5db;
      border-top: 1.5px solid #d1d5db;
      transition: left 0.16s ease;
    }

    @keyframes keypadPop {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(-6px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }
    }

    .candidate-row {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
    }

    .action-row {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
    }

    .action-row .keypad-btn {
      flex: 1;
      height: 36px;
      font-size: 16px;
    }

    .keypad-btn {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      border: 1.5px solid #e5e7eb;
      background: #f9fafb;
      color: var(--text-dark);
      font-size: 22px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.12s ease, border-color 0.12s ease;
      user-select: none;
    }

    .keypad-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .keypad-btn:active {
      background: #e2e8f0;
    }

    .keypad-btn.action-btn {
      color: #6b7280;
      background: #f3f4f6;
    }

    .keypad-btn.current-val {
      border-color: var(--text-dark);
      background: #f1f5f9;
      font-weight: 700;
    }

    .keypad-btn.disabled {
      opacity: 0.22;
      pointer-events: none;
      background: #f3f4f6;
      color: #9ca3af;
      border-color: #e5e7eb;
      text-decoration: line-through;
    }

    /* Bottom-Right Pool Selector Popup */
    .pool-selector-popup {
      position: fixed;
      bottom: 76px;
      right: 24px;
      background: #ffffff;
      border: 1.5px solid #d1d5db;
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 18px 40px -4px rgba(0, 0, 0, 0.18), 0 8px 16px -2px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 100;
      transform-origin: bottom right;
      animation: poolPopIn 0.12s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes poolPopIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .pool-grid {
      display: grid;
      grid-template-columns: repeat(5, 36px);
      grid-gap: 6px;
    }

    .pool-digit-btn {
      width: 36px;
      height: 38px;
      border-radius: 8px;
      border: 1.5px solid #e5e7eb;
      background: #f9fafb;
      color: var(--text-dark);
      font-size: 18px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
      user-select: none;
    }

    .pool-digit-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .pool-digit-btn.selected {
      background: var(--text-dark);
      color: #ffffff;
      border-color: var(--text-dark);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    /* Area Model Container */
    .area-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
      margin-top: clamp(80px, 14vh, 130px);
    }

    /* Top dimension labels row - padded on both sides to align exactly over rectangle */
    .dim-top-row {
      display: flex;
      width: 100%;
      padding-left: 56px;
      padding-right: 56px;
      height: 32px;
      min-height: 32px;
      margin-bottom: 8px;
      box-sizing: border-box;
      align-items: center;
    }

    .dim-top-label {
      font-size: 22px;
      font-weight: 400;
      text-align: center;
      line-height: 32px;
      height: 32px;
      opacity: 0;
      box-sizing: border-box;
      transition: opacity 0.25s ease, width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dim-top-label.tens,
    .dim-left-label.tens {
      color: var(--orange-accent);
    }

    .dim-top-label.units,
    .dim-left-label.units {
      color: var(--blue-accent);
    }

    /* Main rectangular layout */
    .area-body-row {
      display: flex;
      width: 100%;
      align-items: stretch;
    }

    /* Left dimension labels column - space is permanently reserved */
    .dim-left-col {
      width: 56px;
      min-width: 56px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding-right: 12px;
      box-sizing: border-box;
    }

    /* Right spacer to balance dim-left-col so the area frame is centered with the times symbol */
    .dim-right-spacer {
      width: 56px;
      min-width: 56px;
      box-sizing: border-box;
      pointer-events: none;
    }

    .dim-left-label {
      font-size: 22px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      opacity: 0;
      box-sizing: border-box;
      transition: opacity 0.25s ease, height 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* The big partitioned rectangle */
    .area-box-frame {
      flex: 1;
      height: 275px;
      border: 1.5px solid var(--border-dark);
      display: grid;
      position: relative;
      background: #ffffff;
      box-shadow: none;
      transition: grid-template-columns 0.3s cubic-bezier(0.16, 1, 0.3, 1),
        grid-template-rows 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cell-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s, opacity 0.25s ease;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }

    .cell-block:hover {
      filter: brightness(0.97);
    }

    .block-tl {
      grid-column: 1;
      grid-row: 1;
      border-right: 1.5px solid var(--border-dark);
      border-bottom: 1.5px solid var(--border-dark);
      background-color: #ffffff;
    }

    .block-tr {
      grid-column: 2;
      grid-row: 1;
      border-bottom: 1.5px solid var(--border-dark);
      background: linear-gradient(135deg, var(--cross-bg-top) 0%, var(--cross-bg-bottom) 100%);
    }

    .block-bl {
      grid-column: 1;
      grid-row: 2;
      border-right: 1.5px solid var(--border-dark);
      background: linear-gradient(135deg, var(--cross-bg-top) 0%, var(--cross-bg-bottom) 100%);
    }

    .block-br {
      grid-column: 2;
      grid-row: 2;
      background-color: #ffffff;
    }

    .cell-expr {
      font-size: 22px;
      font-weight: 400;
      white-space: nowrap;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), font-weight 0.15s ease;
      pointer-events: none;
    }

    .cell-val {
      font-size: 15px;
      font-weight: 400;
      color: #4b5563;
      margin-top: 3px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), font-weight 0.15s ease;
      pointer-events: none;
    }

    /* State 1: Show expression only */
    .cell-block.state-1 .cell-expr {
      opacity: 1;
      transform: translateY(0);
    }

    .cell-block.state-1 .cell-val {
      opacity: 0;
      transform: translateY(4px);
    }

    /* State 2: Show expression and value */
    .cell-block.state-2 .cell-expr {
      opacity: 1;
      transform: translateY(0);
    }

    .cell-block.state-2 .cell-val {
      opacity: 1;
      transform: translateY(0);
    }

    .highlight-active {
      box-shadow: inset 0 0 0 1.5px var(--border-dark) !important;
      z-index: 2;
    }

    .highlight-active .cell-expr,
    .cell-block:active .cell-expr {
      font-weight: 700;
      transform: none;
    }

    .highlight-active .cell-val,
    .cell-block:active .cell-val {
      font-weight: 700;
      transform: none;
    }

    /* Floating Toolbar */
    .floating-toolbar {
      position: fixed;
      bottom: 20px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0.75;
      transition: opacity 0.2s ease;
      z-index: 10;
    }

    .floating-toolbar:hover {
      opacity: 1;
    }

    .icon-btn {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      border: 1.5px solid #d1d5db;
      background: #ffffff;
      color: #1f2328;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 22px;
      transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      user-select: none;
    }

    .icon-btn:hover {
      background: #f9fafb;
      border-color: #9ca3af;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }

    .icon-btn:active {
      background: #f3f4f6;
    }

    @media (max-width: 960px) {
      .app-container {
        flex-direction: column;
        gap: 32px;
        min-height: auto;
        padding-bottom: 60px;
      }

      .center-divider {
        width: 80%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.12) 20%, rgba(0, 0, 0, 0.12) 80%, transparent);
      }

      .panel-col {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="app-container">
    <!-- LEFT PANEL -->
    <div class="panel-col" id="panelLeft">
      <!-- Top Equation -->
      <div class="input-equation" id="L_eq">
        <div class="digit-pair">
          <div class="digit-box tens" id="L_boxT1" data-panel="left" data-key="t1">
            <span class="digit-val" id="L_valT1"></span>
          </div>
          <div class="digit-box units" id="L_boxU1" data-panel="left" data-key="u1">
            <span class="digit-val" id="L_valU1"></span>
          </div>
        </div>

        <div class="op-symbol">×</div>

        <div class="digit-pair">
          <div class="digit-box tens" id="L_boxT2" data-panel="left" data-key="t2">
            <span class="digit-val" id="L_valT2"></span>
          </div>
          <div class="digit-box units" id="L_boxU2" data-panel="left" data-key="u2">
            <span class="digit-val" id="L_valU2"></span>
          </div>
        </div>
      </div>

      <!-- Area Model Visual -->
      <div class="area-stage" id="L_areaStage">
        <div class="dim-top-row">
          <div class="dim-top-label tens" id="L_dimTopLeft"></div>
          <div class="dim-top-label units" id="L_dimTopRight"></div>
        </div>

        <div class="area-body-row">
          <div class="dim-left-col">
            <div class="dim-left-label tens" id="L_dimLeftTop"></div>
            <div class="dim-left-label units" id="L_dimLeftBottom"></div>
          </div>

          <div class="area-box-frame" id="L_areaFrame">
            <div class="cell-block block-tl" id="L_blockTL" data-panel="left" data-term="tl">
              <div class="cell-expr" id="L_exprTL"></div>
              <div class="cell-val" id="L_valTL"></div>
            </div>
            <div class="cell-block block-tr" id="L_blockTR" data-panel="left" data-term="tr">
              <div class="cell-expr" id="L_exprTR"></div>
              <div class="cell-val" id="L_valTR"></div>
            </div>
            <div class="cell-block block-bl" id="L_blockBL" data-panel="left" data-term="bl">
              <div class="cell-expr" id="L_exprBL"></div>
              <div class="cell-val" id="L_valBL"></div>
            </div>
            <div class="cell-block block-br" id="L_blockBR" data-panel="left" data-term="br">
              <div class="cell-expr" id="L_exprBR"></div>
              <div class="cell-val" id="L_valBR"></div>
            </div>
          </div>

          <div class="dim-right-spacer"></div>
        </div>
      </div>
    </div>

    <!-- Center Divider Line -->
    <div class="center-divider"></div>

    <!-- RIGHT PANEL -->
    <div class="panel-col" id="panelRight">
      <!-- Top Equation -->
      <div class="input-equation" id="R_eq">
        <div class="digit-pair">
          <div class="digit-box tens" id="R_boxT1" data-panel="right" data-key="t1">
            <span class="digit-val" id="R_valT1"></span>
          </div>
          <div class="digit-box units" id="R_boxU1" data-panel="right" data-key="u1">
            <span class="digit-val" id="R_valU1"></span>
          </div>
        </div>

        <div class="op-symbol">×</div>

        <div class="digit-pair">
          <div class="digit-box tens" id="R_boxT2" data-panel="right" data-key="t2">
            <span class="digit-val" id="R_valT2"></span>
          </div>
          <div class="digit-box units" id="R_boxU2" data-panel="right" data-key="u2">
            <span class="digit-val" id="R_valU2"></span>
          </div>
        </div>
      </div>

      <!-- Area Model Visual -->
      <div class="area-stage" id="R_areaStage">
        <div class="dim-top-row">
          <div class="dim-top-label tens" id="R_dimTopLeft"></div>
          <div class="dim-top-label units" id="R_dimTopRight"></div>
        </div>

        <div class="area-body-row">
          <div class="dim-left-col">
            <div class="dim-left-label tens" id="R_dimLeftTop"></div>
            <div class="dim-left-label units" id="R_dimLeftBottom"></div>
          </div>

          <div class="area-box-frame" id="R_areaFrame">
            <div class="cell-block block-tl" id="R_blockTL" data-panel="right" data-term="tl">
              <div class="cell-expr" id="R_exprTL"></div>
              <div class="cell-val" id="R_valTL"></div>
            </div>
            <div class="cell-block block-tr" id="R_blockTR" data-panel="right" data-term="tr">
              <div class="cell-expr" id="R_exprTR"></div>
              <div class="cell-val" id="R_valTR"></div>
            </div>
            <div class="cell-block block-bl" id="R_blockBL" data-panel="right" data-term="bl">
              <div class="cell-expr" id="R_exprBL"></div>
              <div class="cell-val" id="R_valBL"></div>
            </div>
            <div class="cell-block block-br" id="R_blockBR" data-panel="right" data-term="br">
              <div class="cell-expr" id="R_exprBR"></div>
              <div class="cell-val" id="R_valBR"></div>
            </div>
          </div>

          <div class="dim-right-spacer"></div>
        </div>
      </div>
    </div>

    <!-- Floating Virtual Keypad for Equation -->
    <div class="virtual-keypad" id="virtualKeypad" style="display: none;">
      <div class="keypad-caret" id="keypadCaret"></div>
      <div class="candidate-row" id="keypadCandidates"></div>
      <div class="action-row">
        <button class="keypad-btn action-btn" id="keypadBack" title="清除">⌫</button>
        <button class="keypad-btn action-btn" id="keypadClose" title="完成">✓</button>
      </div>
    </div>

    <!-- Bottom-Right 0-9 Pool Selector Popup -->
    <div class="pool-selector-popup" id="poolSelectorPopup" style="display: none;">
      <div class="pool-grid" id="poolGrid"></div>
    </div>

    <!-- Floating Minimal Controls -->
    <div class="floating-toolbar">
      <button class="icon-btn" id="btnPool" title="候选数字 0-9">🔢</button>
      <button class="icon-btn" id="btnReset" title="复原空白">↺</button>
    </div>
