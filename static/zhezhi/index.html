<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>虚拟折纸</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #334455;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            width: 100vw;
            height: 100vh;
        }

        .btn {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.6), inset -1px -1px 3px rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.3s, box-shadow 0.3s, transform 0.1s;
            user-select: none;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-icon {
            width: 44px;
            height: 44px;
            padding: 0;
            font-size: 1.3rem;
        }

        .btn:hover {
            background: rgba(60, 60, 60, 0.9);
        }

        .btn:active {
            box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.8), inset -1px -1px 2px rgba(255, 255, 255, 0.05);
            transform: scale(0.97);
        }

        /* 右上角按钮栏 */
        #topRightBar {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #topRightBar .btn {
            position: static;
        }

        /* 任意折叠模式按钮高亮激活状态 (纯净银灰微光质感，去除蓝光) */
        #foldModeBtn.active {
            background: rgba(255, 255, 255, 0.22);
            border: 1.5px solid #d1d5db;
            color: #f9fafb;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.25), inset 1px 1px 3px rgba(255, 255, 255, 0.2);
        }

        /* 模式切换提示气泡 Toast */
        #toast {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(15, 23, 42, 0.88);
            color: #f8fafc;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            backdrop-filter: blur(8px);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 30;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 右侧中间工具栏 (画笔、清屏) */
        #rightCenterBar {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            z-index: 22;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #rightCenterBar .btn {
            position: static;
            width: 44px;
            height: 44px;
            padding: 0;
        }

        /* 画笔处于激活涂鸦模式时的高亮状态 (亮橙金高光，醒目美观) */
        #penBtn.active {
            background: rgba(249, 115, 22, 0.4);
            border: 1.5px solid #f97316;
            color: #ffedd5;
            box-shadow: 0 0 14px rgba(249, 115, 22, 0.6), inset 1px 1px 3px rgba(255, 255, 255, 0.3);
        }

        /* 右下角按钮栏 (重置按钮 + 设置规格按钮) */
        #bottomRightBar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #bottomRightBar .btn {
            position: static;
            width: 44px;
            height: 44px;
            padding: 0;
        }

        /* 全屏涂鸦画布 */
        #doodleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 18;
            pointer-events: none;
            touch-action: none;
        }

        #doodleCanvas.active {
            pointer-events: auto;
            cursor: crosshair;
        }

        /* 底部和右侧滑动条容器 */
        #slidersContainer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 15;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            outline: none;
            position: absolute;
            pointer-events: auto;
        }

        /* 滑块白色圆点与阴影 */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 10px, transparent 11px);
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
            cursor: pointer;
            border: none;
            margin-top: -17px;
        }

        /* 轨道样式：内凹阴影 */
        input[type=range]::-webkit-slider-runnable-track {
            height: 10px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: inset 1px 1px 4px rgba(0, 0, 0, 0.8), inset -1px -1px 2px rgba(255, 255, 255, 0.15);
        }

        #widthSlider {
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
        }

        #heightSlider {
            top: 50%;
            right: calc(32px - 25vh);
            width: 50vh;
            transform: translateY(-50%) rotate(-90deg);
            margin: 0;
        }

        .slider-val {
            position: absolute;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 2rem;
            font-weight: 500;
            backdrop-filter: blur(4px);
            pointer-events: none;
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.6), inset -1px -1px 3px rgba(255, 255, 255, 0.1);
        }

        #widthVal {
            bottom: 65px;
            left: 50%;
            transform: translateX(-50%);
        }

        #heightVal {
            top: 50%;
            right: 80px;
            transform: translateY(-50%);
        }
    </style>
</head>

<!-- 全屏涂鸦画布 -->
<canvas id="doodleCanvas"></canvas>

<!-- 提示气泡 Toast -->
<div id="toast"></div>

<!-- 右上角按钮栏 (折叠模式切换 + 形状切换) -->
<div id="topRightBar">
    <!-- 任意折上折 / 均等对折 模式切换按钮 -->
    <button id="foldModeBtn" class="btn btn-icon" title="当前：均等对折模式（点击切换为任意折）">
        <svg id="foldModeIconHalf" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <line x1="12" y1="3" x2="12" y2="21" stroke-dasharray="3 3" />
        </svg>
        <svg id="foldModeIconFree" style="display: none;" width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h10l6 6v10H4V4z" />
            <path d="M14 4v6h6" />
        </svg>
    </button>

    <!-- 形状切换按钮 (长方形纸 ↔ 圆形纸) -->
    <button id="shapeBtn" class="btn btn-icon" title="切换为圆形纸">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="12" cy="12" r="9" />
        </svg>
    </button>
</div>

<!-- 右侧中间工具栏 (画笔、清屏) -->
<div id="rightCenterBar">
    <!-- 画笔涂鸦按钮 -->
    <button id="penBtn" class="btn btn-icon" title="画笔涂鸦（点击开启，再点退出）">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
        </svg>
    </button>
    <!-- 清屏按钮 -->
    <button id="clearDoodleBtn" class="btn btn-icon" title="清屏（清除所有涂鸦）">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
    </button>
</div>

<!-- 右下角按钮栏 (重置按钮 + 设置规格按钮) -->
<div id="bottomRightBar">
    <!-- 重置按钮 (移动至右下方) -->
    <button id="resetBtn" class="btn btn-icon" title="重置白纸">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2v6h-6"></path>
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
            <path d="M3 22v-6h6"></path>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
        </svg>
    </button>

    <!-- 设置规格按钮 -->
    <button id="settingsBtn" class="btn btn-icon" title="设置规格">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
        </svg>
    </button>
</div>

<!-- 底部与右侧滑动条 -->
<div id="slidersContainer" style="display: none;">
    <input type="range" id="widthSlider" min="10" max="60" step="1" value="30">
    <div class="slider-val" id="widthVal">30</div>

    <input type="range" id="heightSlider" min="10" max="60" step="1" value="21">
    <div class="slider-val" id="heightVal">21</div>
</div>

<!-- 引入 Three.js 和 OrbitControls -->
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
