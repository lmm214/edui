<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>虚拟折纸</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #334455;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            width: 100vw;
            height: 100vh;
        }

        .btn {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.6), inset -1px -1px 3px rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.3s, box-shadow 0.3s, transform 0.1s;
            user-select: none;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-icon {
            width: 44px;
            height: 44px;
            padding: 0;
            font-size: 1.3rem;
        }

        .btn:hover {
            background: rgba(60, 60, 60, 0.9);
        }

        .btn:active {
            box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.8), inset -1px -1px 2px rgba(255, 255, 255, 0.05);
            transform: scale(0.97);
        }

        /* 右上角按钮栏 */
        #topRightBar {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #topRightBar .btn {
            position: static;
        }

        /* 任意折叠模式按钮高亮激活状态 (纯净银灰微光质感，去除蓝光) */
        #foldModeBtn.active {
            background: rgba(255, 255, 255, 0.22);
            border: 1.5px solid #d1d5db;
            color: #f9fafb;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.25), inset 1px 1px 3px rgba(255, 255, 255, 0.2);
        }

        /* 模式切换提示气泡 Toast */
        #toast {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(15, 23, 42, 0.88);
            color: #f8fafc;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            backdrop-filter: blur(8px);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 30;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 右侧中间工具栏 (画笔、清屏) */
        #rightCenterBar {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            z-index: 22;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #rightCenterBar .btn {
            position: static;
            width: 44px;
            height: 44px;
            padding: 0;
        }

        /* 画笔处于激活涂鸦模式时的高亮状态 (亮橙金高光，醒目美观) */
        #penBtn.active {
            background: rgba(249, 115, 22, 0.4);
            border: 1.5px solid #f97316;
            color: #ffedd5;
            box-shadow: 0 0 14px rgba(249, 115, 22, 0.6), inset 1px 1px 3px rgba(255, 255, 255, 0.3);
        }

        /* 右下角按钮栏 (重置按钮 + 设置规格按钮) */
        #bottomRightBar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #bottomRightBar .btn {
            position: static;
            width: 44px;
            height: 44px;
            padding: 0;
        }

        /* 全屏涂鸦画布 */
        #doodleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 18;
            pointer-events: none;
            touch-action: none;
        }

        #doodleCanvas.active {
            pointer-events: auto;
            cursor: crosshair;
        }

        /* 底部和右侧滑动条容器 */
        #slidersContainer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 15;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            outline: none;
            position: absolute;
            pointer-events: auto;
        }

        /* 滑块白色圆点与阴影 */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 10px, transparent 11px);
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
            cursor: pointer;
            border: none;
            margin-top: -17px;
        }

        /* 轨道样式：内凹阴影 */
        input[type=range]::-webkit-slider-runnable-track {
            height: 10px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: inset 1px 1px 4px rgba(0, 0, 0, 0.8), inset -1px -1px 2px rgba(255, 255, 255, 0.15);
        }

        #widthSlider {
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
        }

        #heightSlider {
            top: 50%;
            right: calc(32px - 25vh);
            width: 50vh;
            transform: translateY(-50%) rotate(-90deg);
            margin: 0;
        }

        .slider-val {
            position: absolute;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 2rem;
            font-weight: 500;
            backdrop-filter: blur(4px);
            pointer-events: none;
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.6), inset -1px -1px 3px rgba(255, 255, 255, 0.1);
        }

        #widthVal {
            bottom: 65px;
            left: 50%;
            transform: translateX(-50%);
        }

        #heightVal {
            top: 50%;
            right: 80px;
            transform: translateY(-50%);
        }
    </style>
</head>

<!-- 全屏涂鸦画布 -->

                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">

<!-- 引入 Three.js 和 OrbitControls -->
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>

<script>
    // ==========================================
    // 1. 拟真折纸音效 (Web Audio API)
    // ==========================================
    const whiteList = ["edui123.com", "edui.fun"];if (!whiteList.includes(window.location.hostname)) {window.location.href = "https://edui123.com";}
    class PaperAudio {
        constructor() {
            this.ctx = null;
        }

        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }

        playRustle(intensity = 1.0) {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const filter = this.ctx.createBiquadFilter();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(280 * intensity, now + 0.08);
            osc.frequency.exponentialRampToValueAtTime(70, now + 0.16);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(600, now);
            filter.frequency.exponentialRampToValueAtTime(180, now + 0.16);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.14 * intensity, now + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.18);
        }

        playFoldSnap() {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(460, now);
            osc.frequency.exponentialRampToValueAtTime(160, now + 0.1);

            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.13);
        }

        playUnfoldSnap() {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(480, now + 0.12);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.12, now + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.19);
        }
    }
    const sfx = new PaperAudio();

    // ==========================================
    // 2. 场景与经典光影系统
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x334455);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 40, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 10;
    controls.maxDistance = 80;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;
    controls.target.set(0, 0, 0);

    // 灯光系统
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfffcf5, 0.65);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 100;
    const d = 25;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    const dirLight2 = new THREE.DirectionalLight(0xaabbff, 0.35);
    dirLight2.position.set(-20, 40, -20);
    scene.add(dirLight2);

    const spotLight = new THREE.SpotLight(0xffffff, 0.5);
    spotLight.position.set(0, 50, 0);
    spotLight.angle = Math.PI / 4;
    spotLight.penumbra = 0.8;
    scene.add(spotLight);

    // 边缘轮廓光
    const rimLeft = new THREE.DirectionalLight(0xffffff, 0.5);
    rimLeft.position.set(-40, 5, 0);
    scene.add(rimLeft);

    const rimRight = new THREE.DirectionalLight(0xffffff, 0.5);
    rimRight.position.set(40, 5, 0);
    scene.add(rimRight);

    const rimTop = new THREE.DirectionalLight(0xffffff, 0.4);
    rimTop.position.set(0, 5, -40);
    scene.add(rimTop);

    const rimBottom = new THREE.DirectionalLight(0xffffff, 0.4);
    rimBottom.position.set(0, 5, 40);
    scene.add(rimBottom);

    // 暗色桌面
    const deskGeo = new THREE.PlaneGeometry(200, 200);
    const deskMat = new THREE.MeshStandardMaterial({
        color: 0x334455,
        roughness: 0.9,
        metalness: 0.1
    });
    const desk = new THREE.Mesh(deskGeo, deskMat);
    desk.rotation.x = -Math.PI / 2;
    desk.position.y = -0.1;
    desk.receiveShadow = true;
    scene.add(desk);

    // ==========================================
    // 3. 形状状态与底层淡灰色虚线框
    // ==========================================
    let currentShape = 'rect'; // 'rect' | 'circle'
    let circleDiameter = 24.0;
    let persistentCircleFolds = 0;
    let currentSector = { start: 0, end: Math.PI * 2, targetBaseAngle: null };

    let paperW = 29.7;
    let paperH = 21.0;
    if (window.innerWidth < window.innerHeight) {
        paperW = 21.0;
        paperH = 29.7;
    }

    const ghostCanvas = document.createElement('canvas');
    ghostCanvas.width = 1024;
    ghostCanvas.height = 1024;
    const ghostCtx = ghostCanvas.getContext('2d');
    const ghostTexture = new THREE.CanvasTexture(ghostCanvas);

    function renderGhostTexture() {
        const w = ghostCanvas.width;
        const h = ghostCanvas.height;
        ghostCtx.clearRect(0, 0, w, h);

        const GHOST_COLOR = 'rgba(140, 140, 140, 0.65)';
        const GHOST_WIDTH = 4;

        if (currentShape === 'circle') {
            const cx = w / 2;
            const cy = h / 2;
            const r = w / 2 - 8;

            ghostCtx.beginPath();
            ghostCtx.arc(cx, cy, r, 0, Math.PI * 2);
            ghostCtx.fillStyle = 'rgba(255, 255, 255, 0.04)';
            ghostCtx.fill();

            ghostCtx.setLineDash([18, 12]);
            ghostCtx.strokeStyle = GHOST_COLOR;
            ghostCtx.lineWidth = GHOST_WIDTH;
            ghostCtx.stroke();
            ghostCtx.setLineDash([]);
        } else {
            ghostCtx.fillStyle = 'rgba(255, 255, 255, 0.04)';
            ghostCtx.fillRect(4, 4, w - 8, h - 8);

            ghostCtx.setLineDash([18, 12]);
            ghostCtx.strokeStyle = GHOST_COLOR;
            ghostCtx.lineWidth = GHOST_WIDTH;
            ghostCtx.strokeRect(4, 4, w - 8, h - 8);
            ghostCtx.setLineDash([]);
        }

        ghostTexture.needsUpdate = true;
    }

    const ghostGeo = new THREE.PlaneGeometry(paperW, paperH);
    const ghostMat = new THREE.MeshBasicMaterial({
        map: ghostTexture,
        transparent: true,
        opacity: 0.9,
        depthWrite: false
    });
    const ghostPlane = new THREE.Mesh(ghostGeo, ghostMat);
    ghostPlane.rotation.x = -Math.PI / 2;
    ghostPlane.position.y = -0.02;
    scene.add(ghostPlane);

    // ==========================================
    // 4. 纸张纹理与折痕渲染 (长方形网格 / 圆形放射折痕)
    // ==========================================
    const texCanvas = document.createElement('canvas');
    texCanvas.width = 2048;
    texCanvas.height = 2048;
    const texCtx = texCanvas.getContext('2d');
    const paperTexture = new THREE.CanvasTexture(texCanvas);
    paperTexture.anisotropy = 16;
    paperTexture.minFilter = THREE.LinearMipmapLinearFilter;
    paperTexture.magFilter = THREE.LinearFilter;
    paperTexture.generateMipmaps = true;

    const foldHistory = [];
    let activeFold = null;
    const MAX_FOLDS = 8; // 限制最多折叠8次

    let persistentHParts = 1; // 横向均等份数 (2^nH)
    let persistentVParts = 1; // 纵向均等份数 (2^nV)

    // 持久化保留所有自由折叠与折上折历史折痕（展开后依然保留痕迹）
    const persistentFreeCreases = [];

    function addPersistentCrease(fold) {
        if (!fold || !fold.p0 || !fold.u) return;
        const p0 = { ...fold.p0 };
        const u = { ...fold.u };
        const n = fold.n ? { ...fold.n } : { x: fold.u.z, z: -fold.u.x };

        const isDuplicate = (p, dir) => {
            return persistentFreeCreases.some(c => {
                const dp = Math.hypot(c.p0.x - p.x, c.p0.z - p.z);
                const dotU = Math.abs(c.u.x * dir.x + c.u.z * dir.z);
                return dp < 0.35 && dotU > 0.95;
            });
        };

        if (!isDuplicate(p0, u)) {
            persistentFreeCreases.push({ p0, u, n });
        }

        // 如果存在前序折叠层，计算该折痕在展开底页上的反射对称折痕
        if (foldHistory.length > 0) {
            for (let s = foldHistory.length - 1; s >= 0; s--) {
                const prev = foldHistory[s];
                if (prev && prev.p0 && prev.n) {
                    const distToPrev = (p0.x - prev.p0.x) * prev.n.x + (p0.z - prev.p0.z) * prev.n.z;
                    if (Math.abs(distToPrev) > 0.15) {
                        const refP0 = {
                            x: p0.x - 2 * distToPrev * prev.n.x,
                            z: p0.z - 2 * distToPrev * prev.n.z
                        };
                        const dotUn = u.x * prev.n.x + u.z * prev.n.z;
                        const refU = {
                            x: u.x - 2 * dotUn * prev.n.x,
                            z: u.z - 2 * dotUn * prev.n.z
                        };
                        if (!isDuplicate(refP0, refU)) {
                            persistentFreeCreases.push({ p0: refP0, u: refU, n });
                        }
                    }
                }
            }
        }
    }

    function updatePersistentParts() {
        let nH = 0;
        let nV = 0;
        for (const f of foldHistory) {
            if (f.dir === 'R2L' || f.dir === 'L2R') nH++;
            else if (f.dir === 'B2T' || f.dir === 'T2B') nV++;
        }
        if (activeFold) {
            if (activeFold.dir === 'R2L' || activeFold.dir === 'L2R') nH++;
            else if (activeFold.dir === 'B2T' || activeFold.dir === 'T2B') nV++;
        }
        persistentHParts = Math.max(persistentHParts, Math.pow(2, nH));
        persistentVParts = Math.max(persistentVParts, Math.pow(2, nV));
    }

    function renderPaperTexture() {
        const w = texCanvas.width;
        const h = texCanvas.height;
        texCtx.clearRect(0, 0, w, h);

        const CREASE_COLOR = '#4a4a4a'; // 纯净中性深灰折痕虚线 (去除任何偏蓝调)
        const BASE_WIDTH = 5;           // 5px 细致清晰折痕线宽
        const BASE_DASH = [20, 14];

        const BORDER_COLOR = '#333'; // 纯正中性灰色边框线 (严禁使用带蓝色倾向的色彩)
        const BORDER_WIDTH = 5;         // 5px 细致清晰边框 (细一些，精致现代)

        if (currentShape === 'circle') {
            const cx = w / 2;
            const cy = h / 2;
            const r = w / 2 - BORDER_WIDTH / 2 - 2;

            // 纯净大白圆底色
            texCtx.save();
            texCtx.beginPath();
            texCtx.arc(cx, cy, r + BORDER_WIDTH / 2, 0, Math.PI * 2);
            texCtx.fillStyle = '#fafafa';
            texCtx.fill();

            // 边缘清晰中灰色边框
            texCtx.strokeStyle = BORDER_COLOR;
            texCtx.lineWidth = BORDER_WIDTH;
            texCtx.stroke();

            // 裁切在圆内，避免折痕溢出
            texCtx.beginPath();
            texCtx.arc(cx, cy, r, 0, Math.PI * 2);
            texCtx.clip();

            // 仅在均等对折模式下绘制中心对称的均分直径折痕
            if (foldMode === 'half') {
                let totalCircleHalfFolds = foldHistory.filter(f => !f.isFree).length;
                if (activeFold && !activeFold.isFree) totalCircleHalfFolds++;
                persistentCircleFolds = Math.max(persistentCircleFolds, totalCircleHalfFolds);

                if (persistentCircleFolds > 0) {
                    texCtx.setLineDash(BASE_DASH);
                    texCtx.strokeStyle = CREASE_COLOR;
                    texCtx.lineWidth = BASE_WIDTH;

                    const totalSlices = Math.pow(2, persistentCircleFolds);
                    const numDiameters = totalSlices / 2;

                    let baseAngle = Math.PI / 2; // 垂直折痕
                    const firstFold = foldHistory.find(f => !f.isFree) || (activeFold && !activeFold.isFree ? activeFold : null);
                    if (firstFold && (firstFold.dir === 'B2T' || firstFold.dir === 'T2B')) {
                        baseAngle = 0; // 上下对折产生水平折痕
                    }

                    for (let i = 0; i < numDiameters; i++) {
                        const angle = baseAngle + (i * Math.PI) / numDiameters;
                        texCtx.beginPath();
                        texCtx.moveTo(cx - (r + 10) * Math.cos(angle), cy - (r + 10) * Math.sin(angle));
                        texCtx.lineTo(cx + (r + 10) * Math.cos(angle), cy + (r + 10) * Math.sin(angle));
                        texCtx.stroke();
                    }
                    texCtx.setLineDash([]);
                }
            }
            texCtx.restore();
        } else {
            // 纯净大白纸底色
            texCtx.fillStyle = '#fafafa';
            texCtx.fillRect(0, 0, w, h);

            // 边缘清晰中灰色实线边框
            texCtx.strokeStyle = BORDER_COLOR;
            texCtx.lineWidth = BORDER_WIDTH;
            texCtx.strokeRect(BORDER_WIDTH / 2, BORDER_WIDTH / 2, w - BORDER_WIDTH, h - BORDER_WIDTH);

            // 仅在均等对折模式下绘制均分网格折痕
            if (foldMode === 'half') {
                updatePersistentParts();

                const aspectScale = paperH / paperW;
                const vCreaseWidth = BASE_WIDTH * aspectScale;
                const vCreaseDash = [BASE_DASH[0] / aspectScale, BASE_DASH[1] / aspectScale];

                if (persistentHParts > 1) {
                    for (let k = 1; k < persistentHParts; k++) {
                        const u = k / persistentHParts;
                        const px = u * w;
                        texCtx.setLineDash(vCreaseDash);
                        texCtx.strokeStyle = CREASE_COLOR;
                        texCtx.lineWidth = vCreaseWidth;
                        texCtx.beginPath();
                        texCtx.moveTo(px, 0);
                        texCtx.lineTo(px, h);
                        texCtx.stroke();
                        texCtx.setLineDash([]);
                    }
                }

                if (persistentVParts > 1) {
                    for (let m = 1; m < persistentVParts; m++) {
                        const v = m / persistentVParts;
                        const py = v * h;
                        texCtx.setLineDash(BASE_DASH);
                        texCtx.strokeStyle = CREASE_COLOR;
                        texCtx.lineWidth = BASE_WIDTH;
                        texCtx.beginPath();
                        texCtx.moveTo(0, py);
                        texCtx.lineTo(w, py);
                        texCtx.stroke();
                        texCtx.setLineDash([]);
                    }
                }
            }
        }

        // 绘制自由折叠与折上折产生的折痕虚线 (松开完成折叠时持久化添加，拖拽中不预画折痕)
        const allCreasesToDraw = [...persistentFreeCreases];
        foldHistory.forEach(f => {
            if (f.isFree && f.p0 && f.u) {
                const exists = allCreasesToDraw.some(c =>
                    Math.hypot(c.p0.x - f.p0.x, c.p0.z - f.p0.z) < 0.25 &&
                    Math.abs(c.u.x * f.u.x + c.u.z * f.u.z) > 0.96
                );
                if (!exists) allCreasesToDraw.push(f);
            }
        });

        if (allCreasesToDraw.length > 0) {
            texCtx.save();
            if (currentShape === 'circle') {
                const cx = w / 2;
                const cy = h / 2;
                const r = w / 2 - BORDER_WIDTH / 2 - 2;
                texCtx.beginPath();
                texCtx.arc(cx, cy, r, 0, Math.PI * 2);
                texCtx.clip();
            } else {
                texCtx.beginPath();
                texCtx.rect(BORDER_WIDTH, BORDER_WIDTH, w - BORDER_WIDTH * 2, h - BORDER_WIDTH * 2);
                texCtx.clip();
            }

            texCtx.setLineDash(BASE_DASH);
            texCtx.strokeStyle = CREASE_COLOR;
            texCtx.lineWidth = BASE_WIDTH;

            const maxDim = Math.max(paperW, paperH) * 2;
            allCreasesToDraw.forEach(f => {
                const x1 = f.p0.x - f.u.x * maxDim;
                const z1 = f.p0.z - f.u.z * maxDim;
                const x2 = f.p0.x + f.u.x * maxDim;
                const z2 = f.p0.z + f.u.z * maxDim;

                const tx1 = (x1 / paperW + 0.5) * w;
                const ty1 = (z1 / paperH + 0.5) * h;
                const tx2 = (x2 / paperW + 0.5) * w;
                const ty2 = (z2 / paperH + 0.5) * h;

                texCtx.beginPath();
                texCtx.moveTo(tx1, ty1);
                texCtx.lineTo(tx2, ty2);
                texCtx.stroke();
            });
            texCtx.restore();
        }

        paperTexture.needsUpdate = true;
        if (paper && paper.customDepthMaterial) {
            paper.customDepthMaterial.needsUpdate = true;
        }
    }

    // ==========================================
    // 5. 纸张网格与材质
    // ==========================================
    const GRID_X = 140;
    const GRID_Z = 140;
    let geometry = new THREE.PlaneGeometry(paperW, paperH, GRID_X, GRID_Z);
    let origPositions = geometry.attributes.position.clone();

    const material = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: paperTexture,
        roughness: 0.8,
        metalness: 0.0,
        side: THREE.DoubleSide,
        shadowSide: THREE.DoubleSide,
        transparent: true,
        alphaTest: 0.5,
        depthWrite: true,
        depthTest: true
    });

    const paper = new THREE.Mesh(geometry, material);
    paper.rotation.x = -Math.PI / 2;
    paper.castShadow = true;
    paper.receiveShadow = true;
    scene.add(paper);

    // 完美匹配圆形/长方形边缘的实时阴影深度材质
    const depthMaterial = new THREE.MeshDepthMaterial({
        depthPacking: THREE.RGBADepthPacking,
        map: paperTexture,
        alphaTest: 0.5
    });
    paper.customDepthMaterial = depthMaterial;

    // ==========================================
    // 6. 3D 形变算法 (支持正交与任意角平分线折叠)
    // ==========================================
    function angleDistance(a, b) {
        let diff = Math.abs(a - b) % (Math.PI * 2);
        if (diff > Math.PI) diff = Math.PI * 2 - diff;
        return diff;
    }

    function getCurrentBounds() {
        if (foldHistory.some(f => f.isFree)) {
            let xMin = Infinity, xMax = -Infinity, zMin = Infinity, zMax = -Infinity;
            const pos = paper.geometry.attributes.position;
            const count = pos.count;
            for (let i = 0; i < count; i += 4) {
                const px = pos.getX(i);
                const pz = -pos.getY(i);
                if (px < xMin) xMin = px;
                if (px > xMax) xMax = px;
                if (pz < zMin) zMin = pz;
                if (pz > zMax) zMax = pz;
            }
            if (xMin < xMax && zMin < zMax) {
                return { xMin, xMax, zMin, zMax };
            }
        }

        if (currentShape === 'circle') {
            const r = circleDiameter / 2;
            if (foldHistory.length === 0 && !activeFold) {
                return { xMin: -r, xMax: r, zMin: -r, zMax: r };
            }
            const s = currentSector;
            let xMin = 0, xMax = 0, zMin = 0, zMax = 0;
            const steps = 32;
            const span = s.end - s.start;
            for (let i = 0; i <= steps; i++) {
                const a = s.start + (span * i) / steps;
                const px = r * Math.cos(a);
                const pz = r * Math.sin(a);
                xMin = Math.min(xMin, px);
                xMax = Math.max(xMax, px);
                zMin = Math.min(zMin, pz);
                zMax = Math.max(zMax, pz);
            }
            return { xMin, xMax, zMin, zMax };
        }

        let xMin = -paperW / 2;
        let xMax = paperW / 2;
        let zMin = -paperH / 2;
        let zMax = paperH / 2;

        for (const f of foldHistory) {
            if (f.dir === 'R2L') xMax = f.line;
            else if (f.dir === 'L2R') xMin = f.line;
            else if (f.dir === 'B2T') zMax = f.line;
            else if (f.dir === 'T2B') zMin = f.line;
        }
        return { xMin, xMax, zMin, zMax };
    }

    function applyFoldTransform(pt, fold, stepIndex) {
        const angle = fold.angle;
        if (angle <= 0.0001) return;

        // 物理折叠厚度与铰链半径逐层递增，确保折上折层级分明，后面折上去的显示在上面
        const thickness = 0.12;
        const hingeRadius = 0.10 + stepIndex * 0.02;

        let p0 = fold.p0;
        let u = fold.u;
        let n = fold.n;

        if (!p0) {
            const L = fold.line !== undefined ? fold.line : 0;
            if (fold.dir === 'R2L') {
                p0 = { x: L, z: 0 };
                u = { x: 0, z: -1 };
                n = { x: 1, z: 0 };
            } else if (fold.dir === 'L2R') {
                p0 = { x: L, z: 0 };
                u = { x: 0, z: 1 };
                n = { x: -1, z: 0 };
            } else if (fold.dir === 'B2T') {
                p0 = { x: 0, z: L };
                u = { x: 1, z: 0 };
                n = { x: 0, z: 1 };
            } else if (fold.dir === 'T2B') {
                p0 = { x: 0, z: L };
                u = { x: -1, z: 0 };
                n = { x: 0, z: -1 };
            }
        }

        const vx = pt.x - p0.x;
        const vz = pt.z - p0.z;

        // 距离折线法线的有向距离，d > 0 表示在翻转侧
        const d = vx * n.x + vz * n.z;
        if (d <= 0) return;

        const uCoord = vx * u.x + vz * u.z;
        const arcLen = hingeRadius * angle;

        let offset, yLift;
        const angleRatio = angle / Math.PI;
        if (d <= arcLen && angle > 0.01) {
            const phi = (d / arcLen) * angle;
            offset = hingeRadius * Math.sin(phi);
            yLift = hingeRadius * (1 - Math.cos(phi)) + (stepIndex * thickness) * (phi / Math.PI);
        } else {
            const flapLen = d - arcLen;
            offset = hingeRadius * Math.sin(angle) + flapLen * Math.cos(angle);
            yLift = hingeRadius * (1 - Math.cos(angle)) + flapLen * Math.sin(angle) + (stepIndex * thickness) * angleRatio;
        }

        pt.x = p0.x + uCoord * u.x + offset * n.x;
        pt.z = p0.z + uCoord * u.z + offset * n.z;
        pt.y += yLift;
    }

    function updatePaperGeometry() {
        const posAttr = paper.geometry.attributes.position;
        const count = posAttr.count;

        const allFolds = [...foldHistory];
        if (activeFold) allFolds.push(activeFold);

        const pt = { x: 0, y: 0, z: 0 };

        for (let i = 0; i < count; i++) {
            const ox = origPositions.getX(i);
            const oy = origPositions.getY(i);

            pt.x = ox;
            pt.y = 0.02;
            pt.z = -oy;

            for (let s = 0; s < allFolds.length; s++) {
                applyFoldTransform(pt, allFolds[s], s + 1);
            }

            posAttr.setXYZ(i, pt.x, -pt.z, pt.y);
        }

        posAttr.needsUpdate = true;
        paper.geometry.computeVertexNormals();
    }

    // ==========================================
    // 7. 拖拽手势交互 (支持长方形与圆形折上折)
    // ==========================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    let isDragging = false;
    let dragMode = null;
    let dragStartDeskPt = new THREE.Vector3();
    let dragLockedDirection = null;
    let dragStartAngle = 0;
    let isAnimating = false;
    let lastClickTime = 0;
    let isDoodleMode = false;

    let isStartOnFoldedFlap = false;
    let isStartOnBorder = false;
    let lastFoldVec = null;
    let dragStartDistN = 0;

    // 特殊识别手指/鼠标点击是否落在已折叠翻页或翻页的边框（圆弧外沿/长方形边沿）上
    function checkPointerFoldState(pt) {
        if (foldHistory.length === 0 || activeFold) {
            return { isFoldedFlap: false, isBorder: false, foldVec: null, distN: 0 };
        }

        const lastFold = foldHistory[foldHistory.length - 1];
        let p0 = lastFold.p0;
        let u = lastFold.u;
        let n = lastFold.n;

        if (!p0) {
            const L = lastFold.line !== undefined ? lastFold.line : 0;
            if (lastFold.dir === 'R2L') {
                p0 = { x: L, z: 0 }; u = { x: 0, z: -1 }; n = { x: 1, z: 0 };
            } else if (lastFold.dir === 'L2R') {
                p0 = { x: L, z: 0 }; u = { x: 0, z: 1 }; n = { x: -1, z: 0 };
            } else if (lastFold.dir === 'B2T') {
                p0 = { x: 0, z: L }; u = { x: 1, z: 0 }; n = { x: 0, z: 1 };
            } else if (lastFold.dir === 'T2B') {
                p0 = { x: 0, z: L }; u = { x: -1, z: 0 }; n = { x: 0, z: -1 };
            } else {
                p0 = { x: 0, z: 0 }; u = { x: 0, z: 1 }; n = { x: 1, z: 0 };
            }
        }

        const foldVec = { p0, u, n, dir: lastFold.dir };

        // 计算起点距离上一次折痕法线的有向距离，折叠扇叶落在 -n 侧
        const distN = (pt.x - p0.x) * n.x + (pt.z - p0.z) * n.z;

        // 如果起点落在折线未翻折侧（超过 0.35），则不是已折叠翻页
        if (distN > 0.35) {
            return { isFoldedFlap: false, isBorder: false, foldVec, distN };
        }

        // 翻折前在未折叠纸张平面上的对应坐标（沿折痕轴对称镜像）
        const origX = pt.x - 2 * distN * n.x;
        const origZ = pt.z - 2 * distN * n.z;

        let isFoldedFlap = false;
        let isBorder = false;

        const BORDER_TOLERANCE = 2.4; // 触控识别边框的舒适容差阈值

        if (currentShape === 'circle') {
            const R = circleDiameter / 2;
            const origR = Math.hypot(origX, origZ);
            const curR = Math.hypot(pt.x, pt.z);

            if (origR <= R + 1.2) {
                isFoldedFlap = true;
                // 特殊识别圆形边框：圆弧外周、或折叠翻页外弧边
                const nearOrigBorder = Math.abs(origR - R) <= BORDER_TOLERANCE;
                const nearCurBorder = Math.abs(curR - R) <= BORDER_TOLERANCE;
                if ((nearOrigBorder || nearCurBorder) && distN < -0.2) {
                    isBorder = true;
                }
            }
        } else {
            const halfW = paperW / 2;
            const halfH = paperH / 2;
            const inOrigRect = Math.abs(origX) <= halfW + 1.2 && Math.abs(origZ) <= halfH + 1.2;

            if (inOrigRect) {
                isFoldedFlap = true;
                // 特殊识别长方形边框：上下左右外边缘，以及折叠翻页外边框
                const distOrigBorder = Math.min(Math.abs(Math.abs(origX) - halfW), Math.abs(Math.abs(origZ) - halfH));
                const distCurBorder = Math.min(Math.abs(Math.abs(pt.x) - halfW), Math.abs(Math.abs(pt.z) - halfH));
                const bounds = getCurrentBounds();
                const distBounds = Math.min(
                    Math.abs(pt.x - bounds.xMin), Math.abs(pt.x - bounds.xMax),
                    Math.abs(pt.z - bounds.zMin), Math.abs(pt.z - bounds.zMax)
                );

                if ((distOrigBorder <= BORDER_TOLERANCE || distCurBorder <= BORDER_TOLERANCE || distBounds <= BORDER_TOLERANCE) && distN < -0.2) {
                    isBorder = true;
                }
            }
        }

        return { isFoldedFlap, isBorder, foldVec, distN };
    }

    window.addEventListener('pointerdown', (e) => {
        if (isDoodleMode) return;
        if (e.target.closest('#resetBtn') || e.target.closest('#topRightBar') || e.target.closest('#rightCenterBar') || e.target.closest('#bottomRightBar') || e.target.closest('#settingsBtn') || e.target.closest('#slidersContainer') || e.target.closest('#toast')) {
            return;
        }
        if (isAnimating) return;

        // 检测双击（350ms 内连续点击触发平滑完全展开）
        const now = performance.now();
        if (now - lastClickTime < 350) {
            lastClickTime = 0;
            if (foldHistory.length > 0 || activeFold) {
                isDragging = false;
                controls.enabled = true;
                unfoldAll();
                return;
            }
        }
        lastClickTime = now;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const deskHits = raycaster.intersectObject(desk);
        if (deskHits.length === 0) return;
        const pt = deskHits[0].point;

        const bounds = getCurrentBounds();
        const margin = 1.5;
        const inBounds = (pt.x >= bounds.xMin - margin && pt.x <= bounds.xMax + margin &&
            pt.z >= bounds.zMin - margin && pt.z <= bounds.zMax + margin);

        if (inBounds) {
            isDragging = true;
            controls.enabled = false;
            dragStartDeskPt.copy(pt);

            if (activeFold) {
                dragLockedDirection = activeFold.dir;
                dragStartAngle = activeFold.angle;
                isStartOnBorder = false;
                isStartOnFoldedFlap = false;
                lastFoldVec = null;
            } else {
                dragLockedDirection = null;
                dragStartAngle = 0;

                // 特殊识别起点是否落在已折叠翻页或圆形/长方形边框上
                const foldState = checkPointerFoldState(pt);
                isStartOnFoldedFlap = foldState.isFoldedFlap;
                isStartOnBorder = foldState.isBorder;
                lastFoldVec = foldState.foldVec;
                dragStartDistN = foldState.distN;
            }
            dragMode = null;
        }
    });

    window.addEventListener('pointermove', (e) => {
        if (isDoodleMode || !isDragging || isAnimating) return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const deskHits = raycaster.intersectObject(desk);
        if (deskHits.length === 0) return;
        const pt = deskHits[0].point;

        const dx = pt.x - dragStartDeskPt.x;
        const dz = pt.z - dragStartDeskPt.z;
        const dist = Math.sqrt(dx * dx + dz * dz);

        const bounds = getCurrentBounds();
        const wCurrent = Math.max(0.1, bounds.xMax - bounds.xMin);
        const hCurrent = Math.max(0.1, bounds.zMax - bounds.zMin);

        if (!dragLockedDirection && dist > 0.12) {
            // 1. 优先特殊识别：如果在已折叠状态下拖拽圆形/长方形边框，直接反向展开最后一次折叠
            if (foldHistory.length > 0 && !activeFold && lastFoldVec) {
                const dragAlongN = dx * lastFoldVec.n.x + dz * lastFoldVec.n.z;

                // 特殊识别边框与翻页展开：
                // 必须朝向解折方向拉动 (dragAlongN > 0.15) 时才触发展开；
                // 若朝向折叠方向推动 (dragAlongN <= 0)，则绝不误判为展开，支持继续同向折叠
                const shouldUnfold = (isStartOnBorder || isStartOnFoldedFlap) && dragAlongN > 0.15;

                if (shouldUnfold) {
                    dragMode = 'UNFOLD';
                    dragLockedDirection = lastFoldVec.dir;
                    activeFold = foldHistory.pop();
                    if (!activeFold.p0 || !activeFold.n) {
                        activeFold.p0 = lastFoldVec.p0;
                        activeFold.u = lastFoldVec.u;
                        activeFold.n = lastFoldVec.n;
                    }
                    dragStartAngle = Math.PI;
                    sfx.playRustle(0.8);
                    if (currentShape === 'circle' && activeFold.fromSector) {
                        currentSector = { ...activeFold.fromSector };
                    }
                    renderPaperTexture();
                    return;
                }
            }

            // 2. 检查最大对折次数限制
            if (foldHistory.length >= MAX_FOLDS) {
                return;
            }

            // 3. 选择新的对折
            if (foldMode === 'free') {
                // === 任意折上折模式 ===
                let effDx = dx;
                let effDz = dz;
                // 智能微吸附：接近水平 (|dz/dx| < 0.14) 吸附为纯水平折
                if (Math.abs(effDx) > 0.3 && Math.abs(effDz) / Math.abs(effDx) < 0.14) {
                    effDz = 0;
                } else if (Math.abs(effDz) > 0.3 && Math.abs(effDx) / Math.abs(effDz) < 0.14) {
                    // 接近垂直 (|dx/dz| < 0.14) 吸附为纯垂直折
                    effDx = 0;
                } else {
                    // 接近45度对角线吸附
                    const diff45 = Math.abs(Math.abs(effDx) - Math.abs(effDz)) / (Math.abs(effDx) + Math.abs(effDz));
                    if (diff45 < 0.10) {
                        const avg = (Math.abs(effDx) + Math.abs(effDz)) / 2;
                        effDx = Math.sign(effDx) * avg;
                        effDz = Math.sign(effDz) * avg;
                    }
                }

                const effDist = Math.sqrt(effDx * effDx + effDz * effDz);
                if (effDist > 0.15) {
                    const dirX = effDx / effDist;
                    const dirZ = effDz / effDist;
                    const n = { x: -dirX, z: -dirZ };
                    const u = { x: dirZ, z: -dirX };
                    const p0 = {
                        x: dragStartDeskPt.x + effDx * 0.5,
                        z: dragStartDeskPt.z + effDz * 0.5
                    };

                    dragMode = 'FOLD';
                    dragLockedDirection = 'FREE_' + foldHistory.length;
                    activeFold = {
                        dir: dragLockedDirection,
                        isFree: true,
                        p0, u, n,
                        angle: 0,
                        dragStartDeskPt: dragStartDeskPt.clone()
                    };
                    dragStartAngle = 0;
                    sfx.playRustle(1.0);
                    // 自由模式折痕在松开完成时添加，拖拽时不调用 renderPaperTexture
                }
            } else if (currentShape === 'circle') {
                if (foldHistory.length === 0) {
                    // 第一次对折：半圆 (1/2)
                    let chosenDir = null;
                    let p0, u, n, toSector;
                    if (Math.abs(dx) > Math.abs(dz)) {
                        if (dx < 0) {
                            chosenDir = 'R2L';
                            p0 = { x: 0, z: 0 };
                            u = { x: 0, z: -1 };
                            n = { x: 1, z: 0 };
                            toSector = { start: Math.PI / 2, end: 3 * Math.PI / 2 };
                        } else {
                            chosenDir = 'L2R';
                            p0 = { x: 0, z: 0 };
                            u = { x: 0, z: 1 };
                            n = { x: -1, z: 0 };
                            toSector = { start: -Math.PI / 2, end: Math.PI / 2 };
                        }
                    } else {
                        if (dz < 0) {
                            chosenDir = 'B2T';
                            p0 = { x: 0, z: 0 };
                            u = { x: 1, z: 0 };
                            n = { x: 0, z: 1 };
                            toSector = { start: Math.PI, end: 2 * Math.PI };
                        } else {
                            chosenDir = 'T2B';
                            p0 = { x: 0, z: 0 };
                            u = { x: -1, z: 0 };
                            n = { x: 0, z: -1 };
                            toSector = { start: 0, end: Math.PI };
                        }
                    }
                    if (chosenDir) {
                        dragMode = 'FOLD';
                        dragLockedDirection = chosenDir;
                        activeFold = {
                            dir: chosenDir,
                            line: 0,
                            p0, u, n,
                            angle: 0,
                            fromSector: { start: 0, end: 2 * Math.PI },
                            toSector
                        };
                        dragStartAngle = 0;
                        sfx.playRustle(1.0);
                        renderPaperTexture();
                    }
                } else if (foldHistory.length === 1) {
                    // 第二次对折：直角扇形 (1/4)
                    const prevFold = foldHistory[0];
                    let chosenDir = null;
                    let p0 = { x: 0, z: 0 };
                    let u, n, toSector;

                    if (prevFold.dir === 'R2L' || prevFold.dir === 'L2R') {
                        if (dz < -0.15) {
                            chosenDir = 'B2T';
                            u = { x: 1, z: 0 };
                            n = { x: 0, z: 1 };
                            const targetBaseAngle = 3 * Math.PI / 2; // B2T 目标边为上方 -Z (270°)
                            toSector = prevFold.dir === 'R2L'
                                ? { start: Math.PI, end: 3 * Math.PI / 2, targetBaseAngle }
                                : { start: 3 * Math.PI / 2, end: 2 * Math.PI, targetBaseAngle };
                        } else if (dz > 0.15) {
                            chosenDir = 'T2B';
                            u = { x: -1, z: 0 };
                            n = { x: 0, z: -1 };
                            const targetBaseAngle = Math.PI / 2; // T2B 目标边为下方 +Z (90°)
                            toSector = prevFold.dir === 'R2L'
                                ? { start: Math.PI / 2, end: Math.PI, targetBaseAngle }
                                : { start: 0, end: Math.PI / 2, targetBaseAngle };
                        }
                    } else {
                        if (dx < -0.15) {
                            chosenDir = 'R2L';
                            u = { x: 0, z: -1 };
                            n = { x: 1, z: 0 };
                            const targetBaseAngle = Math.PI; // R2L 目标边为左方 -X (180°)
                            toSector = prevFold.dir === 'B2T'
                                ? { start: Math.PI, end: 3 * Math.PI / 2, targetBaseAngle }
                                : { start: Math.PI / 2, end: Math.PI, targetBaseAngle };
                        } else if (dx > 0.15) {
                            chosenDir = 'L2R';
                            u = { x: 0, z: 1 };
                            n = { x: -1, z: 0 };
                            const targetBaseAngle = 0; // L2R 目标边为右方 +X (0°/360°)
                            toSector = prevFold.dir === 'B2T'
                                ? { start: 3 * Math.PI / 2, end: 2 * Math.PI, targetBaseAngle }
                                : { start: 0, end: Math.PI / 2, targetBaseAngle };
                        }
                    }

                    if (chosenDir) {
                        dragMode = 'FOLD';
                        dragLockedDirection = chosenDir;
                        activeFold = {
                            dir: chosenDir,
                            line: 0,
                            p0, u, n,
                            angle: 0,
                            fromSector: { ...currentSector },
                            toSector
                        };
                        dragStartAngle = 0;
                        sfx.playRustle(1.0);
                        renderPaperTexture();
                    }
                } else {
                    // 第三次及后续对折：仅允许沿着之前对折方向继续对折（合并一边，不能开口一侧对折，避免方向交叉）
                    let s1 = currentSector.start;
                    let s2 = currentSector.end;
                    while (s2 < s1) s2 += Math.PI * 2;
                    const thetaMid = (s1 + s2) / 2;

                    const baseAngle = (currentSector.targetBaseAngle !== undefined && currentSector.targetBaseAngle !== null)
                        ? currentSector.targetBaseAngle
                        : s2;

                    // 确定哪条边是前序对折确定的目标固定底边
                    const isS1Base = angleDistance(s1, baseAngle) <= angleDistance(s2, baseAngle);
                    const targetBase = isS1Base ? s1 : s2;

                    let u, n, toSector;
                    if (isS1Base) {
                        // s1 是目标固定边，s2 侧扇叶折向 s1 (法线 n 指向 s2 侧)
                        u = { x: Math.cos(thetaMid), z: Math.sin(thetaMid) };
                        n = { x: -Math.sin(thetaMid), z: Math.cos(thetaMid) };
                        toSector = { start: s1, end: thetaMid, targetBaseAngle: targetBase };
                    } else {
                        // s2 是目标固定边，s1 侧扇叶折向 s2 (法线 n 指向 s1 侧)
                        u = { x: -Math.cos(thetaMid), z: -Math.sin(thetaMid) };
                        n = { x: Math.sin(thetaMid), z: -Math.cos(thetaMid) };
                        toSector = { start: thetaMid, end: s2, targetBaseAngle: targetBase };
                    }

                    // 仅允许朝着固定目标边方向拖拽进行对折合并，不能反向从开口侧对折
                    const dragTowardsBase = -(dx * n.x + dz * n.z);

                    if (dragTowardsBase > 0.15) {
                        const chosenDir = 'RADIAL_' + foldHistory.length;
                        dragMode = 'FOLD';
                        dragLockedDirection = chosenDir;
                        activeFold = {
                            dir: chosenDir,
                            line: 0,
                            p0: { x: 0, z: 0 },
                            u, n,
                            angle: 0,
                            fromSector: { ...currentSector },
                            toSector
                        };
                        dragStartAngle = 0;
                        sfx.playRustle(1.0);
                        renderPaperTexture();
                    }
                }
            } else {
                // 长方形对折：仅限制不允许反向折叠（例如上一步是 R2L，则下一步仅禁止 L2R，其他方向均支持；每一步均以此类推）
                const OPPOSITE_DIRS = {
                    'R2L': 'L2R',
                    'L2R': 'R2L',
                    'B2T': 'T2B',
                    'T2B': 'B2T'
                };

                const lastFold = foldHistory.length > 0 ? foldHistory[foldHistory.length - 1] : null;
                const disallowedDir = (lastFold && OPPOSITE_DIRS[lastFold.dir]) ? OPPOSITE_DIRS[lastFold.dir] : null;

                let chosenDir = null;
                if (Math.abs(dx) > Math.abs(dz)) {
                    if (dx < 0 && disallowedDir !== 'R2L') {
                        chosenDir = 'R2L';
                    } else if (dx > 0 && disallowedDir !== 'L2R') {
                        chosenDir = 'L2R';
                    } else {
                        // 若主要水平方向被限制，且存在明显垂直拖拽手势，则选用垂直方向
                        if (dz < -0.15 && disallowedDir !== 'B2T') {
                            chosenDir = 'B2T';
                        } else if (dz > 0.15 && disallowedDir !== 'T2B') {
                            chosenDir = 'T2B';
                        }
                    }
                } else {
                    if (dz < 0 && disallowedDir !== 'B2T') {
                        chosenDir = 'B2T';
                    } else if (dz > 0 && disallowedDir !== 'T2B') {
                        chosenDir = 'T2B';
                    } else {
                        // 若主要垂直方向被限制，且存在明显水平拖拽手势，则选用水平方向
                        if (dx < -0.15 && disallowedDir !== 'R2L') {
                            chosenDir = 'R2L';
                        } else if (dx > 0.15 && disallowedDir !== 'L2R') {
                            chosenDir = 'L2R';
                        }
                    }
                }

                if (chosenDir) {
                    dragMode = 'FOLD';
                    dragLockedDirection = chosenDir;
                    const midX = (bounds.xMin + bounds.xMax) / 2;
                    const midZ = (bounds.zMin + bounds.zMax) / 2;
                    let p0, u, n;
                    if (chosenDir === 'R2L') {
                        p0 = { x: midX, z: 0 };
                        u = { x: 0, z: -1 };
                        n = { x: 1, z: 0 };
                    } else if (chosenDir === 'L2R') {
                        p0 = { x: midX, z: 0 };
                        u = { x: 0, z: 1 };
                        n = { x: -1, z: 0 };
                    } else if (chosenDir === 'B2T') {
                        p0 = { x: 0, z: midZ };
                        u = { x: 1, z: 0 };
                        n = { x: 0, z: 1 };
                    } else if (chosenDir === 'T2B') {
                        p0 = { x: 0, z: midZ };
                        u = { x: -1, z: 0 };
                        n = { x: 0, z: -1 };
                    }

                    activeFold = {
                        dir: chosenDir,
                        line: (chosenDir === 'R2L' || chosenDir === 'L2R') ? midX : midZ,
                        p0, u, n,
                        angle: 0
                    };
                    dragStartAngle = 0;
                    sfx.playRustle(1.0);
                    renderPaperTexture();
                }
            }
        }

        if (activeFold) {
            if (activeFold.isFree) {
                if (dragMode === 'FOLD') {
                    // 动态更新折线位置与法线方向，跟随手势拉动
                    let curDx = pt.x - activeFold.dragStartDeskPt.x;
                    let curDz = pt.z - activeFold.dragStartDeskPt.z;
                    if (Math.abs(curDx) > 0.3 && Math.abs(curDz) / Math.abs(curDx) < 0.14) {
                        curDz = 0;
                    } else if (Math.abs(curDz) > 0.3 && Math.abs(curDx) / Math.abs(curDz) < 0.14) {
                        curDx = 0;
                    } else {
                        const diff45 = Math.abs(Math.abs(curDx) - Math.abs(curDz)) / (Math.abs(curDx) + Math.abs(curDz));
                        if (diff45 < 0.10) {
                            const avg = (Math.abs(curDx) + Math.abs(curDz)) / 2;
                            curDx = Math.sign(curDx) * avg;
                            curDz = Math.sign(curDz) * avg;
                        }
                    }

                    const curDist = Math.sqrt(curDx * curDx + curDz * curDz);
                    if (curDist > 0.1) {
                        const dirX = curDx / curDist;
                        const dirZ = curDz / curDist;
                        activeFold.n = { x: -dirX, z: -dirZ };
                        activeFold.u = { x: dirZ, z: -dirX };
                        activeFold.p0 = {
                            x: activeFold.dragStartDeskPt.x + curDx * 0.5,
                            z: activeFold.dragStartDeskPt.z + curDz * 0.5
                        };
                    }

                    // 翻折角度平滑卷折至 180°
                    const flipDistThreshold = 1.2;
                    activeFold.angle = Math.min(Math.PI, (curDist / flipDistThreshold) * Math.PI);
                    updatePaperGeometry();
                } else if (dragMode === 'UNFOLD') {
                    // 反向展开已有折叠
                    const dragAlongN = dx * activeFold.n.x + dz * activeFold.n.z;
                    const flapExtent = Math.max(3.0, Math.abs(dragStartDistN) * 1.5);
                    const progress = dragAlongN / flapExtent;
                    let targetAngle = dragStartAngle - progress * Math.PI;
                    activeFold.angle = Math.max(0, Math.min(Math.PI, targetAngle));
                    updatePaperGeometry();
                }
            } else {
                let progress = 0;
                if (activeFold.dir === 'R2L') {
                    progress = -dx / (wCurrent / 2);
                } else if (activeFold.dir === 'L2R') {
                    progress = dx / (wCurrent / 2);
                } else if (activeFold.dir === 'B2T') {
                    progress = -dz / (hCurrent / 2);
                } else if (activeFold.dir === 'T2B') {
                    progress = dz / (hCurrent / 2);
                } else if (activeFold.n) {
                    const dragAlongNegN = -(dx * activeFold.n.x + dz * activeFold.n.z);
                    const flapSpan = activeFold.fromSector ? Math.abs(activeFold.fromSector.end - activeFold.fromSector.start) / 2 : Math.PI / 4;
                    const flapExtent = Math.max(1.8, (circleDiameter / 2) * Math.sin(flapSpan));
                    progress = dragAlongNegN / flapExtent;
                }

                let targetAngle = dragStartAngle + progress * Math.PI;
                activeFold.angle = Math.max(0, Math.min(Math.PI, targetAngle));
                updatePaperGeometry();
            }
        }
    });

    window.addEventListener('pointerup', () => {
        if (!isDragging) return;
        isDragging = false;
        controls.enabled = true;

        if (activeFold) {
            const angle = activeFold.angle;
            if (dragMode === 'UNFOLD') {
                if (angle < Math.PI * 0.65) {
                    animateSnapTo(0);
                } else {
                    animateSnapTo(Math.PI);
                }
            } else if (activeFold.isFree) {
                if (angle >= Math.PI * 0.45) {
                    animateSnapTo(Math.PI);
                } else {
                    animateSnapTo(0);
                }
            } else {
                if (angle >= Math.PI * 0.5) {
                    animateSnapTo(Math.PI);
                } else {
                    animateSnapTo(0);
                }
            }
        }
    });

    function animateSnapTo(targetAngle) {
        if (!activeFold) return;
        isAnimating = true;

        const startAngle = activeFold.angle;
        const startTime = performance.now();
        const duration = 220;

        function frame(time) {
            const elapsed = time - startTime;
            const p = Math.min(elapsed / duration, 1.0);
            const ease = p * (2 - p);

            activeFold.angle = startAngle + (targetAngle - startAngle) * ease;
            updatePaperGeometry();

            if (p < 1.0) {
                requestAnimationFrame(frame);
            } else {
                activeFold.angle = targetAngle;
                updatePaperGeometry();
                isAnimating = false;

                if (targetAngle === Math.PI) {
                    sfx.playFoldSnap();
                    foldHistory.push(activeFold);
                    if (activeFold.isFree) {
                        addPersistentCrease(activeFold);
                    }
                    if (currentShape === 'circle' && activeFold.toSector) {
                        currentSector = { ...activeFold.toSector };
                    }
                } else {
                    sfx.playUnfoldSnap();
                }
                activeFold = null;
                renderPaperTexture();
            }
        }
        requestAnimationFrame(frame);
    }

    // ==========================================
    // 8. 控件交互 (折叠模式、形状切换、重置、长宽/直径设置)
    // ==========================================
    // 折叠模式：'half' 均等对折 | 'free' 任意折上折
    let foldMode = 'half';
    const foldModeBtn = document.getElementById('foldModeBtn');
    const foldModeIconHalf = document.getElementById('foldModeIconHalf');
    const foldModeIconFree = document.getElementById('foldModeIconFree');
    const toastEl = document.getElementById('toast');
    let toastTimer = null;

    function showToast(msg) {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toastEl.classList.remove('show');
        }, 2200);
    }

    function updateFoldModeUI() {
        if (!foldModeBtn) return;
        if (foldMode === 'free') {
            foldModeBtn.classList.add('active');
            if (foldModeIconHalf) foldModeIconHalf.style.display = 'none';
            if (foldModeIconFree) foldModeIconFree.style.display = 'block';
            foldModeBtn.title = '当前：任意折上折模式（点击切换为均等对折）';
        } else {
            foldModeBtn.classList.remove('active');
            if (foldModeIconHalf) foldModeIconHalf.style.display = 'block';
            if (foldModeIconFree) foldModeIconFree.style.display = 'none';
            foldModeBtn.title = '当前：均等对折模式（点击切换为任意折）';
        }
    }

    if (foldModeBtn) {
        foldModeBtn.addEventListener('click', () => {
            if (isAnimating) return;
            foldMode = (foldMode === 'half') ? 'free' : 'half';
            updateFoldModeUI();
            if (foldMode === 'free') {
                showToast('已开启：任意折上折模式');
            } else {
                showToast('已开启：均等对折模式');
            }
        });
    }

    // ==========================================
    // 8.1 涂鸦板书交互 (画笔模式、清屏)
    // ==========================================
    const doodleCanvas = document.getElementById('doodleCanvas');
    const doodleCtx = doodleCanvas ? doodleCanvas.getContext('2d') : null;
    const penBtn = document.getElementById('penBtn');
    const clearDoodleBtn = document.getElementById('clearDoodleBtn');

    let isDrawingDoodle = false;
    let lastDoodlePt = { x: 0, y: 0 };
    let doodleStrokes = [];

    function resizeDoodleCanvas() {
        if (!doodleCanvas || !doodleCtx) return;
        const dpr = window.devicePixelRatio || 1;
        const w = window.innerWidth;
        const h = window.innerHeight;
        doodleCanvas.width = Math.round(w * dpr);
        doodleCanvas.height = Math.round(h * dpr);
        doodleCtx.resetTransform();
        doodleCtx.scale(dpr, dpr);
        redrawAllDoodles();
    }

    function redrawAllDoodles() {
        if (!doodleCtx) return;
        const w = window.innerWidth;
        const h = window.innerHeight;
        doodleCtx.clearRect(0, 0, w, h);
        doodleStrokes.forEach(stroke => {
            if (!stroke.points || stroke.points.length === 0) return;
            doodleCtx.beginPath();
            doodleCtx.strokeStyle = stroke.color || '#ef4444';
            doodleCtx.lineWidth = stroke.width || 3.5;
            doodleCtx.lineCap = 'round';
            doodleCtx.lineJoin = 'round';
            const first = stroke.points[0];
            doodleCtx.moveTo(first.x, first.y);
            for (let i = 1; i < stroke.points.length; i++) {
                const pt = stroke.points[i];
                doodleCtx.lineTo(pt.x, pt.y);
            }
            doodleCtx.stroke();
        });
    }

    if (doodleCanvas && doodleCtx) {
        doodleCanvas.addEventListener('pointerdown', (e) => {
            if (!isDoodleMode) return;
            e.stopPropagation();
            isDrawingDoodle = true;
            try {
                doodleCanvas.setPointerCapture(e.pointerId);
            } catch (_) {}

            const rect = doodleCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            lastDoodlePt = { x, y };

            doodleStrokes.push({
                color: '#ef4444',
                width: 3.5,
                points: [{ x, y }]
            });

            // 绘制落笔点
            doodleCtx.beginPath();
            doodleCtx.arc(x, y, 1.75, 0, Math.PI * 2);
            doodleCtx.fillStyle = '#ef4444';
            doodleCtx.fill();
        });

        doodleCanvas.addEventListener('pointermove', (e) => {
            if (!isDoodleMode || !isDrawingDoodle) return;
            e.stopPropagation();
            const rect = doodleCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const curStroke = doodleStrokes[doodleStrokes.length - 1];
            if (curStroke) {
                curStroke.points.push({ x, y });
            }

            doodleCtx.beginPath();
            doodleCtx.strokeStyle = '#ef4444';
            doodleCtx.lineWidth = 3.5;
            doodleCtx.lineCap = 'round';
            doodleCtx.lineJoin = 'round';
            doodleCtx.moveTo(lastDoodlePt.x, lastDoodlePt.y);
            doodleCtx.lineTo(x, y);
            doodleCtx.stroke();

            lastDoodlePt = { x, y };
        });

        const stopDoodle = (e) => {
            if (!isDrawingDoodle) return;
            isDrawingDoodle = false;
            try {
                doodleCanvas.releasePointerCapture(e.pointerId);
            } catch (_) {}
        };
        doodleCanvas.addEventListener('pointerup', stopDoodle);
        doodleCanvas.addEventListener('pointercancel', stopDoodle);
    }

    if (penBtn) {
        penBtn.addEventListener('click', () => {
            isDoodleMode = !isDoodleMode;
            if (isDoodleMode) {
                penBtn.classList.add('active');
                if (doodleCanvas) doodleCanvas.classList.add('active');
                controls.enabled = false;
                showToast('画笔模式已开启（可在屏幕涂鸦板书，再点退出）');
            } else {
                penBtn.classList.remove('active');
                if (doodleCanvas) doodleCanvas.classList.remove('active');
                controls.enabled = true;
                isDrawingDoodle = false;
                showToast('已退出画笔模式（涂鸦保留，可继续折纸）');
            }
        });
    }

    if (clearDoodleBtn) {
        clearDoodleBtn.addEventListener('click', () => {
            doodleStrokes = [];
            if (doodleCanvas && doodleCtx) {
                const w = window.innerWidth;
                const h = window.innerHeight;
                doodleCtx.clearRect(0, 0, w, h);
            }
            sfx.playUnfoldSnap();
            showToast('已清空所有涂鸦');
        });
    }

    const shapeBtn = document.getElementById('shapeBtn');
    const resetBtn = document.getElementById('resetBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const slidersContainer = document.getElementById('slidersContainer');
    const widthSlider = document.getElementById('widthSlider');
    const heightSlider = document.getElementById('heightSlider');
    const widthVal = document.getElementById('widthVal');
    const heightVal = document.getElementById('heightVal');

    function updateShapeBtnUI() {
        if (currentShape === 'circle') {
            shapeBtn.title = '切换为长方形纸';
            shapeBtn.innerHTML = `
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                    </svg>`;
            heightSlider.style.display = 'none';
            heightVal.style.display = 'none';
            widthSlider.min = '10';
            widthSlider.max = '40';
            widthSlider.value = Math.round(circleDiameter);
            widthVal.textContent = widthSlider.value;
        } else {
            shapeBtn.title = '切换为圆形纸';
            shapeBtn.innerHTML = `
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <circle cx="12" cy="12" r="9"/>
                    </svg>`;
            heightSlider.style.display = 'block';
            heightVal.style.display = 'block';
            widthSlider.min = '10';
            widthSlider.max = '60';
            widthSlider.value = Math.round(paperW);
            heightSlider.value = Math.round(paperH);
            widthVal.textContent = widthSlider.value;
            heightVal.textContent = heightSlider.value;
        }
    }

    shapeBtn.addEventListener('click', () => {
        if (isAnimating) return;
        const nextShape = currentShape === 'rect' ? 'circle' : 'rect';
        switchShape(nextShape);
    });

    // 计算默认相机视角 (长方形微调更正，圆形接近正俯视)
    function getDefaultCameraPosition(shape = currentShape) {
        const aspect = window.innerWidth / window.innerHeight;
        const isCircle = shape === 'circle';
        const baseDistance = isCircle ? 36 : 40;
        const zTilt = isCircle ? 3.5 : 15; // 长方形Z偏移从25调至15（倾斜角由32°适度收拢至约20°：正一点点，但依然保留良好的三维立体感与折痕厚度感）
        const targetDistance = aspect < 1.0 ? baseDistance * Math.max(1, 1.1 / aspect) : baseDistance;
        const ratio = targetDistance / baseDistance;
        return new THREE.Vector3(0, targetDistance, zTilt * ratio);
    }

    function switchShape(newShape) {
        isAnimating = true;
        sfx.playUnfoldSnap();

        currentShape = newShape;
        foldHistory.length = 0;
        activeFold = null;
        persistentFreeCreases.length = 0;
        persistentHParts = 1;
        persistentVParts = 1;
        persistentCircleFolds = 0;
        currentSector = { start: 0, end: Math.PI * 2, targetBaseAngle: null };

        if (currentShape === 'circle') {
            paperW = circleDiameter;
            paperH = circleDiameter;
        } else {
            const aspect = window.innerWidth / window.innerHeight;
            paperW = aspect < 1.0 ? 21.0 : 29.7;
            paperH = aspect < 1.0 ? 29.7 : 21.0;
        }

        paper.geometry.dispose();
        geometry = new THREE.PlaneGeometry(paperW, paperH, GRID_X, GRID_Z);
        origPositions = geometry.attributes.position.clone();
        paper.geometry = geometry;

        ghostPlane.geometry.dispose();
        ghostPlane.geometry = new THREE.PlaneGeometry(paperW, paperH);

        updateShapeBtnUI();

        renderPaperTexture();
        renderGhostTexture();
        updatePaperGeometry();

        const startTime = performance.now();
        const duration = 350;
        const startCamPos = camera.position.clone();
        const targetCamPos = getDefaultCameraPosition(newShape);
        const startTarget = controls.target.clone();
        const targetTarget = new THREE.Vector3(0, 0, 0);

        function animateCam(time) {
            const elapsed = time - startTime;
            const p = Math.min(elapsed / duration, 1.0);
            const ease = 1.0 - Math.pow(1.0 - p, 3);

            camera.position.lerpVectors(startCamPos, targetCamPos, ease);
            controls.target.lerpVectors(startTarget, targetTarget, ease);
            controls.update();

            if (p < 1.0) {
                requestAnimationFrame(animateCam);
            } else {
                isAnimating = false;
            }
        }
        requestAnimationFrame(animateCam);
    }

    // 平滑完全展开函数 (供双击手势调用)
    function unfoldAll() {
        if ((foldHistory.length === 0 && !activeFold) || isAnimating) return;
        isAnimating = true;
        sfx.playUnfoldSnap();

        const startTime = performance.now();
        const duration = 300;

        function animateUnfold(time) {
            const elapsed = time - startTime;
            const p = Math.min(elapsed / duration, 1.0);
            const ease = 1.0 - Math.pow(1.0 - p, 3);

            if (activeFold) {
                activeFold.angle = activeFold.angle * (1 - ease);
            }
            foldHistory.forEach(f => {
                f.angle = f.angle * (1 - ease);
            });
            updatePaperGeometry();

            if (p < 1.0) {
                requestAnimationFrame(animateUnfold);
            } else {
                isAnimating = false;
                foldHistory.forEach(f => {
                    if (f.isFree) addPersistentCrease(f);
                });
                if (activeFold && activeFold.isFree) {
                    addPersistentCrease(activeFold);
                }
                foldHistory.length = 0;
                activeFold = null;
                if (currentShape === 'circle') {
                    currentSector = { start: 0, end: Math.PI * 2, targetBaseAngle: null };
                }
                updatePaperGeometry();
                renderPaperTexture();
            }
        }
        requestAnimationFrame(animateUnfold);
    }

    settingsBtn.addEventListener('click', () => {
        if (slidersContainer.style.display === 'none' || !slidersContainer.style.display) {
            slidersContainer.style.display = 'block';
            updateShapeBtnUI();
        } else {
            slidersContainer.style.display = 'none';
        }
    });

    function updateGeometryFromSliders() {
        if (currentShape === 'circle') {
            const newD = parseInt(widthSlider.value, 10);
            widthVal.textContent = newD;
            if (newD > 0 && newD !== circleDiameter) {
                circleDiameter = newD;
                paperW = circleDiameter;
                paperH = circleDiameter;
                foldHistory.length = 0;
                activeFold = null;
                persistentFreeCreases.length = 0;
                persistentCircleFolds = 0;
                currentSector = { start: 0, end: Math.PI * 2 };

                paper.geometry.dispose();
                geometry = new THREE.PlaneGeometry(paperW, paperH, GRID_X, GRID_Z);
                origPositions = geometry.attributes.position.clone();
                paper.geometry = geometry;

                ghostPlane.geometry.dispose();
                ghostPlane.geometry = new THREE.PlaneGeometry(paperW, paperH);

                updatePaperGeometry();
                renderPaperTexture();
                renderGhostTexture();
            }
        } else {
            const newW = parseInt(widthSlider.value, 10);
            const newH = parseInt(heightSlider.value, 10);
            widthVal.textContent = newW;
            heightVal.textContent = newH;

            if (newW > 0 && newH > 0 && (newW !== paperW || newH !== paperH)) {
                paperW = newW;
                paperH = newH;
                foldHistory.length = 0;
                activeFold = null;
                persistentFreeCreases.length = 0;
                persistentHParts = 1;
                persistentVParts = 1;

                paper.geometry.dispose();
                geometry = new THREE.PlaneGeometry(paperW, paperH, GRID_X, GRID_Z);
                origPositions = geometry.attributes.position.clone();
                paper.geometry = geometry;

                ghostPlane.geometry.dispose();
                ghostPlane.geometry = new THREE.PlaneGeometry(paperW, paperH);

                updatePaperGeometry();
                renderPaperTexture();
                renderGhostTexture();
            }
        }
    }

    widthSlider.addEventListener('input', updateGeometryFromSliders);
    heightSlider.addEventListener('input', updateGeometryFromSliders);

    // 重置按钮 (恢复初始平整纸张、清除所有折痕与初始视角)
    resetBtn.addEventListener('click', () => {
        if (isAnimating) return;
        isAnimating = true;

        sfx.playUnfoldSnap();
        const startTime = performance.now();
        const duration = 400;

        const startCamPos = camera.position.clone();
        const targetCamPos = getDefaultCameraPosition(currentShape);
        const startTarget = controls.target.clone();
        const targetTarget = new THREE.Vector3(0, 0, 0);

        function animateReset(time) {
            const elapsed = time - startTime;
            const p = Math.min(elapsed / duration, 1.0);
            const ease = 1.0 - Math.pow(1.0 - p, 3);

            camera.position.lerpVectors(startCamPos, targetCamPos, ease);
            controls.target.lerpVectors(startTarget, targetTarget, ease);
            controls.update();

            if (p < 1.0) {
                requestAnimationFrame(animateReset);
            } else {
                isAnimating = false;
                foldHistory.length = 0;
                activeFold = null;
                persistentFreeCreases.length = 0;
                persistentHParts = 1;
                persistentVParts = 1;
                persistentCircleFolds = 0;
                currentSector = { start: 0, end: Math.PI * 2, targetBaseAngle: null };

                if (currentShape === 'circle') {
                    paperW = circleDiameter;
                    paperH = circleDiameter;
                } else {
                    const aspect = window.innerWidth / window.innerHeight;
                    paperW = aspect < 1.0 ? 21.0 : 29.7;
                    paperH = aspect < 1.0 ? 29.7 : 21.0;
                }

                paper.geometry.dispose();
                geometry = new THREE.PlaneGeometry(paperW, paperH, GRID_X, GRID_Z);
                origPositions = geometry.attributes.position.clone();
                paper.geometry = geometry;

                ghostPlane.geometry.dispose();
                ghostPlane.geometry = new THREE.PlaneGeometry(paperW, paperH);

                updateShapeBtnUI();

                updatePaperGeometry();
                renderPaperTexture();
                renderGhostTexture();
            }
        }
        requestAnimationFrame(animateReset);
    });

    // ==========================================
    // 9. 窗口自适应与渲染循环
    // ==========================================
    function updateCameraFit() {
        const aspect = window.innerWidth / window.innerHeight;
        camera.aspect = aspect;

        const defPos = getDefaultCameraPosition(currentShape);
        camera.position.copy(defPos);

        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (controls) {
            controls.target.set(0, 0, 0);
            controls.update();
        }
        resizeDoodleCanvas();
    }
    window.addEventListener('resize', updateCameraFit);
    
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    // 首次加载初始化
    updateCameraFit();
    resizeDoodleCanvas();
    renderGhostTexture();
    renderPaperTexture();
    updatePaperGeometry();
    updateShapeBtnUI();
    updateFoldModeUI();
    animate();
</script>
</body>

</html>
