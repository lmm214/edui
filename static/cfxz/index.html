<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一张可自由对折的纸</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #334455;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            width: 100vw;
            height: 100vh;
        }

        /* 右上角重置按钮 */
        #resetBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            width: 44px;
            height: 44px;
            padding: 0;
            font-size: 1.3rem;
        }

        .btn {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.6), inset -1px -1px 3px rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.3s, box-shadow 0.3s, transform 0.1s;
            user-select: none;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-icon {
            width: 44px;
            height: 44px;
            padding: 0;
            font-size: 1.3rem;
        }

        .btn:hover {
            background: rgba(60, 60, 60, 0.9);
        }

        .btn:active {
            box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.8), inset -1px -1px 2px rgba(255, 255, 255, 0.05);
            transform: scale(0.97);
        }

        /* 右下角设置按钮 */
        #settingsBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            width: 44px;
            height: 44px;
            padding: 0;
            font-size: 1.3rem;
        }

        /* 底部和右侧滑动条容器 */
        #slidersContainer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 15;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            outline: none;
            position: absolute;
            pointer-events: auto;
        }

        /* 滑块白色圆点与阴影 */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 10px, transparent 11px);
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
            cursor: pointer;
            border: none;
            margin-top: -17px;
        }

        /* 轨道样式：内凹阴影 */
        input[type=range]::-webkit-slider-runnable-track {
            height: 10px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: inset 1px 1px 4px rgba(0, 0, 0, 0.8), inset -1px -1px 2px rgba(255, 255, 255, 0.15);
        }

        #widthSlider {
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
        }

        #heightSlider {
            top: 50%;
            right: calc(32px - 25vh);
            width: 50vh;
            transform: translateY(-50%) rotate(-90deg);
            margin: 0;
        }

        .slider-val {
            position: absolute;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 2rem;
            font-weight: 500;
            backdrop-filter: blur(4px);
            pointer-events: none;
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.6), inset -1px -1px 3px rgba(255, 255, 255, 0.1);
        }

        #widthVal {
            bottom: 65px;
            left: 50%;
            transform: translateX(-50%);
        }

        #heightVal {
            top: 50%;
            right: 80px;
            transform: translateY(-50%);
        }
    </style>
</head>

<body>
    <!-- 右上角重置按钮 -->
    <button id="resetBtn" class="btn btn-icon" title="重置白纸">🔄</button>

    <!-- 右下角设置按钮 -->
    <button id="settingsBtn" class="btn btn-icon" title="设置长宽">⚙️</button>

    <!-- 底部与右侧滑动条 -->
    <div id="slidersContainer" style="display: none;">
        <input type="range" id="widthSlider" min="10" max="60" step="1" value="30">
        <div class="slider-val" id="widthVal">30</div>

        <input type="range" id="heightSlider" min="10" max="60" step="1" value="21">
        <div class="slider-val" id="heightVal">21</div>
    </div>

    <!-- 引入 Three.js 和 OrbitControls -->
    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>

    <script>
        // ==========================================
        // 1. 拟真折纸音效 (Web Audio API)
        // ==========================================
        class PaperAudio {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playRustle(intensity = 1.0) {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(280 * intensity, now + 0.08);
                osc.frequency.exponentialRampToValueAtTime(70, now + 0.16);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(600, now);
                filter.frequency.exponentialRampToValueAtTime(180, now + 0.16);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.14 * intensity, now + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.18);
            }

            playFoldSnap() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(460, now);
                osc.frequency.exponentialRampToValueAtTime(160, now + 0.1);

                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.13);
            }

            playUnfoldSnap() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(480, now + 0.12);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.12, now + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.19);
            }
        }
        const sfx = new PaperAudio();

        // ==========================================
        // 2. 场景与经典光影系统
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x334455);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 40, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 10;
        controls.maxDistance = 80;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.target.set(0, 0, 0);

        // 原版灯光系统
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffcf5, 0.65);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 100;
        const d = 25;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        const dirLight2 = new THREE.DirectionalLight(0xaabbff, 0.35);
        dirLight2.position.set(-20, 40, -20);
        scene.add(dirLight2);

        const spotLight = new THREE.SpotLight(0xffffff, 0.5);
        spotLight.position.set(0, 50, 0);
        spotLight.angle = Math.PI / 4;
        spotLight.penumbra = 0.8;
        scene.add(spotLight);

        // 4 方向边缘轮廓光 (Rim Lights)
        const rimLeft = new THREE.DirectionalLight(0xffffff, 0.5);
        rimLeft.position.set(-40, 5, 0);
        scene.add(rimLeft);

        const rimRight = new THREE.DirectionalLight(0xffffff, 0.5);
        rimRight.position.set(40, 5, 0);
        scene.add(rimRight);

        const rimTop = new THREE.DirectionalLight(0xffffff, 0.4);
        rimTop.position.set(0, 5, -40);
        scene.add(rimTop);

        const rimBottom = new THREE.DirectionalLight(0xffffff, 0.4);
        rimBottom.position.set(0, 5, 40);
        scene.add(rimBottom);

        // 原版暗色桌面
        const deskGeo = new THREE.PlaneGeometry(200, 200);
        const deskMat = new THREE.MeshStandardMaterial({
            color: 0x334455,
            roughness: 0.9,
            metalness: 0.1
        });
        const desk = new THREE.Mesh(deskGeo, deskMat);
        desk.rotation.x = -Math.PI / 2;
        desk.position.y = -0.1;
        desk.receiveShadow = true;
        scene.add(desk);

        // ==========================================
        // 3. 底层淡灰色虚线框 (折过去之后露出的初始底框)
        // ==========================================
        let paperW = 29.7;
        let paperH = 21.0;
        if (window.innerWidth < window.innerHeight) {
            paperW = 21.0;
            paperH = 29.7;
        }

        const ghostCanvas = document.createElement('canvas');
        ghostCanvas.width = 1024;
        ghostCanvas.height = 1024;
        const ghostCtx = ghostCanvas.getContext('2d');
        const ghostTexture = new THREE.CanvasTexture(ghostCanvas);

        function renderGhostTexture() {
            const w = ghostCanvas.width;
            const h = ghostCanvas.height;
            ghostCtx.clearRect(0, 0, w, h);

            ghostCtx.fillStyle = 'rgba(255, 255, 255, 0.04)';
            ghostCtx.fillRect(4, 4, w - 8, h - 8);

            ghostCtx.setLineDash([18, 12]);
            ghostCtx.strokeStyle = 'rgba(156, 163, 175, 0.85)';
            ghostCtx.lineWidth = 5;
            ghostCtx.strokeRect(4, 4, w - 8, h - 8);
            ghostCtx.setLineDash([]);

            ghostTexture.needsUpdate = true;
        }

        const ghostGeo = new THREE.PlaneGeometry(paperW, paperH);
        const ghostMat = new THREE.MeshBasicMaterial({
            map: ghostTexture,
            transparent: true,
            opacity: 0.9,
            depthWrite: false
        });
        const ghostPlane = new THREE.Mesh(ghostGeo, ghostMat);
        ghostPlane.rotation.x = -Math.PI / 2;
        ghostPlane.position.y = -0.02;
        scene.add(ghostPlane);

        // ==========================================
        // 4. 完美平均分（均等网格）深灰色虚线折痕与边框
        // ==========================================
        const texCanvas = document.createElement('canvas');
        texCanvas.width = 2048;
        texCanvas.height = 2048;
        const texCtx = texCanvas.getContext('2d');
        const paperTexture = new THREE.CanvasTexture(texCanvas);
        paperTexture.anisotropy = 16;
        paperTexture.minFilter = THREE.LinearMipmapLinearFilter;
        paperTexture.magFilter = THREE.LinearFilter;
        paperTexture.generateMipmaps = true;

        const foldHistory = [];
        let activeFold = null;
        const MAX_FOLDS = 6; // 限制最多对折6次 (2^6 = 64等分)

        let persistentHParts = 1; // 横向均等份数 (2^nH)
        let persistentVParts = 1; // 纵向均等份数 (2^nV)

        function updatePersistentParts() {
            let nH = 0;
            let nV = 0;
            for (const f of foldHistory) {
                if (f.dir === 'R2L' || f.dir === 'L2R') nH++;
                else if (f.dir === 'B2T' || f.dir === 'T2B') nV++;
            }
            if (activeFold) {
                if (activeFold.dir === 'R2L' || activeFold.dir === 'L2R') nH++;
                else if (activeFold.dir === 'B2T' || activeFold.dir === 'T2B') nV++;
            }
            persistentHParts = Math.max(persistentHParts, Math.pow(2, nH));
            persistentVParts = Math.max(persistentVParts, Math.pow(2, nV));
        }

        function renderPaperTexture() {
            const w = texCanvas.width;
            const h = texCanvas.height;

            // 纯净大白纸底色（无对角色彩衰减，确保整张纸各处对比度完全一致）
            texCtx.fillStyle = '#fafafa';
            texCtx.fillRect(0, 0, w, h);

            // 淡灰色实线边框
            texCtx.strokeStyle = 'rgba(148, 163, 184, 0.85)';
            texCtx.lineWidth = 5;
            texCtx.strokeRect(2.5, 2.5, w - 5, h - 5);

            updatePersistentParts();

            // 统一折痕样式基准（以上下对折的精致虚线为标杆）
            const CREASE_COLOR = '#1f2937'; // 统一深灰色 (Tailwind Gray 800)
            const BASE_WIDTH = 4.5;
            const BASE_DASH = [20, 14];

            // 计算纸张长宽比修正系数，确保左右折痕在3D空间中与上下折痕具有完全相同的绝对粗细与虚线节奏
            const aspectScale = paperH / paperW;
            const vCreaseWidth = BASE_WIDTH * aspectScale;
            const vCreaseDash = [BASE_DASH[0] / aspectScale, BASE_DASH[1] / aspectScale];

            // 1. 渲染所有垂直等分折痕 (左右对折产生，严格匹配上下对折的线宽与虚线比例)
            if (persistentHParts > 1) {
                for (let k = 1; k < persistentHParts; k++) {
                    const u = k / persistentHParts;
                    const px = u * w;

                    texCtx.setLineDash(vCreaseDash);
                    texCtx.strokeStyle = CREASE_COLOR;
                    texCtx.lineWidth = vCreaseWidth;
                    texCtx.beginPath();
                    texCtx.moveTo(px, 0);
                    texCtx.lineTo(px, h);
                    texCtx.stroke();
                    texCtx.setLineDash([]);
                }
            }

            // 2. 渲染所有水平等分折痕 (上下对折产生)
            if (persistentVParts > 1) {
                for (let m = 1; m < persistentVParts; m++) {
                    const v = m / persistentVParts;
                    const py = v * h;

                    texCtx.setLineDash(BASE_DASH);
                    texCtx.strokeStyle = CREASE_COLOR;
                    texCtx.lineWidth = BASE_WIDTH;
                    texCtx.beginPath();
                    texCtx.moveTo(0, py);
                    texCtx.lineTo(w, py);
                    texCtx.stroke();
                    texCtx.setLineDash([]);
                }
            }

            paperTexture.needsUpdate = true;
        }

        // ==========================================
        // 5. 纸张网格与材质
        // ==========================================
        const GRID_X = 140;
        const GRID_Z = 140;
        let geometry = new THREE.PlaneGeometry(paperW, paperH, GRID_X, GRID_Z);
        let origPositions = geometry.attributes.position.clone();

        const material = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            map: paperTexture,
            roughness: 0.8,
            metalness: 0.0,
            side: THREE.DoubleSide,
            shadowSide: THREE.DoubleSide
        });

        const paper = new THREE.Mesh(geometry, material);
        paper.rotation.x = -Math.PI / 2;
        paper.castShadow = true;
        paper.receiveShadow = true;
        scene.add(paper);

        // ==========================================
        // 6. 3D 形变算法
        // ==========================================
        function getCurrentBounds() {
            let xMin = -paperW / 2;
            let xMax = paperW / 2;
            let zMin = -paperH / 2;
            let zMax = paperH / 2;

            for (const f of foldHistory) {
                if (f.dir === 'R2L') xMax = f.line;
                else if (f.dir === 'L2R') xMin = f.line;
                else if (f.dir === 'B2T') zMax = f.line;
                else if (f.dir === 'T2B') zMin = f.line;
            }
            return { xMin, xMax, zMin, zMax };
        }

        function applyFoldTransform(pt, fold, stepIndex) {
            const angle = fold.angle;
            if (angle <= 0.0001) return;

            const thickness = 0.06;
            const hingeRadius = 0.08 + stepIndex * 0.015;
            const L = fold.line;

            if (fold.dir === 'R2L') {
                const dx = pt.x - L;
                if (dx > 0) {
                    const arcLen = hingeRadius * angle;
                    if (dx <= arcLen && angle > 0.01) {
                        const phi = (dx / arcLen) * angle;
                        pt.x = L + hingeRadius * Math.sin(phi);
                        pt.y += hingeRadius * (1 - Math.cos(phi)) + stepIndex * thickness * (phi / Math.PI);
                    } else {
                        const flapLen = dx - arcLen;
                        pt.x = L + hingeRadius * Math.sin(angle) + flapLen * Math.cos(angle);
                        pt.y += hingeRadius * (1 - Math.cos(angle)) + flapLen * Math.sin(angle) + stepIndex * thickness;
                    }
                }
            } else if (fold.dir === 'L2R') {
                const dx = L - pt.x;
                if (dx > 0) {
                    const arcLen = hingeRadius * angle;
                    if (dx <= arcLen && angle > 0.01) {
                        const phi = (dx / arcLen) * angle;
                        pt.x = L - hingeRadius * Math.sin(phi);
                        pt.y += hingeRadius * (1 - Math.cos(phi)) + stepIndex * thickness * (phi / Math.PI);
                    } else {
                        const flapLen = dx - arcLen;
                        pt.x = L - hingeRadius * Math.sin(angle) - flapLen * Math.cos(angle);
                        pt.y += hingeRadius * (1 - Math.cos(angle)) + flapLen * Math.sin(angle) + stepIndex * thickness;
                    }
                }
            } else if (fold.dir === 'B2T') {
                const dz = pt.z - L;
                if (dz > 0) {
                    const arcLen = hingeRadius * angle;
                    if (dz <= arcLen && angle > 0.01) {
                        const phi = (dz / arcLen) * angle;
                        pt.z = L + hingeRadius * Math.sin(phi);
                        pt.y += hingeRadius * (1 - Math.cos(phi)) + stepIndex * thickness * (phi / Math.PI);
                    } else {
                        const flapLen = dz - arcLen;
                        pt.z = L + hingeRadius * Math.sin(angle) + flapLen * Math.cos(angle);
                        pt.y += hingeRadius * (1 - Math.cos(angle)) + flapLen * Math.sin(angle) + stepIndex * thickness;
                    }
                }
            } else if (fold.dir === 'T2B') {
                const dz = L - pt.z;
                if (dz > 0) {
                    const arcLen = hingeRadius * angle;
                    if (dz <= arcLen && angle > 0.01) {
                        const phi = (dz / arcLen) * angle;
                        pt.z = L - hingeRadius * Math.sin(phi);
                        pt.y += hingeRadius * (1 - Math.cos(phi)) + stepIndex * thickness * (phi / Math.PI);
                    } else {
                        const flapLen = dz - arcLen;
                        pt.z = L - hingeRadius * Math.sin(angle) - flapLen * Math.cos(angle);
                        pt.y += hingeRadius * (1 - Math.cos(angle)) + flapLen * Math.sin(angle) + stepIndex * thickness;
                    }
                }
            }
        }

        function updatePaperGeometry() {
            const posAttr = paper.geometry.attributes.position;
            const count = posAttr.count;

            const allFolds = [...foldHistory];
            if (activeFold) allFolds.push(activeFold);

            const pt = { x: 0, y: 0, z: 0 };

            for (let i = 0; i < count; i++) {
                const ox = origPositions.getX(i);
                const oy = origPositions.getY(i);

                pt.x = ox;
                pt.y = 0.02;
                pt.z = -oy;

                for (let s = 0; s < allFolds.length; s++) {
                    applyFoldTransform(pt, allFolds[s], s + 1);
                }

                posAttr.setXYZ(i, pt.x, -pt.z, pt.y);
            }

            posAttr.needsUpdate = true;
            paper.geometry.computeVertexNormals();
        }

        // ==========================================
        // 7. 拖拽手势交互 (限制最多6次对折)
        // ==========================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        let isDragging = false;
        let dragMode = null;
        let dragStartDeskPt = new THREE.Vector3();
        let dragLockedDirection = null;
        let dragStartAngle = 0;
        let isAnimating = false;
        let lastClickTime = 0;

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#resetBtn') || e.target.closest('#settingsBtn') || e.target.closest('#slidersContainer')) {
                return;
            }
            if (isAnimating) return;

            // 检测双击（350ms 内连续点击触发平滑完全展开）
            const now = performance.now();
            if (now - lastClickTime < 350) {
                lastClickTime = 0;
                if (foldHistory.length > 0 || activeFold) {
                    isDragging = false;
                    controls.enabled = true;
                    unfoldAll();
                    return;
                }
            }
            lastClickTime = now;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const deskHits = raycaster.intersectObject(desk);
            if (deskHits.length === 0) return;
            const pt = deskHits[0].point;

            const bounds = getCurrentBounds();
            const margin = 1.5;
            const inBounds = (pt.x >= bounds.xMin - margin && pt.x <= bounds.xMax + margin &&
                              pt.z >= bounds.zMin - margin && pt.z <= bounds.zMax + margin);

            if (inBounds) {
                isDragging = true;
                controls.enabled = false;
                dragStartDeskPt.copy(pt);

                if (activeFold) {
                    dragLockedDirection = activeFold.dir;
                    dragStartAngle = activeFold.angle;
                } else {
                    dragLockedDirection = null;
                    dragStartAngle = 0;
                }
                dragMode = null;
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging || isAnimating) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const deskHits = raycaster.intersectObject(desk);
            if (deskHits.length === 0) return;
            const pt = deskHits[0].point;

            const dx = pt.x - dragStartDeskPt.x;
            const dz = pt.z - dragStartDeskPt.z;
            const dist = Math.sqrt(dx * dx + dz * dz);

            const bounds = getCurrentBounds();
            const wCurrent = bounds.xMax - bounds.xMin;
            const hCurrent = bounds.zMax - bounds.zMin;

            if (!dragLockedDirection && dist > 0.2) {
                // 1. 优先检测是否反向展开已完成的最后一步 (从开口侧拉动)
                if (foldHistory.length > 0 && !activeFold) {
                    const lastFold = foldHistory[foldHistory.length - 1];
                    let isUnfolding = false;

                    if (lastFold.dir === 'R2L' && dx > 0.25) isUnfolding = true;
                    else if (lastFold.dir === 'L2R' && dx < -0.25) isUnfolding = true;
                    else if (lastFold.dir === 'B2T' && dz > 0.25) isUnfolding = true;
                    else if (lastFold.dir === 'T2B' && dz < -0.25) isUnfolding = true;

                    if (isUnfolding) {
                        dragMode = 'UNFOLD';
                        dragLockedDirection = lastFold.dir;
                        activeFold = foldHistory.pop();
                        dragStartAngle = Math.PI;
                        sfx.playRustle(0.8);
                        renderPaperTexture();
                        return;
                    }
                }

                // 2. 检查最大对折次数限制 (最多6次)
                if (foldHistory.length >= MAX_FOLDS) {
                    return;
                }

                // 3. 仅支持从非开口处（闭合折痕边缘/平整边）继续对折
                const lastHFold = foldHistory.slice().reverse().find(f => f.dir === 'R2L' || f.dir === 'L2R');
                const lastVFold = foldHistory.slice().reverse().find(f => f.dir === 'B2T' || f.dir === 'T2B');

                const allowedH = lastHFold ? [lastHFold.dir] : ['R2L', 'L2R'];
                const allowedV = lastVFold ? [lastVFold.dir] : ['B2T', 'T2B'];

                let chosenDir = null;
                if (Math.abs(dx) > Math.abs(dz)) {
                    if (dx < 0 && allowedH.includes('R2L')) {
                        chosenDir = 'R2L';
                    } else if (dx > 0 && allowedH.includes('L2R')) {
                        chosenDir = 'L2R';
                    }
                } else {
                    if (dz < 0 && allowedV.includes('B2T')) {
                        chosenDir = 'B2T';
                    } else if (dz > 0 && allowedV.includes('T2B')) {
                        chosenDir = 'T2B';
                    }
                }

                if (chosenDir) {
                    dragMode = 'FOLD';
                    dragLockedDirection = chosenDir;
                    if (chosenDir === 'R2L' || chosenDir === 'L2R') {
                        activeFold = {
                            dir: chosenDir,
                            line: (bounds.xMin + bounds.xMax) / 2,
                            angle: 0
                        };
                    } else {
                        activeFold = {
                            dir: chosenDir,
                            line: (bounds.zMin + bounds.zMax) / 2,
                            angle: 0
                        };
                    }
                    dragStartAngle = 0;
                    sfx.playRustle(1.0);
                    renderPaperTexture();
                }
            }

            if (activeFold) {
                let progress = 0;
                if (activeFold.dir === 'R2L') {
                    progress = -dx / (wCurrent / 2);
                } else if (activeFold.dir === 'L2R') {
                    progress = dx / (wCurrent / 2);
                } else if (activeFold.dir === 'B2T') {
                    progress = -dz / (hCurrent / 2);
                } else if (activeFold.dir === 'T2B') {
                    progress = dz / (hCurrent / 2);
                }

                let targetAngle = dragStartAngle + progress * Math.PI;
                activeFold.angle = Math.max(0, Math.min(Math.PI, targetAngle));
                updatePaperGeometry();
            }
        });

        window.addEventListener('pointerup', () => {
            if (!isDragging) return;
            isDragging = false;
            controls.enabled = true;

            if (activeFold) {
                const angle = activeFold.angle;
                if (angle >= Math.PI * 0.8) {
                    animateSnapTo(Math.PI);
                } else if (angle <= Math.PI * 0.2) {
                    animateSnapTo(0);
                } else {
                    sfx.playRustle(0.6);
                }
            }
        });

        function animateSnapTo(targetAngle) {
            if (!activeFold) return;
            isAnimating = true;

            const startAngle = activeFold.angle;
            const startTime = performance.now();
            const duration = 220;

            function frame(time) {
                const elapsed = time - startTime;
                const p = Math.min(elapsed / duration, 1.0);
                const ease = p * (2 - p);

                activeFold.angle = startAngle + (targetAngle - startAngle) * ease;
                updatePaperGeometry();

                if (p < 1.0) {
                    requestAnimationFrame(frame);
                } else {
                    activeFold.angle = targetAngle;
                    updatePaperGeometry();
                    isAnimating = false;

                    if (targetAngle === Math.PI) {
                        sfx.playFoldSnap();
                        foldHistory.push(activeFold);
                    } else {
                        sfx.playUnfoldSnap();
                    }
                    activeFold = null;
                    renderPaperTexture();
                }
            }
            requestAnimationFrame(frame);
        }

        // ==========================================
        // 8. 控件交互 (重置、长宽设置)
        // ==========================================
        const resetBtn = document.getElementById('resetBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const slidersContainer = document.getElementById('slidersContainer');
        const widthSlider = document.getElementById('widthSlider');
        const heightSlider = document.getElementById('heightSlider');
        const widthVal = document.getElementById('widthVal');
        const heightVal = document.getElementById('heightVal');

        // 平滑完全展开函数 (供双击等手势直接调用)
        function unfoldAll() {
            if ((foldHistory.length === 0 && !activeFold) || isAnimating) return;
            isAnimating = true;
            sfx.playUnfoldSnap();

            const startTime = performance.now();
            const duration = 300;

            function animateUnfold(time) {
                const elapsed = time - startTime;
                const p = Math.min(elapsed / duration, 1.0);
                const ease = 1.0 - Math.pow(1.0 - p, 3);

                if (activeFold) {
                    activeFold.angle = activeFold.angle * (1 - ease);
                }
                foldHistory.forEach(f => {
                    f.angle = f.angle * (1 - ease);
                });
                updatePaperGeometry();

                if (p < 1.0) {
                    requestAnimationFrame(animateUnfold);
                } else {
                    isAnimating = false;
                    foldHistory.length = 0;
                    activeFold = null;
                    updatePaperGeometry();
                    renderPaperTexture();
                }
            }
            requestAnimationFrame(animateUnfold);
        }

        settingsBtn.addEventListener('click', () => {
            if (slidersContainer.style.display === 'none' || !slidersContainer.style.display) {
                slidersContainer.style.display = 'block';
                widthSlider.value = Math.round(paperW);
                heightSlider.value = Math.round(paperH);
                widthVal.textContent = widthSlider.value;
                heightVal.textContent = heightSlider.value;
            } else {
                slidersContainer.style.display = 'none';
            }
        });

        function updateGeometryFromSliders() {
            const newW = parseInt(widthSlider.value, 10);
            const newH = parseInt(heightSlider.value, 10);
            widthVal.textContent = newW;
            heightVal.textContent = newH;

            if (newW > 0 && newH > 0 && (newW !== paperW || newH !== paperH)) {
                paperW = newW;
                paperH = newH;
                foldHistory.length = 0;
                activeFold = null;
                persistentHParts = 1;
                persistentVParts = 1;

                paper.geometry.dispose();
                geometry = new THREE.PlaneGeometry(paperW, paperH, GRID_X, GRID_Z);
                origPositions = geometry.attributes.position.clone();
                paper.geometry = geometry;

                ghostPlane.geometry.dispose();
                ghostPlane.geometry = new THREE.PlaneGeometry(paperW, paperH);

                updatePaperGeometry();
                renderPaperTexture();
                renderGhostTexture();
            }
        }

        widthSlider.addEventListener('input', updateGeometryFromSliders);
        heightSlider.addEventListener('input', updateGeometryFromSliders);

        // 重置按钮 (恢复初始平整纸张、清除所有折痕与初始视角)
        resetBtn.addEventListener('click', () => {
            if (isAnimating) return;
            isAnimating = true;

            sfx.playUnfoldSnap();
            const startTime = performance.now();
            const duration = 400;

            const aspect = window.innerWidth / window.innerHeight;
            const baseDistance = 40;
            const targetDistance = aspect < 1.0 ? baseDistance * Math.max(1, 1.1 / aspect) : baseDistance;
            const ratio = targetDistance / baseDistance;

            const startCamPos = camera.position.clone();
            const targetCamPos = new THREE.Vector3(0, targetDistance, 25 * ratio);
            const startTarget = controls.target.clone();
            const targetTarget = new THREE.Vector3(0, 0, 0);

            function animateReset(time) {
                const elapsed = time - startTime;
                const p = Math.min(elapsed / duration, 1.0);
                const ease = 1.0 - Math.pow(1.0 - p, 3);

                camera.position.lerpVectors(startCamPos, targetCamPos, ease);
                controls.target.lerpVectors(startTarget, targetTarget, ease);
                controls.update();

                if (p < 1.0) {
                    requestAnimationFrame(animateReset);
                } else {
                    isAnimating = false;
                    foldHistory.length = 0;
                    activeFold = null;
                    persistentHParts = 1;
                    persistentVParts = 1;

                    paperW = aspect < 1.0 ? 21.0 : 29.7;
                    paperH = aspect < 1.0 ? 29.7 : 21.0;

                    paper.geometry.dispose();
                    geometry = new THREE.PlaneGeometry(paperW, paperH, GRID_X, GRID_Z);
                    origPositions = geometry.attributes.position.clone();
                    paper.geometry = geometry;

                    ghostPlane.geometry.dispose();
                    ghostPlane.geometry = new THREE.PlaneGeometry(paperW, paperH);

                    widthSlider.value = Math.round(paperW);
                    heightSlider.value = Math.round(paperH);
                    widthVal.textContent = widthSlider.value;
                    heightVal.textContent = heightSlider.value;

                    updatePaperGeometry();
                    renderPaperTexture();
                    renderGhostTexture();
                }
            }
            requestAnimationFrame(animateReset);
        });


        // ==========================================
        // 9. 窗口自适应与渲染循环
        // ==========================================
        function updateCameraFit() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.aspect = aspect;

            const baseDistance = 40;
            const targetDistance = aspect < 1.0 ? baseDistance * Math.max(1, 1.1 / aspect) : baseDistance;
            const ratio = targetDistance / baseDistance;
            camera.position.set(0, targetDistance, 25 * ratio);

            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (controls) {
                controls.target.set(0, 0, 0);
                controls.update();
            }
        }
        window.addEventListener('resize', updateCameraFit);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        const whiteList = ["edui123.com", "edui.fun"];if (!whiteList.includes(window.location.hostname)) {window.location.href = "https://edui123.com";}
        // 首次加载初始化
        updateCameraFit();
        renderGhostTexture();
        renderPaperTexture();
        updatePaperGeometry();
        animate();
    </script>
</body>
