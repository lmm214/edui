<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一张可自由对折的纸</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #334455;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            width: 100vw;
            height: 100vh;
        }

        /* 右上角重置按钮 */
        #resetBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            width: 44px;
            height: 44px;
            padding: 0;
            font-size: 1.3rem;
        }

        .btn {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.6), inset -1px -1px 3px rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.3s, box-shadow 0.3s, transform 0.1s;
            user-select: none;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-icon {
            width: 44px;
            height: 44px;
            padding: 0;
            font-size: 1.3rem;
        }

        .btn:hover {
            background: rgba(60, 60, 60, 0.9);
        }

        .btn:active {
            box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.8), inset -1px -1px 2px rgba(255, 255, 255, 0.05);
            transform: scale(0.97);
        }

        /* 右下角设置按钮 */
        #settingsBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            width: 44px;
            height: 44px;
            padding: 0;
            font-size: 1.3rem;
        }

        /* 底部和右侧滑动条容器 */
        #slidersContainer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 15;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            outline: none;
            position: absolute;
            pointer-events: auto;
        }

        /* 滑块白色圆点与阴影 */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 10px, transparent 11px);
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
            cursor: pointer;
            border: none;
            margin-top: -17px;
        }

        /* 轨道样式：内凹阴影 */
        input[type=range]::-webkit-slider-runnable-track {
            height: 10px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: inset 1px 1px 4px rgba(0, 0, 0, 0.8), inset -1px -1px 2px rgba(255, 255, 255, 0.15);
        }

        #widthSlider {
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
        }

        #heightSlider {
            top: 50%;
            right: calc(32px - 25vh);
            width: 50vh;
            transform: translateY(-50%) rotate(-90deg);
            margin: 0;
        }

        .slider-val {
            position: absolute;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 2rem;
            font-weight: 500;
            backdrop-filter: blur(4px);
            pointer-events: none;
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.6), inset -1px -1px 3px rgba(255, 255, 255, 0.1);
        }

        #widthVal {
            bottom: 65px;
            left: 50%;
            transform: translateX(-50%);
        }

        #heightVal {
            top: 50%;
            right: 80px;
            transform: translateY(-50%);
        }
    </style>
</head>

<body>
    <!-- 右上角重置按钮 -->
    <button id="resetBtn" class="btn btn-icon" title="重置白纸">🔄</button>

    <!-- 右下角设置按钮 -->
    <button id="settingsBtn" class="btn btn-icon" title="设置长宽">⚙️</button>

    <!-- 底部与右侧滑动条 -->
    <div id="slidersContainer" style="display: none;">
        <input type="range" id="widthSlider" min="10" max="60" step="1" value="30">
        <div class="slider-val" id="widthVal">30</div>

        <input type="range" id="heightSlider" min="10" max="60" step="1" value="21">
        <div class="slider-val" id="heightVal">21</div>
    </div>

    <!-- 引入 Three.js 和 OrbitControls -->
    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
