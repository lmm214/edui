<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>两位数乘两位数 · 点子图</title>
  <style>
    :root {
      --bg: #F4F3EC;
      --ink: #1B2B38;
      --grid-line: #1F5F8B;
      --bright-orange: #FF6600;
      --capsule-bg: #CAE9F1;
      --dot-color: #7EB2D9;
      --red-line: #FF0000;
      --card-bg: rgba(250, 248, 242, 0.96);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Songti SC", "STSong", "SimSun", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", serif, sans-serif;
      color: var(--ink);
      font-weight: normal;
      touch-action: manipulation;
    }

    .app-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      padding: 1vh 2vw;
      overflow: hidden;
    }

    /* 全屏画笔与虚线画板层 (覆盖全屏，任何位置均可书写、圈画、拖画虚线) */
    canvas#paint-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      touch-action: none;
      cursor: crosshair;
    }

    /* 顶部右上角重置按钮 */
    .top-actions {
      position: absolute;
      top: 18px;
      right: 22px;
      z-index: 30;
    }

    /* 底部右下角：仅保留随机按钮 */
    .bottom-actions {
      position: absolute;
      bottom: 18px;
      right: 22px;
      z-index: 30;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1.5px solid rgba(31, 95, 139, 0.3);
      background: #FAF8F2;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      font-weight: 400;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(27, 43, 56, 0.06);
    }

    .icon-btn:hover {
      background: var(--grid-line);
      color: #FFFFFF;
      border-color: var(--grid-line);
      transform: translateY(-1px);
    }

    /* 右下角极简“随机”按钮 */
    .random-btn {
      height: 40px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1.5px solid rgba(31, 95, 139, 0.3);
      background: #FAF8F2;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 400;
      transition: all 0.2s ease;
      box-shadow: 0 2px 10px rgba(27, 43, 56, 0.06);
    }

    .random-btn:hover {
      background: var(--grid-line);
      color: #FFFFFF;
      border-color: var(--grid-line);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(31, 95, 139, 0.2);
    }

    .random-btn:active {
      transform: scale(0.96);
    }

    .dice-icon {
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .random-btn.rolling .dice-icon {
      transform: rotate(360deg);
    }

    /* 顶部算式：保留背景色与原算式排版风格 */
    .header {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 25;
      pointer-events: none;
    }

    .formula-bar {
      display: inline-flex;
      align-items: center;
      font-size: clamp(36px, 5.2vw, 64px);
      font-weight: 400;
      letter-spacing: 2px;
      color: var(--ink);
      line-height: 1;
      pointer-events: none;
    }

    .formula-result {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 100px;
      height: 1.2em;
      margin-left: 10px;
      border-bottom: 2.5px dashed rgba(31, 95, 139, 0.45);
      color: var(--ink);
      font-weight: 400;
      border-radius: 4px;
      padding: 0 10px;
      transition: all 0.25s ease;
      cursor: pointer;
      pointer-events: auto;
    }

    .formula-result:hover {
      border-bottom-color: var(--grid-line);
      background: rgba(31, 95, 139, 0.04);
    }

    .formula-result.completed {
      border-bottom: 2.5px solid var(--grid-line);
      color: var(--ink);
    }

    /* 主体舞台包裹层 (点子图置于下层，全屏画布覆盖其上) */
    .stage-wrapper {
      flex: 1;
      width: 100%;
      height: calc(100vh - 86px);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      position: relative;
      z-index: 1;
      pointer-events: none;
    }

    .stage-container {
      position: relative;
      width: min(88vw, calc((100vh - 100px) * 0.88));
      height: min(calc(88vw / 0.88), calc(100vh - 100px));
      max-width: 820px;
      max-height: calc(100vh - 100px);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    svg#dot-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      pointer-events: none;
    }

    /* 右侧极简常用画笔工具栏 */
    .right-toolbar {
      position: fixed;
      right: 22px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(31, 95, 139, 0.35);
      border-radius: 999px;
      padding: 12px 7px;
      box-shadow: 0 4px 22px rgba(27, 43, 56, 0.08);
      z-index: 30;
      pointer-events: auto;
    }

    .tool-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1.5px solid rgba(31, 95, 139, 0.22);
      background: #FFFFFF;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.18s ease;
      position: relative;
    }

    .tool-btn:hover {
      transform: scale(1.08);
      border-color: var(--grid-line);
    }

    .tool-btn.active {
      background: var(--grid-line);
      color: #FFFFFF;
      border-color: var(--grid-line);
    }

    .tool-btn.active-red {
      background: #FFF0F0;
      color: var(--red-line);
      border-color: var(--red-line);
      box-shadow: 0 0 0 2px rgba(255, 0, 0, 0.2);
    }

    .toolbar-divider {
      width: 22px;
      height: 1px;
      background: rgba(31, 95, 139, 0.2);
      margin: 2px 0;
    }

    /* 颜色选择小圆点 */
    .color-swatches {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.18s ease;
      position: relative;
    }

    .color-dot:hover {
      transform: scale(1.22);
    }

    .color-dot.active {
      transform: scale(1.18);
      box-shadow: 0 0 0 2px #FAF8F2, 0 0 0 3.5px var(--ink);
    }
  </style>
</head>

<body>

  <div class="app-container">

    <!-- 全屏画板：全屏任意位置皆可书写、圈画、拖画虚线与擦除 -->
    <canvas id="paint-canvas"></canvas>

    <!-- 顶部右上角重置按钮 -->
    <div class="top-actions">
      <button class="icon-btn" id="btn-reset" title="清空全部笔迹与虚线">↺</button>
    </div>

    <!-- 底部右下角：仅保留随机按钮 -->
    <div class="bottom-actions">
      <button class="random-btn" id="btn-random" title="随机换一题">
        <svg class="dice-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <circle cx="8" cy="8" r="1.3" fill="currentColor"></circle>
          <circle cx="16" cy="8" r="1.3" fill="currentColor"></circle>
          <circle cx="12" cy="12" r="1.3" fill="currentColor"></circle>
          <circle cx="8" cy="16" r="1.3" fill="currentColor"></circle>
          <circle cx="16" cy="16" r="1.3" fill="currentColor"></circle>
        </svg>
        <span>随机</span>
      </button>
    </div>

    <!-- 顶部算式：保留背景色与算式排版 -->
    <header class="header">
      <div class="formula-bar">
        <span id="formula-a">12</span>
        <span style="margin: 0 8px; font-weight: 400; opacity: 0.7;">×</span>
        <span id="formula-b">13</span>
        <span style="margin: 0 8px; font-weight: 400; opacity: 0.7;">=</span>
        <span class="formula-result" id="formula-result" title="点击显示/隐藏得数"></span>
      </div>
    </header>

    <!-- 主体：点子图 SVG -->
    <main class="stage-wrapper">
      <div class="stage-container" id="stage-container">
        <svg id="dot-svg" viewBox="0 0 900 1000">
          <!-- 胶囊行与点阵 -->
          <g id="capsules-layer"></g>
        </svg>
      </div>
    </main>

    <!-- 右侧极简常用画笔工具栏 -->
    <aside class="right-toolbar">
      <!-- 自由画笔工具 -->
      <button class="tool-btn active" id="btn-tool-pen" title="画笔 (圈一圈/做标记)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
        </svg>
      </button>

      <!-- 颜色选择点 -->
      <div class="color-swatches" id="color-swatches">
        <div class="color-dot active" data-color="#1B2B38" style="background: #1B2B38;" title="墨黑"></div>
        <div class="color-dot" data-color="#E63946" style="background: #E63946;" title="珊瑚红"></div>
        <div class="color-dot" data-color="#FF6600" style="background: #FF6600;" title="活力橙"></div>
        <div class="color-dot" data-color="#1F5F8B" style="background: #1F5F8B;" title="青黛蓝"></div>
      </div>

      <div class="toolbar-divider"></div>

      <!-- 红色虚线工具：手动拖动画虚线，支持撤销与擦除 -->
      <button class="tool-btn" id="btn-tool-dashed" title="红色虚线 (手动拖动画虚线)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#FF0000" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="4 3">
          <line x1="2" y1="12" x2="22" y2="12"></line>
        </svg>
      </button>

      <div class="toolbar-divider"></div>

      <!-- 橡皮擦：支持擦除自由画笔与红色虚线 -->
      <button class="tool-btn" id="btn-tool-eraser" title="橡皮擦 (支持擦除画笔和虚线)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13.5L13.5 18H7L3 14l9-9 7 7-1 1.5z"></path>
          <path d="M7 18h14"></path>
        </svg>
      </button>

      <!-- 撤销：撤销上一步操作 -->
      <button class="tool-btn" id="btn-tool-undo" title="撤销笔迹或虚线">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7v6h6"></path>
          <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
        </svg>
      </button>

      <!-- 清屏 -->
      <button class="tool-btn" id="btn-tool-clear" title="清空所有笔迹与虚线">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"></path>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
    </aside>

  </div>
