<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>刘徽割圆术</title>
  <meta name="description" content="小学六年级数学“割圆术”教学系统">
  <style>
    :root {
      --bg-main: #f1f5f9;
      --bg-stage: #ffffff;
      --bg-card: #ffffff;
      --border-subtle: #cbd5e1;
      --border-tech: #38bdf8;
      --border-tech-bright: #0284c7;
      --border-gold: #f59e0b;
      --text-main: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;

      --accent-blue: #0284c7;
      --accent-blue-light: #f0f9ff;
      --accent-blue-border: #38bdf8;
      --accent-gold: #d97706;
      --accent-gold-light: #fffbeb;
      --accent-gold-border: #f59e0b;
      --accent-emerald: #059669;
      --accent-emerald-light: #ecfdf5;
      --accent-purple: #7c3aed;
      --accent-purple-light: #f5f3ff;
      --accent-rose: #dc2626;

      --font-mono: "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-sans);
      display: flex;
    }

    /* Celebrity Quote Fullscreen Modal Overlay - Tech Sharp Edge & Bright Glow */
    .quote-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.3s ease, visibility 0.3s;
    }

    .quote-modal-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .quote-card {
      position: relative;
      width: 90%;
      max-width: 800px;
      background: #ffffff;
      border: 2px solid var(--border-tech);
      border-top: 5px solid var(--border-tech-bright);
      border-radius: 0px;
      padding: 48px 54px;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.25), 0 20px 60px rgba(15, 23, 42, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transform: scale(1);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .quote-modal-overlay.hidden .quote-card {
      transform: scale(0.95);
    }

    .quote-close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 38px;
      height: 38px;
      border-radius: 0px;
      background: #f8fafc;
      border: 1.5px solid var(--border-tech);
      color: #475569;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .quote-close-btn:hover {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #ffffff;
      box-shadow: 0 0 14px rgba(2, 132, 199, 0.6);
    }

    .quote-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .quote-dynasty-badge {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 4px 14px;
      border-radius: 0px;
      background: var(--accent-blue-light);
      border: 1.5px solid var(--border-tech);
      color: var(--accent-blue);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }

    .quote-author {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: 0.02em;
    }

    .quote-main-text {
      position: relative;
      font-size: 28px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.65;
      letter-spacing: 0.04em;
      margin: 12px 0 22px;
      padding: 0 10px;
    }

    .quote-main-text::before {
      content: "“";
      font-family: serif;
      font-size: 56px;
      color: var(--border-tech);
      position: absolute;
      top: -24px;
      left: -22px;
      opacity: 0.5;
    }

    .quote-main-text::after {
      content: "”";
      font-family: serif;
      font-size: 56px;
      color: var(--border-tech);
      position: absolute;
      bottom: -40px;
      right: -22px;
      opacity: 0.5;
    }

    .quote-sub-expl {
      font-size: 15px;
      color: #0369a1;
      line-height: 1.6;
      font-weight: 500;
      background: var(--accent-blue-light);
      border: 1.5px solid var(--border-tech);
      border-left: 4px solid var(--accent-blue);
      padding: 12px 24px;
      border-radius: 0px;
      margin-bottom: 30px;
      max-width: 660px;
    }

    .quote-enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #0284c7;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      padding: 13px 44px;
      border-radius: 0px;
      border: 2px solid #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 22px rgba(2, 132, 199, 0.45);
      transition: all 0.2s ease;
      letter-spacing: 0.04em;
    }

    .quote-enter-btn:hover {
      background: #0369a1;
      border-color: #7dd3fc;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.7);
      transform: translateY(-2px);
    }

    .quote-enter-btn:active {
      transform: translateY(0);
    }

    /* Main Pure 2-Column Classroom Layout */
    main {
      width: 100vw;
      height: 100vh;
      display: flex;
      overflow: hidden;
      background: #f8fafc;
    }

    /* Left Column: Full-Height Canvas Stage with Bottom Slider Bar */
    .stage-left {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-right: 2px solid var(--border-subtle);
      position: relative;
    }

    .svg-canvas-wrap {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      cursor: grab;
    }

    .svg-canvas-wrap:active {
      cursor: grabbing;
    }

    /* Huge Stage SVG */
    #main-svg {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: all;
    }

    /* Slider Bar anchored at bottom of Left Stage */
    .stage-slider-bar {
      height: 72px;
      padding: 0 36px;
      background: #f8fafc;
      border-top: 1.5px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      position: relative;
    }

    .slider-track-wrap {
      position: relative;
      width: 100%;
      height: 28px;
      display: flex;
      align-items: center;
    }

    .step-range-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 0px;
      background: #cbd5e1;
      outline: none;
      cursor: pointer;
      margin: 0;
      padding: 0;
      position: relative;
      z-index: 5;
    }

    .step-range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 0px;
      background: #0284c7;
      border: 2px solid #ffffff;
      box-shadow: 0 0 10px rgba(2, 132, 199, 0.6);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .step-range-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.9);
    }

    /* Perfectly Aligned Label Container */
    .slider-ticks-labels {
      position: relative;
      width: 100%;
      height: 22px;
    }

    .slider-tick-node {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      cursor: pointer;
      color: #64748b;
      font-size: 14px;
      font-family: var(--font-sans);
      font-weight: 500;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .slider-tick-node.active {
      color: #0284c7;
      font-weight: 700;
      transform: translateX(-50%) scale(1.2);
    }

    .slider-tick-node:hover {
      color: #0f172a;
    }

    /* Right Column: Full-Height Sidebar */
    .sidebar-right {
      width: 340px;
      min-width: 320px;
      height: 100%;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      background: #f8fafc;
      overflow-y: auto;
      scrollbar-width: thin;
      z-index: 15;
    }

    .sidebar-cards-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: #ffffff;
      border: 1.5px solid var(--border-tech);
      border-radius: 0px;
      padding: 14px 14px;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.08);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    /* Clickable Interactive Cards with Clear Hover Indication */
    .clickable-card {
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .clickable-card:hover {
      border-color: var(--accent-blue);
      box-shadow: 0 0 18px rgba(2, 132, 199, 0.25);
      transform: translateY(-2px);
    }

    .clickable-card:active {
      transform: translateY(0);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 5px;
      border-bottom: 1.5px solid #f1f5f9;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-action-hint {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent-blue);
      background: var(--accent-blue-light);
      border: 1px solid var(--border-tech);
      padding: 2px 7px;
      border-radius: 0px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all 0.2s ease;
    }

    .clickable-card:hover .card-action-hint {
      background: var(--accent-blue);
      color: #ffffff;
      box-shadow: 0 0 8px rgba(2, 132, 199, 0.5);
    }

    .step-num-badge {
      display: inline-flex;
      width: 22px;
      height: 22px;
      border-radius: 0px;
      align-items: center;
      justify-content: center;
      font-size: 12.5px;
      font-weight: 700;
      border: 1px solid currentColor;
    }

    .badge-blue {
      background: #e0f2fe;
      color: #0284c7;
      border-color: #38bdf8;
    }

    .badge-gold {
      background: #fef3c7;
      color: #b45309;
      border-color: #f59e0b;
    }

    .badge-green {
      background: #d1fae5;
      color: #059669;
      border-color: #10b981;
    }

    .step-pill {
      font-size: 12.5px;
      font-family: var(--font-sans);
      padding: 2px 7px;
      border-radius: 0px;
      background: var(--accent-blue-light);
      color: #0284c7;
      border: 1px solid var(--border-tech);
      font-weight: 600;
    }

    /* Math Breakdown Rows - Clean & Unbloated Normal Font Weight */
    .math-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: #f8fafc;
      padding: 10px 12px;
      border-radius: 0px;
      border: 1px solid #e2e8f0;
      border-left: 4px solid var(--accent-gold);
    }

    .math-row.blue-accent {
      border-left-color: var(--accent-blue);
      border-color: #e0f2fe;
      border-left: 4.5px solid var(--accent-blue);
      background: #f0f9ff;
    }

    .math-row.emerald-accent {
      border-left-color: var(--accent-emerald);
      border-color: #d1fae5;
      border-left: 4.5px solid var(--accent-emerald);
      background: #ecfdf5;
    }

    .math-formula-box {
      font-family: var(--font-sans);
      font-size: 20px;
      color: #0f172a;
      line-height: 1.75;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .math-formula-box b {
      font-weight: 600;
      color: #b45309;
    }

    .math-formula-box b.blue {
      color: var(--accent-blue);
    }

    .math-formula-box b.emerald {
      color: var(--accent-emerald);
    }

    /* Right Sidebar Bottom 2 Toggles in Side-by-Side Grid */
    .sidebar-toggles-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding-top: 10px;
      border-top: 1.5px dashed #cbd5e1;
    }

    .toggle-chip {
      height: 42px;
      padding: 0 8px;
      border-radius: 0px;
      background: #ffffff;
      border: 1.5px solid var(--border-subtle);
      color: #334155;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.2s ease;
    }

    .toggle-chip:hover {
      background: #f8fafc;
      border-color: var(--border-tech);
    }

    .toggle-chip.active {
      background: #f0f9ff;
      border-color: var(--accent-blue);
      color: var(--accent-blue);
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.2);
    }

    .toggle-chip.purple-chip.active {
      background: #f5f3ff;
      border-color: var(--accent-purple);
      color: var(--accent-purple);
      box-shadow: 0 0 12px rgba(124, 58, 237, 0.2);
    }

    .toggle-indicator {
      width: 8px;
      height: 8px;
      border-radius: 0px;
      background: #94a3b8;
      flex-shrink: 0;
    }

    .toggle-chip.active .toggle-indicator {
      background: var(--accent-blue);
      box-shadow: 0 0 6px var(--accent-blue);
    }

    .toggle-chip.purple-chip.active .toggle-indicator {
      background: var(--accent-purple);
      box-shadow: 0 0 6px var(--accent-purple);
    }

    /* SVG Elements Styling */
    .svg-circle-bg {
      fill: rgba(2, 132, 199, 0.02);
      stroke: #0284c7;
      stroke-width: 2.2px;
      stroke-dasharray: 6 5;
      vector-effect: non-scaling-stroke;
    }

    /* Solid Spoke Lines (Polygon Triangle Boundaries) */
    .svg-spoke-solid {
      stroke: #64748b;
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    /* Dashed Spoke Lines (Subdivision Bisector Spokes) */
    .svg-spoke-dashed {
      stroke: #94a3b8;
      stroke-width: 1.6px;
      stroke-dasharray: 5 4;
      vector-effect: non-scaling-stroke;
    }

    /* Focus Spokes for Highlighted Sector */
    .svg-focus-spoke {
      stroke: #0284c7;
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    /* Altitude Line from Center O to Chord Midpoint or Sagitta Altitude */
    .svg-altitude-line {
      stroke: #d97706;
      stroke-width: 2.2px;
      stroke-dasharray: 4 3;
      vector-effect: non-scaling-stroke;
    }

    /* Right Angle Symbol at Altitude Foot */
    .svg-right-angle-marker {
      fill: none;
      stroke: #d97706;
      stroke-width: 1.6px;
      vector-effect: non-scaling-stroke;
    }

    .svg-prev-polygon {
      fill: #f1f5f9;
      stroke: #475569;
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
      transition: all 0.3s ease;
    }

    /* Center Radiating Polygon Triangles */
    .svg-center-poly-triangle {
      fill: rgba(241, 245, 249, 0.9);
      stroke: #475569;
      stroke-width: 1.8px;
      vector-effect: non-scaling-stroke;
      transition: fill 0.2s, stroke 0.2s;
    }

    .svg-center-poly-triangle.highlighted {
      fill: rgba(2, 132, 199, 0.35);
      stroke: #0284c7;
      stroke-width: 2.8px;
    }

    .svg-added-triangle {
      fill: rgba(245, 158, 11, 0.4);
      stroke: #d97706;
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
      transition: fill 0.2s, stroke 0.2s;
    }

    .svg-added-triangle.highlighted {
      fill: rgba(2, 132, 199, 0.45);
      stroke: #0284c7;
      stroke-width: 3px;
    }

    /* Circumscribed Rectangles (Outer Rectangles) */
    .svg-outer-rect {
      fill: rgba(124, 58, 237, 0.12);
      stroke: #7c3aed;
      stroke-width: 1.5px;
      stroke-dasharray: 3 2;
      vector-effect: non-scaling-stroke;
    }

    .svg-outer-rect.highlighted {
      fill: rgba(124, 58, 237, 0.35);
      stroke: #7c3aed;
      stroke-width: 2.5px;
      stroke-dasharray: none;
    }

    .svg-center-point {
      fill: #0284c7;
      stroke: #ffffff;
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    /* Diameter Guide Line */
    .svg-diameter-guide {
      stroke: #cbd5e1;
      stroke-width: 1.5px;
      stroke-dasharray: 4 4;
      vector-effect: non-scaling-stroke;
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      .quote-card {
        padding: 32px 24px;
      }

      .quote-main-text {
        font-size: 20px;
      }

      main {
        flex-direction: column;
      }

      .stage-left {
        flex: 1;
        border-right: none;
        border-bottom: 1.5px solid var(--border-subtle);
      }

      .sidebar-right {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>

<body>

  <!-- Fullscreen Translucent Celebrity Quote Modal Overlay (Tech Straight Angles & Bright Border) -->
  <div class="quote-modal-overlay" id="quote-modal-overlay" onclick="if(event.target===this) closeQuoteModal()">
    <div class="quote-card">
      <button class="quote-close-btn" onclick="closeQuoteModal()" title="关闭并进入系统">✕</button>

      <div class="quote-card-header">
        <span class="quote-dynasty-badge">魏晋数学巨擘</span>
        <span class="quote-author">刘徽 · 《九章算术》</span>
      </div>

      <div class="quote-main-text">
        割之弥细，所失弥少，割之又割，以至于不可割，则与圆周合体而无所失矣。
      </div>

      <div class="quote-sub-expl">
        —— 创立人类数学史上最早的“割圆术”，以无限逼近的极限思想探寻圆面积与圆周率之本源
      </div>

      <button class="quote-enter-btn" onclick="closeQuoteModal()">
        <span>进入教学探索</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <!-- Main Pure 2-Column Layout -->
  <main>
    <!-- Left Column: Full-Height Canvas Stage with Bottom Slider Bar -->
    <div class="stage-left">
      <div class="svg-canvas-wrap" id="svg-canvas-wrap">
        <!-- Main SVG Canvas with Default Horizontal Diameter & Top-Right Highlight -->
        <svg id="main-svg" viewBox="-1.25 -1.25 2.5 2.5" preserveAspectRatio="xMidYMid meet">
          <!-- Background Grid & Unit Circle -->
          <g id="svg-layer-bg">
            <circle cx="0" cy="0" r="1" class="svg-circle-bg" />
            <!-- Horizontal Diameter Line -->
            <line x1="-1.15" y1="0" x2="1.15" y2="0" class="svg-diameter-guide" />
            <line x1="0" y1="-1.15" x2="0" y2="1.15" class="svg-diameter-guide" stroke-opacity="0.5" />
          </g>

          <!-- Base Polygon / Center Triangles -->
          <g id="svg-layer-prev-poly"></g>

          <!-- Outer Rectangles (When Outer Rectangles Toggle is Active) -->
          <g id="svg-layer-outer-rects"></g>

          <!-- Alternating Solid & Dashed Spokes -->
          <g id="svg-layer-spokes"></g>

          <!-- Newly Added Triangles (Current Step) -->
          <g id="svg-layer-added-triangles"></g>

          <!-- Key Annotations, Dimension Labels & Dots -->
          <g id="svg-layer-annotations"></g>

          <!-- Center Point with Regular 'O' Letter located in the bottom-left quadrant -->
          <circle cx="0" cy="0" id="svg-center-dot" class="svg-center-point" />
          <text id="svg-center-text" x="-0.045" y="0.052" font-size="0.06" fill="#0f172a" text-anchor="end"
            dominant-baseline="central" font-weight="500" font-family="var(--font-sans)">O</text>
        </svg>
      </div>

      <!-- Slider Bar on Left Stage Bottom -->
      <div class="stage-slider-bar">
        <div class="slider-track-wrap">
          <input type="range" id="step-range-slider" class="step-range-slider" min="0" max="9" step="1" value="0"
            oninput="setStep(parseInt(this.value))">
        </div>
        <div class="slider-ticks-labels" id="slider-ticks-labels">
          <!-- Rendered with pixel-perfect percentage by JS -->
        </div>
      </div>
    </div>

    <!-- Right Column: Full-Height Sidebar -->
    <aside class="sidebar-right" id="sidebar-right">
      <div class="sidebar-cards-group">
        <!-- Step 1: 1 个小三角形面积 (点击自动聚焦放大) -->
        <div class="card clickable-card" onclick="focusSingleTriangle()" title="点击自动放大聚焦观察右上角三角形">
          <div class="card-header">
            <div class="card-title">
              <span class="step-num-badge badge-blue">1</span>
              1个小三角形面积
            </div>
