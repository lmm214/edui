    /* ==========================================================================
       9. High-Performance Gapless Closed Region Scanline Flood Fill & Live Hover Preview
       ========================================================================== */
    function hexToRgb(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function getBoundaryData() {
      const W = 1280, H = 1280;
      if (!cachedBoundaryCanvas) {
        cachedBoundaryCanvas = document.createElement('canvas');
        cachedBoundaryCanvas.width = W;
        cachedBoundaryCanvas.height = H;
      }

      if (boundaryDirty || !cachedBoundaryData) {
        const bCtx = cachedBoundaryCanvas.getContext('2d', { willReadFrequently: true });
        bCtx.fillStyle = '#FFFFFF';
        bCtx.fillRect(0, 0, W, H);

        bCtx.save();
        bCtx.scale(W / 640, H / 640);
        bCtx.translate(320, 320);

        // Clip boundary extraction within Base Circle
        bCtx.beginPath();
        bCtx.arc(0, 0, BASE_RADIUS, 0, Math.PI * 2);
        bCtx.clip();

        bCtx.strokeStyle = '#000000';
        bCtx.lineWidth = 2.2;
        bCtx.lineCap = 'round';
        bCtx.lineJoin = 'round';

        // 1. Base Circle Perimeter
        bCtx.beginPath();
        bCtx.arc(0, 0, BASE_RADIUS, 0, Math.PI * 2);
        bCtx.stroke();

        // 2. All User Drawn Vector Shapes (Circles, Lines, Arcs)
        shapes.forEach(s => {
          if (s.type === 'circle' && s.params) {
            bCtx.beginPath();
            bCtx.arc(s.params.center.x, s.params.center.y, s.params.radius, 0, Math.PI * 2);
            bCtx.stroke();
          } else if (s.type === 'line' && s.params) {
            bCtx.beginPath();
            bCtx.moveTo(s.params.p1.x, s.params.p1.y);
            bCtx.lineTo(s.params.p2.x, s.params.p2.y);
            bCtx.stroke();
          } else if (s.svgEl) {
            const d = s.svgEl.getAttribute('d');
            if (d) {
              try {
                const p2d = new Path2D(d);
                bCtx.stroke(p2d);
              } catch (e) { }
            }
          }
        });

        bCtx.restore();
        cachedBoundaryData = bCtx.getImageData(0, 0, W, H).data;
        boundaryDirty = false;
      }
      return cachedBoundaryData;
    }

    function computeFloodFillMask(svgX, svgY) {
      const W = 1280, H = 1280;
      const startX = Math.round((svgX + 320) * (W / 640));
      const startY = Math.round((svgY + 320) * (H / 640));

      if (startX < 4 || startX >= W - 4 || startY < 4 || startY >= H - 4) return null;

      const distFromCenter = Math.hypot(svgX, svgY);
      if (distFromCenter > BASE_RADIUS) return null;

      const bData = getBoundaryData();
      const startIdx = (startY * W + startX) * 4;

      if (bData[startIdx] < 50 && bData[startIdx + 1] < 50 && bData[startIdx + 2] < 50) {
        return null;
      }

      const visited = new Uint8Array(W * H);
      const queue = [startX, startY];
      visited[startY * W + startX] = 1;

      let qHead = 0;
      let count = 0;

      while (qHead < queue.length) {
        const cx = queue[qHead++];
        const cy = queue[qHead++];
        count++;

        const nbrs = [
          cx + 1, cy,
          cx - 1, cy,
          cx, cy + 1,
          cx, cy - 1
        ];

        for (let i = 0; i < 8; i += 2) {
          const nx = nbrs[i];
          const ny = nbrs[i + 1];

          if (nx >= 2 && nx < W - 2 && ny >= 2 && ny < H - 2) {
            const nPos = ny * W + nx;
            if (!visited[nPos]) {
              const nIdx = nPos * 4;
              if (bData[nIdx] >= 50 || bData[nIdx + 1] >= 50 || bData[nIdx + 2] >= 50) {
                visited[nPos] = 1;
                queue.push(nx, ny);
              }
            }
          }
        }
      }

      if (count === 0) return null;

      // 2-pixel dilation / bleed to eliminate all white halos/fringe
      const dilated = new Uint8Array(W * H);
      for (let y = 2; y < H - 2; y++) {
        const row = y * W;
        for (let x = 2; x < W - 2; x++) {
          const idx = row + x;
          if (visited[idx]) {
            dilated[idx] = 1;
            dilated[idx - 1] = 1;
            dilated[idx + 1] = 1;
            dilated[idx - W] = 1;
            dilated[idx + W] = 1;
            dilated[idx - W - 1] = 1;
            dilated[idx - W + 1] = 1;
            dilated[idx + W - 1] = 1;
            dilated[idx + W + 1] = 1;
            dilated[idx - 2] = 1;
            dilated[idx + 2] = 1;
            dilated[idx - 2 * W] = 1;
            dilated[idx + 2 * W] = 1;
          }
        }
      }

      return { mask: dilated, W, H };
    }

    // Hover Color Preview
    function updateFillPreview(svgX, svgY) {
      if (currentTool !== 'fill' || isAutoFilling) return;

      const pCanvas = document.getElementById('previewFillCanvas');
      const pCtx = pCanvas.getContext('2d');
      const W = pCanvas.width, H = pCanvas.height;

      const fillResult = computeFloodFillMask(svgX, svgY);
      if (!fillResult) {
        pCtx.clearRect(0, 0, W, H);
        return;
      }

      const mask = fillResult.mask;
      const rgb = hexToRgb(currentColor);
      const imgData = pCtx.createImageData(W, H);
      const data = imgData.data;

      const fillR = rgb.r, fillG = rgb.g, fillB = rgb.b;
      const previewA = 135;

      for (let i = 0; i < W * H; i++) {
        if (mask[i]) {
          const idx = i * 4;
          data[idx] = fillR;
          data[idx + 1] = fillG;
          data[idx + 2] = fillB;
          data[idx + 3] = previewA;
        }
      }

      pCtx.putImageData(imgData, 0, 0);
    }

    function floodFillRegion(svgX, svgY, hexColor) {
      clearFillPreview();

      const fillResult = computeFloodFillMask(svgX, svgY);
      if (!fillResult) return;

      const mask = fillResult.mask;
      const rgb = hexToRgb(hexColor);
      const fillR = rgb.r, fillG = rgb.g, fillB = rgb.b, fillA = 255;

      for (let i = 0; i < W * H; i++) {
        if (mask[i]) {
          const idx = i * 4;
          fillData[idx] = fillR;
          fillData[idx + 1] = fillG;
          fillData[idx + 2] = fillB;
          fillData[idx + 3] = fillA;
        }
      }

      ctx.putImageData(fillImgData, 0, 0);
      const nextCanvasImgData = ctx.getImageData(0, 0, W, H);
      history.push({ type: 'fill_canvas', prevState: prevCanvasImgData, nextState: nextCanvasImgData });
      redoStack = [];
      playSound('fill');
    }

      // 1. Group Identical Congruent Shapes (相同图形识别)

      // 2. Curated Modern Color Theory Palettes (High-Luminance, Golden Harmonic Ratio & Contrast)

        {

      ];

      const selectedTheme = designPalettes[Math.floor(Math.random() * designPalettes.length)];
      const shuffledColors = [...selectedTheme.colors].sort(() => Math.random() - 0.5);

      shapeGroups.sort((a, b) => a.dist - b.dist);

      shapeGroups.forEach((group, gIdx) => {

      // Flatten sorted regions so symmetrical petals light up in rhythmic harmony
      const orderedRegions = [];

    /* ==========================================================================
       Identical Shape Recognition & Classification System
       ========================================================================== */
    function classifyIdenticalShapeGroups(regions) {
      const groups = [];

      regions.forEach(reg => {
        let matchedGroup = null;

        for (let group of groups) {
          const rep = group.regions[0];

          // 1. Radial distance from circle center (0, 0)
          const distDiff = Math.abs(reg.dist - rep.dist);

          // 2. Pixel Area ratio
          const areaRatio = Math.min(reg.area, rep.area) / Math.max(reg.area, rep.area);

          // 3. Gyration variance / Shape moment ratio
          const gyrRatio = Math.min(reg.gyration, rep.gyration) / Math.max(reg.gyration, rep.gyration);

          // If regions share radial distance ring (within 9px), similar area (>= 86%), and matching moment (>= 78%)
          if (distDiff <= 9 && areaRatio >= 0.86 && gyrRatio >= 0.78) {
            matchedGroup = group;
            break;
          }
        }

        if (matchedGroup) {
          matchedGroup.regions.push(reg);
        } else {
          groups.push({
            id: groups.length,
            dist: reg.dist,
            area: reg.area,
            gyration: reg.gyration,
            regions: [reg]
          });
        }
      });

      return groups;
    }

    function discoverAllClosedRegions() {
      const W = 1280, H = 1280;
      const visitedGlobal = new Uint8Array(W * H);
      const discovered = [];

      const ringSteps = [0, 20, 45, 75, 105, 135, 165, 195, 212];
      const candidates = [];

      candidates.push({ x: 0, y: 0 });

      ringSteps.forEach(r => {
        if (r === 0) return;
        const count = Math.max(8, Math.round((2 * Math.PI * r) / 16));
        for (let i = 0; i < count; i++) {
          const a = (i * 2 * Math.PI) / count;
          candidates.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
        }
      });

      for (let y = -210; y <= 210; y += 16) {
        for (let x = -210; x <= 210; x += 16) {
          if (Math.hypot(x, y) <= BASE_RADIUS - 5) {
            candidates.push({ x, y });
          }
        }
      }

      candidates.forEach(pt => {
        const sx = Math.round((pt.x + 320) * (W / 640));
        const sy = Math.round((pt.y + 320) * (H / 640));
        if (sx < 4 || sx >= W - 4 || sy < 4 || sy >= H - 4) return;

        const gIdx = sy * W + sx;
        if (visitedGlobal[gIdx]) return;

        const fillRes = computeFloodFillMask(pt.x, pt.y);
        if (fillRes && fillRes.mask) {
          const mask = fillRes.mask;
          let sumX = 0, sumY = 0, count = 0;
          const pixelCoords = [];

          for (let i = 0; i < W * H; i++) {
            if (mask[i]) {
              visitedGlobal[i] = 1;
              const px = i % W;
              const py = Math.floor(i / W);
              sumX += px;
              sumY += py;
              pixelCoords.push({ px, py });
              count++;
            }
          }

          if (count >= 15) {
            const avgCanvasX = sumX / count;
            const avgCanvasY = sumY / count;
            const svgX = (avgCanvasX / (W / 640)) - 320;
            const svgY = (avgCanvasY / (H / 640)) - 320;
            const dist = Math.hypot(svgX, svgY);
            const angle = Math.atan2(svgY, svgX);

            // Compute rotation-invariant 2nd central moment (Gyration Variance)
            let gyrSum = 0;
            for (let p of pixelCoords) {
              gyrSum += (p.px - avgCanvasX) ** 2 + (p.py - avgCanvasY) ** 2;
            }
            const gyration = Math.sqrt(gyrSum / count);

            discovered.push({
              mask,
              cx: svgX,
              cy: svgY,
              dist,
              angle,
              area: count,
              gyration
            });
          }
        }
      });

      return discovered;
    }

    /* ==========================================================================
       10. Toolbar & Settings Actions
       ========================================================================== */
    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === tool);
      });

      const container = document.getElementById('canvasContainer');
      if (container) {
        container.className = `canvas-container tool-${tool}`;
      }

      const svg = document.getElementById('drawSvg');
      if (tool === 'fill') {
        svg.classList.add('mode-fill');
        document.getElementById('snapBreatheDot').style.display = 'none';
        document.getElementById('snapPulseRing').style.display = 'none';
      } else {
        svg.classList.remove('mode-fill');
        closeFillSubMenu();
      }

      clearShapeHoverEffects();
      deselectShape();
      clearFillPreview();
      resetConstruction();
    }

    function setDivisions(n) {
      currentDivisions = n;
      document.querySelectorAll('.div-btn').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.div) === n);
      });
      rebuildKeySnapPoints();
      playSound('step');
    }

    function setColor(hex) {
      currentColor = hex;
      document.querySelectorAll('.color-dot').forEach(dot => {
        dot.classList.toggle('active', dot.dataset.color === hex);
      });
      playSound('step');
    }

    function triggerColorPicker() {
      const input = document.getElementById('customColorInput');
      input.click();
    }

    function handleCustomColor(hex) {
      currentColor = hex;
      document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
      const customDot = document.getElementById('customColorDot');
      customDot.classList.add('active');
      playSound('step');
    }

    function toggleSnap() {
      isSnapEnabled = !isSnapEnabled;
      document.getElementById('btnSnap').classList.toggle('active', isSnapEnabled);
      playSound('step');
    }

    function toggleSound() {
      isSoundEnabled = !isSoundEnabled;
      document.getElementById('btnSound').classList.toggle('active', isSoundEnabled);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => { });
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => { });
        }
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const isFs = !!document.fullscreenElement;
      const enterIcon = document.getElementById('iconEnterFs');
      const exitIcon = document.getElementById('iconExitFs');
      const fsBtn = document.getElementById('btnFullscreen');
      if (enterIcon && exitIcon) {
        enterIcon.style.display = isFs ? 'none' : 'block';
        exitIcon.style.display = isFs ? 'block' : 'none';
      }
      if (fsBtn) fsBtn.classList.toggle('active', isFs);
      playSound('step');
    });

    function undo() {
      if (history.length === 0) return;

      const last = history.pop();
      if (last.type === 'add_shape') {
        const idx = shapes.findIndex(s => s.id === last.data.id);
        if (idx !== -1) shapes.splice(idx, 1);
        last.data.svgEl.remove();
        redoStack.push(last);
        markBoundaryDirty();
      } else if (last.type === 'remove_shape') {
        document.getElementById('shapesLayer').appendChild(last.data.svgEl);
        shapes.push(last.data);
        redoStack.push(last);
        markBoundaryDirty();
      } else if (last.type === 'fill_canvas') {
        const canvas = document.getElementById('fillCanvas');
        const ctx = canvas.getContext('2d');
        ctx.putImageData(last.prevState, 0, 0);
        redoStack.push(last);
      }
      deselectShape();
      clearFillPreview();
      playSound('step');
      rebuildKeySnapPoints();
    }

    function redo() {
      if (redoStack.length === 0) return;

      const next = redoStack.pop();
      if (next.type === 'add_shape') {
        document.getElementById('shapesLayer').appendChild(next.data.svgEl);
        shapes.push(next.data);
        history.push(next);
        markBoundaryDirty();
      } else if (next.type === 'remove_shape') {
        const idx = shapes.findIndex(s => s.id === next.data.id);
        if (idx !== -1) shapes.splice(idx, 1);
        next.data.svgEl.remove();
        history.push(next);
        markBoundaryDirty();
      } else if (next.type === 'fill_canvas') {
        const canvas = document.getElementById('fillCanvas');
        const ctx = canvas.getContext('2d');
        ctx.putImageData(next.nextState, 0, 0);
        history.push(next);
      }
      deselectShape();
      clearFillPreview();
      playSound('step');
      rebuildKeySnapPoints();
    }

    function clearCanvas() {
      const canvas = document.getElementById('fillCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      deselectShape();
      clearFillPreview();
      closeFillSubMenu();
      document.getElementById('shapesLayer').innerHTML = '';
      shapes = [];
      history = [];
      redoStack = [];
      resetConstruction();
      document.getElementById('flipPill').classList.remove('show');
      markBoundaryDirty();
      playSound('clear');
    }

    /* ==========================================================================
       11. Export Artwork (Cleanly Clipped Base Circle, 4K High-Res, Mobile Friendly)
       ========================================================================== */
    let currentExportBlob = null;
    let currentExportUrl = null;
    let currentExportFilename = '';
    let toastTimer = null;

    function showToast(message, duration = 2200) {
      const toast = document.getElementById('appToast');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, duration);
    }

    function closeExportModal(e) {
      if (e && e.target && e.target !== e.currentTarget && !e.target.closest('.export-modal-close')) {
        return;
      }
      const modal = document.getElementById('exportModal');
      if (modal) {
        modal.classList.remove('show');
      }
    }

    function triggerDirectDownload() {
      if (!currentExportUrl && !currentExportBlob) return;
      const downloadUrl = currentExportUrl || (currentExportBlob ? URL.createObjectURL(currentExportBlob) : null);
      if (!downloadUrl) return;

      const a = document.createElement('a');
      a.href = downloadUrl;
      a.download = currentExportFilename || `用圆设计的美丽图案-${Date.now()}.png`;
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        if (a.parentNode) {
          a.parentNode.removeChild(a);
        }
      }, 200);

      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
                       (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));
      if (isMobile) {
        showToast('已发起下载，若无反应请长按上方图片保存');
      } else {
        showToast('图片下载已开始');
      }
    }

    async function triggerNativeShare() {
      if (!currentExportBlob) {
        showToast('图片准备中，请稍候');
        return;
      }
      try {
        const file = new File([currentExportBlob], currentExportFilename, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: '用圆设计的美丽图案',
            text: '用圆设计的美丽图案 (2560×2560 超清)',
            files: [file]
          });
          showToast('分享成功');
        } else {
          showToast('当前环境不支持直接分享文件，请长按图片保存');
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          console.warn('Share error:', err);
          showToast('请长按上方图片保存到手机相册');
        }
      }
    }

    async function triggerCopyImage() {
      if (!currentExportBlob) {
        showToast('图片尚未就绪');
        return;
      }
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({ 'image/png': currentExportBlob })
          ]);
          showToast('✅ 已成功复制图片到剪贴板！');
          return;
        }
      } catch (err) {
        console.warn('Clipboard write failed:', err);
      }
      showToast('当前环境不支持直接复制，请长按图片保存');
    }

    function exportArtwork() {
      const fillCanvas = document.getElementById('fillCanvas');
      const OUT_SIZE = 2560; // 4K Ultra High Definition
      const outCanvas = document.createElement('canvas');
      outCanvas.width = OUT_SIZE;
      outCanvas.height = OUT_SIZE;
      const ctx = outCanvas.getContext('2d');

      // 1. Pure White Clean Background
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, OUT_SIZE, OUT_SIZE);

      // High-quality antialiasing
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      ctx.save();
      // Map SVG coordinates [-320, 320] to Canvas [0, 2560] (scale = 4, center at 1280, 1280)
      const scaleFactor = OUT_SIZE / 640;
      ctx.translate(OUT_SIZE / 2, OUT_SIZE / 2);
      ctx.scale(scaleFactor, scaleFactor);

      // 2. Strict Circle Clipping for Pure Vector & Color Artwork
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, BASE_RADIUS, 0, Math.PI * 2);
      ctx.clip();

      // 3. Draw Fill Color Layer (fillCanvas)
      ctx.drawImage(fillCanvas, -320, -320, 640, 640);

      // 4. Draw All User Drawn Geometries (Circles, Arcs, Lines) - No guidelines, no dots
      ctx.setLineDash([]); // Pure solid clean lines
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      shapes.forEach(shape => {
        const color = (shape.svgEl && shape.svgEl.getAttribute('stroke')) || shape.color || '#1E293B';
        const strokeWidth = (shape.svgEl && parseFloat(shape.svgEl.getAttribute('stroke-width'))) || 2.2;
        ctx.strokeStyle = color;
        ctx.lineWidth = strokeWidth;

        if (shape.type === 'circle' && shape.params) {
          ctx.beginPath();
          ctx.arc(shape.params.center.x, shape.params.center.y, shape.params.radius, 0, Math.PI * 2);
          ctx.stroke();
        } else if (shape.type === 'line' && shape.params) {
          ctx.beginPath();
          ctx.moveTo(shape.params.p1.x, shape.params.p1.y);
          ctx.lineTo(shape.params.p2.x, shape.params.p2.y);
          ctx.stroke();
        } else if (shape.type === 'arc' && shape.svgEl) {
          const d = shape.svgEl.getAttribute('d');
          if (d) {
            try {
              const p2d = new Path2D(d);
              ctx.stroke(p2d);
            } catch (e) { }
          }
        }
      });

      ctx.restore(); // end clip

      // 5. Draw Crisp Outer Base Circle Boundary
      ctx.beginPath();
      ctx.arc(0, 0, BASE_RADIUS, 0, Math.PI * 2);
      ctx.strokeStyle = '#1E293B';
      ctx.lineWidth = 2.2;
      ctx.stroke();

      ctx.restore(); // end transform

      // 6. Asynchronous Blob & Modal Setup for Reliable Desktop & Mobile Export
      currentExportFilename = `用圆设计的美丽图案-${Date.now()}.png`;

      // Clean up previous blob URL
      if (currentExportUrl && currentExportUrl.startsWith('blob:')) {
        URL.revokeObjectURL(currentExportUrl);
      }

      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
                       (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent)) ||
                       (window.innerWidth <= 768);
      const isWeChat = /MicroMessenger/i.test(navigator.userAgent);

      // Handle Blob conversion
      const handleBlobReady = (blob, dataUrlFallback) => {
        currentExportBlob = blob;
        currentExportUrl = blob ? URL.createObjectURL(blob) : dataUrlFallback;

        let dataUrl = dataUrlFallback;
        if (!dataUrl) {
          try {
            dataUrl = outCanvas.toDataURL('image/png');
          } catch (e) {
            console.warn('toDataURL fallback error:', e);
          }
        }

        const imgEl = document.getElementById('exportPreviewImg');
        if (imgEl) {
          imgEl.src = dataUrl || currentExportUrl;
        }

        // Configure mobile tip
        const tipTextEl = document.getElementById('exportTipText');
        if (tipTextEl) {
          if (isWeChat) {
            tipTextEl.textContent = '💡 微信提示：长按上方图片即可「保存到手机相册」或发送给好友';
          } else if (isMobile) {
            tipTextEl.textContent = '📱 手机提示：长按上方图片即可「存储图像」或「保存到相册」';
          } else {
            tipTextEl.textContent = '💡 提示：可直接点击下载，或右键/长按图片另存为高清图片';
          }
        }

        // Configure share button visibility
        const shareBtn = document.getElementById('btnShareNative');
        if (shareBtn) {
          if (blob && navigator.canShare) {
            try {
              const testFile = new File([blob], currentExportFilename, { type: 'image/png' });
              if (navigator.canShare({ files: [testFile] })) {
                shareBtn.style.display = 'inline-flex';
              } else {
                shareBtn.style.display = 'none';
              }
            } catch (e) {
              shareBtn.style.display = 'none';
            }
          } else {
            shareBtn.style.display = 'none';
          }
        }

        // Show Modal
        const modal = document.getElementById('exportModal');
        if (modal) {
          modal.classList.add('show');
        }

        // If on Desktop, attempt direct download automatically as well
        if (!isMobile && !isWeChat) {
          triggerDirectDownload();
        }

        playSound('complete');
      };

      if (outCanvas.toBlob) {
        outCanvas.toBlob((blob) => {
          if (blob) {
            handleBlobReady(blob, null);
          } else {
            const dataUrl = outCanvas.toDataURL('image/png');
            handleBlobReady(null, dataUrl);
          }
        }, 'image/png');
      } else {
        const dataUrl = outCanvas.toDataURL('image/png');
        handleBlobReady(null, dataUrl);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeExportModal();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        if (e.shiftKey) {
          redo();
        } else {
          undo();
        }
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
        e.preventDefault();
        redo();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const whiteList = ["edui123.com", "edui.fun"];if (!whiteList.includes(window.location.hostname)) {window.location.href = "https://edui123.com";}
      setTool('circle');
      rebuildKeySnapPoints();
      updateStepHint();
    });
  </script>
