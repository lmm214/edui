<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>用圆设计图案</title>
  <style>
    :root {
      --bg-color: #FFFFFF;
      --panel-bg: rgba(255, 255, 255, 0.95);
      --panel-border: #E2E8F0;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --primary-light: #EEF2FF;
      --accent-blue: #3B82F6;
      --accent-green: #10B981;
      --accent-coral: #F43F5E;
      --accent-amber: #F59E0B;
      --canvas-bg: #FFFFFF;
      --base-circle: #1E293B;
      --guide-line: #94A3B8;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 6px 20px -2px rgba(15, 23, 42, 0.08);
      --radius-xl: 18px;
      --radius-lg: 12px;
      --radius-md: 8px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #FFFFFF;
      color: var(--text-main);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      touch-action: none;
    }

    /* Operation Hint Bar (Top Center - Minimal Single-Color Theme & Concise Text) */
    .step-hint-capsule {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #334155;
      border: 1px solid #E2E8F0;
      padding: 6px 16px;
      border-radius: var(--radius-full);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
      pointer-events: none;
      transition: all 0.2s ease;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #F1F5F9;
      color: #475569;
      font-size: 12px;
      font-weight: 700;
    }

    .step-dots {
      display: flex;
      gap: 4px;
    }

    .step-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #E2E8F0;
      transition: all 0.2s ease;
    }

    .step-dot.active {
      background: #475569;
      transform: scale(1.2);
    }

    .step-dot.done {
      background: #94A3B8;
    }

    /* Selection Floating Action Card */
    .selection-card {
      position: absolute;
      top: 64px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      z-index: 48;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #FFFFFF;
      border: 1.5px solid var(--primary);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.25);
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .selection-card.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
    }

    .selection-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      padding-right: 4px;
      border-right: 1px solid var(--panel-border);
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: none;
      background: transparent;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .action-btn.primary {
      background: var(--primary);
      color: #FFFFFF;
    }

    .action-btn.primary:hover {
      background: var(--primary-hover);
    }

    .action-btn.danger {
      background: #FEE2E2;
      color: #EF4444;
    }

    .action-btn.danger:hover {
      background: #FCA5A5;
      color: #B91C1C;
    }

    .action-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Floating Flip Pill for Touchscreen Quick Toggle */
    .flip-pill {
      position: absolute;
      top: 64px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      z-index: 45;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #FFFFFF;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      padding: 6px 16px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.2);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .flip-pill.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
    }

    .flip-pill:hover {
      background: var(--primary-light);
    }

    .flip-pill svg {
      width: 15px;
      height: 15px;
    }

    /* Primary Canvas Container & Dynamic Tool Cursors */
    .canvas-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      cursor: crosshair;
    }

    .canvas-container.tool-eraser,
    .canvas-container.tool-eraser #drawSvg {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="%23EF4444" stroke="%23FFFFFF" stroke-width="1.8"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>') 6 22, pointer !important;
    }

    .canvas-container.tool-fill,
    .canvas-container.tool-fill #drawSvg {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="%234F46E5" stroke="%23FFFFFF" stroke-width="1.5"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg>') 2 20, pointer !important;
    }

    .canvas-container.tool-select,
    .canvas-container.tool-select #drawSvg {
      cursor: default !important;
    }

    .canvas-container.tool-circle,
    .canvas-container.tool-semicircle,
    .canvas-container.tool-arc,
    .canvas-container.tool-line {
      cursor: crosshair !important;
    }

    .canvas-wrapper {
      position: relative;
      width: 90vmin;
      height: 90vmin;
      max-width: 900px;
      max-height: 900px;
    }

    /* Strict Circle Boundary Clipping for Canvases: 220 / 640 = 34.375% */
    #fillCanvas,
    #previewFillCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      clip-path: circle(34.375% at 50% 50%);
      -webkit-clip-path: circle(34.375% at 50% 50%);
    }

    #fillCanvas {
      z-index: 1;
    }

    #previewFillCanvas {
      z-index: 2;
      opacity: 0.7;
    }

    #drawSvg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      touch-action: none;
      z-index: 3;
    }

    /* Left Floating Tool Palette: [选择, 整圆, 半圆, 圆弧, 直尺, 涂色, 橡皮] */
    .left-palette {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 7px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      padding: 8px 6px;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
    }

    .tool-btn {
      width: 46px;
      height: 46px;
      border-radius: var(--radius-lg);
      border: 1.5px solid transparent;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tool-btn svg {
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }

    .tool-btn span {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .tool-btn:hover {
      background: #F1F5F9;
      color: var(--text-main);
    }

    .tool-btn.active {
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(79, 70, 229, 0.3);
    }

    /* Fill Tool Submenu (Stained Glass Auto Fill) */
    .fill-tool-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fill-submenu {
      position: absolute;
      left: calc(100% + 12px);
      top: 50%;
      transform: translateY(-50%) scale(0.9);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--primary);
      border-radius: var(--radius-full);
      box-shadow: 0 6px 24px rgba(79, 70, 229, 0.22);
      padding: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 60;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .fill-submenu.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(-50%) scale(1);
    }

    .submenu-btn {
      border: none;
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      color: #FFFFFF;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.15s ease;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
    }

    .submenu-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
    }

    .submenu-btn:active {
      transform: scale(0.97);
    }

    /* Right Palette - Colors & Undo/Redo */
    .right-palette {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      padding: 8px 6px;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      max-height: 92vh;
      overflow-y: auto;
    }

    .color-swatches {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .color-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #FFFFFF;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      transition: all 0.15s ease;
      position: relative;
    }

    .color-dot:hover {
      transform: scale(1.15);
    }

    .color-dot.active {
      transform: scale(1.22);
      box-shadow: 0 0 0 2.5px var(--primary), 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    /* Custom Rainbow Color Swatch */
    .color-dot.custom-color-dot {
      background: conic-gradient(from 0deg, #FF0000, #FF7F00, #FFFF00, #00FF00, #00FFFF, #0000FF, #8B00FF, #FF0000);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .color-dot.custom-color-dot::after {
      content: '+';
      font-size: 13px;
      font-weight: 800;
      color: #FFFFFF;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      line-height: 1;
    }

    .palette-divider {
      width: 20px;
      height: 1px;
      background: var(--panel-border);
      margin: 2px auto;
    }

    /* Bottom Floating Division & Settings Bar (Center Bottom) */
    .bottom-bar {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .division-group {
      display: flex;
      align-items: center;
      background: #F1F5F9;
      border-radius: var(--radius-full);
      padding: 2px;
      gap: 2px;
    }

    .div-btn {
      border: none;
      background: transparent;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .div-btn.active {
      background: #FFFFFF;
      color: var(--primary);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .divider {
      width: 1px;
      height: 18px;
      background: var(--panel-border);
    }

    .icon-btn {
      border: none;
      background: transparent;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }

    .icon-btn:hover {
      background: #F1F5F9;
      color: var(--text-main);
    }

    .icon-btn.active {
      background: var(--primary-light);
      color: var(--primary);
    }

    .icon-btn svg {
      width: 17px;
      height: 17px;
      stroke-width: 2;
    }

    /* Bottom-Right Dedicated Action Capsule (Clear & Export) */
    .bottom-right-bar {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      padding: 6px 10px;
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    /* SVG Style Elements */
    .svg-base-circle {
      fill: none;
      stroke: #1E293B;
      stroke-width: 2.2px;
    }

    .svg-axis-line {
      stroke: #94A3B8;
      stroke-width: 1.2px;
      stroke-dasharray: 4 4;
    }

    .svg-radius-guide {
      stroke: #60A5FA;
      stroke-width: 1.5px;
      stroke-dasharray: 4 4;
    }

    .svg-preview-arc {
      fill: none;
      stroke: var(--primary);
      stroke-width: 2.4px;
      stroke-linecap: round;
      stroke-dasharray: 6 4;
      animation: dashMove 0.8s linear infinite;
    }

    @keyframes dashMove {
      to {
        stroke-dashoffset: -10;
      }
    }

    .svg-user-drawn {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s ease, filter 0.15s ease;
      cursor: pointer;
    }

    .svg-user-drawn:hover {
      filter: drop-shadow(0 0 4px rgba(79, 70, 229, 0.5));
    }

    /* Selected Shape Highlight */
    .svg-user-drawn.shape-selected {
      stroke: #4F46E5 !important;
      stroke-dasharray: 8 4 !important;
      animation: selectPulse 0.9s ease-in-out infinite alternate !important;
      filter: drop-shadow(0 0 6px rgba(79, 70, 229, 0.9)) !important;
    }

    /* Hover Glow when in Eraser Mode */
    .svg-user-drawn.shape-eraser-hover {
      stroke: #EF4444 !important;
      stroke-width: 4px !important;
      filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.9)) !important;
      transition: stroke 0.1s ease, filter 0.1s ease;
    }

    /* Hover Glow when in Select Mode */
    .svg-user-drawn.shape-select-hover {
      stroke: #6366F1 !important;
      stroke-width: 3.6px !important;
      filter: drop-shadow(0 0 6px rgba(99, 102, 241, 0.8)) !important;
    }

    @keyframes selectPulse {
      0% {
        stroke-width: 3px;
      }

      100% {
        stroke-width: 4.8px;
      }
    }

    .svg-snap-point {
      transition: transform 0.15s ease, opacity 0.15s ease;
      cursor: pointer;
    }

    /* Breathing Animated Midpoint / Keypoint Dot */
    @keyframes breatheGlow {

      0%,
      100% {
        transform: scale(0.95);
        opacity: 0.88;
        filter: drop-shadow(0 0 3px rgba(59, 130, 246, 0.6));
      }

      50% {
        transform: scale(1.45);
        opacity: 1;
        filter: drop-shadow(0 0 9px rgba(59, 130, 246, 0.9));
      }
    }

    @keyframes snapPulseWave {
      0% {
        r: 6px;
        opacity: 0.9;
        stroke-width: 2.2px;
      }

      100% {
        r: 26px;
        opacity: 0;
        stroke-width: 0.5px;
      }
    }

    .snap-breathe-active {
      animation: breatheGlow 1.3s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .snap-ring-pulse {
      fill: none;
      stroke: #3B82F6;
      animation: snapPulseWave 1.3s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    .compass-needle {
      pointer-events: none;
    }

    /* Hide all snap points, breathe pulse dots, and guide axes/radii lines during Fill Mode */
    .mode-fill #guideAxes,
    .mode-fill #guideRadii,
    .mode-fill #snapPointsLayer,
    .mode-fill #snapPulseLayer,
    .mode-fill #liveOverlay,
    .mode-fill #liveClippedOverlay {
      display: none !important;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .step-hint-capsule {
        top: 10px;
        padding: 5px 12px;
        font-size: 13px;
        max-width: 90vw;
      }

      .left-palette {
        left: 8px;
        padding: 6px 4px;
        gap: 5px;
      }

      .tool-btn {
        width: 40px;
        height: 40px;
      }

      .right-palette {
        right: 8px;
        padding: 6px 4px;
        gap: 5px;
      }

      .bottom-bar {
        display: none !important;
      }

      .bottom-right-bar {
        bottom: 12px;
        right: 12px;
        padding: 4px 6px;
      }
    }

    /* Export / Save Artwork Modal & Toast Notification (Cross-Platform Mobile & Desktop) */
    .export-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      touch-action: auto !important;
    }

    .export-modal-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .export-modal-card {
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25), 0 0 0 1px rgba(226, 232, 240, 0.9);
      max-width: 440px;
      width: 100%;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: scale(0.92) translateY(12px);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      touch-action: auto !important;
    }

    .export-modal-backdrop.show .export-modal-card {
      transform: scale(1) translateY(0);
    }

    .export-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #F1F5F9;
    }

    .export-modal-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      color: #1E293B;
    }

    .export-modal-badge {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      color: #4F46E5;
      background: #EEF2FF;
      padding: 2px 8px;
      border-radius: 9999px;
      border: 1px solid #E0E7FF;
    }

    .export-modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #F1F5F9;
      color: #64748B;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    .export-modal-close:hover {
      background: #E2E8F0;
      color: #1E293B;
    }

      align-items: center;
      overflow-y: auto;

      height: 18px;
      color: #3B82F6;
    }

    .export-modal-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .export-action-btn-row {

      gap: 8px;
      width: 100%;

      height: 42px;
      border-radius: 12px;
      border: none;

      height: 17px;

      color: #334155;
      border: 1px solid #E2E8F0;

    .export-btn.secondary:hover {
      background: #E2E8F0;
      color: #0F172A;
    }

    .export-btn.secondary:active {
      transform: scale(0.98);
    }

    /* Toast Notification */
    .app-toast {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #FFFFFF;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .app-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>

  <!-- Prominent Operation Tip Capsule (Minimal Single-Color Palette & Concise Text) -->
  <div id="stepHint" class="step-hint-capsule">
    <span class="step-badge" id="stepBadge">1</span>

    <div class="step-dots" id="stepDots">
      <div class="step-dot active"></div>

  <!-- Selection Action Card (Flip opening direction / Delete) -->

        <path d="m3 8 4-4 4 4" />
        <path d="M7 4v16" />

    <button class="action-btn danger" onclick="deleteSelectedShape()">

        <polyline points="3 6 5 6 21 6" />
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />

  <!-- Flip Opening Quick Toggle Capsule (For Post-Draw Fast Adjust) -->

      <path d="m3 8 4-4 4 4" />

  <!-- Left Floating Tool Palette: [整圆, 半圆, 圆弧, 直尺, 涂色, 选择, 橡皮] -->
  <div class="left-palette">
    <!-- 1. 整圆 (默认激活) -->
    <button class="tool-btn active" data-mode="circle" onclick="setTool('circle')" title="2点画整圆 (支持触屏拖拽或点击)">

    <!-- 2. 半圆 (2点画半圆：圆心 -> 弧中点) -->

        <circle cx="5" cy="19" r="2" fill="currentColor" />
        <circle cx="19" cy="5" r="2" fill="currentColor" />

    <!-- 5. 涂色 (带二级一键涂色) -->

        <path d="m5 11 9 9" />

  <!-- Right Floating Palette (Expanded Colors + Rainbow Custom Picker + Undo/Redo) -->
  <div class="right-palette">
    <!-- Color Swatches (10 curated colors + 1 custom color) -->
    <div class="color-swatches">
      <div class="color-dot active" style="background: #1E293B;" data-color="#1E293B" onclick="setColor('#1E293B')"

      <div class="color-dot" style="background: #2563EB;" data-color="#2563EB" onclick="setColor('#2563EB')"

      <div class="color-dot" style="background: #059669;" data-color="#059669" onclick="setColor('#059669')" title="翠绿">
      </div>
      <div class="color-dot" style="background: #D97706;" data-color="#D97706" onclick="setColor('#D97706')" title="暖橙">
      </div>
      <div class="color-dot" style="background: #DC2626;" data-color="#DC2626" onclick="setColor('#DC2626')" title="鲜红">
      </div>
      <div class="color-dot" style="background: #DB2777;" data-color="#DB2777" onclick="setColor('#DB2777')" title="玫粉">
      </div>
      <div class="color-dot" style="background: #7C3AED;" data-color="#7C3AED" onclick="setColor('#7C3AED')"
        title="紫罗兰"></div>
      <div class="color-dot" style="background: #0891B2;" data-color="#0891B2" onclick="setColor('#0891B2')" title="青蓝">
      </div>
      <div class="color-dot" style="background: #65A30D;" data-color="#65A30D" onclick="setColor('#65A30D')" title="嫩绿">
      </div>
      <div class="color-dot" style="background: #F59E0B;" data-color="#F59E0B" onclick="setColor('#F59E0B')" title="亮黄">
      </div>

      <!-- Custom Color Picker Rainbow Dot -->
      <div class="color-dot custom-color-dot" id="customColorDot" title="自定义任意彩色" onclick="triggerColorPicker()">
        <input type="color" id="customColorInput"
          style="position:absolute; opacity:0; pointer-events:none; width:0; height:0;"

      </div>
    </div>

    <div class="palette-divider"></div>

    <!-- Undo & Redo -->
    <button class="icon-btn" onclick="undo()" title="撤销 (Ctrl+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M3 7v6h6" />
        <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13" />
      </svg>
    </button>
    <button class="icon-btn" onclick="redo()" title="重做 (Ctrl+Y / Ctrl+Shift+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M21 7v6h-6" />
        <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13" />

  <!-- Bottom Floating Division & Settings Bar (Center Bottom) -->
  <div class="bottom-bar">
    <!-- Division Presets -->
    <div class="division-group" title="设置基准圆等分数">
      <button class="div-btn active" data-div="4" onclick="setDivisions(4)">4等分</button>
      <button class="div-btn" data-div="6" onclick="setDivisions(6)">6等分</button>

      <button class="div-btn" data-div="12" onclick="setDivisions(12)">12等分</button>

    <div class="divider"></div>

    <!-- Essential Snap, Sound & Fullscreen Toggles -->
    <button class="icon-btn active" id="btnSnap" onclick="toggleSnap()" title="开启/关闭 智能磁吸">

        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />

    <button class="icon-btn" id="btnFullscreen" onclick="toggleFullscreen()" title="全屏 / 退出全屏">
      <svg id="iconEnterFs" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
      </svg>
      <svg id="iconExitFs" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="display:none;">
        <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3" />

  <!-- Bottom-Right Dedicated Action Bar (Clear Canvas & Export Image) -->
  <div class="bottom-right-bar">
    <button class="icon-btn" onclick="clearCanvas()" title="清空画板">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <polyline points="3 6 5 6 21 6" />
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      </svg>
    </button>
    <button class="icon-btn" onclick="exportArtwork()" title="保存作品图片 (2560×2560 超清)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" y1="15" x2="12" y2="3" />
      </svg>
    </button>
  </div>

  <!-- Main Geometric Canvas Area: Dual Layer -->
  <div class="canvas-container" id="canvasContainer">
    <div class="canvas-wrapper">
      <!-- Layer 1: Permanent Solid Colors (Clipped to Base Circle) -->
      <canvas id="fillCanvas" width="1280" height="1280"></canvas>
      <!-- Layer 2: Real-time Hover Color Preview Canvas (Clipped to Base Circle) -->
      <canvas id="previewFillCanvas" width="1280" height="1280"></canvas>

      <!-- Layer 3: Mathematical Vector SVG -->
      <svg id="drawSvg" viewBox="-320 -320 640 640">
        <defs>
          <!-- Base Circle Clip Path: Strictly restricts all drawn vector graphics to Base Circle (R = 220) -->
          <clipPath id="baseCircleClip">
            <circle cx="0" cy="0" r="220" />
          </clipPath>
        </defs>

        <!-- Guidelines (Cross Dashed Axes & Radii) -->
        <g id="guideGroup">
          <g id="guideAxes" clip-path="url(#baseCircleClip)">
            <line id="axisHorizontal" x1="-270" y1="0" x2="270" y2="0" class="svg-axis-line" />
            <line id="axisVertical" x1="0" y1="-270" x2="0" y2="270" class="svg-axis-line" />
          </g>
          <g id="guideRadii" clip-path="url(#baseCircleClip)" style="display:none;"></g>
          <!-- Clean Base Circle (R = 220) -->
          <circle id="baseCircle" cx="0" cy="0" r="220" fill="none" class="svg-base-circle" />
        </g>

        <!-- User Drawn Vector Geometries (Clipped strictly inside Base Circle) -->
        <g id="shapesLayer" clip-path="url(#baseCircleClip)"></g>

        <!-- Live Interactive Construction Overlay (Clipped Preview Path & Radius Guide) -->
        <g id="liveClippedOverlay" clip-path="url(#baseCircleClip)">
          <path id="livePreviewPath" class="svg-preview-arc" d="" style="display:none;" />
          <line id="liveRadiusLine" class="svg-radius-guide" x1="0" y1="0" x2="0" y2="0" style="display:none;" />
        </g>

        <!-- Unclipped Construction Center & Compass Markers -->
        <g id="liveOverlay">
          <circle id="liveCenterPoint" cx="0" cy="0" r="5" fill="#EF4444" style="display:none;" />
          <circle id="liveStartPoint" cx="0" cy="0" r="4" fill="#3B82F6" style="display:none;" />

          <!-- Compass Needle Visual -->
          <g id="compassGroup" class="compass-needle" style="display:none;">
            <circle id="compassNeedlePin" cx="0" cy="0" r="4" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5" />
            <line id="compassArm" x1="0" y1="0" x2="0" y2="0" stroke="#475569" stroke-width="2"
              stroke-linecap="round" />
            <circle id="compassPencil" cx="0" cy="0" r="4" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.5" />
          </g>
        </g>

        <!-- Dynamic Key Snap Points Layer with Breathing Pulse Animation -->
        <g id="snapPointsLayer"></g>
        <g id="snapPulseLayer">
          <circle id="snapBreatheDot" cx="0" cy="0" r="5.5" class="snap-breathe-active" fill="#3B82F6" stroke="#FFFFFF"
            stroke-width="2" style="display:none;" />
          <circle id="snapPulseRing" cx="0" cy="0" r="8" class="snap-ring-pulse" style="display:none;" />
        </g>
      </svg>
    </div>
  </div>

            <line x1="12" y1="16" x2="12" y2="12"></line>

                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>

            </button>
            <button class="export-btn secondary" id="btnShareNative" onclick="triggerNativeShare()" style="display:none;">

                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>

            <button class="export-btn secondary" onclick="closeExportModal()">
              <span>完成</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Global Toast Floating Message -->
  <div id="appToast" class="app-toast"></div>

  <script>
    /* ==========================================================================
       1. Global State & Geometric Definitions
       ========================================================================== */
    const BASE_RADIUS = 220;
    let currentDivisions = 4;
    let currentTool = 'circle'; // Default tool is Complete Circle (整圆)
    let currentColor = '#1E293B';
    const currentStrokeWidth = 2.2;
    let isSnapEnabled = true;
    let isSoundEnabled = true;

    // Construction multi-step points & Touch Drag Support
    let stepPoints = [];
    let history = [];
    let redoStack = [];
    let shapes = [];
    let snapPoints = [];
    let activeSnapPoint = null;
    let lastPointerPos = { x: 0, y: 0 };

    // Touch & Mouse Dragging State
    let isPointerDragging = false;
    let dragStartRawPos = { x: 0, y: 0 };
    let dragStartSnappedPos = { x: 0, y: 0 };

    // Dynamic sweep tracking (Clockwise vs Counter-Clockwise motion detection)

    /* ==========================================================================
       2. Web Audio Synthesis for Gentle Kids Friendly Sound FX
       ========================================================================== */
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (!isSoundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'snap') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.07);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'step') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(480, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.start(now);
        osc.stop(now + 0.06);
      } else if (type === 'complete') {
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const chordOsc = audioCtx.createOscillator();
          const chordGain = audioCtx.createGain();
          chordOsc.type = 'sine';
          chordOsc.frequency.setValueAtTime(freq, now + i * 0.04);
          chordGain.gain.setValueAtTime(0.1, now + i * 0.04);
          chordGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3 + i * 0.04);
          chordOsc.connect(chordGain);
          chordGain.connect(audioCtx.destination);
          chordOsc.start(now + i * 0.04);
          chordOsc.stop(now + 0.3 + i * 0.04);
        });
      } else if (type === 'flip') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.09);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'fill') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(620, now + 0.12);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.start(now);
        osc.stop(now + 0.14);
      } else if (type === 'clear') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(160, now + 0.15);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.start(now);
        osc.stop(now + 0.16);
      }
    }

    function playCrystalChime(freq) {
      if (!isSoundEnabled) return;
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

    /* ==========================================================================
       3. Dynamic Midpoint & Snap Points Recognition System (1/4, 1/2, 3/4 Points)
       ========================================================================== */
    function rebuildKeySnapPoints() {
      snapPoints = [];

      // 1. Center of Base Circle O (0, 0)
      snapPoints.push({ x: 0, y: 0, label: '圆心 O', type: 'center', priority: 10, isVisible: true });

      // 2. Base Circle Division points & Radius Fractions (1/4, 1/2, 3/4 R)
      const N = currentDivisions;
      for (let i = 0; i < N; i++) {
        const angle = (i * 2 * Math.PI) / N - Math.PI / 2;
        const cosA = Math.cos(angle);
        const sinA = Math.sin(angle);

        // 1.0 R: Circumference division point
        const x = Math.round(cosA * BASE_RADIUS * 100) / 100;
        const y = Math.round(sinA * BASE_RADIUS * 100) / 100;
        snapPoints.push({ x, y, label: `等分点 #${i + 1}`, type: 'division', priority: 8, isVisible: true });

        // 1/4 R: 1/4 point along radius
        const q1x = Math.round(cosA * (BASE_RADIUS * 0.25) * 100) / 100;
        const q1y = Math.round(sinA * (BASE_RADIUS * 0.25) * 100) / 100;
        snapPoints.push({ x: q1x, y: q1y, label: `半径 1/4 点`, type: 'quarter', priority: 7, isVisible: false });

        // 1/2 R: Midpoint along radius
        const mx = Math.round(cosA * (BASE_RADIUS * 0.5) * 100) / 100;
        const my = Math.round(sinA * (BASE_RADIUS * 0.5) * 100) / 100;
        snapPoints.push({ x: mx, y: my, label: `半径中点`, type: 'midpoint', priority: 8, isVisible: false });

        // 3/4 R: 3/4 point along radius
        const q3x = Math.round(cosA * (BASE_RADIUS * 0.75) * 100) / 100;
        const q3y = Math.round(sinA * (BASE_RADIUS * 0.75) * 100) / 100;
        snapPoints.push({ x: q3x, y: q3y, label: `半径 3/4 点`, type: 'quarter', priority: 7, isVisible: false });

        // Inscribed polygon chord 1/4, 1/2, 3/4 points
        const nextAngle = (((i + 1) % N) * 2 * Math.PI) / N - Math.PI / 2;
        const nx = Math.cos(nextAngle) * BASE_RADIUS;
        const ny = Math.sin(nextAngle) * BASE_RADIUS;

        const cmx = Math.round(((x + nx) / 2) * 100) / 100;
        const cmy = Math.round(((y + ny) / 2) * 100) / 100;
        snapPoints.push({ x: cmx, y: cmy, label: `弦中点`, type: 'chord-mid', priority: 6, isVisible: false });

        const cq1x = Math.round((x * 0.75 + nx * 0.25) * 100) / 100;
        const cq1y = Math.round((y * 0.75 + ny * 0.25) * 100) / 100;
        snapPoints.push({ x: cq1x, y: cq1y, label: `弦 1/4 点`, type: 'quarter', priority: 6, isVisible: false });

        const cq3x = Math.round((x * 0.25 + nx * 0.75) * 100) / 100;
        const cq3y = Math.round((y * 0.25 + ny * 0.75) * 100) / 100;
        snapPoints.push({ x: cq3x, y: cq3y, label: `弦 3/4 点`, type: 'quarter', priority: 6, isVisible: false });
      }

      // 3. Dynamic Midpoint & Quarter Point Recognition for ALL User-Drawn Geometries
      shapes.forEach(shape => {
        if (!shape.params) return;

        // Line Segments: Endpoints, 1/4, 1/2, 3/4 positions
        if (shape.type === 'line' && shape.params.p1 && shape.params.p2) {
          const p1 = shape.params.p1;
          const p2 = shape.params.p2;
          snapPoints.push({ x: p1.x, y: p1.y, label: '端点', type: 'user-point', priority: 7, isVisible: true });
          snapPoints.push({ x: p2.x, y: p2.y, label: '端点', type: 'user-point', priority: 7, isVisible: true });

          // 1/4 Point
          const lineQ1X = Math.round((p1.x * 0.75 + p2.x * 0.25) * 100) / 100;
          const lineQ1Y = Math.round((p1.y * 0.75 + p2.y * 0.25) * 100) / 100;
          snapPoints.push({ x: lineQ1X, y: lineQ1Y, label: '线段 1/4 点', type: 'quarter', priority: 7, isVisible: false });

          // Midpoint (1/2)
          const lineMidX = Math.round(((p1.x + p2.x) / 2) * 100) / 100;
          const lineMidY = Math.round(((p1.y + p2.y) / 2) * 100) / 100;
          snapPoints.push({ x: lineMidX, y: lineMidY, label: '线段中点', type: 'midpoint', priority: 8, isVisible: false });

          // 3/4 Point
          const lineQ3X = Math.round((p1.x * 0.25 + p2.x * 0.75) * 100) / 100;
          const lineQ3Y = Math.round((p1.y * 0.25 + p2.y * 0.75) * 100) / 100;
          snapPoints.push({ x: lineQ3X, y: lineQ3Y, label: '线段 3/4 点', type: 'quarter', priority: 7, isVisible: false });
        }

        // Arcs & Semicircles: Center, Endpoints, Apex, 1/4, 3/4 arc points, and chord fractions
        if (shape.type === 'arc' && shape.params.center && shape.params.p1 && shape.params.p2) {
          const c = shape.params.center;
          const p1 = shape.params.p1;
          const p2 = shape.params.p2;
          const r = shape.params.radius;

          snapPoints.push({ x: c.x, y: c.y, label: '圆弧圆心', type: 'user-center', priority: 9, isVisible: true });
          snapPoints.push({ x: p1.x, y: p1.y, label: '弧线端点', type: 'user-point', priority: 7, isVisible: true });
          snapPoints.push({ x: p2.x, y: p2.y, label: '弧线端点', type: 'user-point', priority: 7, isVisible: true });

          // Semicircle explicit apex or arc midpoint
          if (shape.params.midPt) {
            const m = shape.params.midPt;
            snapPoints.push({ x: m.x, y: m.y, label: '半圆弧中点', type: 'midpoint', priority: 8, isVisible: true });

            // Semicircle 1/4 and 3/4 arc curve points
            const angleM = Math.atan2(m.y - c.y, m.x - c.x);
            const aQ1 = angleM - Math.PI / 4;
            const aQ3 = angleM + Math.PI / 4;
            snapPoints.push({ x: Math.round((c.x + Math.cos(aQ1) * r) * 100) / 100, y: Math.round((c.y + Math.sin(aQ1) * r) * 100) / 100, label: '弧 1/4 点', type: 'quarter', priority: 7, isVisible: false });
            snapPoints.push({ x: Math.round((c.x + Math.cos(aQ3) * r) * 100) / 100, y: Math.round((c.y + Math.sin(aQ3) * r) * 100) / 100, label: '弧 3/4 点', type: 'quarter', priority: 7, isVisible: false });
          } else {
            // General arc angle division
            const a1 = Math.atan2(p1.y - c.y, p1.x - c.x);
            const a2 = Math.atan2(p2.y - c.y, p2.x - c.x);
            let da = a2 - a1;
            if (shape.params.sweepFlag === 1 && da < 0) da += 2 * Math.PI;
            if (shape.params.sweepFlag === 0 && da > 0) da -= 2 * Math.PI;

            const midAngle = a1 + da * 0.5;
            snapPoints.push({ x: Math.round((c.x + Math.cos(midAngle) * r) * 100) / 100, y: Math.round((c.y + Math.sin(midAngle) * r) * 100) / 100, label: '弧中点', type: 'midpoint', priority: 8, isVisible: false });

            const q1Angle = a1 + da * 0.25;
            snapPoints.push({ x: Math.round((c.x + Math.cos(q1Angle) * r) * 100) / 100, y: Math.round((c.y + Math.sin(q1Angle) * r) * 100) / 100, label: '弧 1/4 点', type: 'quarter', priority: 7, isVisible: false });

            const q3Angle = a1 + da * 0.75;
            snapPoints.push({ x: Math.round((c.x + Math.cos(q3Angle) * r) * 100) / 100, y: Math.round((c.y + Math.sin(q3Angle) * r) * 100) / 100, label: '弧 3/4 点', type: 'quarter', priority: 7, isVisible: false });
          }

          // Arc Chord 1/4, 1/2, 3/4
          const chordMidX = Math.round(((p1.x + p2.x) / 2) * 100) / 100;
          const chordMidY = Math.round(((p1.y + p2.y) / 2) * 100) / 100;
          snapPoints.push({ x: chordMidX, y: chordMidY, label: '弧弦中点', type: 'midpoint', priority: 7, isVisible: false });

          // Radius (Center to P1 / P2) 1/4, 1/2, 3/4
          const rMid1X = Math.round(((c.x + p1.x) / 2) * 100) / 100;
          const rMid1Y = Math.round(((c.y + p1.y) / 2) * 100) / 100;
          snapPoints.push({ x: rMid1X, y: rMid1Y, label: '半径中点', type: 'midpoint', priority: 7, isVisible: false });

          const rMid2X = Math.round(((c.x + p2.x) / 2) * 100) / 100;
          const rMid2Y = Math.round(((c.y + p2.y) / 2) * 100) / 100;
          snapPoints.push({ x: rMid2X, y: rMid2Y, label: '半径中点', type: 'midpoint', priority: 7, isVisible: false });
        }

        // Complete Circles: Center, Quadrature Points & 1/4, 1/2, 3/4 Radii
        if (shape.type === 'circle' && shape.params.center && shape.params.radius) {
          const c = shape.params.center;
          const r = shape.params.radius;
          snapPoints.push({ x: c.x, y: c.y, label: '圆心', type: 'user-center', priority: 9, isVisible: true });

          const dirs = [
            { dx: 0, dy: -1, name: '顶' },
            { dx: 0, dy: 1, name: '底' },
            { dx: -1, dy: 0, name: '左' },
            { dx: 1, dy: 0, name: '右' }
          ];

          dirs.forEach(d => {
            snapPoints.push({ x: c.x + d.dx * r, y: c.y + d.dy * r, label: `圆${d.name}点`, type: 'user-point', priority: 6, isVisible: false });
            snapPoints.push({ x: c.x + d.dx * (r * 0.5), y: c.y + d.dy * (r * 0.5), label: `圆半径中点`, type: 'midpoint', priority: 7, isVisible: false });
            snapPoints.push({ x: c.x + d.dx * (r * 0.25), y: c.y + d.dy * (r * 0.25), label: `圆半径 1/4 点`, type: 'quarter', priority: 6, isVisible: false });
            snapPoints.push({ x: c.x + d.dx * (r * 0.75), y: c.y + d.dy * (r * 0.75), label: `圆半径 3/4 点`, type: 'quarter', priority: 6, isVisible: false });
          });
        }
      });

      // 4. Comprehensive Geometric Intersections Recognition (Shape-Shape, Shape-Axis, Shape-BaseCircle)
      const allPrimitives = [];

      // Add Base Circle
      allPrimitives.push({ kind: 'circle', center: { x: 0, y: 0 }, radius: BASE_RADIUS, isBase: true });

      // Add Base Coordinate Axes Lines (Skip horizontal axis in 6-divisions mode)
      if (currentDivisions !== 6) {
        allPrimitives.push({ kind: 'line', p1: { x: -BASE_RADIUS, y: 0 }, p2: { x: BASE_RADIUS, y: 0 }, isAxis: true });
      }
      allPrimitives.push({ kind: 'line', p1: { x: 0, y: -BASE_RADIUS }, p2: { x: 0, y: BASE_RADIUS }, isAxis: true });

      // Add Radial Division Guideline Segments
      if (currentDivisions !== 4) {
        for (let i = 0; i < currentDivisions; i++) {
          const angle = (i * 2 * Math.PI) / currentDivisions - Math.PI / 2;
          allPrimitives.push({
            kind: 'line',
            p1: { x: 0, y: 0 },
            p2: { x: Math.cos(angle) * BASE_RADIUS, y: Math.sin(angle) * BASE_RADIUS },
            isAxis: true
          });
        }
      }

      // Add User Drawn Geometries
      shapes.forEach(s => {
        if (!s.params) return;
        if (s.type === 'line') {
          allPrimitives.push({ kind: 'line', p1: s.params.p1, p2: s.params.p2, shape: s });
        } else if (s.type === 'circle') {
          allPrimitives.push({ kind: 'circle', center: s.params.center, radius: s.params.radius, shape: s });
        } else if (s.type === 'arc') {
          allPrimitives.push({
            kind: 'arc',
            center: s.params.center,
            p1: s.params.p1,
            p2: s.params.p2,
            radius: s.params.radius,
            sweepFlag: s.params.sweepFlag !== undefined ? s.params.sweepFlag : 1,
            shape: s
          });
        }
      });

      // Calculate Intersections Between All Primitive Pairs
      for (let i = 0; i < allPrimitives.length; i++) {
        for (let j = i + 1; j < allPrimitives.length; j++) {
          const a = allPrimitives[i];
          const b = allPrimitives[j];

          // Skip intersection between two static axes (already known at 0,0)
          if (a.isAxis && b.isAxis) continue;
          if (a.isBase && b.isAxis) continue;

          let rawIntersections = [];

          if (a.kind === 'line' && b.kind === 'line') {
            const pt = computeLineLineIntersection(a.p1, a.p2, b.p1, b.p2);
            if (pt) rawIntersections.push(pt);
          } else if (a.kind === 'line' && (b.kind === 'circle' || b.kind === 'arc')) {
            const pts = computeLineCircleIntersections(a.p1, a.p2, b.center, b.radius);
            pts.forEach(pt => {
              if (b.kind === 'circle' || isPtOnArcSpan(pt, b.center, b.p1, b.p2, b.radius, b.sweepFlag)) {
                rawIntersections.push(pt);
              }
            });
          } else if ((a.kind === 'circle' || a.kind === 'arc') && b.kind === 'line') {
            const pts = computeLineCircleIntersections(b.p1, b.p2, a.center, a.radius);
            pts.forEach(pt => {
              if (a.kind === 'circle' || isPtOnArcSpan(pt, a.center, a.p1, a.p2, a.radius, a.sweepFlag)) {
                rawIntersections.push(pt);
              }
            });
          } else if ((a.kind === 'circle' || a.kind === 'arc') && (b.kind === 'circle' || b.kind === 'arc')) {
            const pts = computeCircleCircleIntersections(a.center, a.radius, b.center, b.radius);
            pts.forEach(pt => {
              const onA = a.kind === 'circle' || isPtOnArcSpan(pt, a.center, a.p1, a.p2, a.radius, a.sweepFlag);
              const onB = b.kind === 'circle' || isPtOnArcSpan(pt, b.center, b.p1, b.p2, b.radius, b.sweepFlag);
              if (onA && onB) {
                rawIntersections.push(pt);
              }
            });
          }

          rawIntersections.forEach(pt => {
            if (Math.hypot(pt.x, pt.y) <= BASE_RADIUS + 3) {
              snapPoints.push({
                x: pt.x,
                y: pt.y,
                label: '图形交叉点',
                type: 'intersection',
                priority: 9,
                isVisible: false
              });
            }
          });
        }
      }

      renderSnapPointsDOM();
      renderGuidelinesDOM();
    }

    /* ==========================================================================
       Geometric Intersection Math Utilities
       ========================================================================== */
    function isPtOnArcSpan(pt, center, p1, p2, radius, sweepFlag) {
      const a1 = Math.atan2(p1.y - center.y, p1.x - center.x);
      const a2 = Math.atan2(p2.y - center.y, p2.x - center.x);
      const aPt = Math.atan2(pt.y - center.y, pt.x - center.x);

      let span = a2 - a1;
      let dPt = aPt - a1;

      if (sweepFlag === 1) {
        while (span < 0) span += 2 * Math.PI;
        while (dPt < 0) dPt += 2 * Math.PI;
        return dPt <= span + 0.05;
      } else {
        while (span > 0) span -= 2 * Math.PI;
        while (dPt > 0) dPt -= 2 * Math.PI;
        return dPt >= span - 0.05;
      }
    }

    function computeDistanceToShape(pos, shape) {
      if (!shape || !shape.params) return Infinity;

      if (shape.type === 'line') {
        const { p1, p2 } = shape.params;
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const lenSq = dx * dx + dy * dy;
        if (lenSq < 1e-6) return Math.hypot(pos.x - p1.x, pos.y - p1.y);

        const t = Math.max(0, Math.min(1, ((pos.x - p1.x) * dx + (pos.y - p1.y) * dy) / lenSq));
        const projX = p1.x + t * dx;
        const projY = p1.y + t * dy;
        return Math.hypot(pos.x - projX, pos.y - projY);
      }

      if (shape.type === 'circle') {
        const { center, radius } = shape.params;
        const distToCenter = Math.hypot(pos.x - center.x, pos.y - center.y);
        return Math.abs(distToCenter - radius);
      }

      if (shape.type === 'arc') {
        const { center, radius, p1, p2, sweepFlag } = shape.params;
        const sFlag = sweepFlag !== undefined ? sweepFlag : 1;
        const distToCenter = Math.hypot(pos.x - center.x, pos.y - center.y);

        if (isPtOnArcSpan(pos, center, p1, p2, radius, sFlag)) {
          return Math.abs(distToCenter - radius);
        } else {
          const d1 = Math.hypot(pos.x - p1.x, pos.y - p1.y);
          const d2 = Math.hypot(pos.x - p2.x, pos.y - p2.y);
          return Math.min(d1, d2);
        }
      }

      return Infinity;
    }

    function findClosestShape(pos, maxDist = 26) {
      let bestShape = null;
      let minDist = maxDist;

      for (let shape of shapes) {
        const d = computeDistanceToShape(pos, shape);
        if (d < minDist) {
          minDist = d;
          bestShape = shape;
        }
      }
      return bestShape;
    }

    function clearShapeHoverEffects() {
      shapes.forEach(s => {
        if (s.svgEl) {
          s.svgEl.classList.remove('shape-eraser-hover', 'shape-select-hover');
        }
      });
    }

    function computeLineLineIntersection(p1, p2, p3, p4) {
      const denom = (p4.y - p3.y) * (p2.x - p1.x) - (p4.x - p3.x) * (p2.y - p1.y);
      if (Math.abs(denom) < 1e-6) return null;

      const ua = ((p4.x - p3.x) * (p1.y - p3.y) - (p4.y - p3.y) * (p1.x - p3.x)) / denom;
      const ub = ((p2.x - p1.x) * (p1.y - p3.y) - (p2.y - p1.y) * (p1.x - p3.x)) / denom;

      if (ua >= -0.01 && ua <= 1.01 && ub >= -0.01 && ub <= 1.01) {
        return {
          x: Math.round((p1.x + ua * (p2.x - p1.x)) * 100) / 100,
          y: Math.round((p1.y + ua * (p2.y - p1.y)) * 100) / 100
        };
      }
      return null;
    }

    function computeLineCircleIntersections(p1, p2, center, radius) {
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const lenSq = dx * dx + dy * dy;
      if (lenSq < 1e-6) return [];

      const t = ((center.x - p1.x) * dx + (center.y - p1.y) * dy) / lenSq;
      const projX = p1.x + t * dx;
      const projY = p1.y + t * dy;
      const distSq = (center.x - projX) ** 2 + (center.y - projY) ** 2;

      if (distSq > radius * radius + 1e-4) return [];

      const dt = Math.sqrt(Math.max(0, radius * radius - distSq) / lenSq);
      const t1 = t - dt;
      const t2 = t + dt;
      const results = [];

      [t1, t2].forEach(val => {
        if (val >= -0.02 && val <= 1.02) {
          results.push({
            x: Math.round((p1.x + val * dx) * 100) / 100,
            y: Math.round((p1.y + val * dy) * 100) / 100
          });
        }
      });
      return results;
    }

    function computeCircleCircleIntersections(c1, r1, c2, r2) {
      const d = Math.hypot(c2.x - c1.x, c2.y - c1.y);
      if (d > r1 + r2 + 0.1 || d < Math.abs(r1 - r2) - 0.1 || d < 1e-5) return [];

      const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d);
      const h = Math.sqrt(Math.max(0, r1 * r1 - a * a));

      const p0x = c1.x + (a * (c2.x - c1.x)) / d;
      const p0y = c1.y + (a * (c2.y - c1.y)) / d;

      const rx = -(c2.y - c1.y) * (h / d);
      const ry = (c2.x - c1.x) * (h / d);

      return [
        { x: Math.round((p0x + rx) * 100) / 100, y: Math.round((p0y + ry) * 100) / 100 },
        { x: Math.round((p0x - rx) * 100) / 100, y: Math.round((p0y - ry) * 100) / 100 }
      ];
    }

    function renderGuidelinesDOM() {
      const N = currentDivisions;
      const radiiGroup = document.getElementById('guideRadii');
      const axisH = document.getElementById('axisHorizontal');
      const axisV = document.getElementById('axisVertical');
      radiiGroup.innerHTML = '';

      if (N === 6) {
        // Hide horizontal line in 6 divisions mode
        if (axisH) axisH.style.display = 'none';
        if (axisV) axisV.style.display = 'block';
        radiiGroup.style.display = 'block';

        for (let i = 0; i < N; i++) {
          const angle = (i * 2 * Math.PI) / N - Math.PI / 2;
          // Skip angles coinciding with the vertical axis (-90 deg and +90 deg)
          if (Math.abs(Math.cos(angle)) < 1e-4) continue;
          const x2 = Math.cos(angle) * BASE_RADIUS;
          const y2 = Math.sin(angle) * BASE_RADIUS;
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', '0');
          line.setAttribute('y1', '0');
          line.setAttribute('x2', x2);
          line.setAttribute('y2', y2);
          line.setAttribute('class', 'svg-axis-line');
          radiiGroup.appendChild(line);
        }
      } else if (N !== 4) {
        if (axisH) axisH.style.display = 'block';
        if (axisV) axisV.style.display = 'block';
        radiiGroup.style.display = 'block';

        for (let i = 0; i < N; i++) {
          const angle = (i * 2 * Math.PI) / N - Math.PI / 2;
          const x2 = Math.cos(angle) * BASE_RADIUS;
          const y2 = Math.sin(angle) * BASE_RADIUS;
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', '0');
          line.setAttribute('y1', '0');
          line.setAttribute('x2', x2);
          line.setAttribute('y2', y2);
          line.setAttribute('class', 'svg-axis-line');
          radiiGroup.appendChild(line);
        }
      } else {
        if (axisH) axisH.style.display = 'block';
        if (axisV) axisV.style.display = 'block';
        radiiGroup.style.display = 'none';
      }
    }

    function renderSnapPointsDOM() {
      const snapLayer = document.getElementById('snapPointsLayer');
      snapLayer.innerHTML = '';

      const visiblePoints = snapPoints.filter(p => p.isVisible);
      const unique = [];
      visiblePoints.forEach(p => {
        const exists = unique.some(u => Math.hypot(u.x - p.x, u.y - p.y) < 3);
        if (!exists) unique.push(p);
      });

      unique.forEach(p => {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', p.x);
        c.setAttribute('cy', p.y);

        if (p.type === 'center' || p.type === 'user-center') {
          c.setAttribute('r', '4');
          c.setAttribute('fill', '#EF4444');
          c.setAttribute('stroke', '#FFFFFF');
          c.setAttribute('stroke-width', '1.2');
        } else {
          c.setAttribute('r', '3.5');
          c.setAttribute('fill', '#3B82F6');
          c.setAttribute('stroke', '#FFFFFF');
          c.setAttribute('stroke-width', '1');
        }

        c.setAttribute('class', 'svg-snap-point');
        snapLayer.appendChild(c);
      });
    }

    /* ==========================================================================
       4. Magnetic Snapping & Breathing Animation Visual (No Text Toasts)
       ========================================================================== */
    const SNAP_THRESHOLD = 26;

    function findSnapPoint(pos) {
      if (!isSnapEnabled || currentTool === 'fill' || currentTool === 'select') return { point: pos, isSnapped: false };

      let bestPoint = null;
      let minDistance = SNAP_THRESHOLD;

      for (let p of snapPoints) {
        const d = Math.hypot(p.x - pos.x, p.y - pos.y);
        if (d < minDistance) {
          minDistance = d;
          bestPoint = p;
        }
      }

      if (bestPoint) {
        return {
          point: { x: bestPoint.x, y: bestPoint.y },
          label: bestPoint.label,
          type: bestPoint.type,
          isSnapped: true
        };
      }

      return { point: pos, isSnapped: false };
    }

    function updateSnapVisual(snapResult) {
      const breatheDot = document.getElementById('snapBreatheDot');
      const pulseRing = document.getElementById('snapPulseRing');

      if (currentTool === 'fill' || currentTool === 'select') {
        breatheDot.style.display = 'none';
        pulseRing.style.display = 'none';
        activeSnapPoint = null;
        return;
      }

      if (snapResult && snapResult.isSnapped) {
        breatheDot.setAttribute('cx', snapResult.point.x);
        breatheDot.setAttribute('cy', snapResult.point.y);
        breatheDot.style.display = 'block';

        if (snapResult.type === 'midpoint' || snapResult.type === 'chord-mid') {
          breatheDot.setAttribute('fill', '#10B981'); // Emerald Green for 1/2 Midpoints
          pulseRing.setAttribute('stroke', '#10B981');
        } else if (snapResult.type === 'intersection') {
          breatheDot.setAttribute('fill', '#F59E0B'); // Warm Amber Gold for Geometric Intersections
          pulseRing.setAttribute('stroke', '#F59E0B');
        } else if (snapResult.type === 'quarter') {
          breatheDot.setAttribute('fill', '#8B5CF6'); // Vibrant Violet for 1/4 & 3/4 Division Points
          pulseRing.setAttribute('stroke', '#8B5CF6');
        } else if (snapResult.type === 'center' || snapResult.type === 'user-center') {
          breatheDot.setAttribute('fill', '#EF4444'); // Coral Red for Centers
          pulseRing.setAttribute('stroke', '#EF4444');
        } else {
          breatheDot.setAttribute('fill', '#3B82F6'); // Electric Blue for Perimeter & Endpoints
          pulseRing.setAttribute('stroke', '#3B82F6');
        }

        pulseRing.setAttribute('cx', snapResult.point.x);
        pulseRing.setAttribute('cy', snapResult.point.y);
        pulseRing.style.display = 'block';

        if (!activeSnapPoint || activeSnapPoint.x !== snapResult.point.x || activeSnapPoint.y !== snapResult.point.y) {
          playSound('snap');
        }
        activeSnapPoint = snapResult.point;
      } else {
        breatheDot.style.display = 'none';
        pulseRing.style.display = 'none';
        activeSnapPoint = null;
      }
    }

    /* ==========================================================================
       5. Step-by-Step Hint Manager (Minimal Single-Color & Ultra-Concise)
       ========================================================================== */
    function updateStepHint() {

          <div class="step-dot ${step === 2 ? 'active' : ''}"></div>
        `;

      } else if (currentTool === 'arc') {

      } else if (currentTool === 'line') {
        hintCapsule.style.display = 'flex';

          <div class="step-dot ${step === 1 ? 'active' : 'done'}"></div>
          <div class="step-dot ${step === 2 ? 'active' : ''}"></div>
        `;

    /* ==========================================================================
       6. Pointer & Touch Event Handlers (Dual Support: Drag & Tap Mode)
       ========================================================================== */
    const svgEl = document.getElementById('drawSvg');

    function getSVGCoords(e) {
      const pt = svgEl.createSVGPoint();
      pt.x = e.clientX;
      pt.y = e.clientY;
      const svgPoint = pt.matrixTransform(svgEl.getScreenCTM().inverse());
      return { x: svgPoint.x, y: svgPoint.y };
    }

    svgEl.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      initAudio();
      const rawPos = getSVGCoords(e);
      isPointerDragging = true;
      dragStartRawPos = rawPos;

      closeFillSubMenu();

      if (currentTool === 'select') {
        const closest = findClosestShape(rawPos, 26);
        if (closest) {
          selectShape(closest);
        } else {
          deselectShape();
        }
        return;
      }

      if (currentTool === 'fill') {
        floodFillRegion(rawPos.x, rawPos.y, currentColor);
        return;
      }

      if (currentTool === 'eraser') {
        const closest = findClosestShape(rawPos, 26);
        if (closest) {
          deleteShape(closest.svgEl);
          clearShapeHoverEffects();
        }
        return;
      }

      const snapResult = findSnapPoint(rawPos);
      const pos = snapResult.point;
      dragStartSnappedPos = pos;

      // Start drag / tap construction
      if (stepPoints.length === 0) {
        stepPoints.push(pos);
        showCenterMarker(pos);
        playSound('step');
        updateStepHint();
      }
    });

    svgEl.addEventListener('pointermove', (e) => {
      e.preventDefault();
      const rawPos = getSVGCoords(e);

      if (currentTool === 'fill') {
        updateFillPreview(rawPos.x, rawPos.y);
      } else if (currentTool === 'eraser') {
        clearFillPreview();
        hideLivePreview();
        const closest = findClosestShape(rawPos, 26);
        shapes.forEach(s => {
          if (s === closest) {
            s.svgEl.classList.add('shape-eraser-hover');
          } else {
            s.svgEl.classList.remove('shape-eraser-hover');
          }
        });
      } else if (currentTool === 'select') {
        clearFillPreview();
        hideLivePreview();
        const closest = findClosestShape(rawPos, 26);
        shapes.forEach(s => {
          if (s === closest && s !== selectedShape) {
            s.svgEl.classList.add('shape-select-hover');
          } else {
            s.svgEl.classList.remove('shape-select-hover');
          }
        });
      } else {
        clearShapeHoverEffects();
        const snapResult = findSnapPoint(rawPos);
        lastPointerPos = snapResult.point;
        updateSnapVisual(snapResult);
        clearFillPreview();
        updateLiveDrawingPreview(snapResult.point, rawPos);
      }
    });

    svgEl.addEventListener('pointerup', (e) => {
      e.preventDefault();
      if (!isPointerDragging) return;
      isPointerDragging = false;

      if (currentTool === 'fill' || currentTool === 'eraser' || currentTool === 'select') {
        return;
      }

      const rawPos = getSVGCoords(e);
      const snapResult = findSnapPoint(rawPos);
      const pos = snapResult.point;
      const dragDistance = Math.hypot(rawPos.x - dragStartRawPos.x, rawPos.y - dragStartRawPos.y);
      const DRAG_THRESHOLD = 14;

      if (dragDistance > DRAG_THRESHOLD) {
        // Drag gesture finished: Complete shape automatically!
        handleDragEnd(pos);
      } else {
        // Tap gesture: Step-by-step click mode
        handleTapStep(pos);
      }
    });

    svgEl.addEventListener('pointerleave', () => {
      document.getElementById('snapBreatheDot').style.display = 'none';
      document.getElementById('snapPulseRing').style.display = 'none';
      clearFillPreview();
      clearShapeHoverEffects();
      if (!isPointerDragging && stepPoints.length === 0) {
        hideLivePreview();
      }
    });

    /* ==========================================================================
       7. Construction Logic (Touch Drag Finish & Tap Step-by-Step)
       ========================================================================== */
    function handleDragEnd(pos) {
      if (currentTool === 'circle') {
        const center = stepPoints[0] || dragStartSnappedPos;
        const radius = Math.hypot(pos.x - center.x, pos.y - center.y);
        if (radius >= 6) {
          createCircleShape(center, radius);
          playSound('complete');
        }
        resetConstruction();
      } else if (currentTool === 'semicircle') {
        const center = stepPoints[0] || dragStartSnappedPos;
        const dx = pos.x - center.x;
        const dy = pos.y - center.y;
        const radius = Math.hypot(dx, dy);

        if (radius >= 6) {
          const p1 = { x: center.x + dy, y: center.y - dx };
          const p2 = { x: center.x - dy, y: center.y + dx };
          createArcShape(center, p1, p2, radius, true, 1, 0, pos);
          playSound('complete');
          showFlipPill();
        }
        resetConstruction();
      } else if (currentTool === 'line') {
        const p1 = stepPoints[0] || dragStartSnappedPos;
        const d = Math.hypot(pos.x - p1.x, pos.y - p1.y);
        if (d >= 6) {
          createLineShape(p1, pos);
          playSound('complete');
        }
        resetConstruction();
      } else if (currentTool === 'arc') {
        if (stepPoints.length === 1) {
          // Dragged to set radius and start point
          stepPoints.push(pos);
          showStartMarker(pos);
          playSound('step');
          updateStepHint();
        } else if (stepPoints.length === 2) {
          // Dragged along arc to set end point
          const [center, p1] = stepPoints;
          const radius = Math.hypot(p1.x - center.x, p1.y - center.y);
          const angle2 = Math.atan2(pos.y - center.y, pos.x - center.x);
          const p2 = {
            x: center.x + Math.cos(angle2) * radius,
            y: center.y + Math.sin(angle2) * radius
          };
          createArcShape(center, p1, p2, radius, false, currentSweepFlag, currentLargeArcFlag);
          playSound('complete');
          showFlipPill();
          resetConstruction();
        }
      }
    }

    function handleTapStep(pos) {
      if (currentTool === 'circle') {
        if (stepPoints.length === 1) {
          // If already has center and user tapped again
          const center = stepPoints[0];
          const radius = Math.hypot(pos.x - center.x, pos.y - center.y);
          if (radius >= 5) {
            createCircleShape(center, radius);
            playSound('complete');
            resetConstruction();
          }
        }
      } else if (currentTool === 'semicircle') {
        if (stepPoints.length === 1) {
          const center = stepPoints[0];
          const dx = pos.x - center.x;
          const dy = pos.y - center.y;
          const radius = Math.hypot(dx, dy);

          if (radius >= 5) {
            const p1 = { x: center.x + dy, y: center.y - dx };
            const p2 = { x: center.x - dy, y: center.y + dx };
            createArcShape(center, p1, p2, radius, true, 1, 0, pos);
            playSound('complete');
            showFlipPill();
            resetConstruction();
          }
        }
      } else if (currentTool === 'arc') {
        if (stepPoints.length === 1) {
          stepPoints.push(pos);
          showStartMarker(pos);
          playSound('step');
          updateStepHint();
        } else if (stepPoints.length === 2) {
          const [center, p1] = stepPoints;
          const radius = Math.hypot(p1.x - center.x, p1.y - center.y);
          const angle2 = Math.atan2(pos.y - center.y, pos.x - center.x);
          const p2 = {
            x: center.x + Math.cos(angle2) * radius,
            y: center.y + Math.sin(angle2) * radius
          };
          createArcShape(center, p1, p2, radius, false, currentSweepFlag, currentLargeArcFlag);
          playSound('complete');
          showFlipPill();
          resetConstruction();
        }
      } else if (currentTool === 'line') {
        if (stepPoints.length === 1) {
          const p1 = stepPoints[0];
          const d = Math.hypot(pos.x - p1.x, pos.y - p1.y);
          if (d >= 5) {
            createLineShape(p1, pos);
            playSound('complete');
            resetConstruction();
          }
        }
      }
    }

    function resetConstruction() {
      stepPoints = [];
      hideLivePreview();
      updateStepHint();
      rebuildKeySnapPoints();
    }

    /* Live Preview Construction */
    function updateLiveDrawingPreview(currentPos, rawPos) {
      const previewPath = document.getElementById('livePreviewPath');
      const radiusLine = document.getElementById('liveRadiusLine');
      const compassGroup = document.getElementById('compassGroup');
      const needlePin = document.getElementById('compassNeedlePin');
      const pencilArm = document.getElementById('compassArm');
      const pencilHead = document.getElementById('compassPencil');

      if (currentTool === 'circle') {
        if (stepPoints.length >= 1) {
          const center = stepPoints[0];
          const radius = Math.hypot(currentPos.x - center.x, currentPos.y - center.y);

          if (radius >= 3) {
            previewPath.setAttribute('d', `M ${center.x + radius} ${center.y} A ${radius} ${radius} 0 1 0 ${center.x - radius} ${center.y} A ${radius} ${radius} 0 1 0 ${center.x + radius} ${center.y}`);
            previewPath.style.display = 'block';

            radiusLine.setAttribute('x1', center.x);
            radiusLine.setAttribute('y1', center.y);
            radiusLine.setAttribute('x2', currentPos.x);
            radiusLine.setAttribute('y2', currentPos.y);
            radiusLine.style.display = 'block';

            needlePin.setAttribute('cx', center.x);
            needlePin.setAttribute('cy', center.y);
            pencilArm.setAttribute('x1', center.x);
            pencilArm.setAttribute('y1', center.y);
            pencilArm.setAttribute('x2', currentPos.x);
            pencilArm.setAttribute('y2', currentPos.y);
            pencilHead.setAttribute('cx', currentPos.x);
            pencilHead.setAttribute('cy', currentPos.y);
            compassGroup.style.display = 'block';
          }
        }
      } else if (currentTool === 'semicircle') {
        if (stepPoints.length >= 1) {
          const center = stepPoints[0];
          const midPt = currentPos;
          const dx = midPt.x - center.x;
          const dy = midPt.y - center.y;
          const radius = Math.hypot(dx, dy);

          if (radius >= 3) {
            const p1 = { x: center.x + dy, y: center.y - dx };
            const p2 = { x: center.x - dy, y: center.y + dx };

            const arcD = calculateArcPath(center, p1, p2, radius, 1, 0);
            previewPath.setAttribute('d', arcD);
            previewPath.style.display = 'block';

            radiusLine.setAttribute('x1', center.x);
            radiusLine.setAttribute('y1', center.y);
            radiusLine.setAttribute('x2', midPt.x);
            radiusLine.setAttribute('y2', midPt.y);
            radiusLine.style.display = 'block';

            needlePin.setAttribute('cx', center.x);
            needlePin.setAttribute('cy', center.y);
            pencilArm.setAttribute('x1', center.x);
            pencilArm.setAttribute('y1', center.y);
            pencilArm.setAttribute('x2', midPt.x);
            pencilArm.setAttribute('y2', midPt.y);
            pencilHead.setAttribute('cx', midPt.x);
            pencilHead.setAttribute('cy', midPt.y);
            compassGroup.style.display = 'block';
          }
        }
      } else if (currentTool === 'arc') {
        if (stepPoints.length === 1) {
          const center = stepPoints[0];
          const radius = Math.hypot(currentPos.x - center.x, currentPos.y - center.y);

          if (radius >= 3) {
            radiusLine.setAttribute('x1', center.x);
            radiusLine.setAttribute('y1', center.y);
            radiusLine.setAttribute('x2', currentPos.x);
            radiusLine.setAttribute('y2', currentPos.y);
            radiusLine.style.display = 'block';

            previewPath.setAttribute('d', `M ${center.x + radius} ${center.y} A ${radius} ${radius} 0 1 0 ${center.x - radius} ${center.y} A ${radius} ${radius} 0 1 0 ${center.x + radius} ${center.y}`);
            previewPath.style.display = 'block';

            needlePin.setAttribute('cx', center.x);
            needlePin.setAttribute('cy', center.y);
            pencilArm.setAttribute('x1', center.x);
            pencilArm.setAttribute('y1', center.y);
            pencilArm.setAttribute('x2', currentPos.x);
            pencilArm.setAttribute('y2', currentPos.y);
            pencilHead.setAttribute('cx', currentPos.x);
            pencilHead.setAttribute('cy', currentPos.y);
            compassGroup.style.display = 'block';
          }
        } else if (stepPoints.length === 2) {
          const center = stepPoints[0];
          const p1 = stepPoints[1];
          const radius = Math.hypot(p1.x - center.x, p1.y - center.y);

          const a1 = Math.atan2(p1.y - center.y, p1.x - center.x);
          const a2 = Math.atan2(currentPos.y - center.y, currentPos.x - center.x);

          let delta = a2 - a1;
          while (delta > Math.PI) delta -= 2 * Math.PI;
          while (delta < -Math.PI) delta += 2 * Math.PI;

          currentSweepFlag = delta >= 0 ? 1 : 0;
          currentLargeArcFlag = Math.abs(delta) > Math.PI ? 1 : 0;

          const p2 = {
            x: center.x + Math.cos(a2) * radius,
            y: center.y + Math.sin(a2) * radius
          };

          const arcD = calculateArcPath(center, p1, p2, radius, currentSweepFlag, currentLargeArcFlag);
          previewPath.setAttribute('d', arcD);
          previewPath.style.display = 'block';

          radiusLine.setAttribute('x1', center.x);
          radiusLine.setAttribute('y1', center.y);
          radiusLine.setAttribute('x2', p2.x);
          radiusLine.setAttribute('y2', p2.y);
          radiusLine.style.display = 'block';

          needlePin.setAttribute('cx', center.x);
