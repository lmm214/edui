<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>用圆设计图案</title>
  <style>
    :root {
      --bg-color: #FFFFFF;
      --panel-bg: rgba(255, 255, 255, 0.95);
      --panel-border: #E2E8F0;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --primary-light: #EEF2FF;
      --accent-blue: #3B82F6;
      --accent-green: #10B981;
      --accent-coral: #F43F5E;
      --accent-amber: #F59E0B;
      --canvas-bg: #FFFFFF;
      --base-circle: #1E293B;
      --guide-line: #94A3B8;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 6px 20px -2px rgba(15, 23, 42, 0.08);
      --radius-xl: 18px;
      --radius-lg: 12px;
      --radius-md: 8px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #FFFFFF;
      color: var(--text-main);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      touch-action: none;
    }

    /* Operation Hint Bar (Top Center - Minimal Single-Color Theme & Concise Text) */
    .step-hint-capsule {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #334155;
      border: 1px solid #E2E8F0;
      padding: 6px 16px;
      border-radius: var(--radius-full);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
      pointer-events: none;
      transition: all 0.2s ease;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #F1F5F9;
      color: #475569;
      font-size: 12px;
      font-weight: 700;
    }

    .step-dots {
      display: flex;
      gap: 4px;
    }

    .step-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #E2E8F0;
      transition: all 0.2s ease;
    }

    .step-dot.active {
      background: #475569;
      transform: scale(1.2);
    }

    .step-dot.done {
      background: #94A3B8;
    }

    /* Selection Floating Action Card */
    .selection-card {
      position: absolute;
      top: 64px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      z-index: 48;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #FFFFFF;
      border: 1.5px solid var(--primary);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.25);
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .selection-card.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
    }

    .selection-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      padding-right: 4px;
      border-right: 1px solid var(--panel-border);
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: none;
      background: transparent;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .action-btn.primary {
      background: var(--primary);
      color: #FFFFFF;
    }

    .action-btn.primary:hover {
      background: var(--primary-hover);
    }

    .action-btn.danger {
      background: #FEE2E2;
      color: #EF4444;
    }

    .action-btn.danger:hover {
      background: #FCA5A5;
      color: #B91C1C;
    }

    .action-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Floating Flip Pill for Touchscreen Quick Toggle */
    .flip-pill {
      position: absolute;
      top: 64px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      z-index: 45;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #FFFFFF;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      padding: 6px 16px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.2);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .flip-pill.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
    }

    .flip-pill:hover {
      background: var(--primary-light);
    }

    .flip-pill svg {
      width: 15px;
      height: 15px;
    }

    /* Primary Canvas Container & Dynamic Tool Cursors */
    .canvas-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      cursor: crosshair;
    }

    .canvas-container.tool-eraser,
    .canvas-container.tool-eraser #drawSvg {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="%23EF4444" stroke="%23FFFFFF" stroke-width="1.8"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>') 6 22, pointer !important;
    }

    .canvas-container.tool-fill,
    .canvas-container.tool-fill #drawSvg {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="%234F46E5" stroke="%23FFFFFF" stroke-width="1.5"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg>') 2 20, pointer !important;
    }

    .canvas-container.tool-select,
    .canvas-container.tool-select #drawSvg {
      cursor: default !important;
    }

    .canvas-container.tool-circle,
    .canvas-container.tool-semicircle,
    .canvas-container.tool-arc,
    .canvas-container.tool-line {
      cursor: crosshair !important;
    }

    .canvas-wrapper {
      position: relative;
      width: 90vmin;
      height: 90vmin;
      max-width: 900px;
      max-height: 900px;
    }

    /* Strict Circle Boundary Clipping for Canvases: 220 / 640 = 34.375% */
    #fillCanvas, #previewFillCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      clip-path: circle(34.375% at 50% 50%);
      -webkit-clip-path: circle(34.375% at 50% 50%);
    }

    #fillCanvas {
      z-index: 1;
    }

    #previewFillCanvas {
      z-index: 2;
      opacity: 0.7;
    }

    #drawSvg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      touch-action: none;
      z-index: 3;
    }

    /* Left Floating Tool Palette: [选择, 整圆, 半圆, 圆弧, 直尺, 涂色, 橡皮] */
    .left-palette {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 7px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      padding: 8px 6px;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
    }

    .tool-btn {
      width: 46px;
      height: 46px;
      border-radius: var(--radius-lg);
      border: 1.5px solid transparent;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tool-btn svg {
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }

    .tool-btn span {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .tool-btn:hover {
      background: #F1F5F9;
      color: var(--text-main);
    }

    .tool-btn.active {
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(79, 70, 229, 0.3);
    }

    /* Fill Tool Submenu (Stained Glass Auto Fill) */
    .fill-tool-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fill-submenu {
      position: absolute;
      left: calc(100% + 12px);
      top: 50%;
      transform: translateY(-50%) scale(0.9);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--primary);
      border-radius: var(--radius-full);
      box-shadow: 0 6px 24px rgba(79, 70, 229, 0.22);
      padding: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 60;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .fill-submenu.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(-50%) scale(1);
    }

    .submenu-btn {
      border: none;
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      color: #FFFFFF;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.15s ease;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
    }

    .submenu-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
    }

    .submenu-btn:active {
      transform: scale(0.97);
    }

    /* Right Palette - Colors & Undo/Redo */
    .right-palette {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      padding: 8px 6px;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      max-height: 92vh;
      overflow-y: auto;
    }

    .color-swatches {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .color-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #FFFFFF;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
      transition: all 0.15s ease;
      position: relative;
    }

    .color-dot:hover {
      transform: scale(1.15);
    }

    .color-dot.active {
      transform: scale(1.22);
      box-shadow: 0 0 0 2.5px var(--primary), 0 2px 6px rgba(0,0,0,0.2);
    }

    /* Custom Rainbow Color Swatch */
    .color-dot.custom-color-dot {
      background: conic-gradient(from 0deg, #FF0000, #FF7F00, #FFFF00, #00FF00, #00FFFF, #0000FF, #8B00FF, #FF0000);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .color-dot.custom-color-dot::after {
      content: '+';
      font-size: 13px;
      font-weight: 800;
      color: #FFFFFF;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      line-height: 1;
    }

    .palette-divider {
      width: 20px;
      height: 1px;
      background: var(--panel-border);
      margin: 2px auto;
    }

    /* Bottom Floating Division & Settings Bar (Center Bottom) */
    .bottom-bar {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .division-group {
      display: flex;
      align-items: center;
      background: #F1F5F9;
      border-radius: var(--radius-full);
      padding: 2px;
      gap: 2px;
    }

    .div-btn {
      border: none;
      background: transparent;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .div-btn.active {
      background: #FFFFFF;
      color: var(--primary);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .divider {
      width: 1px;
      height: 18px;
      background: var(--panel-border);
    }

    .icon-btn {
      border: none;
      background: transparent;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }

    .icon-btn:hover {
      background: #F1F5F9;
      color: var(--text-main);
    }

    .icon-btn.active {
      background: var(--primary-light);
      color: var(--primary);
    }

    .icon-btn svg {
      width: 17px;
      height: 17px;
      stroke-width: 2;
    }

    /* Bottom-Right Dedicated Action Capsule (Clear & Export) */
    .bottom-right-bar {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      padding: 6px 10px;
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    /* SVG Style Elements */
    .svg-base-circle {
      fill: none;
      stroke: #1E293B;
      stroke-width: 2.2px;
    }

    .svg-axis-line {
      stroke: #94A3B8;
      stroke-width: 1.2px;
      stroke-dasharray: 4 4;
    }

    .svg-radius-guide {
      stroke: #60A5FA;
      stroke-width: 1.5px;
      stroke-dasharray: 4 4;
    }

    .svg-preview-arc {
      fill: none;
      stroke: var(--primary);
      stroke-width: 2.4px;
      stroke-linecap: round;
      stroke-dasharray: 6 4;
      animation: dashMove 0.8s linear infinite;
    }

    @keyframes dashMove {
      to {
        stroke-dashoffset: -10;
      }
    }

    .svg-user-drawn {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s ease, filter 0.15s ease;
      cursor: pointer;
    }

    .svg-user-drawn:hover {
      filter: drop-shadow(0 0 4px rgba(79, 70, 229, 0.5));
    }

    /* Selected Shape Highlight */
    .svg-user-drawn.shape-selected {
      stroke: #4F46E5 !important;
      stroke-dasharray: 8 4 !important;
      animation: selectPulse 0.9s ease-in-out infinite alternate !important;
      filter: drop-shadow(0 0 6px rgba(79, 70, 229, 0.9)) !important;
    }

    /* Hover Glow when in Eraser Mode */
    .svg-user-drawn.shape-eraser-hover {
      stroke: #EF4444 !important;
      stroke-width: 4px !important;
      filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.9)) !important;
      transition: stroke 0.1s ease, filter 0.1s ease;
    }

    /* Hover Glow when in Select Mode */
    .svg-user-drawn.shape-select-hover {
      stroke: #6366F1 !important;
      stroke-width: 3.6px !important;
      filter: drop-shadow(0 0 6px rgba(99, 102, 241, 0.8)) !important;
    }

    @keyframes selectPulse {
      0% {
        stroke-width: 3px;
      }
      100% {
        stroke-width: 4.8px;
      }
    }

    .svg-snap-point {
      transition: transform 0.15s ease, opacity 0.15s ease;
      cursor: pointer;
    }

    /* Breathing Animated Midpoint / Keypoint Dot */
    @keyframes breatheGlow {
      0%, 100% {
        transform: scale(0.95);
        opacity: 0.88;
        filter: drop-shadow(0 0 3px rgba(59, 130, 246, 0.6));
      }
      50% {
        transform: scale(1.45);
        opacity: 1;
        filter: drop-shadow(0 0 9px rgba(59, 130, 246, 0.9));
      }
    }

    @keyframes snapPulseWave {
      0% {
        r: 6px;
        opacity: 0.9;
        stroke-width: 2.2px;
      }
      100% {
        r: 26px;
        opacity: 0;
        stroke-width: 0.5px;
      }
    }

    .snap-breathe-active {
      animation: breatheGlow 1.3s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .snap-ring-pulse {
      fill: none;
      stroke: #3B82F6;
      animation: snapPulseWave 1.3s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    .compass-needle {
      pointer-events: none;
    }

    /* Hide all snap points, breathe pulse dots, and guide axes/radii lines during Fill Mode */
    .mode-fill #guideAxes,
    .mode-fill #guideRadii,
    .mode-fill #snapPointsLayer,
    .mode-fill #snapPulseLayer,
    .mode-fill #liveOverlay,
    .mode-fill #liveClippedOverlay {
      display: none !important;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .step-hint-capsule {
        top: 10px;
        padding: 5px 12px;
        font-size: 13px;
        max-width: 90vw;
      }
      .left-palette {
        left: 8px;
        padding: 6px 4px;
        gap: 5px;
      }
      .tool-btn {
        width: 40px;
        height: 40px;
      }
      .right-palette {
        right: 8px;
        padding: 6px 4px;
        gap: 5px;
      }
      .bottom-bar {
        display: none !important;
      }
      .bottom-right-bar {
        bottom: 12px;
        right: 12px;
        padding: 4px 6px;
      }
    }
  </style>
</head>
<body>

  <!-- Prominent Operation Tip Capsule (Minimal Single-Color Palette & Concise Text) -->
  <div id="stepHint" class="step-hint-capsule">
    <span class="step-badge" id="stepBadge">1</span>
    <span id="stepText">确定圆心</span>
    <div class="step-dots" id="stepDots">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
    </div>
  </div>

  <!-- Selection Action Card (Flip opening direction / Delete) -->
  <div id="selectionCard" class="selection-card">
    <span id="selectionLabel" class="selection-label">已选中图形</span>
    <button id="btnFlipSelected" class="action-btn primary" onclick="flipSelectedShape()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
      <span>翻转开口方向</span>
    </button>
    <button class="action-btn danger" onclick="deleteSelectedShape()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      <span>删除</span>
    </button>
  </div>

  <!-- Flip Opening Quick Toggle Capsule (For Post-Draw Fast Adjust) -->
  <div id="flipPill" class="flip-pill" onclick="flipLastShape()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
    <span>🔄 点击翻转开口方向</span>
  </div>

  <!-- Left Floating Tool Palette: [整圆, 半圆, 圆弧, 直尺, 涂色, 选择, 橡皮] -->
  <div class="left-palette">
    <!-- 1. 整圆 (默认激活) -->
    <button class="tool-btn active" data-mode="circle" onclick="setTool('circle')" title="2点画整圆 (支持触屏拖拽或点击)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
      <span>整圆</span>
    </button>

    <!-- 2. 半圆 (2点画半圆：圆心 -> 弧中点) -->

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 14 A 8 8 0 0 1 20 14 Z"/></svg>
      <span>半圆</span>
    </button>

    <!-- 3. 圆弧 -->
    <button class="tool-btn" data-mode="arc" onclick="setTool('arc')" title="3点画圆弧 (支持触屏拖拽或点击)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19 A 15 15 0 0 1 19 4"/><circle cx="4" cy="19" r="2.5" fill="currentColor"/></svg>
      <span>圆弧</span>
    </button>

    <!-- 4. 直尺 -->
    <button class="tool-btn" data-mode="line" onclick="setTool('line')" title="直尺连线 (支持触屏拖拽或点击)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="5" y1="19" x2="19" y2="5"/><circle cx="5" cy="19" r="2" fill="currentColor"/><circle cx="19" cy="5" r="2" fill="currentColor"/></svg>
      <span>直尺</span>

    <!-- 5. 涂色 (带二级一键涂色) -->
    <div class="fill-tool-wrapper">
      <button class="tool-btn" id="toolBtnFill" data-mode="fill" onclick="handleFillBtnClick()" title="涂色桶 (选中状态再次点击开启一键涂色)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg>
        <span>涂色</span>
      </button>

    <!-- 6. 选中/选择工具 (移至橡皮上方) -->

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 3l7 18 3-7 7-3L3 3z"/><path d="M13 13l6 6"/></svg>
      <span>选择</span>

    <!-- 7. 橡皮 -->

      <span>橡皮</span>
    </button>

  <!-- Right Floating Palette (Expanded Colors + Rainbow Custom Picker + Undo/Redo) -->
  <div class="right-palette">

      <div class="color-dot active" style="background: #1E293B;" data-color="#1E293B" onclick="setColor('#1E293B')" title="墨黑"></div>

  <div class="canvas-container" id="canvasContainer">

          <!-- Clean Base Circle (R = 220) -->
          <circle id="baseCircle" cx="0" cy="0" r="220" fill="none" class="svg-base-circle" />

        <g id="shapesLayer" clip-path="url(#baseCircleClip)"></g>

        </g>
      </svg>
    </div>
  </div>
