<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="依据《义务教育数学课程标准（2022年版2025年修订）》整理的小学数学在线交互知识结构图。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23f5f8f7' stroke='%2339796b' stroke-width='4'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' fill='%2339796b'%3E%E6%95%B0%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <link href="//fontsapi.zeoseven.com/292/main/result.css" onload="this.rel='stylesheet'" rel="preload" as="style" crossorigin />
  <noscript><link rel="stylesheet" href="//fontsapi.zeoseven.com/292/main/result.css" /></noscript>
  <title>小学数学知识结构图</title>
</head>
<body class="h-screen overflow-hidden antialiased">
  <main class="grid h-screen grid-rows-[auto_minmax(0,1fr)]">
    <header class="topbar" aria-label="知识图谱导航与筛选">
      <div class="brand-group">
        <div class="brand-mark">数</div>
        <h1 class="brand-title">小学数学知识结构图</h1>
      </div>
      <div id="viewToggle" class="view-toggle" aria-label="视图切换">
        <button class="view-toggle-button active" data-view-mode="path">纵向路径</button>
        <button class="view-toggle-button" data-view-mode="map">知识图谱</button>
      </div>

      <nav class="domain-nav" aria-label="学习领域导航">
        <button class="domain-chip active" data-domain-filter="all"><i></i><span>全部</span><b>118</b></button>
        <button class="domain-chip" data-domain-filter="number"><i></i><span>数与代数</span><b>42</b></button>
        <button class="domain-chip" data-domain-filter="geometry"><i></i><span>图形与几何</span><b>46</b></button>
        <button class="domain-chip statistics-chip" data-domain-filter="statistics"><i></i><span>统计与概率</span><b>15</b></button>
        <button class="domain-chip" data-domain-filter="practice"><i></i><span>综合与实践</span><b>15</b></button>
      </nav>

      <div class="search-wrap">
        <svg class="pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="searchInput" class="search-input" type="search" placeholder="搜索知识点…" autocomplete="off" />
        <button id="searchClear" class="search-clear absolute right-1 top-1/2 grid size-7 -translate-y-1/2 place-items-center rounded-lg" aria-label="清空搜索">×</button>
      </div>
    </header>

    <section id="workspace" class="workspace relative min-h-0 overflow-hidden" data-mobile-view="path">
      <div id="mapViewport" class="map-viewport absolute inset-0 overflow-hidden" aria-label="小学数学知识结构图画布">
        <div id="mapWorld" class="map-world absolute left-0 top-0">
          <div class="world-heading">
            <div class="world-corner">
              <strong>知识进阶</strong>
              <span>由经验走向结构</span>
            </div>
            <div class="stage-head" data-stage="1"><b>第一学段</b><span>1—2 年级</span><em>直观感知 · 操作体验</em></div>
            <div class="stage-head" data-stage="2"><b>第二学段</b><span>3—4 年级</span><em>抽象表达 · 关系建构</em></div>
            <div class="stage-head" data-stage="3"><b>第三学段</b><span>5—6 年级</span><em>综合运用 · 初步推理</em></div>
          </div>
          <div id="mapContent" class="map-content"></div>
          <svg id="connectorLayer" class="connector-layer" aria-hidden="true"></svg>
          <svg id="connectorHighlightLayer" class="connector-layer connector-highlight-layer" aria-hidden="true"></svg>
        </div>
      </div>

      <section id="mobilePath" class="mobile-path" aria-label="纵向知识路径">
        <div id="mobilePathBody" class="mobile-path-body"></div>
      </section>

      <div class="canvas-hint pointer-events-none absolute bottom-3 left-3 hidden items-center gap-2 rounded-xl border px-3 py-2 text-xs backdrop-blur sm:flex"><kbd>拖动</kbd><span>浏览</span><kbd>滚轮 / 双指</kbd><span>缩放</span><kbd>Esc</kbd><span>清除聚焦</span></div>
      <button id="authorCard" class="author-card" type="button" aria-expanded="false" aria-label="显示微信公众号二维码">
        <span class="author-card-collapsed">
          <small>公众号</small>
          <span>「五木瞎折腾」出品</span>
        </span>
        <span class="author-card-expanded" aria-hidden="true">
          <strong>欢迎关注</strong>
          <img src="lmm214.jpg" alt="微信公众号「五木瞎折腾」二维码" draggable="false" />
        </span>
      </button>

      <div id="drawerBackdrop" class="drawer-backdrop absolute inset-0 z-30 opacity-0 backdrop-blur-[1px]"></div>
      <aside id="detailDrawer" class="detail-drawer absolute bottom-0 right-0 top-0 z-40 flex w-[min(420px,94vw)] flex-col border-l" aria-hidden="true" aria-label="知识点详情">
        <div class="drawer-header flex items-center justify-between border-b px-6 py-4">
          <span class="drawer-kicker text-xs font-medium tracking-[0.18em]">CURRICULUM SKETCH</span>
          <button id="drawerClose" class="drawer-close grid size-9 place-items-center rounded-xl text-2xl" aria-label="关闭详情">×</button>
        </div>
        <div id="drawerBody" class="drawer-body overflow-y-auto px-6 py-5"></div>
      </aside>

      <div id="copyToast" class="copy-toast" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="knowledge-data.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
