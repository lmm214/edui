<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="依据《义务教育数学课程标准（2022年版2025年修订）》整理的小学数学在线交互知识图。" />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23f5f8f7' stroke='%2339796b' stroke-width='4'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' fill='%2339796b'%3E%E6%95%B0%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css?v=202607311043" />
  <link href="https://fontsapi.zeoseven.com/292/main/result.css" onload="this.rel='stylesheet'" rel="preload" as="style"
    crossorigin />
  <noscript>
    <link rel="stylesheet" href="https://fontsapi.zeoseven.com/292/main/result.css" />
  </noscript>
  <title>小学数学知识结构图</title>
</head>

<body class="h-screen overflow-hidden antialiased">
  <main class="grid h-screen grid-rows-[auto_minmax(0,1fr)]">
    <header class="topbar" data-graph-mode="curriculum" aria-label="知识图谱导航与筛选">
      <div class="brand-group">
        <div class="brand-mark">数</div>
        <h1 class="brand-title">小学数学知识结构图</h1>
      </div>
      <div class="graph-control-cluster" aria-label="图谱模式切换">
        <div id="graphModeToggle" class="graph-mode-toggle" aria-label="图谱模式切换">
          <button class="graph-mode-button active" data-graph-mode="curriculum">课标知识图谱</button>
          <button class="graph-mode-button" data-graph-mode="textbook">教材单元图谱</button>
        </div>
        <div class="sub-toggles-row">
          <div id="viewToggle" class="view-toggle" aria-label="视图切换">
            <button class="view-toggle-button mobile-path-view-button" data-view-mode="path">纵向路径</button>
            <button class="view-toggle-button active" data-view-mode="map">结构画布</button>
            <button class="view-toggle-button" data-view-mode="relation">关系图谱</button>
          </div>
          <div id="textbookVersionToggle" class="textbook-version-toggle" aria-label="教材版本切换" aria-hidden="true">
            <button class="textbook-version-button active" data-textbook-version="pep">人教版</button>
            <button class="textbook-version-button" data-textbook-version="sujiao">苏教版</button>
            <button class="textbook-version-button" data-textbook-version="beishida">北师大版</button>
          </div>
        </div>
      </div>

      <nav class="domain-nav" aria-label="学习领域导航">
        <button class="domain-chip" data-domain-filter="number" aria-pressed="false"><i></i><span>数与代数</span></button>
        <button class="domain-chip" data-domain-filter="geometry"
          aria-pressed="false"><i></i><span>图形与几何</span></button>
        <button class="domain-chip" data-domain-filter="statistics"
          aria-pressed="false"><i></i><span>统计与概率</span></button>
        <button class="domain-chip" data-domain-filter="practice"
          aria-pressed="false"><i></i><span>综合与实践</span></button>
      </nav>

      <div class="search-wrap">
        <button id="searchToggle" class="search-toggle" type="button" aria-label="展开搜索" aria-expanded="false"
          aria-controls="searchInput">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-4-4" />
          </svg>
        </button>
        <input id="searchInput" class="search-input" type="search" placeholder="搜索知识点…" autocomplete="off"
          tabindex="-1" />
        <button id="searchClear"
          class="search-clear absolute right-1 top-1/2 grid size-7 -translate-y-1/2 place-items-center rounded-lg"
          aria-label="清空搜索">×</button>
      </div>
    </header>

    <section id="workspace" class="workspace relative min-h-0 overflow-hidden" data-mobile-view="path">
      <div id="mapViewport" class="map-viewport absolute inset-0 overflow-hidden" aria-label="小学数学知识结构图画布">
        <div id="mapWorld" class="map-world absolute left-0 top-0">
          <div class="world-heading">
            <div class="world-corner">
              <strong>知识进阶</strong>
              <span>由经验走向结构</span>
            </div>
            <div class="stage-head" data-stage="1"><b>第一学段</b><span>1—2 年级</span><em>直观感知 · 操作体验</em></div>
            <div class="stage-head" data-stage="2"><b>第二学段</b><span>3—4 年级</span><em>抽象表达 · 关系建构</em></div>
            <div class="stage-head" data-stage="3"><b>第三学段</b><span>5—6 年级</span><em>综合运用 · 初步推理</em></div>
          </div>
          <div id="mapContent" class="map-content"></div>
          <svg id="connectorLayer" class="connector-layer" aria-hidden="true"></svg>
          <svg id="connectorHighlightLayer" class="connector-layer connector-highlight-layer" aria-hidden="true"></svg>
        </div>
      </div>

      <section id="relationViewport" class="relation-viewport absolute inset-0" aria-label="小学数学中心关系图谱"
        aria-hidden="true">
        <div id="relationGraph" class="relation-graph"></div>
      </section>

      <section id="mobilePath" class="mobile-path" aria-label="纵向知识路径">
        <div id="mobilePathBody" class="mobile-path-body"></div>
      </section>

      <div
        class="canvas-hint pointer-events-none absolute bottom-3 left-3 hidden items-center gap-2 rounded-xl border px-3 py-2 text-sm backdrop-blur sm:flex">
        <kbd>拖动</kbd><span>浏览</span><kbd>双指</kbd><span>缩放</span></div>
      <button id="authorCard" class="author-card" type="button" aria-expanded="false" aria-label="显示微信公众号二维码">
        <span class="author-card-collapsed">
          <small>公众号</small>
          <span>「五木瞎折腾」出品</span>
        </span>
        <span class="author-card-expanded" aria-hidden="true">
          <strong>欢迎关注</strong>
          <img src="lmm214.jpg" alt="微信公众号「五木瞎折腾」二维码" draggable="false" />
        </span>
      </button>

      <aside id="detailDrawer"
        class="detail-drawer absolute bottom-0 right-0 top-0 z-40 flex w-[min(420px,94vw)] flex-col border-l"
        aria-hidden="true" aria-label="知识点详情">
        <div class="drawer-header flex items-center justify-between border-b px-6 py-4">
          <span class="drawer-kicker text-sm font-medium tracking-[0.18em]">知识点详情</span>
          <button id="drawerClose" class="drawer-close grid size-9 place-items-center rounded-xl text-2xl"
            aria-label="关闭详情">×</button>
        </div>
        <div id="drawerBody" class="drawer-body overflow-y-auto px-6 py-5"></div>
      </aside>

      <section id="curriculumTextbookOverlay" class="curriculum-overlay" role="dialog" aria-modal="true"
        aria-hidden="true" aria-label="课标与教材对应">
        <header class="curriculum-overlay-header">
          <button id="curriculumOverlayClose" class="curriculum-overlay-close" type="button"
            aria-label="关闭课标与教材对应页面">×</button>
        </header>
        <div class="curriculum-overlay-grid">
          <section class="curriculum-overlay-column curriculum-column" aria-labelledby="curriculumColumnTitle">
            <div class="curriculum-column-heading">
              <span>01</span>
              <div>
                <h3 id="curriculumColumnTitle">课标与知识点</h3>
                <p>完整课标依据与知识结构</p>
              </div>
            </div>
            <div id="curriculumOverlayBody" class="curriculum-column-body"></div>
          </section>
          <section class="curriculum-overlay-column textbook-column" aria-labelledby="textbookColumnTitle">
            <div class="curriculum-column-heading">
              <span>02</span>
              <div>
                <h3 id="textbookColumnTitle">教材对应内容</h3>
                <p>按版本、册次与单元核对</p>
              </div>
            </div>
            <div id="textbookOverlayBody" class="curriculum-column-body"></div>
          </section>
        </div>
      </section>

      <section id="textbookUnitOverlay" class="curriculum-overlay textbook-unit-overlay" role="dialog" aria-modal="true"
        aria-hidden="true" aria-label="教材单元学习链与版本对比">
        <header class="curriculum-overlay-header">
          <button id="textbookUnitOverlayClose" class="curriculum-overlay-close" type="button"
            aria-label="关闭教材单元详情页面">×</button>
        </header>
        <div class="textbook-unit-overlay-grid">
          <section class="curriculum-overlay-column textbook-unit-overview-column"
            aria-labelledby="textbookUnitOverviewTitle">
            <div class="curriculum-column-heading">
              <span>01</span>
              <div>
                <h3 id="textbookUnitOverviewTitle">教材单元详情</h3>
                <p>单元内容与课标落点</p>
              </div>
            </div>
            <div id="textbookUnitOverlayIntro" class="curriculum-column-body textbook-unit-overlay-intro"></div>
          </section>
          <section class="curriculum-overlay-column textbook-unit-related-column"
            aria-labelledby="textbookUnitRelatedTitle">
            <div class="curriculum-column-heading">
              <span>02</span>
              <div>
                <h3 id="textbookUnitRelatedTitle">学习链与版本对比</h3>
                <p>严格前后序列 · 同课标节点横向核对</p>
              </div>
            </div>
            <div id="textbookUnitOverlayRelated" class="curriculum-column-body textbook-unit-overlay-related"></div>
          </section>
        </div>
      </section>

      <div id="copyToast" class="copy-toast" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="knowledge-data.js?v=202607311043" defer></script>
  <script src="textbook-data.js?v=202607311043" defer></script>
  <script src="app.js?v=202607311043" defer></script>
</body>

</html>
