<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>经纬度与地球定位</title>
  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>

  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent-lat: #ef4444;
      /* 纬线颜色：同赤道红 */
      --accent-lng: #06b6d4;
      /* 经线颜色：同子午线青蓝 */
      --accent-target: #ef4444;
      /* 定位红 */
      --bg-glass: rgba(15, 23, 42, 0.88);
      --border-glass: rgba(255, 255, 255, 0.2);
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: #030712;
      color: var(--text-main);
    }

    #webgl-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* UI Overlay Layer */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    .interactive-element {
      pointer-events: auto;
    }

    /* 1. 左侧大字清晰面板 (专为教室大屏后排学生优化，宽度 155px) */
    .left-control-panel {
      position: absolute;
      top: 50%;
      left: 20px;
      transform: translateY(-50%);
      width: 155px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 20;
      animation: fadeInLeft 0.5s ease-out;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }

    .left-control-panel::-webkit-scrollbar {
      width: 4px;
    }

    .left-control-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
    }

    .panel-section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #93c5fd;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 6px;
    }

    /* 单列按钮网格 (放大字号) */
    .single-col-grid {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .preset-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #ffffff;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      width: 100%;
    }

    .preset-btn:hover {
      background: rgba(59, 130, 246, 0.35);
      border-color: #3b82f6;
    }

    .preset-btn.active {
      background: #2563eb;
      border-color: #60a5fa;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.6);
    }

    .toggle-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 8px 10px;
      color: #e2e8f0;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      transition: all 0.2s ease;
      width: 100%;
    }

    .toggle-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .toggle-btn.active {
      background: rgba(16, 185, 129, 0.25);
      border-color: #10b981;
      color: #6ee7b7;
    }

    /* 2. 底部横向经度滑块 (大字号) ↔️ */
    .longitude-bar-bottom {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 480px;
      /* 桌面端避开左侧面板(190px)和右侧纬度栏(100px) */
      max-width: calc(100vw - 300px);
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 12px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 20;
      animation: fadeInUp 0.5s ease-out;
    }

    .bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .bar-header .bar-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .bar-header.lng .bar-title {
      color: var(--accent-lng);
    }

    .bar-header.lat .bar-title {
      color: var(--accent-lat);
    }

    .horizontal-slider-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-end-label {
      font-size: 0.88rem;
      color: #cbd5e1;
      font-weight: 700;
    }

    input[type="range"].horizontal-range {
      flex: 1;
      height: 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.25);
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    input[type="range"].horizontal-range::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    input[type="range"].horizontal-range::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    /* 3. 右侧纵向纬度滑块 (大字号) ↕️ */
    .latitude-bar-right {
      position: absolute;
      top: 50%;
      right: 24px;
      transform: translateY(-50%);
      height: 420px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 20;
      animation: fadeInRight 0.5s ease-out;
    }

    .vertical-slider-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
    }

    input[type="range"].vertical-range {
      writing-mode: vertical-lr;
      direction: rtl;
      width: 10px;
      height: 280px;
      accent-color: var(--accent-lat);
      cursor: pointer;
    }

    .icon-svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    @keyframes fadeInLeft {
      from {
        opacity: 0;
        transform: translate(-20px, -50%);
      }

      to {
        opacity: 1;
        transform: translate(0, -50%);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translate(-50%, 20px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    @keyframes fadeInRight {
      from {
        opacity: 0;
        transform: translate(20px, -50%);
      }

      to {
        opacity: 1;
        transform: translate(0, -50%);
      }
    }

    /* ===== 手机/窄屏响应式布局 ===== */
    @media (max-width: 768px) {

      /* 左侧面板：手机上隐藏（内容移到顶部横向栏） */
      .left-control-panel {
        display: none;
      }

      /* 手机端顶部地标栏显示 */
      .top-landmark-bar {
        display: flex !important;
      }

      /* 底部经度栏：宽度撑满，底部稍微上移给双滑块 */
      .longitude-bar-bottom {
        width: calc(100vw - 16px);
        bottom: 86px;
        /* 腾出空间给纬度栏 */
        max-width: none;
      }

      /* 纬度竖向滑块：手机上改为水平底部栏 */
      .latitude-bar-right {
        display: none !important;
      }

      .latitude-bar-bottom-mobile {
        display: flex !important;
      }
    }

    /* 桌面端：左侧面板完整显示（地标+视图开关），靠近顶部地标栏隐藏 */
    @media (min-width: 769px) {
      .left-landmark-section {
        display: block;
        /* 桌面端保留左侧地标区 */
      }

      .top-landmark-bar {
        display: none !important;
        /* 桌面端隐藏顶部地标栏 */
      }
    }

    /* 顶部地标横向滚动栏（默认隐藏，仅手机显示） */
    .top-landmark-bar {
      display: none;
      position: absolute;
      top: 12px;
      left: 8px;
      right: 8px;
      flex-wrap: nowrap;
      /* 强制单行不换行 */
      gap: 8px;
      overflow-x: auto;
      /* 超出可横向滚动 */
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 0 4px 4px;
      z-index: 30;
      /* 加毛玻璃背景，让按钮在地球上不迷失 */
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 0 0 14px 14px;
    }

    .top-landmark-bar::-webkit-scrollbar {
      display: none;
    }

    .top-landmark-bar .preset-btn {
      flex-shrink: 0;
      /* 不压缩，保证每个按钮完整显示 */
      flex-grow: 0;
      width: auto;
      /* 覆盖全局 width: 100% */
      font-size: 0.88rem;
      padding: 7px 14px;
      white-space: nowrap;
    }

    /* 底部纬度水平栏（仅手机显示） */
    .latitude-bar-bottom-mobile {
      display: none;
      position: absolute;
      bottom: 10px;
      left: 8px;
      right: 8px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      padding: 10px 16px;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 20;
    }

    /* 坐标信息 HTML Overlay (比 3D Sprite 定位更准确可靠) */
    #coord-overlay {
      position: absolute;
      pointer-events: none;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      transform: translate(-50%, -100%);
      background: rgba(15, 23, 42, 0.96);
      border: 2px solid rgba(56, 189, 248, 0.85);
      border-radius: 12px;
      padding: 9px 16px;
      min-width: 170px;
      max-width: 260px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.8);
      transition: opacity 0.2s ease;
    }

    #coord-overlay .coord-lng {
      font-size: 1.15rem;
      font-weight: 700;
      color: #38bdf8;
      white-space: nowrap;
      letter-spacing: 0.01em;
    }

    #coord-overlay .coord-lat {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ef4444;
      white-space: nowrap;
      letter-spacing: 0.01em;
    }

    /* 引线 SVG 绑定到地球定位点 */
    #coord-leader-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 49;
      overflow: visible;
    }

    #coord-leader-svg line {
      stroke: #38bdf8;
      stroke-width: 1.2;
      stroke-dasharray: 4 3;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <!-- 3D WebGL Canvas -->
  <div id="webgl-container"></div>

  <!-- UI Overlay Layer -->
  <div class="ui-layer">

    <!-- 1. 左侧大字单列面板 (教室大屏优化) -->
    <div class="left-control-panel interactive-element">
      <div class="left-landmark-section">
        <div class="panel-section-title">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" />
          </svg>
          选择地标
        </div>
        <div class="single-col-grid">
          <button class="preset-btn" onclick="setPreset(116.4, 39.9, '北京', this)">
            <span>🇨🇳 北京</span>
          </button>
          <button class="preset-btn" onclick="setPreset(121.5, 31.2, '上海', this)">
            <span>🇨🇳 上海</span>
          </button>
          <button class="preset-btn" onclick="setPreset(113.3, 23.1, '广州', this)">
            <span>🇨🇳 广州</span>
          </button>
          <button class="preset-btn" onclick="setPreset(91.1, 29.7, '布达拉宫', this)">
            <span>🇨🇳 布达拉宫</span>
          </button>
          <button class="preset-btn" onclick="setPreset(89.2, 42.9, '吐鲁番', this)">
            <span>🇨🇳 吐鲁番</span>
          </button>
          <button class="preset-btn" onclick="setPreset(121.5, 29.9, '宁波', this)">
            <span>🇨🇳 宁波</span>
          </button>
        </div>
      </div>
    </div>


    <!-- 2. 底部横向经度滑块 ↔️ -->
    <div class="longitude-bar-bottom interactive-element">
      <div class="bar-header lng">
        <span class="bar-title">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z" />
          </svg>
          经度
        </span>
      </div>
      <div class="horizontal-slider-wrapper">
        <span class="slider-end-label">180°W</span>
        <input type="range" id="lng-slider" class="horizontal-range" min="-180" max="180" step="0.1" value="0">
        <span class="slider-end-label">180°E</span>
      </div>
    </div>

    <!-- 3. 右侧纵向纬度滑块 ↕️ -->
    <div class="latitude-bar-right interactive-element">
      <div class="bar-header lat" style="flex-direction: column; align-items: center; gap: 4px;">
        <span class="bar-title">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <path
              d="M12 5.83L15.17 9l1.41-1.41L12 2 7.41 7.59 8.83 9 12 5.83zm0 12.34L8.83 15l-1.41 1.41L12 22l4.59-5.59L15.17 15 12 18.17z" />
          </svg>
          纬度
        </span>
      </div>
      <div class="vertical-slider-container">
        <span class="slider-end-label">90°N</span>
        <input type="range" id="lat-slider" class="vertical-range" min="-90" max="90" step="0.1" value="0">
        <span class="slider-end-label">90°S</span>
      </div>
    </div><!-- /latitude-bar-right -->

    <!-- 手机端顶部横向地标快捷栏 -->
    <div class="top-landmark-bar interactive-element">

      <button class="preset-btn" onclick="setPreset(116.4, 39.9, '北京', this)">🇨🇳 北京</button>
      <button class="preset-btn" onclick="setPreset(121.5, 31.2, '上海', this)">🇨🇳 上海</button>
      <button class="preset-btn" onclick="setPreset(113.3, 23.1, '广州', this)">🇨🇳 广州</button>
      <button class="preset-btn" onclick="setPreset(91.1, 29.7, '布达拉宫', this)">🇨🇳 布达拉宫</button>
      <button class="preset-btn" onclick="setPreset(89.2, 42.9, '吐鲁番', this)">🇨🇳 吐鲁番</button>
      <button class="preset-btn" onclick="setPreset(121.5, 29.9, '宁波', this)">🇨🇳 宁波</button>
    </div>

    <!-- 手机端底部纬度水平滑块栏 -->
    <div class="latitude-bar-bottom-mobile interactive-element">
      <div class="bar-header lat" style="margin-bottom:0">
        <span class="bar-title">纬度</span>
      </div>
      <div class="horizontal-slider-wrapper">
        <span class="slider-end-label">90°S</span>
        <input type="range" id="lat-slider-mobile" class="horizontal-range" min="-90" max="90" step="0.1" value="0"
          style="accent-color:#ef4444">
        <span class="slider-end-label">90°N</span>
      </div>
    </div>

    <!-- HTML 坐标浮层 Overlay（替代 3D Sprite，更精准不错位） -->
    <svg id="coord-leader-svg">
      <line id="coord-leader-line" x1="0" y1="0" x2="0" y2="0" />
    </svg>
    <div id="coord-overlay">
      <span class="coord-lng" id="coord-lng-text">经度 0°</span>
      <span class="coord-lat" id="coord-lat-text">纬度 0°</span>
    </div>

  </div>
