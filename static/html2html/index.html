<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五木极简 HTML 编辑器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Center Welcome View - No Border, Pure Light Style -->
    <main class="welcome-view" id="welcome-view">
      <div class="welcome-icon">
        <svg class="lucide-icon" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
          <polyline points="14 2 14 8 20 8"/>
          <path d="m10 13-2 2 2 2"/>
          <path d="m14 13 2 2-2 2"/>
        </svg>
      </div>
      <h1 class="welcome-title">五木极简 HTML 编辑器</h1>
      <p class="welcome-desc" style="text-align: left; line-height: 2;">
        ① 拖拽 HTML 文件或完整文件夹。<br>
        ② 载入后点击或双击页面中任意文字、标题。<br>
        ③ 即可原位排版与保存导出副本。
      </p>
      <div class="welcome-actions">
        <button class="btn btn-primary" id="btn-select-file">
          <svg class="lucide-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><polyline points="14 2 14 8 20 8"/><line x1="10" x2="14" y1="13" y2="13"/><line x1="10" x2="14" y1="17" y2="17"/></svg>
          选择单文件
        </button>
        <button class="btn btn-secondary" id="btn-select-dir">
          <svg class="lucide-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L8.6 3.3A2 2 0 0 0 6.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          选择文件夹
        </button>
      </div>
    </main>

    <!-- Fullscreen HTML Viewport -->
    <iframe id="preview-iframe" title="HTML Preview"></iframe>

    <!-- Floating Draggable Control Panel - Default Bottom Right Corner -->
    <div class="floating-panel" id="floating-panel">
      <div class="panel-header" id="panel-drag-handle">
        <div class="panel-title">
          <svg class="lucide-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span>网页排版编辑器</span>
        </div>
        <span class="panel-drag-icon">
          <svg class="lucide-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>
        </span>
      </div>

      <div class="panel-section">
        <div class="undo-redo-row">
          <button class="btn-panel btn-undo" id="btn-undo" title="撤销 (Ctrl+Z)" disabled>
            <svg class="lucide-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
            撤销
          </button>
          <button class="btn-panel btn-redo" id="btn-redo" title="重做 (Ctrl+Shift+Z)" disabled>
            <svg class="lucide-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"/></svg>
            重做
          </button>
        </div>
      </div>
      <div class="panel-section">
        <div class="panel-section-title">核心操作</div>
        <div class="action-grid">
          <button class="btn-panel btn-panel-primary" id="btn-save-copy" title="另存为带时间戳的 HTML 副本 (Ctrl+S)">
            <svg class="lucide-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a1 1 0 0 1 .7.3l4.8 4.8a1 1 0 0 1 .3.7V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            另存副本
          </button>
          <button class="btn-panel" id="btn-export-zip" title="打包导出带时间戳的 ZIP 压缩包">
            <svg class="lucide-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
            导出 ZIP
          </button>
          <button class="btn-panel" id="btn-open-file" title="切换打开新文件或文件夹">
            <svg class="lucide-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.27 10H20a2 2 0 0 1 1.94 2.5l-1.55 6A2 2 0 0 1 18.45 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.69.9H18a2 2 0 0 1 2 2v2"/></svg>
            打开文件
          </button>
        </div>
      </div>
    </div>

    <!-- Hidden File Inputs -->
    <input type="file" id="input-file" accept=".html,.htm" style="display: none;" />
    <input type="file" id="input-dir" webkitdirectory style="display: none;" />

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>
  </div>

  <script src="jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
