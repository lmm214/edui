<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>圆周角定理探索</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none !important;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }

    *:focus, *:active {
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background-color: #F4F3EC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #1e1e1e;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
      background-color: #F4F3EC;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* 主圆与圆心 */
    .circle-main {
      fill: none;
      stroke: #1a1a1a;
      stroke-width: 2.8px;
    }

    .center-dot {
      fill: #eb5757;
      stroke: none;
    }

    /* 连接线段 (原直径线) */
    .line-diameter {
      stroke: #777267;
      stroke-width: 1.8px;
      stroke-dasharray: 5 4;
      stroke-linecap: round;
      display: none;
    }

    /* 射线线条 */
    .line-ray {
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.1s ease, stroke-width 0.1s ease;
    }

    .line-ray.highlight {
      stroke: #FF6B00 !important;
      stroke-width: 2.8px !important;
    }

    /* 角标记 (圆弧与直角折线) - 纯描边，无填充 */
    .angle-mark-path {
      fill: none !important;
      stroke-width: 2.2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      cursor: pointer;
      pointer-events: none;
      transition: stroke-width 0.15s ease;
    }

    .angle-group:hover .angle-mark-path {
      stroke-width: 3px;
    }

    .angle-mark-path.highlight {
      stroke: #FF6B00 !important;
      stroke-width: 2.8px !important;
    }

    .angle-arc-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 36px;
      cursor: pointer;
      pointer-events: all;
      -webkit-tap-highlight-color: transparent !important;
    }

    /* 角数字专用透明大触控区 */
    .label-hit-zone {
      fill: transparent;
      cursor: pointer;
      pointer-events: all;
      -webkit-tap-highlight-color: transparent !important;
    }

    /* 角度文字：不加粗、无阴影 */
    .angle-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 24px;
      font-weight: 400;
      text-anchor: middle;
      dominant-baseline: central;
      cursor: pointer;
      filter: none !important;
      -webkit-tap-highlight-color: transparent !important;
      transition: fill 0.1s ease;
    }

    .angle-label.highlight {
      fill: #FF6B00 !important;
    }

    .angle-group:hover .angle-label {
      filter: none !important;
    }

    /* 顶点控制柄 - 白色实心填充遮挡射线，小巧精致 */
    .vertex-handle {
      fill: #ffffff !important;
      stroke-width: 2px;
      cursor: grab;
      touch-action: none;
      transition: stroke 0.12s ease, stroke-width 0.12s ease;
    }

    .vertex-handle:hover {
      fill: #ffffff !important;
      stroke-width: 2.8px;
    }

    .vertex-handle.dragging {
      cursor: grabbing;
      fill: #ffffff !important;
      stroke: #FF6B00 !important;
      stroke-width: 2.8px !important;
    }

    /* 端点 A、B 小圆控制柄 - 白色实心填充，小巧精致 */
    .point-ab-handle {
      fill: #ffffff !important;
      stroke: #1a1a1a;
      stroke-width: 2px;
      cursor: grab;
      touch-action: none;
      transition: stroke 0.12s ease, stroke-width 0.12s ease;
    }

    .point-ab-handle:hover {
      fill: #ffffff !important;
      stroke: #FF6B00;
      stroke-width: 2.8px;
    }

    .point-ab-handle.dragging {
      cursor: grabbing;
      fill: #ffffff !important;
      stroke: #FF6B00 !important;
      stroke-width: 2.8px !important;
    }

    .touch-hit-zone {
      fill: transparent;
      cursor: grab;
      pointer-events: all;
      touch-action: none;
      -webkit-tap-highlight-color: transparent !important;
    }

    .touch-hit-zone.dragging {
      cursor: grabbing;
    }

    .math-point-label {
      font-family: "STIX Two Math", "KaTeX_Math", "Times New Roman", "Cambria Math", serif;
      font-style: italic;
      font-size: 34px;
      fill: #1a1a1a;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    /* 右侧等式 (∠1=____, ∠2=____, ∠3=____) */
    .equation-group {
      cursor: pointer;
      transition: opacity 0.2s ease;
      -webkit-tap-highlight-color: transparent !important;
    }

    .equation-group:hover {
      opacity: 0.82;
    }

    .angle-sym-text {
      font-family: "STIX Two Math", "Times New Roman", serif;
      font-size: 44px;
      dominant-baseline: central;
      font-weight: 400;
    }

    .underline-bar {
      stroke-width: 2px;
      stroke-linecap: square;
    }

    .val-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 34px;
      font-weight: 400;
      dominant-baseline: central;
      text-anchor: middle;
      filter: none !important;
    }

    /* 左下角精简操作提示 */
    .bottom-left-hint {
      position: absolute;
      bottom: 24px;
      left: 24px;
      font-size: 13px;
      color: #8c897f;
      letter-spacing: 0.3px;
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      line-height: 1.4;
      pointer-events: none;
    }

    /* 右下角外层包装容器 */
    .bottom-right-wrapper {
      position: absolute;
      bottom: 22px;
      right: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 9px;
      pointer-events: auto;
      z-index: 100;
    }

    /* 极简画笔悬浮工具栏 (直接显示在按钮正上方) */
    .pen-toolbox {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid #dcd9cf;
      border-radius: 8px;
      padding: 4px 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      pointer-events: auto;
    }

    .pen-tool-btn {
      width: 27px;
      height: 27px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 5px;
      color: #555;
      cursor: pointer;
      transition: all 0.12s ease;
      padding: 0;
      -webkit-tap-highlight-color: transparent !important;
    }

    .pen-tool-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .pen-tool-btn:hover {
      background: rgba(0, 0, 0, 0.05);
      color: #111;
    }

    .pen-tool-btn.active {
      background: #1e1e1e;
      color: #ffffff;
      border-color: #1e1e1e;
    }

    .tool-sep {
      width: 1px;
      height: 15px;
      background: #e2dfd6;
      margin: 0 2px;
    }

    .panel-v-line {
      width: 1px;
      height: 15px;
      background: #d5d3c8;
      margin: 0 2px;
    }

    .pen-colors {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .color-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: var(--c);
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      -webkit-tap-highlight-color: transparent !important;
    }

    .color-dot:hover {
      transform: scale(1.18);
    }

    .color-dot.active {
      transform: scale(1.22);
      box-shadow: 0 0 0 1.5px #ffffff inset, 0 0 0 1.5px #1e1e1e;
    }

    /* 右下角常规操作按钮栏 */
    .bottom-right-panel {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
    }

    .angles-panel .pill-btn {
      min-width: 48px;
      text-align: center;
    }

    .pill-btn {
      background: transparent;
      border: 1px solid #d5d3c8;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12.5px;
      font-weight: 500;
      color: #555555;
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-tap-highlight-color: transparent !important;
    }

    .pill-btn:hover {
      border-color: #9e9c90;
      color: #111111;
      background-color: rgba(0, 0, 0, 0.02);
    }

    .pill-btn.active {
      background: #1e1e1e;
      color: #ffffff;
      border-color: #1e1e1e;
    }

    .pill-btn:active {
      transform: translateY(1px);
    }

    @media (max-width: 768px) {
      .bottom-left-hint {
        bottom: 14px;
        left: 14px;
        font-size: 11px;
      }
      .bottom-right-wrapper {
        bottom: 14px;
        right: 14px;
        gap: 6px;
      }
      .pen-toolbox {
        padding: 3px 6px;
        gap: 4px;
      }
      .pen-tool-btn {
        width: 24px;
        height: 24px;
      }
      .color-dot {
        width: 14px;
        height: 14px;
      }
      .pill-btn {
        padding: 4px 7px;
        font-size: 11.5px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <svg id="svgCanvas" viewBox="0 0 1100 700">
      <!-- 1. 连接线段 AB (底层) -->
      <line id="diameterLine" class="line-diameter" />

      <!-- 2. 主圆 -->
      <circle id="mainCircle" class="circle-main" />

      <!-- 3. 圆心红色小点 (无字母标记) -->
      <circle id="centerDot" class="center-dot" r="3.5" />

      <!-- 4. 各角射线层 (位于端点和控制柄下方) -->
      <g id="raysLayer"></g>

      <!-- 5. 极简画笔事件捕获层 (覆盖全屏背景，位于控制点手柄与可点击文字下方) -->
      <rect id="drawingOverlay" width="1100" height="700" fill="transparent" style="display: none; cursor: default; pointer-events: all; touch-action: none; -webkit-tap-highlight-color: transparent !important;" />

      <!-- 6. 各角弧度与标记层 -->
      <g id="marksLayer"></g>

      <!-- 7. 端点 A、B (白色填充覆盖射线，位于射线上层) -->
      <g id="pointsABGroup">
        <!-- 点 A -->
        <g id="groupA">
          <circle id="handleA" class="point-ab-handle" r="4.2" />
          <circle id="touchA" class="touch-hit-zone" r="32" />
          <text id="labelA" class="math-point-label">A</text>
        </g>
        <!-- 点 B -->
        <g id="groupB">
          <circle id="handleB" class="point-ab-handle" r="4.2" />
          <circle id="touchB" class="touch-hit-zone" r="32" />
          <text id="labelB" class="math-point-label">B</text>
        </g>
      </g>

      <!-- 8. 动态顶点控制柄层 (白色实心填充，位于射线之上) -->
      <g id="vertexHandlesGroup"></g>

      <!-- 9. 右侧等式组 (∠1=____, ∠2=____, ∠3=____) -->
      <g id="equationsGroup"></g>

      <!-- 10. 极简画笔笔迹渲染层 (置于最顶层，只渲染笔迹，不截获事件) -->
      <g id="drawingsLayer" pointer-events="none"></g>
    </svg>

    <!-- 左下角操作提示 -->
    <div class="bottom-left-hint">
      拖动圆上顶点或端点 A、B · 点击角符号或右侧等式显示角度
    </div>

    <!-- 右下角外层包装容器 (3行布局) -->
    <div class="bottom-right-wrapper">
      <!-- 第一行：画笔工具 (默认不选中画笔) -->
      <div id="penToolbox" class="pen-toolbox">
        <button id="toolPenBtn" class="pen-tool-btn" data-type="pen" title="画笔">
          <svg viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
        </button>
        <button id="toolEraserBtn" class="pen-tool-btn" data-type="eraser" title="橡皮擦">
          <svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
        </button>

        <div class="tool-sep"></div>

        <div class="pen-colors">
          <button class="color-dot active" data-color="#D9383A" style="--c: #D9383A;" title="红色"></button>
          <button class="color-dot" data-color="#1E1E1E" style="--c: #1E1E1E;" title="黑色"></button>
        </div>
      </div>

      <!-- 第二行：角1、2、3 -->
      <div class="bottom-right-panel angles-panel">
        <button id="toggleAngle1Btn" class="pill-btn active">角1</button>
        <button id="toggleAngle2Btn" class="pill-btn active">角2</button>
        <button id="toggleAngle3Btn" class="pill-btn active">角3</button>
      </div>

      <!-- 第三行：显示线段和重置 -->
      <div class="bottom-right-panel actions-panel">
        <button id="toggleDiameterBtn" class="pill-btn" title="显示/隐藏线段 AB">显示线段</button>
        <button id="resetBtn" class="pill-btn">重置</button>
      </div>
    </div>
  </div>
