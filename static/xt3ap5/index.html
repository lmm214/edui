<html lang="zh-CN">

<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            background-color: #ffffff;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            user-select: none;
            touch-action: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 12px 20px 16px;
            gap: 4px;
        }

        #question-bar {
            width: 100%;
            max-width: 1440px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.8rem, 2.5vw, 2.6rem);
            color: #1a1a1a;
            font-family: 'KaiTi', 'STKaiti', 'Songti SC', 'SimSun', serif;
            font-weight: normal;
            letter-spacing: 0.5px;

            gap: 6px 12px;
            margin-bottom: 0;
            line-height: 1.2;
            text-align: center;
            margin-top: 5rem;
        }

        .badge-wrap {
            display: inline-flex;
            align-items: center;
            position: relative;
            margin-right: 8px;
        }

        .badge-star {
            position: absolute;
            top: -14px;
            left: -18px;
            color: #0088cc;
            font-size: 24px;
            font-weight: bold;
            font-family: sans-serif;
        }

        .badge-num {
            width: 46px;
            height: 46px;
            background-color: #0084c7;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.35em;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            line-height: 1;
        }

        .title-cuboid {
            width: 175px;
            height: 87px;
            display: inline-block;
            vertical-align: middle;
            margin: 0 4px;
        }

        .title-cylinder {
            width: 20px;
            height: 48px;
            display: inline-block;
            vertical-align: middle;
            margin: 0 4px;
        }

        #container {
            width: 100%;
            max-width: 1440px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            gap: 16px;
            padding: 0;
            margin-top: 10px;
        }

        @media (max-width: 1080px) {
            #question-bar {
                font-size: clamp(1.4rem, 2.6vw, 1.8rem);
            }

            .title-cuboid {
                width: 160px;
                height: 81px;
            }

            .title-cylinder {
                width: 19px;
                height: 46px;
            }

            #container {
                flex-wrap: wrap;
                gap: 12px;
                margin-top: 6px;
                overflow-y: auto;
            }
        }

        .shape-card {
            flex: 1 1 22%;
            min-width: 200px;
            max-width: 340px;
            height: 310px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            cursor: grab;
        }

        .shape-card:active {
            cursor: grabbing;
        }

        .shape-card svg {
            width: 100%;
            height: 250px;
            overflow: visible;
        }

        .shape-label {
            font-size: 36px;
            font-weight: normal;
            color: #111;
            font-family: 'Times New Roman', 'SimSun', 'Songti SC', serif;
            margin-top: 0px;
            line-height: 1;
            user-select: none;

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

    <!-- 顶部教材题目栏 -->
    <div id="question-bar">
        <span class="badge-wrap">
            <span class="badge-star">✻</span>
            <span class="badge-num">5</span>
        </span>
        <span>下面的物体都是由</span>
        <svg class="title-cuboid" viewBox="-215 -112 430 218">
            <!-- 1. 长方体顶面 (Top Face) -->
            <polygon points="-210,-10 -105,-108 210,-108 105,-10" fill="rgb(255, 228, 214)" stroke="#000"
                stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
            <!-- 2. 长方体右侧面 (Right Face) -->
            <polygon points="105,-10 210,-108 210,2 105,100" fill="rgb(255, 204, 180)" stroke="#000" stroke-width="2.6"
                stroke-linejoin="round" stroke-linecap="round" />
            <!-- 3. 长方体主正面 (Front Face) -->
            <polygon points="-210,-10 105,-10 105,100 -210,100" fill="rgb(255, 245, 240)" stroke="#000"
                stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
        </svg>
        <span>和</span>
        <svg class="title-cylinder" viewBox="-25 -60 50 120">
            <!-- 圆柱侧面 -->
            <path d="M -22.5 -47.5 L -22.5 47.5 A 22.5 10 0 0 0 22.5 47.5 L 22.5 -47.5 Z" fill="rgb(168, 221, 198)"
                stroke="#000" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
            <!-- 圆柱顶面椭圆盖 -->
            <ellipse cx="0" cy="-47.5" rx="22.5" ry="10" fill="rgb(190, 235, 215)" stroke="#000" stroke-width="2.6" />
            <!-- 圆柱底部接触弧线 -->
            <path d="M -22.5 47.5 A 22.5 10 0 0 0 22.5 47.5" fill="none" stroke="#000" stroke-width="2.6"
                stroke-linecap="round" />
        </svg>
        <span>组合成的。哪两个是相同的？</span>
    </div>

    <div id="container">
        <!-- ① 号组合体 (基准形态 0°) -->
        <div class="shape-card" id="card1">
            <svg viewBox="-300 -300 600 600">
                <g id="rotator1" transform="rotate(0, 0, 0)">
                    <!-- 1. 长方体顶面 (Top Face) -->
                    <polygon points="-210,-10 -105,-108 210,-108 105,-10" fill="rgb(255, 228, 214)" stroke="#000"
                        stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />

                    <!-- 2. 长方体右侧面 (Right Face) -->
                    <polygon points="105,-10 210,-108 210,2 105,100" fill="rgb(255, 204, 180)" stroke="#000"
                        stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />

                    <!-- 3. 长方体主正面 (Front Face) -->
                    <polygon points="-210,-10 105,-10 105,100 -210,100" fill="rgb(255, 245, 240)" stroke="#000"
                        stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />

                    <g id="cylinder1">
                        <!-- 圆柱侧面 -->
                        <path d="M 67.5 -117 L 67.5 -22 A 22.5 10 0 0 0 112.5 -22 L 112.5 -117 Z"
                            fill="rgb(168, 221, 198)" stroke="#000" stroke-width="2.6" stroke-linejoin="round"
                            stroke-linecap="round" />

                        <ellipse cx="90" cy="-117" rx="22.5" ry="10" fill="rgb(190, 235, 215)" stroke="#000"

                    <g id="cylinder2">
                        <!-- 圆柱侧面 -->
                        <path d="M 157.5 20 A 22.5 10 0 0 1 202.5 20 L 202.5 115 A 22.5 10 0 0 1 157.5 115 Z"
                            fill="rgb(168, 221, 198)" stroke="#000" stroke-width="2.6" stroke-linejoin="round"
                            stroke-linecap="round" />
                        <!-- 圆柱顶端向上弯曲接触弧线 -->
                        <path d="M 157.5 20 A 22.5 10 0 0 1 202.5 20" fill="none" stroke="#000" stroke-width="2.6"
                            stroke-linecap="round" />
                        <!-- 圆柱底面完整椭圆盖 -->
                        <ellipse cx="180" cy="115" rx="22.5" ry="10" fill="rgb(190, 235, 215)" stroke="#000"
                            stroke-width="2.6" />
                    </g>

                    <!-- 4. 长方体主正面 (Front Face) - 盖在圆柱顶部之上，横边直通拐角 -->
                    <polygon points="-105,-100 210,-100 210,10 -105,10" fill="rgb(255, 245, 240)" stroke="#000"
                        stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
                </g>
            </svg>
            <div class="shape-label">②</div>
        </div>

        <!-- ③ 号组合体 (由 ① 号平面旋转 133.03° 而来) -->
        <div class="shape-card" id="card3">
            <svg viewBox="-300 -300 600 600">
                <g id="rotator3" transform="rotate(133.03, 0, 0)">

                        stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />

                    <!-- 2. 长方体右侧面 (Right Face) -->
                    <polygon points="105,-10 210,-108 210,2 105,100" fill="rgb(255, 204, 180)" stroke="#000"
                        stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />

                    <!-- 3. 长方体主正面 (Front Face) -->
                    <polygon points="-210,-10 105,-10 105,100 -210,100" fill="rgb(255, 245, 240)" stroke="#000"

                    <!-- 4. 小圆柱体 (Cylinder) - 位于顶面右侧立起 -->
                    <g id="cylinder3">
                        <!-- 圆柱侧面 -->
                        <path d="M 67.5 -117 L 67.5 -22 A 22.5 10 0 0 0 112.5 -22 L 112.5 -117 Z"
                            fill="rgb(168, 221, 198)" stroke="#000" stroke-width="2.6" stroke-linejoin="round"
                            stroke-linecap="round" />
                        <!-- 圆柱顶面椭圆盖 -->
                        <ellipse cx="90" cy="-117" rx="22.5" ry="10" fill="rgb(190, 235, 215)" stroke="#000"
                            stroke-width="2.6" />
                        <!-- 圆柱底部接触弧线 -->
                        <path d="M 67.5 -22 A 22.5 10 0 0 0 112.5 -22" fill="none" stroke="#000" stroke-width="2.6"
                            stroke-linecap="round" />
                    </g>
                </g>
            </svg>
            <div class="shape-label">③</div>
        </div>

        <!-- ④ 号组合体 (由 ② 号平面旋转 106.5° 而来) -->
        <div class="shape-card" id="card4">
            <svg viewBox="-300 -300 600 600">
                <g id="rotator4" transform="rotate(106.5, 0, 0)">
                    <!-- 1. 长方体左侧面 (Left Face) -->
                    <polygon points="-105,-100 -210,-2 -210,108 -105,10" fill="rgb(255, 204, 180)" stroke="#000"
                        stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />

                    <!-- 2. 长方体底面 (Bottom Face) -->
                    <polygon points="-105,10 210,10 105,108 -210,108" fill="rgb(255, 228, 214)" stroke="#000"
                        stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />

                    <!-- 3. 小圆柱体 (Cylinder) - 位于底面右侧向下悬垂，上弧接触横线 -->
                    <g id="cylinder4">
                        <!-- 圆柱侧面 -->
                        <path d="M 157.5 20 A 22.5 10 0 0 1 202.5 20 L 202.5 115 A 22.5 10 0 0 1 157.5 115 Z"
                            fill="rgb(168, 221, 198)" stroke="#000" stroke-width="2.6" stroke-linejoin="round"
                            stroke-linecap="round" />
                        <!-- 圆柱顶端向上弯曲接触弧线 -->
                        <path d="M 157.5 20 A 22.5 10 0 0 1 202.5 20" fill="none" stroke="#000" stroke-width="2.6"
                            stroke-linecap="round" />
                        <!-- 圆柱底面完整椭圆盖 -->
                        <ellipse cx="180" cy="115" rx="22.5" ry="10" fill="rgb(190, 235, 215)" stroke="#000"
                            stroke-width="2.6" />
                    </g>

                    <!-- 4. 长方体主正面 (Front Face) - 盖在圆柱顶部之上，横边直通拐角 -->
                    <polygon points="-105,-100 210,-100 210,10 -105,10" fill="rgb(255, 245, 240)" stroke="#000"
                        stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
                </g>
            </svg>
            <div class="shape-label">④</div>
        </div>
    </div>
