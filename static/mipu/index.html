<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>设计密铺图案</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --accent: #F59E0B;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --border: #CBD5E1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none; /* 彻底禁止浏览器默认页面双指与双击缩放 */
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      background: #F1F5F9;
      color: var(--text-main);
    }

    /* 全屏纯 SVG 容器：强制禁止浏览器默认手势，确保拖拽流畅 */
    #mainSvg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: default;
      touch-action: none;
    }

    /* 主体多边形 (默认无填充色，纯粹平面矢量) */
    .main-tile-path {
      stroke: #4F46E5;
      stroke-width: 2.2;
      cursor: pointer;
      filter: none;
      fill: transparent;
      pointer-events: all;
      transition: fill 0.25s ease;
      touch-action: none;
    }

    /* 原始正方形底框 (4条边始终显示为清晰的虚线) */
    .base-frame {
      fill: none;
      stroke: #64748B;
      stroke-width: 1.8;
      stroke-dasharray: 5, 4;
      pointer-events: none;
      touch-action: none;
    }

    /* 宽域隐形边框拖动感应区 (扩大触控感应范围，提升触摸屏命中率) */
    .edge-hit-zone {
      fill: none;
      stroke: transparent;
      stroke-width: 36;
      cursor: grab;
      pointer-events: stroke;
      touch-action: none;
    }

    .edge-hit-zone:hover {
      stroke: transparent;
    }

    .edge-hit-zone:active {
      cursor: grabbing;
    }

    /* 控制手柄节点 - 直线/折线控制点 */
    .handle-corner {
      fill: #4F46E5;
      stroke: #FFFFFF;
      stroke-width: 2.2;
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
      transition: r 0.12s, fill 0.12s;
    }

    .handle-corner:hover {
      r: 8.5;
      fill: #F59E0B;
    }

    .handle-corner:active {
      cursor: grabbing;
      fill: #EF4444;
      r: 9.5;
    }

    /* 控制手柄节点 - 圆弧控制点 (呈现为空心圆环标识) */
    .handle-arc {
      fill: #FFFFFF;
      stroke: #4F46E5;
      stroke-width: 2.8;
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
      transition: r 0.12s, stroke 0.12s;
    }

    .handle-arc:hover {
      r: 9;
      stroke: #F59E0B;
    }

    .handle-arc:active {
      cursor: grabbing;
      stroke: #EF4444;
      r: 10;
    }

    /* 隐形大触控感应区 (专为触摸屏手指触控抓取优化) */
    .handle-touch-target {
      fill: transparent;
      stroke: transparent;
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
    }

    .handle-touch-target:active {
      cursor: grabbing;
    }

    /* 当前选中手柄的外圈指示环 */
    .handle-selected-ring {
      fill: none;
      stroke: #4F46E5;
      stroke-width: 1.5;
      stroke-dasharray: 3, 3;
      pointer-events: none;
      touch-action: none;
    }

    /* 密铺瓷砖单元样式 */
    .tess-tile {
      stroke: rgba(30, 41, 59, 0.35);
      stroke-width: 1.2;
      stroke-linejoin: round;
      pointer-events: none;
      transition: fill 0.25s ease;
    }

    /* 底部悬浮工具条 (整合模式切换、折线圆弧切换、还原和颜色按钮) */
    .bottom-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 12px 28px -6px rgba(15, 23, 42, 0.14), 0 0 0 1px rgba(0, 0, 0, 0.04);
      max-width: calc(100vw - 20px);
      touch-action: manipulation;
    }

    /* 密铺模式切换组 */
    .mode-switch-group {
      display: flex;
      background: #F1F5F9;
      padding: 3px;
      border-radius: 12px;
      gap: 3px;
    }

    .mode-btn {
      padding: 7px 14px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }

    .mode-btn:hover {
      color: var(--primary);
    }

    .mode-btn.active {
      background: #FFFFFF;
      color: var(--primary);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    /* 控制点类型切换按钮组 (加号 vs 圆弧) */
    .type-toggle-group {
      display: flex;
      background: #F1F5F9;
      padding: 3px;
      border-radius: 12px;
      gap: 3px;
      border-left: 1px solid #E2E8F0;
      padding-left: 5px;
    }

    .type-toggle-btn {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    .type-toggle-btn:hover {
      color: var(--primary);
    }

    .type-toggle-btn.active {
      background: #FFFFFF;
      color: var(--primary);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    /* 工具动作按钮组 (还原 + 随机配色，消除独立浮动按钮导致的窄屏重叠问题) */
    .tools-group {
      display: flex;
      align-items: center;
      gap: 6px;
      border-left: 1px solid #E2E8F0;
      padding-left: 6px;
    }

    .tool-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.18s ease;
      flex-shrink: 0;
    }

    .tool-btn:hover {
      background: #F8FAFC;
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
    }

    .tool-btn:active {
      transform: scale(0.92);
    }

    .tool-btn:disabled {
      opacity: 0.32;
      cursor: not-allowed;
      pointer-events: none;
      transform: none !important;
      border-color: var(--border) !important;
      background: #FFFFFF !important;
      color: var(--text-muted) !important;
      box-shadow: none !important;
    }

    .svg-icon {
      display: block;
      pointer-events: none;
    }

    /* 五彩色块圆形配色按钮 (内置于底部工具栏中，完全杜绝重叠) */
    .color-palette-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .color-palette-btn:hover {
      background: #F8FAFC;
      border-color: var(--primary);
      transform: translateY(-1px) rotate(15deg);
      box-shadow: 0 3px 8px rgba(79, 70, 229, 0.15);
    }

    .color-palette-btn:active {
      transform: scale(0.92);
    }

    /* 窄屏自适应响应式布局 (适配各类手机屏幕与折叠屏) */
    @media (max-width: 540px) {
      .bottom-bar {
        bottom: 16px;
        gap: 4px;
        padding: 4px 6px;
        border-radius: 16px;
        max-width: calc(100vw - 12px);
      }

      .mode-switch-group {
        padding: 2px;
        gap: 2px;
      }

      .mode-btn {
        padding: 6px 7px;
        font-size: 0.74rem;
        gap: 2px;
      }

      .type-toggle-group {
        padding: 2px;
        gap: 2px;
        padding-left: 3px;
      }

      .type-toggle-btn {
        width: 30px;
        height: 30px;
      }

      .tools-group {
        gap: 3px;
        padding-left: 3px;
      }

      .tool-btn {
        width: 30px;
        height: 30px;
      }

      .color-palette-btn {
        width: 30px;
        height: 30px;
      }
    }

    /* 极小屏幕微缩自适应 (如各类窄屏手机/窄分屏) */
    @media (max-width: 390px) {
      .bottom-bar {
        bottom: 12px;
        gap: 3px;
        padding: 3px 4px;
        transform: translateX(-50%) scale(0.93);
        transform-origin: bottom center;
      }
    }

    @media (max-width: 350px) {
      .bottom-bar {
        transform: translateX(-50%) scale(0.85);
      }
    }
  </style>

<body>

  <!-- 全屏纯 SVG 渲染与交互架构 -->
  <svg id="mainSvg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- 瓷砖几何形状定义原型 (由 <use> 批量引用) -->
      <path id="tileShapeDef" />
    </defs>

    <!-- 1. 全局底板，捕获空白区域点击 -->
    <rect id="svgBackdrop" fill="none" pointer-events="all" />

    <!-- 2. 全屏密铺背景图形层 (纯 SVG <use> 矩阵) -->
    <g id="tessellationGroup"></g>

    <!-- 3. 中央交互工作层 (中心为坐标 (0,0)) -->
    <g id="centerInteractiveGroup">
      <!-- 可点击的主体变形多边形 -->
      <path id="svgMainTile" class="main-tile-path" fill="transparent" d="" />

      <!-- 原始小正方形4条边始终显示为虚线 -->
      <path id="svgBaseFrame" class="base-frame" d="" />

      <!-- 4条边的宽触控拖拽感应区 -->
      <g id="svgEdgeHitZones"></g>

      <!-- 边框控制手柄与当前选中指示 -->
      <g id="svgHandles"></g>
    </g>
  </svg>

  <!-- 底部居中悬浮模式切换与控制点类型切换工具条 -->
  <div class="bottom-bar">
    <!-- 密铺模式切换组 (选中显示完整的“xx密铺”，未选显示简写) -->
    <div class="mode-switch-group">
      <button class="mode-btn" id="btnAutoMode" title="切换至自动模式：全屏实时平铺">
        <span>🔄 自动</span>
      </button>
      <button class="mode-btn active" id="btnClickMode" title="手动密铺模式：点击中心图形展开/收起密铺">
        <span>👆 手动密铺</span>
      </button>
    </div>

    <!-- 加号 / 圆弧 切换按钮 (默认是加号) -->
    <div class="type-toggle-group">
      <button class="type-toggle-btn active" id="btnTypeCorner" title="折线模式 (➕)：所有拖动点转为折线">
        <svg class="svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>

      <button class="type-toggle-btn" id="btnTypeArc" title="圆弧模式 (⌒)：所有拖动点转为圆弧">
        <svg class="svg-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round">
          <path d="M4 17 A 8.5 8.5 0 0 1 20 17" />
          <circle cx="4" cy="17" r="1.5" fill="currentColor" />
          <circle cx="20" cy="17" r="1.5" fill="currentColor" />
        </svg>
      </button>
    </div>

    <!-- 工具操作按钮组 (撤销 + 恢复 + 还原 + 随机配色) -->
    <div class="tools-group">
      <!-- 撤销按钮 (纯符号无文字) -->
      <button class="tool-btn" id="undoBtn" title="撤销 (Ctrl+Z)" disabled>
        <svg class="svg-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 14 L4 9 L9 4" />
          <path d="M4 9 h10.5 a5.5 5.5 0 0 1 5.5 5.5 v0 a5.5 5.5 0 0 1 -5.5 5.5 H11" />
        </svg>
      </button>

      <!-- 恢复按钮 (纯符号无文字) -->
      <button class="tool-btn" id="redoBtn" title="恢复 (Ctrl+Y)" disabled>
        <svg class="svg-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 14 L20 9 L15 4" />
          <path d="M20 9 H9.5 a5.5 5.5 0 0 0 -5.5 5.5 v0 a5.5 5.5 0 0 0 5.5 5.5 H13" />
        </svg>
      </button>

      <!-- 还原按钮 -->
      <button class="tool-btn" id="resetBtn" title="恢复标准正方形 (↺)">
        <svg class="svg-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
      </button>

      <!-- 五彩色块圆形按钮 (每随机3下，第4下去除背景色) -->
      <button class="color-palette-btn" id="btnColorPalette" title="随机填充配色 (每随机3下，第4下去除背景色)">
        <svg width="22" height="22" viewBox="0 0 24 24" style="border-radius: 50%; display: block; pointer-events: none;">
          <path d="M12 12 L12 2 A10 10 0 0 0 2 12 Z" fill="#F87171" />
          <path d="M12 12 L22 12 A10 10 0 0 0 12 2 Z" fill="#FBBF24" />
          <path d="M12 12 L12 22 A10 10 0 0 0 22 12 Z" fill="#34D399" />
          <path d="M12 12 L2 12 A10 10 0 0 0 12 22 Z" fill="#60A5FA" />
          <circle cx="12" cy="12" r="3.2" fill="#FFFFFF" />
        </svg>
      </button>
    </div>
  </div>
