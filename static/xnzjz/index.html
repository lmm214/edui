<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>虚拟折剪纸</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #334455;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            width: 100vw;
            height: 100vh;
        }

        .btn {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.6), inset -1px -1px 3px rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.3s, box-shadow 0.3s, transform 0.1s;
            user-select: none;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-icon {
            width: 44px;
            height: 44px;
            padding: 0;
            font-size: 1.3rem;
        }

        .btn:hover {
            background: rgba(60, 60, 60, 0.9);
        }

        .btn:active {
            box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.8), inset -1px -1px 2px rgba(255, 255, 255, 0.05);
            transform: scale(0.97);
        }

        /* 右上角按钮栏 */
        #topRightBar {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #topRightBar .btn {
            position: static;
        }

        /* 任意折叠模式按钮高亮激活状态 (纯净银灰微光质感，去除蓝光) */
        #foldModeBtn.active {
            background: rgba(255, 255, 255, 0.22);
            border: 1.5px solid #d1d5db;
            color: #f9fafb;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.25), inset 1px 1px 3px rgba(255, 255, 255, 0.2);
        }

        /* 模式切换提示气泡 Toast */
        #toast {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(15, 23, 42, 0.88);
            color: #f8fafc;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            backdrop-filter: blur(8px);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 30;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            white-space: nowrap;
            max-width: 92vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 右侧中间工具栏 (画笔、清屏) */
        #rightCenterBar {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            z-index: 22;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #rightCenterBar .btn {
            position: static;
            width: 44px;
            height: 44px;
            padding: 0;
        }

        /* 画笔处于激活涂鸦模式时的高亮状态 (亮橙金高光，醒目美观) */
        #penBtn.active {
            background: rgba(249, 115, 22, 0.4);
            border: 1.5px solid #f97316;
            color: #ffedd5;
            box-shadow: 0 0 14px rgba(249, 115, 22, 0.6), inset 1px 1px 3px rgba(255, 255, 255, 0.3);
        }

        /* 右下角按钮栏 (重置按钮 + 设置规格按钮) */
        #bottomRightBar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #bottomRightBar .btn {
            position: static;
            width: 44px;
            height: 44px;
            padding: 0;
        }

        /* 剪切按钮 (位于设置规格按钮正上方) */
        #cutBtn {
            position: absolute;
            bottom: 76px;
            right: 20px;
            z-index: 20;
            width: 44px;
            height: 44px;
            padding: 0;
        }

        /* 剪切模式激活高亮 (亮丽珊瑚红微光质感) */
        #cutBtn.active {
            background: rgba(239, 68, 68, 0.4);
            border: 1.5px solid #ef4444;
            color: #fee2e2;
            box-shadow: 0 0 14px rgba(239, 68, 68, 0.6), inset 1px 1px 3px rgba(255, 255, 255, 0.3);
        }

        /* 剪切工具栏 (显示在顶部中央，与全局按钮风格一致) */
        #cutToolbar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-15px);
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        #cutToolbar.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .cut-tool-btn {
            position: static;
        }

        .cut-tool-btn.active {
            background: rgba(239, 68, 68, 0.4);
            border: 1.5px solid #ef4444;
            color: #fee2e2;
            box-shadow: 0 0 14px rgba(239, 68, 68, 0.6), inset 1px 1px 3px rgba(255, 255, 255, 0.3);
        }

        .cut-tool-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .cut-action-unfold {
            border: 1px solid rgba(52, 211, 153, 0.45);
            color: #d1fae5;
        }

        .toolbar-divider {
            width: 1px;
            height: 26px;
            background: rgba(255, 255, 255, 0.18);
            margin: 0 2px;
            flex-shrink: 0;
        }

        /* 剪切后选择保留/剪去部分的顶部次级栏 */
        #cutChoiceBar {
            position: absolute;
            top: 72px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            z-index: 26;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        #cutChoiceBar.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        #cutChoiceBar .btn {
            position: static;
            height: 38px;
            padding: 0 12px;
            font-size: 0.88rem;
        }

        #swapCutChoiceBtn {
            border: 1px solid rgba(96, 165, 250, 0.5);
            color: #dbeafe;
        }

        #confirmCutChoiceBtn {
            border: 1px solid rgba(52, 211, 153, 0.5);
            color: #d1fae5;
        }

        @media (max-width: 768px) {
            #cutToolbar {
                top: 72px;
                max-width: 96vw;
                overflow-x: auto;
                gap: 6px;
            }
            #cutChoiceBar {
                top: 122px;
            }
            .cut-tool-btn.btn-icon {
                width: 38px;
                height: 38px;
            }
        }

        /* 全屏剪切虚线绘制画布 */
        #cutCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 19;
            pointer-events: none;
            touch-action: none;
        }

        #cutCanvas.active {
            pointer-events: auto;
            cursor: crosshair;
        }

        /* 全屏涂鸦画布 */
        #doodleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 18;
            pointer-events: none;
            touch-action: none;
        }

        #doodleCanvas.active {
            pointer-events: auto;
            cursor: crosshair;
        }

        /* 底部和右侧滑动条容器 */
        #slidersContainer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 15;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            outline: none;
            position: absolute;
            pointer-events: auto;
        }

        /* 滑块白色圆点与阴影 */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 10px, transparent 11px);
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
            cursor: pointer;
            border: none;
            margin-top: -17px;
        }

        /* 轨道样式：内凹阴影 */
        input[type=range]::-webkit-slider-runnable-track {
            height: 10px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: inset 1px 1px 4px rgba(0, 0, 0, 0.8), inset -1px -1px 2px rgba(255, 255, 255, 0.15);
        }

        #widthSlider {
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
        }

        #heightSlider {
            top: 50%;
            right: calc(32px - 25vh);
            width: 50vh;
            transform: translateY(-50%) rotate(-90deg);
            margin: 0;
        }

        .slider-val {
            position: absolute;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 2rem;
            font-weight: 500;
            backdrop-filter: blur(4px);
            pointer-events: none;
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.6), inset -1px -1px 3px rgba(255, 255, 255, 0.1);
        }

        #widthVal {
            bottom: 65px;
            left: 50%;
            transform: translateX(-50%);
        }

        #heightVal {
            top: 50%;
            right: 80px;
            transform: translateY(-50%);
        }
    </style>
</head>

<body>
<!-- 全屏涂鸦画布 -->
<canvas id="doodleCanvas"></canvas>
<!-- 全屏剪切虚线画布 -->
<canvas id="cutCanvas"></canvas>

<!-- 提示气泡 Toast -->
<div id="toast"></div>

<!-- 右上角按钮栏 (折叠模式切换 + 形状切换) -->
<div id="topRightBar">
    <!-- 任意折上折 / 均等对折 模式切换按钮 -->
    <button id="foldModeBtn" class="btn btn-icon" title="当前：均等对折模式（点击切换为任意折）">
        <svg id="foldModeIconHalf" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <line x1="12" y1="3" x2="12" y2="21" stroke-dasharray="3 3" />
        </svg>
        <svg id="foldModeIconFree" style="display: none;" width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h10l6 6v10H4V4z" />
            <path d="M14 4v6h6" />
        </svg>
    </button>

    <!-- 形状切换按钮 (正方形纸 ↔ 圆形纸) -->
    <button id="shapeBtn" class="btn btn-icon" title="切换为圆形纸">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="12" cy="12" r="9" />
        </svg>
    </button>
</div>

<!-- 右侧中间工具栏 (画笔、清屏) -->
<div id="rightCenterBar">
    <!-- 画笔涂鸦按钮 -->
    <button id="penBtn" class="btn btn-icon" title="画笔涂鸦（点击开启，再点退出）">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
        </svg>
    </button>
    <!-- 清屏按钮 -->
    <button id="clearDoodleBtn" class="btn btn-icon" title="清屏（清除所有涂鸦）">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
    </button>
</div>

<!-- 剪切按钮 (位于右下设置规格按钮正上方) -->
<button id="cutBtn" class="btn btn-icon" title="剪纸模式">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="3"></circle>
        <circle cx="6" cy="18" r="3"></circle>
        <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
        <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
        <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
    </svg>
</button>

<!-- 剪纸多功能子工具栏 (顶部居中，统一图标按钮风格) -->
<div id="cutToolbar">
    <button class="btn btn-icon cut-tool-btn active" data-tool="free" title="自由剪">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 17c3-6 6-6 9 0s6 6 9 0" />
        </svg>
    </button>
    <button class="btn btn-icon cut-tool-btn" data-tool="carve" title="线条镂空">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 4l6 6L8 22H2v-6L14 4z" />
        </svg>
    </button>
    <button class="btn btn-icon cut-tool-btn" data-tool="line" title="直线剪">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="4" y1="20" x2="20" y2="4" stroke-dasharray="4 3" />
        </svg>
    </button>
    <button class="btn btn-icon cut-tool-btn" data-tool="heart" title="心形">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        </svg>
    </button>
    <button class="btn btn-icon cut-tool-btn" data-tool="star" title="五角星">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
        </svg>
    </button>
    <button class="btn btn-icon cut-tool-btn" data-tool="circle" title="圆形">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="4 3">
            <circle cx="12" cy="12" r="8" />
        </svg>
    </button>
    <button class="btn btn-icon cut-tool-btn" data-tool="petal" title="花瓣">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
        </svg>
    </button>
    <div class="toolbar-divider"></div>
    <button id="undoCutBtn" class="btn btn-icon cut-tool-btn" disabled title="撤销">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7v6h6" />
            <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13" />
        </svg>
    </button>
    <button id="unfoldAfterCutBtn" class="btn btn-icon cut-tool-btn cut-action-unfold" title="展开">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9" />
            <polyline points="9 21 3 21 3 15" />
            <line x1="21" y1="3" x2="14" y2="10" />
            <line x1="3" y1="21" x2="10" y2="14" />
        </svg>
    </button>
</div>

<!-- 剪切后选择剪去/保留区域的精简按钮栏 -->
<div id="cutChoiceBar">
    <button id="swapCutChoiceBtn" class="btn" title="互换剪去与保留部分">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9" />
            <path d="M3 11V9a4 4 0 0 1 4-4h14" />
            <polyline points="7 23 3 19 7 15" />
            <path d="M21 13v2a4 4 0 0 1-4 4H3" />
        </svg>
        <span>互换</span>
    </button>
    <button id="confirmCutChoiceBtn" class="btn" title="确认">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
        </svg>
        <span>确认</span>
    </button>
</div>

<!-- 右下角按钮栏 (重置按钮 + 设置规格按钮) -->
<div id="bottomRightBar">
    <!-- 重置按钮 (移动至右下方) -->
    <button id="resetBtn" class="btn btn-icon" title="重置白纸">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2v6h-6"></path>
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
            <path d="M3 22v-6h6"></path>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
        </svg>
    </button>

    <!-- 设置规格按钮 -->
    <button id="settingsBtn" class="btn btn-icon" title="设置规格">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
        </svg>
    </button>
</div>

<!-- 底部与右侧滑动条 -->
<div id="slidersContainer" style="display: none;">
    <input type="range" id="widthSlider" min="10" max="60" step="1" value="24">
    <div class="slider-val" id="widthVal">24</div>

    <input type="range" id="heightSlider" min="10" max="60" step="1" value="24">
    <div class="slider-val" id="heightVal">24</div>
</div>

<!-- 引入 Three.js 和 OrbitControls (使用稳定 CDN 链接) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    // ==========================================
    // 1. 拟真折纸音效 (Web Audio API)
    // ==========================================
    class PaperAudio {
        constructor() {
            this.ctx = null;
        }

        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }

        playRustle(intensity = 1.0) {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const filter = this.ctx.createBiquadFilter();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(280 * intensity, now + 0.08);
            osc.frequency.exponentialRampToValueAtTime(70, now + 0.16);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(600, now);
            filter.frequency.setValueAtTime(180, now + 0.16);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.14 * intensity, now + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.18);
        }

        playFoldSnap() {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(460, now);
            osc.frequency.exponentialRampToValueAtTime(160, now + 0.1);

            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.13);
        }

        playUnfoldSnap() {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(480, now + 0.12);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.12, now + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.19);
        }

        playCut() {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;

            // 模拟剪刀剪切纸张清脆的"咔嚓"双重脉冲音效
            [0, 0.055].forEach((delay) => {
                const t = now + delay;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(1500, t);
                osc.frequency.exponentialRampToValueAtTime(320, t + 0.045);

                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(2400, t);
                filter.Q.setValueAtTime(3.0, t);

                gain.gain.setValueAtTime(0.001, t);
                gain.gain.linearRampToValueAtTime(0.24, t + 0.008);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(t);
                osc.stop(t + 0.06);
            });
        }
    }

    // ==========================================
    // 3. 形状状态与底层淡灰色虚线框
    // ==========================================
    let currentShape = 'rect'; // 'rect' | 'circle'
    let circleDiameter = 24.0;
    let persistentCircleFolds = 0;

    const ghostCanvas = document.createElement('canvas');

    function renderGhostTexture() {

    const ghostGeo = new THREE.PlaneGeometry(paperW, paperH);

    // ==========================================
    // 4. 纸张纹理与折痕渲染 (长方形网格 / 圆形放射折痕)
    // ==========================================
    const texCanvas = document.createElement('canvas');
    texCanvas.width = 2048;
    texCanvas.height = 2048;
    const texCtx = texCanvas.getContext('2d');
    const paperTexture = new THREE.CanvasTexture(texCanvas);
    paperTexture.anisotropy = 16;
    paperTexture.minFilter = THREE.LinearMipmapLinearFilter;
    paperTexture.magFilter = THREE.LinearFilter;
    paperTexture.generateMipmaps = true;

    // 独立的高清不透明度遮罩纹理 (避免 Canvas2D 预乘透明黑 rgba(0,0,0,0) 在边缘插值产生黑点与黑边)
    const alphaCanvas = document.createElement('canvas');
    alphaCanvas.width = 2048;
    alphaCanvas.height = 2048;
    const alphaCtx = alphaCanvas.getContext('2d');
    const paperAlphaTexture = new THREE.CanvasTexture(alphaCanvas);
    paperAlphaTexture.anisotropy = 16;
    paperAlphaTexture.minFilter = THREE.LinearFilter;
    paperAlphaTexture.magFilter = THREE.LinearFilter;
    paperAlphaTexture.generateMipmaps = false;

    const foldHistory = [];
    let activeFold = null;
    const MAX_FOLDS = 8; // 限制最多折叠8次

    let persistentHParts = 1; // 横向均等份数 (2^nH)
    let persistentVParts = 1; // 纵向均等份数 (2^nV)

    // 持久化保留所有自由折叠与折上折历史折痕（展开后依然保留痕迹）
    const persistentFreeCreases = [];

    function addPersistentCrease(fold) {
        if (!fold || !fold.p0 || !fold.u) return;
        const p0 = { ...fold.p0 };
        const u = { ...fold.u };
        const n = fold.n ? { ...fold.n } : { x: fold.u.z, z: -fold.u.x };

        const isDuplicate = (p, dir) => {
            return persistentFreeCreases.some(c => {
                const dp = Math.hypot(c.p0.x - p.x, c.p0.z - p.z);
                const dotU = Math.abs(c.u.x * dir.x + c.u.z * dir.z);
                return dp < 0.35 && dotU > 0.95;
            });
        };

        if (!isDuplicate(p0, u)) {
            persistentFreeCreases.push({ p0, u, n });
        }

        // 如果存在前序折叠层，计算该折痕在展开底页上的反射对称折痕
        if (foldHistory.length > 0) {
            for (let s = foldHistory.length - 1; s >= 0; s--) {
                const prev = foldHistory[s];
                if (prev && prev.p0 && prev.n) {
                    const distToPrev = (p0.x - prev.p0.x) * prev.n.x + (p0.z - prev.p0.z) * prev.n.z;
                    if (Math.abs(distToPrev) > 0.15) {
                        const refP0 = {
                            x: p0.x - 2 * distToPrev * prev.n.x,
                            z: p0.z - 2 * distToPrev * prev.n.z
                        };
                        const dotUn = u.x * prev.n.x + u.z * prev.n.z;
                        const refU = {
                            x: u.x - 2 * dotUn * prev.n.x,
                            z: u.z - 2 * dotUn * prev.n.z
                        };
                        if (!isDuplicate(refP0, refU)) {
                            persistentFreeCreases.push({ p0: refP0, u: refU, n });
                        }
                    }
                }
            }
        }
    }

    function updatePersistentParts() {
        let nH = 0;
        let nV = 0;
        for (const f of foldHistory) {
            if (f.dir === 'R2L' || f.dir === 'L2R') nH++;
            else if (f.dir === 'B2T' || f.dir === 'T2B') nV++;
        }
        if (activeFold) {
            if (activeFold.dir === 'R2L' || activeFold.dir === 'L2R') nH++;
            else if (activeFold.dir === 'B2T' || activeFold.dir === 'T2B') nV++;
        }
        persistentHParts = Math.max(persistentHParts, Math.pow(2, nH));
        persistentVParts = Math.max(persistentVParts, Math.pow(2, nV));
    }

    function renderPaperTexture() {
        const w = texCanvas.width;
        const h = texCanvas.height;

        // 1. 始终以纯净白纸底色填充整张颜色画布，杜绝透明黑像素被双线性滤波采样产生黑点
        texCtx.fillStyle = '#fafafa';
        texCtx.fillRect(0, 0, w, h);

        // 初始化独立 Alpha 遮罩画布（黑色=#000000代表完全透明，白色=#ffffff代表保留的纸面）
        alphaCtx.fillStyle = '#000000';
        alphaCtx.fillRect(0, 0, w, h);

        const CREASE_COLOR = '#4a4a4a'; // 纯净中性深灰折痕虚线
        const BASE_WIDTH = 5;           // 5px 细致清晰折痕线宽
        const BASE_DASH = [20, 14];

        const BORDER_COLOR = '#333'; // 纯正中性灰色外边框线
        const BORDER_WIDTH = 5;      // 5px 细致清晰外边框

        if (currentShape === 'circle') {
            const cx = w / 2;
            const cy = h / 2;
            const r = w / 2 - BORDER_WIDTH / 2 - 2;

            // 在 Alpha 遮罩上绘制平滑圆形区域
            alphaCtx.save();
            alphaCtx.beginPath();
            alphaCtx.arc(cx, cy, r + BORDER_WIDTH / 2, 0, Math.PI * 2);
            alphaCtx.fillStyle = '#ffffff';
            alphaCtx.fill();
            alphaCtx.restore();

            // 纯净大白圆底色与外框
            texCtx.save();
            texCtx.beginPath();
            texCtx.arc(cx, cy, r + BORDER_WIDTH / 2, 0, Math.PI * 2);
            texCtx.fillStyle = '#fafafa';
            texCtx.fill();

            // 边缘清晰中灰色边框
            texCtx.strokeStyle = BORDER_COLOR;
            texCtx.lineWidth = BORDER_WIDTH;
            texCtx.stroke();

            // 裁切在圆内，避免折痕溢出
            texCtx.beginPath();
            texCtx.arc(cx, cy, r, 0, Math.PI * 2);
            texCtx.clip();

            // 仅在均等对折模式下绘制中心对称的均分直径折痕
            if (foldMode === 'half') {
                let totalCircleHalfFolds = foldHistory.filter(f => !f.isFree).length;
                if (activeFold && !activeFold.isFree) totalCircleHalfFolds++;
                persistentCircleFolds = Math.max(persistentCircleFolds, totalCircleHalfFolds);

                if (persistentCircleFolds > 0) {
                    texCtx.setLineDash(BASE_DASH);
                    texCtx.strokeStyle = CREASE_COLOR;
                    texCtx.lineWidth = BASE_WIDTH;

                    const totalSlices = Math.pow(2, persistentCircleFolds);
                    const numDiameters = totalSlices / 2;

                    let baseAngle = Math.PI / 2; // 垂直折痕
                    const firstFold = foldHistory.find(f => !f.isFree) || (activeFold && !activeFold.isFree ? activeFold : null);
                    if (firstFold && (firstFold.dir === 'B2T' || firstFold.dir === 'T2B')) {
                        baseAngle = 0; // 上下对折产生水平折痕
                    }

                    for (let i = 0; i < numDiameters; i++) {
                        const angle = baseAngle + (i * Math.PI) / numDiameters;
                        texCtx.beginPath();
                        texCtx.moveTo(cx - (r + 10) * Math.cos(angle), cy - (r + 10) * Math.sin(angle));
                        texCtx.lineTo(cx + (r + 10) * Math.cos(angle), cy + (r + 10) * Math.sin(angle));
                        texCtx.stroke();
                    }
                    texCtx.setLineDash([]);
                }
            }
            texCtx.restore();
        } else {
            // 矩形纸张 Alpha 遮罩全白
            alphaCtx.fillStyle = '#ffffff';
            alphaCtx.fillRect(0, 0, w, h);

            // 边缘清晰中灰色实线边框
            texCtx.strokeStyle = BORDER_COLOR;
            texCtx.lineWidth = BORDER_WIDTH;
            texCtx.strokeRect(BORDER_WIDTH / 2, BORDER_WIDTH / 2, w - BORDER_WIDTH, h - BORDER_WIDTH);

            // 仅在均等对折模式下绘制均分网格折痕
            if (foldMode === 'half') {
                updatePersistentParts();

                const aspectScale = paperH / paperW;
                const vCreaseWidth = BASE_WIDTH * aspectScale;
                const vCreaseDash = [BASE_DASH[0] / aspectScale, BASE_DASH[1] / aspectScale];

                if (persistentHParts > 1) {
                    for (let k = 1; k < persistentHParts; k++) {
                        const u = k / persistentHParts;
                        const px = u * w;
                        texCtx.setLineDash(vCreaseDash);
                        texCtx.strokeStyle = CREASE_COLOR;
                        texCtx.lineWidth = vCreaseWidth;
                        texCtx.beginPath();
                        texCtx.moveTo(px, 0);
                        texCtx.lineTo(px, h);
                        texCtx.stroke();
                        texCtx.setLineDash([]);
                    }
                }

                if (persistentVParts > 1) {
                    for (let m = 1; m < persistentVParts; m++) {
                        const v = m / persistentVParts;
                        const py = v * h;
                        texCtx.setLineDash(BASE_DASH);
                        texCtx.strokeStyle = CREASE_COLOR;
                        texCtx.lineWidth = BASE_WIDTH;
                        texCtx.beginPath();
                        texCtx.moveTo(0, py);
                        texCtx.lineTo(w, py);
                        texCtx.stroke();
                        texCtx.setLineDash([]);
                    }
                }
            }
        }

        // 绘制自由折叠与折上折产生的折痕虚线
        const allCreasesToDraw = [...persistentFreeCreases];
        foldHistory.forEach(f => {
            if (f.isFree && f.p0 && f.u) {
                const exists = allCreasesToDraw.some(c =>
                    Math.hypot(c.p0.x - f.p0.x, c.p0.z - f.p0.z) < 0.25 &&
                    Math.abs(c.u.x * f.u.x + c.u.z * f.u.z) > 0.96
                );
                if (!exists) allCreasesToDraw.push(f);
            }
        });

        if (allCreasesToDraw.length > 0) {
            texCtx.save();
            if (currentShape === 'circle') {
                const cx = w / 2;
                const cy = h / 2;
                const r = w / 2 - BORDER_WIDTH / 2 - 2;
                texCtx.beginPath();
                texCtx.arc(cx, cy, r, 0, Math.PI * 2);
                texCtx.clip();
            } else {
                texCtx.beginPath();
                texCtx.rect(BORDER_WIDTH, BORDER_WIDTH, w - BORDER_WIDTH * 2, h - BORDER_WIDTH * 2);
                texCtx.clip();
            }

            texCtx.setLineDash(BASE_DASH);
            texCtx.strokeStyle = CREASE_COLOR;
            texCtx.lineWidth = BASE_WIDTH;

            const maxDim = Math.max(paperW, paperH) * 2;
            allCreasesToDraw.forEach(f => {
                const x1 = f.p0.x - f.u.x * maxDim;
                const z1 = f.p0.z - f.u.z * maxDim;
                const x2 = f.p0.x + f.u.x * maxDim;
                const z2 = f.p0.z + f.u.z * maxDim;

                const tx1 = (x1 / paperW + 0.5) * w;
                const ty1 = (z1 / paperH + 0.5) * h;
                const tx2 = (x2 / paperW + 0.5) * w;
                const ty2 = (z2 / paperH + 0.5) * h;

                texCtx.beginPath();
                texCtx.moveTo(tx1, ty1);
                texCtx.lineTo(tx2, ty2);
                texCtx.stroke();
            });
            texCtx.restore();
        }

        // 将已剪除区域同步至 Alpha 遮罩画布（不绘制深灰/黑色切口描边，使切口呈现自然纯净的白纸边缘）
        if (typeof hasAnyCuts !== 'undefined' && hasAnyCuts && typeof cutMaskCanvas !== 'undefined') {
            alphaCtx.save();
            alphaCtx.imageSmoothingEnabled = true;
            alphaCtx.imageSmoothingQuality = 'high';
            alphaCtx.drawImage(cutMaskCanvas, 0, 0, w, h);
            alphaCtx.restore();
        }

        paperTexture.needsUpdate = true;
        paperAlphaTexture.needsUpdate = true;
        if (paper && paper.customDepthMaterial) {
            paper.customDepthMaterial.needsUpdate = true;
        }
    }

    // ==========================================
    // 5. 纸张网格与材质
    // ==========================================
    const GRID_X = 140;
    const GRID_Z = 140;
    let geometry = new THREE.PlaneGeometry(paperW, paperH, GRID_X, GRID_Z);
    let origPositions = geometry.attributes.position.clone();

    const material = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: paperTexture,
        alphaMap: paperAlphaTexture,
        roughness: 0.8,
        metalness: 0.0,
        side: THREE.DoubleSide,
        shadowSide: THREE.DoubleSide,
        transparent: false,
        alphaTest: 0.5,
        depthWrite: true,
        depthTest: true
    });

    const paper = new THREE.Mesh(geometry, material);
    paper.rotation.x = -Math.PI / 2;
    paper.castShadow = true;
    paper.receiveShadow = true;
    scene.add(paper);

    // 完美匹配圆形/长方形及任意镂空剪纸边缘的实时阴影深度材质
    const depthMaterial = new THREE.MeshDepthMaterial({
        depthPacking: THREE.RGBADepthPacking,
        alphaMap: paperAlphaTexture,
        alphaTest: 0.5
    });
    paper.customDepthMaterial = depthMaterial;

    // ==========================================
    // 6. 3D 形变算法 (支持正交与任意角平分线折叠)
    // ==========================================
    function angleDistance(a, b) {
        let diff = Math.abs(a - b) % (Math.PI * 2);
        if (diff > Math.PI) diff = Math.PI * 2 - diff;
        return diff;
    }

    function getCurrentBounds() {
        if (foldHistory.some(f => f.isFree)) {
            let xMin = Infinity, xMax = -Infinity, zMin = Infinity, zMax = -Infinity;
            const pos = paper.geometry.attributes.position;
            const count = pos.count;
            for (let i = 0; i < count; i += 4) {
                const px = pos.getX(i);
                const pz = -pos.getY(i);
                if (px < xMin) xMin = px;
                if (px > xMax) xMax = px;
                if (pz < zMin) zMin = pz;
                if (pz > zMax) zMax = pz;
            }
            if (xMin < xMax && zMin < zMax) {
                return { xMin, xMax, zMin, zMax };
            }
        }

        if (currentShape === 'circle') {
            const r = circleDiameter / 2;
            if (foldHistory.length === 0 && !activeFold) {
                return { xMin: -r, xMax: r, zMin: -r, zMax: r };
            }
            const s = currentSector;
            let xMin = 0, xMax = 0, zMin = 0, zMax = 0;
            const steps = 32;
            const span = s.end - s.start;
            for (let i = 0; i <= steps; i++) {
                const a = s.start + (span * i) / steps;
                const px = r * Math.cos(a);
                const pz = r * Math.sin(a);
                xMin = Math.min(xMin, px);
                xMax = Math.max(xMax, px);
                zMin = Math.min(zMin, pz);
                zMax = Math.max(zMax, pz);
            }
            return { xMin, xMax, zMin, zMax };
        }

        let xMin = -paperW / 2;
        let xMax = paperW / 2;
        let zMin = -paperH / 2;
        let zMax = paperH / 2;

        for (const f of foldHistory) {
            if (f.dir === 'R2L') xMax = f.line;
            else if (f.dir === 'L2R') xMin = f.line;
            else if (f.dir === 'B2T') zMax = f.line;
            else if (f.dir === 'T2B') zMin = f.line;
        }
        return { xMin, xMax, zMin, zMax };
    }

    function extractFoldPlane(fold) {
        let p0 = fold.p0;
        let u = fold.u;
        let n = fold.n;
        if (!p0 || !n) {
            const L = fold.line !== undefined ? fold.line : 0;
            if (fold.dir === 'R2L') {
                p0 = { x: L, z: 0 }; u = { x: 0, z: -1 }; n = { x: 1, z: 0 };
            } else if (fold.dir === 'L2R') {
                p0 = { x: L, z: 0 }; u = { x: 0, z: 1 }; n = { x: -1, z: 0 };
            } else if (fold.dir === 'B2T') {
                p0 = { x: 0, z: L }; u = { x: 1, z: 0 }; n = { x: 0, z: 1 };
            } else if (fold.dir === 'T2B') {
                p0 = { x: 0, z: L }; u = { x: -1, z: 0 }; n = { x: 0, z: -1 };
            } else {
                p0 = { x: 0, z: 0 }; u = { x: 0, z: 1 }; n = { x: 1, z: 0 };
            }
        }
        return { p0, u, n };
    }

    function applyFoldTransform(pt, fold, stepIndex) {
        const angle = fold.angle;
        if (angle <= 0.0001) return;

        // 物理折叠厚度与铰链半径逐层递增，确保折上折层级分明
        const thickness = 0.12;
        const hingeRadius = 0.10 + stepIndex * 0.02;

        const { p0, u, n } = extractFoldPlane(fold);

        const vx = pt.x - p0.x;
        const vz = pt.z - p0.z;

        // 距离折线法线的有向距离，d > 0 表示在翻转侧
        const d = vx * n.x + vz * n.z;
        if (d <= 0) return;

        const uCoord = vx * u.x + vz * u.z;
        const arcLen = hingeRadius * angle;

        let offset, yLift;
        const angleRatio = angle / Math.PI;
        if (d <= arcLen && angle > 0.01) {
            const phi = (d / arcLen) * angle;
            offset = hingeRadius * Math.sin(phi);
            yLift = hingeRadius * (1 - Math.cos(phi)) + (stepIndex * thickness) * (phi / Math.PI);
        } else {
            const flapLen = d - arcLen;
            offset = hingeRadius * Math.sin(angle) + flapLen * Math.cos(angle);
            yLift = hingeRadius * (1 - Math.cos(angle)) + flapLen * Math.sin(angle) + (stepIndex * thickness) * angleRatio;
        }

        pt.x = p0.x + uCoord * u.x + offset * n.x;
        pt.z = p0.z + uCoord * u.z + offset * n.z;
        pt.y += yLift;
    }

    function updatePaperGeometry() {
        const posAttr = paper.geometry.attributes.position;
        const count = posAttr.count;

        const allFolds = [...foldHistory];
        if (activeFold) allFolds.push(activeFold);

        const pt = { x: 0, y: 0, z: 0 };

        for (let i = 0; i < count; i++) {
            const ox = origPositions.getX(i);
            const oy = origPositions.getY(i);

            pt.x = ox;
            pt.y = 0.02;
            pt.z = -oy;

            for (let s = 0; s < allFolds.length; s++) {
                applyFoldTransform(pt, allFolds[s], s + 1);
            }

            posAttr.setXYZ(i, pt.x, -pt.z, pt.y);
        }

        posAttr.needsUpdate = true;
        paper.geometry.computeVertexNormals();
    }

    // ==========================================
    // 7. 拖拽手势交互 (支持长方形与圆形折上折)
    // ==========================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    let isDragging = false;
    let dragMode = null;
    let dragStartDeskPt = new THREE.Vector3();
    let dragLockedDirection = null;
    let dragStartAngle = 0;
    let isAnimating = false;
    let lastClickTime = 0;
    let isDoodleMode = false;

    let isStartOnFoldedFlap = false;
    let isStartOnBorder = false;
    let lastFoldVec = null;
    let dragStartDistN = 0;

    // 特殊识别手指/鼠标点击是否落在已折叠翻页或翻页的边框（圆弧外沿/长方形边沿）上
    function checkPointerFoldState(pt) {
        if (foldHistory.length === 0 || activeFold) {
            return { isFoldedFlap: false, isBorder: false, foldVec: null, distN: 0 };
        }

        const lastFold = foldHistory[foldHistory.length - 1];
        const { p0, u, n } = extractFoldPlane(lastFold);
        const foldVec = { p0, u, n, dir: lastFold.dir };

        // 计算起点距离上一次折痕法线的有向距离，折叠扇叶落在 -n 侧
        const distN = (pt.x - p0.x) * n.x + (pt.z - p0.z) * n.z;

        // 如果起点落在折线未翻折侧（超过 0.35），则不是已折叠翻页
        if (distN > 0.35) {
            return { isFoldedFlap: false, isBorder: false, foldVec, distN };
        }

        // 翻折前在未折叠纸张平面上的对应坐标（沿折痕轴对称镜像）
        const origX = pt.x - 2 * distN * n.x;
        const origZ = pt.z - 2 * distN * n.z;

        let isFoldedFlap = false;
        let isBorder = false;

        const BORDER_TOLERANCE = 2.4;

        if (currentShape === 'circle') {
            const R = circleDiameter / 2;
            const origR = Math.hypot(origX, origZ);
            const curR = Math.hypot(pt.x, pt.z);

            if (origR <= R + 1.2) {
                isFoldedFlap = true;
                const nearOrigBorder = Math.abs(origR - R) <= BORDER_TOLERANCE;
                const nearCurBorder = Math.abs(curR - R) <= BORDER_TOLERANCE;
                if ((nearOrigBorder || nearCurBorder) && distN < -0.2) {
                    isBorder = true;
                }
            }
        } else {
            const halfW = paperW / 2;
            const halfH = paperH / 2;
            const inOrigRect = Math.abs(origX) <= halfW + 1.2 && Math.abs(origZ) <= halfH + 1.2;

            if (inOrigRect) {
                isFoldedFlap = true;
                const distOrigBorder = Math.min(Math.abs(Math.abs(origX) - halfW), Math.abs(Math.abs(origZ) - halfH));
                const distCurBorder = Math.min(Math.abs(Math.abs(pt.x) - halfW), Math.abs(Math.abs(pt.z) - halfH));
                const bounds = getCurrentBounds();
                const distBounds = Math.min(
                    Math.abs(pt.x - bounds.xMin), Math.abs(pt.x - bounds.xMax),
                    Math.abs(pt.z - bounds.zMin), Math.abs(pt.z - bounds.zMax)
                );

                if ((distOrigBorder <= BORDER_TOLERANCE || distCurBorder <= BORDER_TOLERANCE || distBounds <= BORDER_TOLERANCE) && distN < -0.2) {
                    isBorder = true;
                }
            }
        }

        return { isFoldedFlap, isBorder, foldVec, distN };
    }

    window.addEventListener('pointerdown', (e) => {
        if (isDoodleMode || (typeof isCutMode !== 'undefined' && isCutMode)) return;
        if (e.target.closest('#resetBtn') || e.target.closest('#cutBtn') || e.target.closest('#cutToolbar') || e.target.closest('#cutChoiceBar') || e.target.closest('#topRightBar') || e.target.closest('#rightCenterBar') || e.target.closest('#bottomRightBar') || e.target.closest('#settingsBtn') || e.target.closest('#slidersContainer') || e.target.closest('#toast')) {
            return;
        }
        if (isAnimating) return;

        // 检测双击（350ms 内连续点击触发平滑完全展开）
        const now = performance.now();
        if (now - lastClickTime < 350) {
            lastClickTime = 0;
            if (foldHistory.length > 0 || activeFold) {
                isDragging = false;
                controls.enabled = true;
                unfoldAll();
                return;
            }
        }
        lastClickTime = now;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const deskHits = raycaster.intersectObject(desk);
        if (deskHits.length === 0) return;
        const pt = deskHits[0].point;

        const bounds = getCurrentBounds();
        const margin = 1.5;
        const inBounds = (pt.x >= bounds.xMin - margin && pt.x <= bounds.xMax + margin &&
            pt.z >= bounds.zMin - margin && pt.z <= bounds.zMax + margin);

        if (inBounds) {
            isDragging = true;
            controls.enabled = false;
            dragStartDeskPt.copy(pt);

            if (activeFold) {
                dragLockedDirection = activeFold.dir;
                dragStartAngle = activeFold.angle;
                isStartOnBorder = false;
                isStartOnFoldedFlap = false;
                lastFoldVec = null;
            } else {
                dragLockedDirection = null;
                dragStartAngle = 0;

                const foldState = checkPointerFoldState(pt);
                isStartOnFoldedFlap = foldState.isFoldedFlap;
                isStartOnBorder = foldState.isBorder;
                lastFoldVec = foldState.foldVec;
                dragStartDistN = foldState.distN;
            }
            dragMode = null;
        }
    });

    window.addEventListener('pointermove', (e) => {
        if (isDoodleMode || !isDragging || isAnimating) return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const deskHits = raycaster.intersectObject(desk);
        if (deskHits.length === 0) return;
        const pt = deskHits[0].point;

        const dx = pt.x - dragStartDeskPt.x;
        const dz = pt.z - dragStartDeskPt.z;
        const dist = Math.sqrt(dx * dx + dz * dz);

        const bounds = getCurrentBounds();
        const wCurrent = Math.max(0.1, bounds.xMax - bounds.xMin);
        const hCurrent = Math.max(0.1, bounds.zMax - bounds.zMin);

        if (!dragLockedDirection && dist > 0.12) {
            // 1. 优先特殊识别：如果在已折叠状态下拖拽圆形/长方形边框，直接反向展开最后一次折叠
            if (foldHistory.length > 0 && !activeFold && lastFoldVec) {
                const dragAlongN = dx * lastFoldVec.n.x + dz * lastFoldVec.n.z;
                const shouldUnfold = (isStartOnBorder || isStartOnFoldedFlap) && dragAlongN > 0.15;

                if (shouldUnfold) {
                    dragMode = 'UNFOLD';
                    dragLockedDirection = lastFoldVec.dir;
                    activeFold = foldHistory.pop();
                    if (!activeFold.p0 || !activeFold.n) {
                        activeFold.p0 = lastFoldVec.p0;
                        activeFold.u = lastFoldVec.u;
                        activeFold.n = lastFoldVec.n;
                    }
                    dragStartAngle = Math.PI;
                    sfx.playRustle(0.8);
                    if (currentShape === 'circle' && activeFold.fromSector) {
                        currentSector = { ...activeFold.fromSector };
                    }
                    renderPaperTexture();
                    return;
                }
            }

            // 2. 检查剪切状态与最大对折次数限制（剪完之后限制不能再折，仅允许展开）
            if (typeof hasAnyCuts !== 'undefined' && hasAnyCuts) {
                if (dist > 0.35) {
                    showToast('已剪切纸张不能再折叠，可拖拽边框展开或双击纸面展开');
                }
                return;
            }

            if (foldHistory.length >= MAX_FOLDS) {
                return;
            }

            // 3. 选择新的对折
            if (foldMode === 'free') {
                // === 任意折上折模式 ===
                let effDx = dx;
                let effDz = dz;
                if (Math.abs(effDx) > 0.3 && Math.abs(effDz) / Math.abs(effDx) < 0.14) {
                    effDz = 0;
                } else if (Math.abs(effDz) > 0.3 && Math.abs(effDx) / Math.abs(effDz) < 0.14) {
                    effDx = 0;
                } else {
                    const diff45 = Math.abs(Math.abs(effDx) - Math.abs(effDz)) / (Math.abs(effDx) + Math.abs(effDz));
                    if (diff45 < 0.10) {
                        const avg = (Math.abs(effDx) + Math.abs(effDz)) / 2;
                        effDx = Math.sign(effDx) * avg;
                        effDz = Math.sign(effDz) * avg;
                    }
                }

                const effDist = Math.sqrt(effDx * effDx + effDz * effDz);
                if (effDist > 0.15) {
                    const dirX = effDx / effDist;
                    const dirZ = effDz / effDist;
                    const n = { x: -dirX, z: -dirZ };
                    const u = { x: dirZ, z: -dirX };
                    const p0 = {
                        x: dragStartDeskPt.x + effDx * 0.5,
                        z: dragStartDeskPt.z + effDz * 0.5
                    };

                    dragMode = 'FOLD';
                    dragLockedDirection = 'FREE_' + foldHistory.length;
                    activeFold = {
                        dir: dragLockedDirection,
                        isFree: true,
                        p0, u, n,
                        angle: 0,
                        dragStartDeskPt: dragStartDeskPt.clone()
                    };
                    dragStartAngle = 0;
                    sfx.playRustle(1.0);
                }
            } else if (currentShape === 'circle') {
                if (foldHistory.length === 0) {
                    let chosenDir = null;
                    let p0, u, n, toSector;
                    if (Math.abs(dx) > Math.abs(dz)) {
                        if (dx < 0) {
                            chosenDir = 'R2L';
                            p0 = { x: 0, z: 0 }; u = { x: 0, z: -1 }; n = { x: 1, z: 0 };
                            toSector = { start: Math.PI / 2, end: 3 * Math.PI / 2 };
                        } else {
                            chosenDir = 'L2R';
                            p0 = { x: 0, z: 0 }; u = { x: 0, z: 1 }; n = { x: -1, z: 0 };
                            toSector = { start: -Math.PI / 2, end: Math.PI / 2 };
                        }
                    } else {
                        if (dz < 0) {
                            chosenDir = 'B2T';
                            p0 = { x: 0, z: 0 }; u = { x: 1, z: 0 }; n = { x: 0, z: 1 };
                            toSector = { start: Math.PI, end: 2 * Math.PI };
                        } else {
                            chosenDir = 'T2B';
                            p0 = { x: 0, z: 0 }; u = { x: -1, z: 0 }; n = { x: 0, z: -1 };
                            toSector = { start: 0, end: Math.PI };
                        }
                    }
                    if (chosenDir) {
                        dragMode = 'FOLD';
                        dragLockedDirection = chosenDir;
                        activeFold = {
                            dir: chosenDir,
                            line: 0,
                            p0, u, n,
                            angle: 0,
                            fromSector: { start: 0, end: 2 * Math.PI },
                            toSector
                        };
                        dragStartAngle = 0;
                        sfx.playRustle(1.0);
                        renderPaperTexture();
                    }
                } else if (foldHistory.length === 1) {
                    const prevFold = foldHistory[0];
                    let chosenDir = null;
                    let p0 = { x: 0, z: 0 };
                    let u, n, toSector;

                    if (prevFold.dir === 'R2L' || prevFold.dir === 'L2R') {
                        if (dz < -0.15) {
                            chosenDir = 'B2T';
                            u = { x: 1, z: 0 }; n = { x: 0, z: 1 };
                            const targetBaseAngle = 3 * Math.PI / 2;
                            toSector = prevFold.dir === 'R2L'
                                ? { start: Math.PI, end: 3 * Math.PI / 2, targetBaseAngle }
                                : { start: 3 * Math.PI / 2, end: 2 * Math.PI, targetBaseAngle };
                        } else if (dz > 0.15) {
                            chosenDir = 'T2B';
                            u = { x: -1, z: 0 }; n = { x: 0, z: -1 };
                            const targetBaseAngle = Math.PI / 2;
                            toSector = prevFold.dir === 'R2L'
                                ? { start: Math.PI / 2, end: Math.PI, targetBaseAngle }
                                : { start: 0, end: Math.PI / 2, targetBaseAngle };
                        }
                    } else {
                        if (dx < -0.15) {
                            chosenDir = 'R2L';
                            u = { x: 0, z: -1 }; n = { x: 1, z: 0 };
                            const targetBaseAngle = Math.PI;
                            toSector = prevFold.dir === 'B2T'
                                ? { start: Math.PI, end: 3 * Math.PI / 2, targetBaseAngle }
                                : { start: Math.PI / 2, end: Math.PI, targetBaseAngle };
                        } else if (dx > 0.15) {
                            chosenDir = 'L2R';
                            u = { x: 0, z: 1 }; n = { x: -1, z: 0 };
                            const targetBaseAngle = 0;
                            toSector = prevFold.dir === 'B2T'
                                ? { start: 3 * Math.PI / 2, end: 2 * Math.PI, targetBaseAngle }
                                : { start: 0, end: Math.PI / 2, targetBaseAngle };
                        }
                    }

                    if (chosenDir) {
                        dragMode = 'FOLD';
                        dragLockedDirection = chosenDir;
                        activeFold = {
                            dir: chosenDir,
                            line: 0,
                            p0, u, n,
                            angle: 0,
                            fromSector: { ...currentSector },
                            toSector
                        };
                        dragStartAngle = 0;
                        sfx.playRustle(1.0);
                        renderPaperTexture();
                    }
                } else {
                    let s1 = currentSector.start;
                    let s2 = currentSector.end;
                    while (s2 < s1) s2 += Math.PI * 2;
                    const thetaMid = (s1 + s2) / 2;

                    const baseAngle = (currentSector.targetBaseAngle !== undefined && currentSector.targetBaseAngle !== null)
                        ? currentSector.targetBaseAngle
                        : s2;

                    const isS1Base = angleDistance(s1, baseAngle) <= angleDistance(s2, baseAngle);
                    const targetBase = isS1Base ? s1 : s2;

                    let u, n, toSector;
                    if (isS1Base) {
                        u = { x: Math.cos(thetaMid), z: Math.sin(thetaMid) };
                        n = { x: -Math.sin(thetaMid), z: Math.cos(thetaMid) };
                        toSector = { start: s1, end: thetaMid, targetBaseAngle: targetBase };
                    } else {
                        u = { x: -Math.cos(thetaMid), z: -Math.sin(thetaMid) };
                        n = { x: Math.sin(thetaMid), z: -Math.cos(thetaMid) };
                        toSector = { start: thetaMid, end: s2, targetBaseAngle: targetBase };
                    }

                    const dragTowardsBase = -(dx * n.x + dz * n.z);

                    if (dragTowardsBase > 0.15) {
                        const chosenDir = 'RADIAL_' + foldHistory.length;
                        dragMode = 'FOLD';
                        dragLockedDirection = chosenDir;
                        activeFold = {
                            dir: chosenDir,
                            line: 0,
                            p0: { x: 0, z: 0 },
                            u, n,
                            angle: 0,
                            fromSector: { ...currentSector },
                            toSector
                        };
                        dragStartAngle = 0;
                        sfx.playRustle(1.0);
                        renderPaperTexture();
                    }
                }
            } else {
                const OPPOSITE_DIRS = {
                    'R2L': 'L2R',
                    'L2R': 'R2L',
                    'B2T': 'T2B',
                    'T2B': 'B2T'
                };

                const lastFold = foldHistory.length > 0 ? foldHistory[foldHistory.length - 1] : null;
                const disallowedDir = (lastFold && OPPOSITE_DIRS[lastFold.dir]) ? OPPOSITE_DIRS[lastFold.dir] : null;

                let chosenDir = null;
                if (Math.abs(dx) > Math.abs(dz)) {
                    if (dx < 0 && disallowedDir !== 'R2L') {
                        chosenDir = 'R2L';
                    } else if (dx > 0 && disallowedDir !== 'L2R') {
                        chosenDir = 'L2R';
                    } else {
                        if (dz < -0.15 && disallowedDir !== 'B2T') {
                            chosenDir = 'B2T';
                        } else if (dz > 0.15 && disallowedDir !== 'T2B') {
                            chosenDir = 'T2B';
                        }
                    }
                } else {
                    if (dz < 0 && disallowedDir !== 'B2T') {
                        chosenDir = 'B2T';
                    } else if (dz > 0 && disallowedDir !== 'T2B') {
                        chosenDir = 'T2B';
                    } else {
                        if (dx < -0.15 && disallowedDir !== 'R2L') {
                            chosenDir = 'R2L';
                        } else if (dx > 0.15 && disallowedDir !== 'L2R') {
                            chosenDir = 'L2R';
                        }
                    }
                }

                if (chosenDir) {
                    dragMode = 'FOLD';
                    dragLockedDirection = chosenDir;
                    const midX = (bounds.xMin + bounds.xMax) / 2;
                    const midZ = (bounds.zMin + bounds.zMax) / 2;
                    let p0, u, n;
                    if (chosenDir === 'R2L') {
                        p0 = { x: midX, z: 0 }; u = { x: 0, z: -1 }; n = { x: 1, z: 0 };
                    } else if (chosenDir === 'L2R') {
                        p0 = { x: midX, z: 0 }; u = { x: 0, z: 1 }; n = { x: -1, z: 0 };
                    } else if (chosenDir === 'B2T') {
                        p0 = { x: 0, z: midZ }; u = { x: 1, z: 0 }; n = { x: 0, z: 1 };
                    } else if (chosenDir === 'T2B') {
                        p0 = { x: 0, z: midZ }; u = { x: -1, z: 0 }; n = { x: 0, z: -1 };
                    }

                    activeFold = {
                        dir: chosenDir,
                        line: (chosenDir === 'R2L' || chosenDir === 'L2R') ? midX : midZ,
                        p0, u, n,
                        angle: 0
                    };
                    dragStartAngle = 0;
                    sfx.playRustle(1.0);
                    renderPaperTexture();
                }
            }
        }

        if (activeFold) {
            if (activeFold.isFree) {
                if (dragMode === 'FOLD') {
                    let curDx = pt.x - activeFold.dragStartDeskPt.x;
                    let curDz = pt.z - activeFold.dragStartDeskPt.z;
                    if (Math.abs(curDx) > 0.3 && Math.abs(curDz) / Math.abs(curDx) < 0.14) {
                        curDz = 0;
                    } else if (Math.abs(curDz) > 0.3 && Math.abs(curDx) / Math.abs(curDz) < 0.14) {
                        curDx = 0;
                    } else {
                        const diff45 = Math.abs(Math.abs(curDx) - Math.abs(curDz)) / (Math.abs(curDx) + Math.abs(curDz));
                        if (diff45 < 0.10) {
                            const avg = (Math.abs(curDx) + Math.abs(curDz)) / 2;
                            curDx = Math.sign(curDx) * avg;
                            curDz = Math.sign(curDz) * avg;
                        }
                    }

                    const curDist = Math.sqrt(curDx * curDx + curDz * curDz);
                    if (curDist > 0.1) {
                        const dirX = curDx / curDist;
                        const dirZ = curDz / curDist;
                        activeFold.n = { x: -dirX, z: -dirZ };
                        activeFold.u = { x: dirZ, z: -dirX };
                        activeFold.p0 = {
                            x: activeFold.dragStartDeskPt.x + curDx * 0.5,
                            z: activeFold.dragStartDeskPt.z + curDz * 0.5
                        };
                    }

                    const flipDistThreshold = 1.2;
                    activeFold.angle = Math.min(Math.PI, (curDist / flipDistThreshold) * Math.PI);
                    updatePaperGeometry();
                } else if (dragMode === 'UNFOLD') {
                    const dragAlongN = dx * activeFold.n.x + dz * activeFold.n.z;
                    const flapExtent = Math.max(3.0, Math.abs(dragStartDistN) * 1.5);
                    const progress = dragAlongN / flapExtent;
                    let targetAngle = dragStartAngle - progress * Math.PI;
                    activeFold.angle = Math.max(0, Math.min(Math.PI, targetAngle));
                    updatePaperGeometry();
                }
            } else {
                let progress = 0;
                if (activeFold.dir === 'R2L') {
                    progress = -dx / (wCurrent / 2);
                } else if (activeFold.dir === 'L2R') {
                    progress = dx / (wCurrent / 2);
                } else if (activeFold.dir === 'B2T') {
                    progress = -dz / (hCurrent / 2);
                } else if (activeFold.dir === 'T2B') {
                    progress = dz / (hCurrent / 2);
                } else if (activeFold.n) {
                    const dragAlongNegN = -(dx * activeFold.n.x + dz * activeFold.n.z);
                    const flapSpan = activeFold.fromSector ? Math.abs(activeFold.fromSector.end - activeFold.fromSector.start) / 2 : Math.PI / 4;
                    const flapExtent = Math.max(1.8, (circleDiameter / 2) * Math.sin(flapSpan));
                    progress = dragAlongNegN / flapExtent;
                }

                let targetAngle = dragStartAngle + progress * Math.PI;
                activeFold.angle = Math.max(0, Math.min(Math.PI, targetAngle));
                updatePaperGeometry();
            }
        }
    });

    window.addEventListener('pointerup', () => {
        if (!isDragging) return;
        isDragging = false;
        controls.enabled = true;

        if (activeFold) {
            const angle = activeFold.angle;
            if (dragMode === 'UNFOLD') {
                if (angle < Math.PI * 0.65) {
                    animateSnapTo(0);
                } else {
                    animateSnapTo(Math.PI);
                }
            } else if (activeFold.isFree) {
                if (angle >= Math.PI * 0.45) {
                    animateSnapTo(Math.PI);
                } else {
                    animateSnapTo(0);
                }
            } else {
                if (angle >= Math.PI * 0.5) {
                    animateSnapTo(Math.PI);
                } else {
                    animateSnapTo(0);
                }
            }
        }
    });

    function animateSnapTo(targetAngle) {
        if (!activeFold) return;
        isAnimating = true;

        const startAngle = activeFold.angle;
        const startTime = performance.now();
        const duration = 220;

        function frame(time) {
            const elapsed = time - startTime;
            const p = Math.min(elapsed / duration, 1.0);
            const ease = p * (2 - p);

            activeFold.angle = startAngle + (targetAngle - startAngle) * ease;
            updatePaperGeometry();

            if (p < 1.0) {
                requestAnimationFrame(frame);
            } else {
                activeFold.angle = targetAngle;
                updatePaperGeometry();
                isAnimating = false;

                if (targetAngle === Math.PI) {
                    sfx.playFoldSnap();
                    foldHistory.push(activeFold);
                    if (activeFold.isFree) {
                        addPersistentCrease(activeFold);
                    }
                    if (currentShape === 'circle' && activeFold.toSector) {
                        currentSector = { ...activeFold.toSector };
                    }
                } else {
                    sfx.playUnfoldSnap();
                }
                activeFold = null;
                renderPaperTexture();
            }
        }
        requestAnimationFrame(frame);
    }

    // ==========================================
    // 8.2 增强版折后剪纸系统 (支持任意曲线、边缘挖剪、闭合图形、线条镂空与几何形状)
    // ==========================================
    const cutBtn = document.getElementById('cutBtn');
    const cutToolbar = document.getElementById('cutToolbar');
    const cutChoiceBar = document.getElementById('cutChoiceBar');
    const swapCutChoiceBtn = document.getElementById('swapCutChoiceBtn');
    const confirmCutChoiceBtn = document.getElementById('confirmCutChoiceBtn');
    const undoCutBtn = document.getElementById('undoCutBtn');
    const unfoldAfterCutBtn = document.getElementById('unfoldAfterCutBtn');
    const cutCanvas = document.getElementById('cutCanvas');
    const cutCtx = cutCanvas ? cutCanvas.getContext('2d') : null;

    let isCutMode = false;
    let currentCutTool = 'free'; // 'free' | 'carve' | 'line' | 'heart' | 'star' | 'circle' | 'petal'
    let isDrawingCut = false;
    let cutStrokeState = null;
    // 保存最近一次完成剪切的区域数据，支持用户在剪切后自由点击切换“剪去哪部分、保留哪部分”
    let lastCutSession = null;

    // 展开状态下的高清剪纸掩码 (1024x1024)
    const MASK_RES = 1024;
    const cutMaskCanvas = document.createElement('canvas');
    cutMaskCanvas.width = MASK_RES;
    cutMaskCanvas.height = MASK_RES;
    const cutMaskCtx = cutMaskCanvas.getContext('2d');

    const cutBorderCanvas = document.createElement('canvas');
    cutBorderCanvas.width = MASK_RES;
    cutBorderCanvas.height = MASK_RES;
    const cutBorderCtx = cutBorderCanvas.getContext('2d');

    // 平面纸张每个像素是否被剪除的标记数组 (1 = 已剪除, 0 = 保留) 与连续抗锯齿遮罩 (0.0 ~ 1.0)
    const flatCutFlags = new Uint8Array(MASK_RES * MASK_RES);
    const flatCutMask = new Float32Array(MASK_RES * MASK_RES);
    const smoothedCutMask = new Float32Array(MASK_RES * MASK_RES);
    const flatBfsVisited = new Uint8Array(MASK_RES * MASK_RES);
    const flatBfsQueue = new Int32Array(MASK_RES * MASK_RES);
    const cutUndoStack = []; // 保存每次剪切前的 flatCutMask 快照，支持多步撤销
    let hasAnyCuts = false;

    // 桌面坐标系下的高清剪切画布 (1024x1024) 与实时拓扑求解网格 (220x220)
    const DESK_MASK_RES = 1024;
    const deskCutCanvas = document.createElement('canvas');
    deskCutCanvas.width = DESK_MASK_RES;
    deskCutCanvas.height = DESK_MASK_RES;
    const deskCutCtx = deskCutCanvas.getContext('2d');

    const SOLVER_RES = 220;
    const solverCanvas = document.createElement('canvas');
    solverCanvas.width = SOLVER_RES;
    solverCanvas.height = SOLVER_RES;
    const solverCtx = solverCanvas.getContext('2d');

    // 当前折叠状态下桌面纸张的2D轮廓掩码与边界点缓存
    const paperSilhouette = new Uint8Array(SOLVER_RES * SOLVER_RES);
    const previewCutGrid = new Uint8Array(SOLVER_RES * SOLVER_RES);
    const previewKeptGrid = new Uint8Array(SOLVER_RES * SOLVER_RES);
    const bfsVisited = new Uint8Array(SOLVER_RES * SOLVER_RES);
    const bfsQueue = new Int32Array(SOLVER_RES * SOLVER_RES);
    let silhouetteBoundaryPts = []; // [{x, z, gx, gz}]

    function getDeskHalfSpan() {
        return Math.max(paperW, paperH, circleDiameter) * 0.65;
    }

    function worldToSolverGrid(wx, wz) {
        const span = getDeskHalfSpan() * 2;
        const gx = Math.floor(((wx / span) + 0.5) * SOLVER_RES);
        const gz = Math.floor(((wz / span) + 0.5) * SOLVER_RES);
        return {
            gx: Math.max(0, Math.min(SOLVER_RES - 1, gx)),
            gz: Math.max(0, Math.min(SOLVER_RES - 1, gz))
        };
    }

    function solverGridToWorld(gx, gz) {
        const span = getDeskHalfSpan() * 2;
        return {
            x: (((gx + 0.5) / SOLVER_RES) - 0.5) * span,
            z: (((gz + 0.5) / SOLVER_RES) - 0.5) * span
        };
    }

    function worldToCanvasPt(wx, wz, res) {
        const span = getDeskHalfSpan() * 2;
        return {
            x: ((wx / span) + 0.5) * res,
            y: ((wz / span) + 0.5) * res
        };
    }

    // 提取当前所有折叠层的反射平面参数（用于快速坐标映射）
    function getCompiledFoldPlanes(folds = foldHistory) {
        return folds.map(f => {
            const { p0, n } = extractFoldPlane(f);
            return { p0x: p0.x, p0z: p0.z, nx: n.x, nz: n.z };
        });
    }

    // 计算当前折叠状态下纸张在桌面上的2D投影轮廓
    function rebuildFoldedPaperSilhouette() {
        paperSilhouette.fill(0);
        silhouetteBoundaryPts = [];

        const planes = getCompiledFoldPlanes(foldHistory);
        const numFolds = planes.length;
        const span = getDeskHalfSpan() * 2;
        const isCircle = currentShape === 'circle';
        const rSq = (circleDiameter / 2) * (circleDiameter / 2);

        const SAMPLES = 380;
        for (let sy = 0; sy < SAMPLES; sy++) {
            const v = (sy + 0.5) / SAMPLES;
            const oz = (v - 0.5) * paperH;
            const my = Math.min(MASK_RES - 1, Math.floor(v * MASK_RES));
            const mRow = my * MASK_RES;

            for (let sx = 0; sx < SAMPLES; sx++) {
                const u = (sx + 0.5) / SAMPLES;
                const ox = (u - 0.5) * paperW;

                if (isCircle && (ox * ox + oz * oz > rSq)) continue;

                const mx = Math.min(MASK_RES - 1, Math.floor(u * MASK_RES));
                if (flatCutFlags[mRow + mx] === 1) continue;

                let curX = ox;
                let curZ = oz;
                for (let s = 0; s < numFolds; s++) {
                    const pl = planes[s];
                    const d = (curX - pl.p0x) * pl.nx + (curZ - pl.p0z) * pl.nz;
                    if (d > 0.0001) {
                        curX -= 2 * d * pl.nx;
                        curZ -= 2 * d * pl.nz;
                    }
                }

                const gx = Math.floor(((curX / span) + 0.5) * SOLVER_RES);
                const gz = Math.floor(((curZ / span) + 0.5) * SOLVER_RES);
                if (gx >= 0 && gx < SOLVER_RES && gz >= 0 && gz < SOLVER_RES) {
                    const idx = gz * SOLVER_RES + gx;
                    paperSilhouette[idx] = 1;
                    if (gx + 1 < SOLVER_RES) paperSilhouette[idx + 1] = 1;
                    if (gz + 1 < SOLVER_RES) paperSilhouette[idx + SOLVER_RES] = 1;
                }
            }
        }

        // 提取轮廓外边缘点集合，供自由画线智能吸附/延伸到纸张边缘使用
        for (let gz = 1; gz < SOLVER_RES - 1; gz++) {
            const row = gz * SOLVER_RES;
            for (let gx = 1; gx < SOLVER_RES - 1; gx++) {
                const idx = row + gx;
                if (paperSilhouette[idx] === 1) {
                    if (paperSilhouette[idx - 1] === 0 || paperSilhouette[idx + 1] === 0 ||
                        paperSilhouette[idx - SOLVER_RES] === 0 || paperSilhouette[idx + SOLVER_RES] === 0) {
                        const wPt = solverGridToWorld(gx, gz);
                        silhouetteBoundaryPts.push({ x: wPt.x, z: wPt.z, gx, gz });
                    }
                }
            }
        }
    }

    // 查询世界坐标点距离折纸边缘的最近点与距离
    function findNearestBoundaryInfo(wx, wz) {
        const { gx, gz } = worldToSolverGrid(wx, wz);
        const inside = paperSilhouette[gz * SOLVER_RES + gx] === 1;
        let minDist = Infinity;
        let nearestPt = { x: wx, z: wz };
        for (let i = 0; i < silhouetteBoundaryPts.length; i++) {
            const bp = silhouetteBoundaryPts[i];
            const d = Math.hypot(wx - bp.x, wz - bp.z);
            if (d < minDist) {
                minDist = d;
                nearestPt = bp;
            }
        }
        return { inside, dist: inside ? minDist : 0, nearestPt };
    }

    // 在 Canvas2D 上绘制预设几何形状路径 (心形、五角星、圆形、花瓣)
    function tracePresetShapePath(ctx, tool, startW, curW, res) {
        const s = worldToCanvasPt(startW.x, startW.z, res);
        const c = worldToCanvasPt(curW.x, curW.z, res);
        const dx = c.x - s.x;
        const dy = c.y - s.y;
        const r = Math.hypot(dx, dy);
        if (r < 2) return;
        const angle = Math.atan2(dy, dx) - Math.PI / 2;

        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(angle);
        ctx.beginPath();

        if (tool === 'circle') {
            ctx.arc(0, 0, r, 0, Math.PI * 2);
        } else if (tool === 'star') {
            const spikes = 5;
            const outerR = r;
            const innerR = r * 0.42;
            for (let i = 0; i < spikes * 2; i++) {
                const rad = i % 2 === 0 ? outerR : innerR;
                const a = (i * Math.PI) / spikes - Math.PI / 2;
                const px = Math.cos(a) * rad;
                const py = Math.sin(a) * rad;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
        } else if (tool === 'heart') {
            const steps = 48;
            for (let i = 0; i <= steps; i++) {
                const t = (i / steps) * Math.PI * 2;
                const hx = 16 * Math.pow(Math.sin(t), 3);
                const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                const px = (hx / 16) * r;
                const py = (hy / 16) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
        } else if (tool === 'petal') {
            // 优美的水滴/花瓣纹样，从起点向外舒展
            const steps = 40;
            for (let i = 0; i <= steps; i++) {
                const t = (i / steps) * Math.PI * 2;
                // 水滴参数方程
                const px = r * 0.52 * Math.sin(t) * Math.pow(Math.sin(t / 2), 1.2);
                const py = r * (1 - Math.cos(t)) * 0.5;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
        }
        ctx.restore();
    }

    // 检测折线是否存在自相交
    function checkSelfIntersection(pts) {
        const n = pts.length;
        if (n < 6) return false;
        const ccw = (A, B, C) => (C.z - A.z) * (B.x - A.x) > (B.z - A.z) * (C.x - A.x);
        const intersect = (A, B, C, D) => ccw(A, C, D) !== ccw(B, C, D) && ccw(A, B, C) !== ccw(A, B, D);
        for (let i = 0; i < n - 3; i++) {
            for (let j = i + 2; j < n - 1; j++) {
                if (intersect(pts[i], pts[i + 1], pts[j], pts[j + 1])) {
                    return true;
                }
            }
        }
        return false;
    }

    // 智能平滑算法：自动识别近似直线并拉直，对弧线进行高斯去抖与 Catmull-Rom 样条平滑插值
    function getSmoothedCutPoints(rawPts, isClosed = false) {
        if (!rawPts || rawPts.length < 2) return rawPts ? rawPts.slice() : [];

        // 1. 过滤距离过近的采样点
        const pts = [rawPts[0]];
        for (let i = 1; i < rawPts.length; i++) {
            const prev = pts[pts.length - 1];
            if (Math.hypot(rawPts[i].x - prev.x, rawPts[i].z - prev.z) > 0.08 || i === rawPts.length - 1) {
                pts.push(rawPts[i]);
            }
        }
        if (pts.length <= 2) return pts;

        const pStart = pts[0];
        const pEnd = pts[pts.length - 1];
        const chordLen = Math.hypot(pEnd.x - pStart.x, pEnd.z - pStart.z);
        let totalLen = 0;
        for (let i = 1; i < pts.length; i++) {
            totalLen += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].z - pts[i - 1].z);
        }

        // 2. 若非闭合且整体非常接近直线，则自动拟合为笔直切线
        if (!isClosed && chordLen > 0.35) {
            const ux = (pEnd.x - pStart.x) / chordLen;
            const uz = (pEnd.z - pStart.z) / chordLen;
            let maxDev = 0;
            for (let i = 1; i < pts.length - 1; i++) {
                const dev = Math.abs((pts[i].x - pStart.x) * (-uz) + (pts[i].z - pStart.z) * ux);
                if (dev > maxDev) maxDev = dev;
            }
            if (maxDev < Math.max(0.18, chordLen * 0.042) && totalLen < chordLen * 1.08) {
                return [pStart, pEnd];
            }
        }

        // 3. 等弧长重采样，消除手绘速度不均导致的折角
        const step = 0.22;
        const numSamples = Math.max(4, Math.min(200, Math.round(totalLen / step)));
        const resampled = [{ x: pts[0].x, z: pts[0].z }];
        let accum = 0;
        let segIdx = 0;
        let segStart = pts[0];

        for (let k = 1; k < numSamples; k++) {
            const targetDist = (k / numSamples) * totalLen;
            while (segIdx < pts.length - 1) {
                const segEnd = pts[segIdx + 1];
                const segLen = Math.hypot(segEnd.x - segStart.x, segEnd.z - segStart.z);
                if (accum + segLen >= targetDist) {
                    const t = segLen > 1e-5 ? (targetDist - accum) / segLen : 0;
                    resampled.push({
                        x: segStart.x + (segEnd.x - segStart.x) * t,
                        z: segStart.z + (segEnd.z - segStart.z) * t
                    });
                    break;
                }
                accum += segLen;
                segIdx++;
                segStart = pts[segIdx];
            }
        }
        if (!isClosed) {
