            resampled.push({ x: pEnd.x, z: pEnd.z });
        }

        const m = resampled.length;
        if (m <= 2) return resampled;

        // 4. 识别用户刻意折出的尖角（如剪三角形缺口），避免把尖角过度磨圆
        const isCorner = new Uint8Array(m);
        if (!isClosed) {
            isCorner[0] = 1;
            isCorner[m - 1] = 1;
        }
        const win = 2;
        for (let i = win; i < m - win; i++) {
            const pPrev = resampled[i - win];
            const pCurr = resampled[i];
            const pNext = resampled[i + win];
            const v1x = pCurr.x - pPrev.x, v1z = pCurr.z - pPrev.z;
            const v2x = pNext.x - pCurr.x, v2z = pNext.z - pCurr.z;
            const l1 = Math.hypot(v1x, v1z), l2 = Math.hypot(v2x, v2z);
            if (l1 > 0.05 && l2 > 0.05) {
                const cosA = (v1x * v2x + v1z * v2z) / (l1 * l2);
                if (cosA < 0.45) { // 转折角大于约 63° 视为刻意拐角
                    isCorner[i] = 1;
                }
            }
        }

        // 5. 多轮高斯核平滑滤波，彻底消除手抖锯齿
        let currPts = resampled;
        const passes = 4;
        for (let p = 0; p < passes; p++) {
            const nextPts = currPts.map(pt => ({ x: pt.x, z: pt.z }));
            for (let i = 0; i < m; i++) {
                if (!isClosed && (i === 0 || i === m - 1)) continue;
                if (isCorner[i]) continue;
                const iPrev = (i - 1 + m) % m;
                const iNext = (i + 1) % m;
                nextPts[i].x = 0.25 * currPts[iPrev].x + 0.5 * currPts[i].x + 0.25 * currPts[iNext].x;
                nextPts[i].z = 0.25 * currPts[iPrev].z + 0.5 * currPts[i].z + 0.25 * currPts[iNext].z;
            }
            currPts = nextPts;
        }

        // 6. Catmull-Rom 样条曲线加密插值，生成丝滑圆弧点列
        const splinePts = [];
        const subdivisions = 3;
        const count = isClosed ? m : m - 1;
        for (let i = 0; i < count; i++) {
            const p0 = currPts[isClosed ? (i - 1 + m) % m : Math.max(0, i - 1)];
            const p1 = currPts[i];
            const p2 = currPts[(i + 1) % m];
            const p3 = currPts[isClosed ? (i + 2) % m : Math.min(m - 1, i + 2)];

            if (isCorner[i] && isCorner[(i + 1) % m]) {
                splinePts.push({ x: p1.x, z: p1.z });
                continue;
            }

            for (let s = 0; s < subdivisions; s++) {
                const t = s / subdivisions;
                const t2 = t * t;
                const t3 = t2 * t;
                const x = 0.5 * (
                    (2 * p1.x) +
                    (-p0.x + p2.x) * t +
                    (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
                    (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
                );
                const z = 0.5 * (
                    (2 * p1.z) +
                    (-p0.z + p2.z) * t +
                    (2 * p0.z - 5 * p1.z + 4 * p2.z - p3.z) * t2 +
                    (-p0.z + 3 * p1.z - 3 * p2.z + p3.z) * t3
                );
                splinePts.push({ x, z });
            }
        }
        if (!isClosed) {
            splinePts.push({ x: currPts[m - 1].x, z: currPts[m - 1].z });
        }
        return splinePts;
    }

    // 在 Canvas2D 上使用二次贝塞尔曲线绘制光滑路径
    function traceSmoothCurveOnCtx(ctx, worldPts, res, closePath = false) {
        if (!worldPts || worldPts.length < 2) return;
        const cPts = worldPts.map(p => worldToCanvasPt(p.x, p.z, res));
        ctx.beginPath();
        ctx.moveTo(cPts[0].x, cPts[0].y);
        if (cPts.length === 2) {
            ctx.lineTo(cPts[1].x, cPts[1].y);
        } else {
            for (let i = 1; i < cPts.length - 1; i++) {
                const mx = (cPts[i].x + cPts[i + 1].x) * 0.5;
                const my = (cPts[i].y + cPts[i + 1].y) * 0.5;
                ctx.quadraticCurveTo(cPts[i].x, cPts[i].y, mx, my);
            }
            const last = cPts[cPts.length - 1];
            ctx.lineTo(last.x, last.y);
        }
        if (closePath) ctx.closePath();
    }

    // 计算网格区域内部的视觉中心点（极点算法，确保标签落在区域内部）
    function computeGridVisualCenter(grid) {
        let sumX = 0, sumZ = 0, count = 0;
        for (let gz = 0; gz < SOLVER_RES; gz++) {
            const row = gz * SOLVER_RES;
            for (let gx = 0; gx < SOLVER_RES; gx++) {
                if (grid[row + gx] === 1) {
                    sumX += gx;
                    sumZ += gz;
                    count++;
                }
            }
        }
        if (count === 0) return { x: 0, z: 0, valid: false };
        const avgX = sumX / count;
        const avgZ = sumZ / count;

        const boundaryPts = [];
        for (let gz = 1; gz < SOLVER_RES - 1; gz++) {
            const row = gz * SOLVER_RES;
            for (let gx = 1; gx < SOLVER_RES - 1; gx++) {
                const idx = row + gx;
                if (grid[idx] === 1) {
                    if (grid[idx - 1] === 0 || grid[idx + 1] === 0 ||
                        grid[idx - SOLVER_RES] === 0 || grid[idx + SOLVER_RES] === 0) {
                        boundaryPts.push({ gx, gz });
                    }
                }
            }
        }

        let bestGx = Math.round(avgX);
        let bestGz = Math.round(avgZ);
        let bestScore = -Infinity;

        for (let gz = 2; gz < SOLVER_RES - 2; gz += 3) {
            const row = gz * SOLVER_RES;
            for (let gx = 2; gx < SOLVER_RES - 2; gx += 3) {
                if (grid[row + gx] === 1) {
                    let minDistB = 999;
                    for (let b = 0; b < boundaryPts.length; b += 2) {
                        const d = Math.hypot(gx - boundaryPts[b].gx, gz - boundaryPts[b].gz);
                        if (d < minDistB) minDistB = d;
                    }
                    const distC = Math.hypot(gx - avgX, gz - avgZ);
                    const score = minDistB - distC * 0.18;
                    if (score > bestScore) {
                        bestScore = score;
                        bestGx = gx;
                        bestGz = gz;
                    }
                }
            }
        }

        const wPt = solverGridToWorld(bestGx, bestGz);
        return { x: wPt.x, z: wPt.z, valid: true };
    }

    // 核心算法：根据当前工具、点集以及是否反转(invertChoice)，计算 previewCutGrid 和 previewKeptGrid，并可选生成高清 deskCutCanvas
    function evaluateCurrentCutRegion(renderHighRes = false, strokeObj = cutStrokeState, invertChoice = false) {
        previewCutGrid.fill(0);
        previewKeptGrid.fill(0);
        if (renderHighRes) {
            deskCutCtx.clearRect(0, 0, DESK_MASK_RES, DESK_MASK_RES);
        }
        if (!strokeObj || !strokeObj.pts3D || strokeObj.pts3D.length < 2) {
            return false;
        }

        const tool = strokeObj.tool || currentCutTool;
        const rawPts = strokeObj.pts3D;
        const pStartRaw = rawPts[0];
        const pEndRaw = rawPts[rawPts.length - 1];
        const span = getDeskHalfSpan() * 2;

        // 辅助函数：根据默认剪除掩码 defaultCutMask (1=默认剪去, 0=默认保留) 和 invertChoice 填充 previewCutGrid 与 previewKeptGrid
        const commitSolverGrids = () => {
            let cutCount = 0, keptCount = 0;
            for (let i = 0; i < SOLVER_RES * SOLVER_RES; i++) {
                if (paperSilhouette[i] === 1) {
                    const isDefaultCut = previewCutGrid[i] === 1;
                    const finalCut = invertChoice ? !isDefaultCut : isDefaultCut;
                    if (finalCut) {
                        previewCutGrid[i] = 1;
                        previewKeptGrid[i] = 0;
                        cutCount++;
                    } else {
                        previewCutGrid[i] = 0;
                        previewKeptGrid[i] = 1;
                        keptCount++;
                    }
                } else {
                    previewCutGrid[i] = 0;
                    previewKeptGrid[i] = 0;
                }
            }
            return cutCount > 0 && keptCount > 0;
        };

        // 1. 预设几何形状模式 ('heart' | 'star' | 'circle' | 'petal')
        if (tool === 'heart' || tool === 'star' || tool === 'circle' || tool === 'petal') {
            const dist = Math.hypot(pEndRaw.x - pStartRaw.x, pEndRaw.z - pStartRaw.z);
            if (dist < 0.35) return false;

            solverCtx.clearRect(0, 0, SOLVER_RES, SOLVER_RES);
            solverCtx.fillStyle = '#ffffff';
            tracePresetShapePath(solverCtx, tool, pStartRaw, pEndRaw, SOLVER_RES);
            solverCtx.fill();

            const imgData = solverCtx.getImageData(0, 0, SOLVER_RES, SOLVER_RES).data;
            for (let i = 0; i < SOLVER_RES * SOLVER_RES; i++) {
                if (paperSilhouette[i] === 1 && imgData[i * 4 + 3] > 100) {
                    previewCutGrid[i] = 1;
                }
            }

            const valid = commitSolverGrids();
            if (renderHighRes && valid) {
                if (!invertChoice) {
                    deskCutCtx.fillStyle = '#ffffff';
                    tracePresetShapePath(deskCutCtx, tool, pStartRaw, pEndRaw, DESK_MASK_RES);
                    deskCutCtx.fill();
                } else {
                    deskCutCtx.fillStyle = '#ffffff';
                    deskCutCtx.fillRect(0, 0, DESK_MASK_RES, DESK_MASK_RES);
                    deskCutCtx.save();
                    deskCutCtx.globalCompositeOperation = 'destination-out';
                    tracePresetShapePath(deskCutCtx, tool, pStartRaw, pEndRaw, DESK_MASK_RES);
                    deskCutCtx.fill();
                    deskCutCtx.restore();
                }
            }
            return valid;
        }

        // 2. 线条镂空模式 ('carve')：画任意线条或曲线直接刻出光滑镂空通道
        if (tool === 'carve') {
            const pts = getSmoothedCutPoints(rawPts, false);
            let totalLen = 0;
            for (let i = 1; i < pts.length; i++) {
                totalLen += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].z - pts[i - 1].z);
            }
            if (totalLen < 0.35) return false;

            const worldStrokeWidth = 0.48;

            const drawCarveStroke = (ctx, res) => {
                ctx.save();
                traceSmoothCurveOnCtx(ctx, pts, res, false);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = (worldStrokeWidth / span) * res;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
                ctx.restore();
            };

            solverCtx.clearRect(0, 0, SOLVER_RES, SOLVER_RES);
            drawCarveStroke(solverCtx, SOLVER_RES);
            const imgData = solverCtx.getImageData(0, 0, SOLVER_RES, SOLVER_RES).data;
            for (let i = 0; i < SOLVER_RES * SOLVER_RES; i++) {
                if (paperSilhouette[i] === 1 && imgData[i * 4 + 3] > 100) {
                    previewCutGrid[i] = 1;
                }
            }

            const valid = commitSolverGrids();
            if (renderHighRes && valid) {
                if (!invertChoice) {
                    drawCarveStroke(deskCutCtx, DESK_MASK_RES);
                } else {
                    deskCutCtx.fillStyle = '#ffffff';
                    deskCutCtx.fillRect(0, 0, DESK_MASK_RES, DESK_MASK_RES);
                    deskCutCtx.save();
                    deskCutCtx.globalCompositeOperation = 'destination-out';
                    drawCarveStroke(deskCutCtx, DESK_MASK_RES);
                    deskCutCtx.restore();
                }
            }
            return valid;
        }

        // 3. 直线剪模式 ('line')：拉出贯穿折纸的直线
        if (tool === 'line') {
            const vx = pEndRaw.x - pStartRaw.x;
            const vz = pEndRaw.z - pStartRaw.z;
            const len = Math.hypot(vx, vz);
            if (len < 0.45) return false;

            let nx = -vz / len;
            let nz = vx / len;

            let cPos = 0, cNeg = 0;
            for (let gz = 0; gz < SOLVER_RES; gz++) {
                const row = gz * SOLVER_RES;
                for (let gx = 0; gx < SOLVER_RES; gx++) {
                    if (paperSilhouette[row + gx] === 1) {
                        const wPt = solverGridToWorld(gx, gz);
                        const d = (wPt.x - pStartRaw.x) * nx + (wPt.z - pStartRaw.z) * nz;
                        if (d > 0.02) cPos++;
                        else if (d < -0.02) cNeg++;
                    }
                }
            }
            if (cPos === 0 || cNeg === 0) return false;
            if (cPos > cNeg) {
                nx = -nx;
                nz = -nz;
            }

            for (let gz = 0; gz < SOLVER_RES; gz++) {
                const row = gz * SOLVER_RES;
                for (let gx = 0; gx < SOLVER_RES; gx++) {
                    if (paperSilhouette[row + gx] === 1) {
                        const wPt = solverGridToWorld(gx, gz);
                        const d = (wPt.x - pStartRaw.x) * nx + (wPt.z - pStartRaw.z) * nz;
                        if (d > 0) previewCutGrid[row + gx] = 1;
                    }
                }
            }

            const valid = commitSolverGrids();
            if (renderHighRes && valid) {
                const effNx = invertChoice ? -nx : nx;
                const effNz = invertChoice ? -nz : nz;
                const dirX = -effNz;
                const dirZ = effNx;
                const big = span * 2;
                const pA = worldToCanvasPt(pStartRaw.x - dirX * big, pStartRaw.z - dirZ * big, DESK_MASK_RES);
                const pB = worldToCanvasPt(pStartRaw.x + dirX * big, pStartRaw.z + dirZ * big, DESK_MASK_RES);
                const pC = worldToCanvasPt(pStartRaw.x + dirX * big + effNx * big, pStartRaw.z + dirZ * big + effNz * big, DESK_MASK_RES);
                const pD = worldToCanvasPt(pStartRaw.x - dirX * big + effNx * big, pStartRaw.z - dirZ * big + effNz * big, DESK_MASK_RES);

                deskCutCtx.fillStyle = '#ffffff';
                deskCutCtx.beginPath();
                deskCutCtx.moveTo(pA.x, pA.y);
                deskCutCtx.lineTo(pB.x, pB.y);
                deskCutCtx.lineTo(pC.x, pC.y);
                deskCutCtx.lineTo(pD.x, pD.y);
                deskCutCtx.closePath();
                deskCutCtx.fill();
            }
            return valid;
        }

        // 4. 自由剪模式 ('free')：先对轨迹进行光滑拟合
        let rawTotalLen = 0;
        for (let i = 1; i < rawPts.length; i++) {
            rawTotalLen += Math.hypot(rawPts[i].x - rawPts[i - 1].x, rawPts[i].z - rawPts[i - 1].z);
        }
        const rawChordLen = Math.hypot(pEndRaw.x - pStartRaw.x, pEndRaw.z - pStartRaw.z);
        if (rawTotalLen < 0.45) return false;

        const startInfo = findNearestBoundaryInfo(pStartRaw.x, pStartRaw.z);
        const endInfo = findNearestBoundaryInfo(pEndRaw.x, pEndRaw.z);
        const isSelfIntersecting = checkSelfIntersection(rawPts);

        // 判断是否为纸面内部的闭合环
        const isClosedLoopInside = (
            startInfo.inside && endInfo.inside &&
            startInfo.dist > 0.75 && endInfo.dist > 0.75 &&
            rawTotalLen > 2.2 &&
            (rawChordLen < Math.min(2.2, rawTotalLen * 0.36) || isSelfIntersecting)
        );

        const pts = getSmoothedCutPoints(rawPts, isClosedLoopInside);
        const pStart = pts[0];
        const pEnd = pts[pts.length - 1];

        if (isClosedLoopInside) {
            const fillClosedPolygon = (ctx, res) => {
                ctx.save();
                traceSmoothCurveOnCtx(ctx, pts, res, true);
                ctx.fillStyle = '#ffffff';
                ctx.fill('evenodd');
                ctx.restore();
            };

            solverCtx.clearRect(0, 0, SOLVER_RES, SOLVER_RES);
            fillClosedPolygon(solverCtx, SOLVER_RES);
            const imgData = solverCtx.getImageData(0, 0, SOLVER_RES, SOLVER_RES).data;
            for (let i = 0; i < SOLVER_RES * SOLVER_RES; i++) {
                if (paperSilhouette[i] === 1 && imgData[i * 4 + 3] > 100) {
                    previewCutGrid[i] = 1;
                }
            }

            const valid = commitSolverGrids();
            if (renderHighRes && valid) {
                if (!invertChoice) {
                    fillClosedPolygon(deskCutCtx, DESK_MASK_RES);
                } else {
                    deskCutCtx.fillStyle = '#ffffff';
                    deskCutCtx.fillRect(0, 0, DESK_MASK_RES, DESK_MASK_RES);
                    deskCutCtx.save();
                    deskCutCtx.globalCompositeOperation = 'destination-out';
                    traceSmoothCurveOnCtx(deskCutCtx, pts, DESK_MASK_RES, true);
                    deskCutCtx.fill('evenodd');
                    deskCutCtx.restore();
                }
            }
            return valid;
        }

        // 构造延伸至纸张边缘外的平滑分割路径 extendedPts
        const extendedPts = [];
        const SNAP_DIST = 4.5;
        const EXTEND_OUT_DIST = 4.5;

        const startDistToEdge = Math.hypot(pStart.x - startInfo.nearestPt.x, pStart.z - startInfo.nearestPt.z);
        if (startDistToEdge <= SNAP_DIST) {
            const lookIdx = Math.min(pts.length - 1, Math.max(1, Math.floor(pts.length * 0.18)));
            const tx = pStart.x - pts[lookIdx].x;
            const tz = pStart.z - pts[lookIdx].z;
            const tLen = Math.hypot(tx, tz);
            if (tLen > 0.02) {
                const ux = tx / tLen;
                const uz = tz / tLen;
                const extLen = startDistToEdge + EXTEND_OUT_DIST;
                const testPt = { x: pStart.x + ux * extLen, z: pStart.z + uz * extLen };
                const { gx, gz } = worldToSolverGrid(testPt.x, testPt.z);
                if (paperSilhouette[gz * SOLVER_RES + gx] === 0) {
                    extendedPts.push(testPt);
                } else {
                    const bx = startInfo.nearestPt.x - pStart.x;
                    const bz = startInfo.nearestPt.z - pStart.z;
                    const bLen = Math.hypot(bx, bz) || 1;
                    extendedPts.push({
                        x: startInfo.nearestPt.x + (bx / bLen) * EXTEND_OUT_DIST,
                        z: startInfo.nearestPt.z + (bz / bLen) * EXTEND_OUT_DIST
                    });
                }
            }
        }

        for (let i = 0; i < pts.length; i++) {
            extendedPts.push(pts[i]);
        }

        const endDistToEdge = Math.hypot(pEnd.x - endInfo.nearestPt.x, pEnd.z - endInfo.nearestPt.z);
        if (endDistToEdge <= SNAP_DIST) {
            const lookIdx = Math.max(0, pts.length - 1 - Math.max(1, Math.floor(pts.length * 0.18)));
            const tx = pEnd.x - pts[lookIdx].x;
            const tz = pEnd.z - pts[lookIdx].z;
            const tLen = Math.hypot(tx, tz);
            if (tLen > 0.02) {
                const ux = tx / tLen;
                const uz = tz / tLen;
                const extLen = endDistToEdge + EXTEND_OUT_DIST;
                const testPt = { x: pEnd.x + ux * extLen, z: pEnd.z + uz * extLen };
                const { gx, gz } = worldToSolverGrid(testPt.x, testPt.z);
                if (paperSilhouette[gz * SOLVER_RES + gx] === 0) {
                    extendedPts.push(testPt);
                } else {
                    const bx = endInfo.nearestPt.x - pEnd.x;
                    const bz = endInfo.nearestPt.z - pEnd.z;
                    const bLen = Math.hypot(bx, bz) || 1;
                    extendedPts.push({
                        x: endInfo.nearestPt.x + (bx / bLen) * EXTEND_OUT_DIST,
                        z: endInfo.nearestPt.z + (bz / bLen) * EXTEND_OUT_DIST
                    });
                }
            }
        }

        // 将分割曲线栅格化为隔离线，并在 paperSilhouette 上运行连通域分析 (BFS Flood Fill)
        solverCtx.clearRect(0, 0, SOLVER_RES, SOLVER_RES);
        traceSmoothCurveOnCtx(solverCtx, extendedPts, SOLVER_RES, false);
        solverCtx.strokeStyle = '#ffffff';
        solverCtx.lineWidth = 2.2;
        solverCtx.lineCap = 'round';
        solverCtx.lineJoin = 'round';
        solverCtx.stroke();

        const barrierData = solverCtx.getImageData(0, 0, SOLVER_RES, SOLVER_RES).data;
        bfsVisited.fill(0);

        const components = [];
        for (let i = 0; i < SOLVER_RES * SOLVER_RES; i++) {
            if (paperSilhouette[i] === 0 || barrierData[i * 4 + 3] > 90) {
                bfsVisited[i] = 255;
            }
        }

        for (let i = 0; i < SOLVER_RES * SOLVER_RES; i++) {
            if (bfsVisited[i] === 0) {
                const compPixels = [];
                let head = 0, tail = 0;
                bfsQueue[tail++] = i;
                bfsVisited[i] = 1;

                while (head < tail) {
                    const curr = bfsQueue[head++];
                    compPixels.push(curr);
                    const cx = curr % SOLVER_RES;
                    const cz = (curr - cx) / SOLVER_RES;

                    if (cx > 0 && bfsVisited[curr - 1] === 0) {
                        bfsVisited[curr - 1] = 1;
                        bfsQueue[tail++] = curr - 1;
                    }
                    if (cx + 1 < SOLVER_RES && bfsVisited[curr + 1] === 0) {
                        bfsVisited[curr + 1] = 1;
                        bfsQueue[tail++] = curr + 1;
                    }
                    if (cz > 0 && bfsVisited[curr - SOLVER_RES] === 0) {
                        bfsVisited[curr - SOLVER_RES] = 1;
                        bfsQueue[tail++] = curr - SOLVER_RES;
                    }
                    if (cz + 1 < SOLVER_RES && bfsVisited[curr + SOLVER_RES] === 0) {
                        bfsVisited[curr + SOLVER_RES] = 1;
                        bfsQueue[tail++] = curr + SOLVER_RES;
                    }
                }

                if (compPixels.length > 6) {
                    components.push(compPixels);
                }
            }
        }

        // 如果分割曲线成功将折纸划分为 2 个或更多连通区域：默认保留最大面积区域，剪除其余较小区域；反转时则保留较小区域，剪除最大区域
        if (components.length >= 2) {
            components.sort((a, b) => b.length - a.length);
            for (let c = 1; c < components.length; c++) {
                const pix = components[c];
                for (let k = 0; k < pix.length; k++) {
                    previewCutGrid[pix[k]] = 1;
                }
            }
            for (let gz = 1; gz < SOLVER_RES - 1; gz++) {
                const row = gz * SOLVER_RES;
                for (let gx = 1; gx < SOLVER_RES - 1; gx++) {
                    const idx = row + gx;
                    if (paperSilhouette[idx] === 1 && barrierData[idx * 4 + 3] > 90) {
                        if (previewCutGrid[idx - 1] === 1 || previewCutGrid[idx + 1] === 1 ||
                            previewCutGrid[idx - SOLVER_RES] === 1 || previewCutGrid[idx + SOLVER_RES] === 1 ||
                            (gx > 1 && previewCutGrid[idx - 2] === 1) || (gx < SOLVER_RES - 2 && previewCutGrid[idx + 2] === 1) ||
                            (gz > 1 && previewCutGrid[idx - 2 * SOLVER_RES] === 1) || (gz < SOLVER_RES - 2 && previewCutGrid[idx + 2 * SOLVER_RES] === 1)) {
                            previewCutGrid[idx] = 1;
                        }
                    }
                }
            }

            const valid = commitSolverGrids();
            if (renderHighRes && valid) {
                renderSplitCutToHighRes(extendedPts);
            }
            return valid;
        }

        // 若曲线未触及纸张边缘（未将纸张一分为二）：
        let maxDev = 0;
        const ux = rawChordLen > 0.01 ? (pEnd.x - pStart.x) / rawChordLen : 1;
        const uz = rawChordLen > 0.01 ? (pEnd.z - pStart.z) / rawChordLen : 0;
        for (let i = 1; i < pts.length - 1; i++) {
            const dev = Math.abs((pts[i].x - pStart.x) * (-uz) + (pts[i].z - pStart.z) * ux);
            if (dev > maxDev) maxDev = dev;
        }

        if (maxDev > 0.55 && rawTotalLen > 2.0) {
            const fillShape = (ctx, res) => {
                ctx.save();
                traceSmoothCurveOnCtx(ctx, pts, res, true);
                ctx.fillStyle = '#ffffff';
                ctx.fill('evenodd');
                ctx.restore();
            };

            solverCtx.clearRect(0, 0, SOLVER_RES, SOLVER_RES);
            fillShape(solverCtx, SOLVER_RES);
            const imgData = solverCtx.getImageData(0, 0, SOLVER_RES, SOLVER_RES).data;
            for (let i = 0; i < SOLVER_RES * SOLVER_RES; i++) {
                if (paperSilhouette[i] === 1 && imgData[i * 4 + 3] > 100) {
                    previewCutGrid[i] = 1;
                }
            }
            const valid = commitSolverGrids();
            if (renderHighRes && valid) {
                if (!invertChoice) {
                    fillShape(deskCutCtx, DESK_MASK_RES);
                } else {
                    deskCutCtx.fillStyle = '#ffffff';
                    deskCutCtx.fillRect(0, 0, DESK_MASK_RES, DESK_MASK_RES);
                    deskCutCtx.save();
                    deskCutCtx.globalCompositeOperation = 'destination-out';
                    traceSmoothCurveOnCtx(deskCutCtx, pts, DESK_MASK_RES, true);
                    deskCutCtx.fill('evenodd');
                    deskCutCtx.restore();
                }
            }
            return valid;
        } else {
            const worldStrokeWidth = 0.46;
            const drawStroke = (ctx, res) => {
                ctx.save();
                traceSmoothCurveOnCtx(ctx, pts, res, false);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = (worldStrokeWidth / span) * res;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
                ctx.restore();
            };

            solverCtx.clearRect(0, 0, SOLVER_RES, SOLVER_RES);
            drawStroke(solverCtx, SOLVER_RES);
            const imgData = solverCtx.getImageData(0, 0, SOLVER_RES, SOLVER_RES).data;
            for (let i = 0; i < SOLVER_RES * SOLVER_RES; i++) {
                if (paperSilhouette[i] === 1 && imgData[i * 4 + 3] > 100) {
                    previewCutGrid[i] = 1;
                }
            }
            const valid = commitSolverGrids();
            if (renderHighRes && valid) {
                if (!invertChoice) {
                    drawStroke(deskCutCtx, DESK_MASK_RES);
                } else {
                    deskCutCtx.fillStyle = '#ffffff';
                    deskCutCtx.fillRect(0, 0, DESK_MASK_RES, DESK_MASK_RES);
                    deskCutCtx.save();
                    deskCutCtx.globalCompositeOperation = 'destination-out';
                    drawStroke(deskCutCtx, DESK_MASK_RES);
                    deskCutCtx.restore();
                }
            }
            return valid;
        }
    }

    // 将连通域分割结果以连续闭合矢量带渲染到 1024x1024 deskCutCanvas，并向外扩展外边界消除边角残条
    function renderSplitCutToHighRes(extendedPts) {
        const scale = DESK_MASK_RES / SOLVER_RES;
        deskCutCtx.clearRect(0, 0, DESK_MASK_RES, DESK_MASK_RES);

        // 1. 绘制剪除区域内部及紧贴剪除区域外沿的扩展网格，确保纸张最外圈边缘100%被切透不留残条
        deskCutCtx.fillStyle = '#ffffff';
        for (let gz = 1; gz < SOLVER_RES - 1; gz++) {
            const row = gz * SOLVER_RES;
            for (let gx = 1; gx < SOLVER_RES - 1; gx++) {
                const idx = row + gx;
                if (previewCutGrid[idx] === 1) {
                    const nearKept =
                        previewKeptGrid[idx - 1] === 1 ||
                        previewKeptGrid[idx + 1] === 1 ||
                        previewKeptGrid[idx - SOLVER_RES] === 1 ||
                        previewKeptGrid[idx + SOLVER_RES] === 1;
                    if (!nearKept) {
                        deskCutCtx.fillRect(gx * scale - 0.5, gz * scale - 0.5, scale + 1, scale + 1);
                    }
                } else if (paperSilhouette[idx] === 0) {
                    // 若处于纸张轮廓外侧且紧邻被剪除区域（且不邻近保留区域），向外扩展填充以彻底覆盖1024高清边界
                    let nearCut = false;
                    let nearKept = false;
                    for (let dz = -2; dz <= 2; dz++) {
                        const r2 = (gz + dz) * SOLVER_RES;
                        if (r2 < 0 || r2 >= SOLVER_RES * SOLVER_RES) continue;
                        for (let dx = -2; dx <= 2; dx++) {
                            const gx2 = gx + dx;
                            if (gx2 < 0 || gx2 >= SOLVER_RES) continue;
                            if (previewCutGrid[r2 + gx2] === 1) nearCut = true;
                            if (previewKeptGrid[r2 + gx2] === 1) nearKept = true;
                        }
                    }
                    if (nearCut && !nearKept) {
                        deskCutCtx.fillRect(gx * scale - 0.5, gz * scale - 0.5, scale + 1, scale + 1);
                    }
                }
            }
        }

        // 2. 判定切线哪一侧为被剪除侧 (cutSign)
        const span = getDeskHalfSpan() * 2;
        const sampleDist = (span / SOLVER_RES) * 2.8;
        let leftHits = 0, rightHits = 0;

        for (let i = 0; i < extendedPts.length - 1; i++) {
            const A = extendedPts[i];
            const B = extendedPts[i + 1];
            const dx = B.x - A.x;
            const dz = B.z - A.z;
            const len = Math.hypot(dx, dz);
            if (len < 0.01) continue;
            const nx = -dz / len;
            const nz = dx / len;
            const mx = (A.x + B.x) * 0.5;
            const mz = (A.z + B.z) * 0.5;

            const gL = worldToSolverGrid(mx + nx * sampleDist, mz + nz * sampleDist);
            const gR = worldToSolverGrid(mx - nx * sampleDist, mz - nz * sampleDist);
            if (previewCutGrid[gL.gz * SOLVER_RES + gL.gx] === 1) leftHits++;
            if (previewCutGrid[gR.gz * SOLVER_RES + gR.gx] === 1) rightHits++;
        }

        const cutSign = leftHits >= rightHits ? 1 : -1;

        // 转换曲线到 1024x1024 画布坐标并计算每个顶点的平滑角平分线法向量
        const cPts = extendedPts.map(p => worldToCanvasPt(p.x, p.z, DESK_MASK_RES));
        const nPts = cPts.length;
        if (nPts < 2) return;

        const vNormals = [];
        for (let i = 0; i < nPts; i++) {
            let nx = 0, ny = 0;
            if (i > 0) {
                const dx = cPts[i].x - cPts[i - 1].x;
                const dy = cPts[i].y - cPts[i - 1].y;
                const l = Math.hypot(dx, dy);
                if (l > 1e-4) {
                    nx += -dy / l;
                    ny += dx / l;
                }
            }
            if (i < nPts - 1) {
                const dx = cPts[i + 1].x - cPts[i].x;
                const dy = cPts[i + 1].y - cPts[i].y;
                const l = Math.hypot(dx, dy);
                if (l > 1e-4) {
                    nx += -dy / l;
                    ny += dx / l;
                }
            }
            const nl = Math.hypot(nx, ny) || 1;
            vNormals.push({ x: nx / nl, y: ny / nl });
        }

        // 使用单条连续闭合路径（正面为二次贝塞尔光滑曲线，背面为角平分法向偏移线）绘制无死角矢量丝带
        const drawContinuousVectorRibbon = (sign, compositeOp) => {
            const widths = [scale * 2.2, scale * 4.5, scale * 8.0];
            deskCutCtx.save();
            deskCutCtx.globalCompositeOperation = compositeOp;
            deskCutCtx.fillStyle = '#ffffff';

            for (let wIdx = 0; wIdx < widths.length; wIdx++) {
                const W = widths[wIdx];
                deskCutCtx.beginPath();
                deskCutCtx.moveTo(cPts[0].x, cPts[0].y);
                if (nPts === 2) {
                    deskCutCtx.lineTo(cPts[1].x, cPts[1].y);
                } else {
                    for (let i = 1; i < nPts - 1; i++) {
                        const mx = (cPts[i].x + cPts[i + 1].x) * 0.5;
                        const my = (cPts[i].y + cPts[i + 1].y) * 0.5;
                        deskCutCtx.quadraticCurveTo(cPts[i].x, cPts[i].y, mx, my);
                    }
                    deskCutCtx.lineTo(cPts[nPts - 1].x, cPts[nPts - 1].y);
                }

                for (let i = nPts - 1; i >= 0; i--) {
                    deskCutCtx.lineTo(
                        cPts[i].x + vNormals[i].x * sign * W,
                        cPts[i].y + vNormals[i].y * sign * W
                    );
                }
                deskCutCtx.closePath();
                deskCutCtx.fill();
            }
            deskCutCtx.restore();
        };

        // 补齐剪除侧平滑矢量边缘，并干净擦除保留侧
        drawContinuousVectorRibbon(cutSign, 'source-over');
        drawContinuousVectorRibbon(-cutSign, 'destination-out');
    }

    // 自动清除剪纸后微小的栅格化毛刺噪点，保留有效纸片与用户选择的对称图形
    function removeFloatingPaperIslands() {
        flatBfsVisited.fill(0);
        const isCircle = currentShape === 'circle';
        const rSq = (circleDiameter / 2) * (circleDiameter / 2);

        for (let y = 0; y < MASK_RES; y++) {
            const oz = ((y + 0.5) / MASK_RES - 0.5) * paperH;
            const yOffset = y * MASK_RES;
            for (let x = 0; x < MASK_RES; x++) {
                const idx = yOffset + x;
                if (flatCutFlags[idx] === 1) {
                    flatBfsVisited[idx] = 255;
                } else if (isCircle) {
                    const ox = ((x + 0.5) / MASK_RES - 0.5) * paperW;
                    if (ox * ox + oz * oz > rSq) {
                        flatBfsVisited[idx] = 255;
                    }
                }
            }
        }

        const paperComponents = [];
        for (let startIdx = 0; startIdx < MASK_RES * MASK_RES; startIdx++) {
            if (flatBfsVisited[startIdx] === 0) {
                let head = 0, tail = 0;
                flatBfsQueue[tail++] = startIdx;
                flatBfsVisited[startIdx] = 1;
                let count = 0;

                while (head < tail) {
                    const curr = flatBfsQueue[head++];
                    count++;
                    const cx = curr % MASK_RES;
                    const cy = (curr - cx) / MASK_RES;

                    if (cx > 0 && flatBfsVisited[curr - 1] === 0) {
                        flatBfsVisited[curr - 1] = 1;
                        flatBfsQueue[tail++] = curr - 1;
                    }
                    if (cx + 1 < MASK_RES && flatBfsVisited[curr + 1] === 0) {
                        flatBfsVisited[curr + 1] = 1;
                        flatBfsQueue[tail++] = curr + 1;
                    }
                    if (cy > 0 && flatBfsVisited[curr - MASK_RES] === 0) {
                        flatBfsVisited[curr - MASK_RES] = 1;
                        flatBfsQueue[tail++] = curr - MASK_RES;
                    }
                    if (cy + 1 < MASK_RES && flatBfsVisited[curr + MASK_RES] === 0) {
                        flatBfsVisited[curr + MASK_RES] = 1;
                        flatBfsQueue[tail++] = curr + MASK_RES;
                    }
                }
                paperComponents.push({ startIdx, count });
            }
        }

        // 仅清除面积小于 80 像素的微小栅格化毛刺噪点，完整保留用户选择保留的对称图形与独立部件
        if (paperComponents.length > 1) {
            paperComponents.sort((a, b) => b.count - a.count);
            flatBfsVisited.fill(0);

            for (let c = 1; c < paperComponents.length; c++) {
                if (paperComponents[c].count >= 80) continue;
                const seed = paperComponents[c].startIdx;
                let head = 0, tail = 0;
                flatBfsQueue[tail++] = seed;
                flatBfsVisited[seed] = 1;

                while (head < tail) {
                    const curr = flatBfsQueue[head++];
                    flatCutFlags[curr] = 1;
                    flatCutMask[curr] = 1.0;

                    const cx = curr % MASK_RES;
                    const cy = (curr - cx) / MASK_RES;

                    if (cx > 0 && flatBfsVisited[curr - 1] === 0 && flatCutFlags[curr - 1] === 0) {
                        flatBfsVisited[curr - 1] = 1;
                        flatBfsQueue[tail++] = curr - 1;
                    }
                    if (cx + 1 < MASK_RES && flatBfsVisited[curr + 1] === 0 && flatCutFlags[curr + 1] === 0) {
                        flatBfsVisited[curr + 1] = 1;
                        flatBfsQueue[tail++] = curr + 1;
                    }
                    if (cy > 0 && flatBfsVisited[curr - MASK_RES] === 0 && flatCutFlags[curr - MASK_RES] === 0) {
                        flatBfsVisited[curr - MASK_RES] = 1;
                        flatBfsQueue[tail++] = curr - MASK_RES;
                    }
                    if (cy + 1 < MASK_RES && flatBfsVisited[curr + MASK_RES] === 0 && flatCutFlags[curr + MASK_RES] === 0) {
                        flatBfsVisited[curr + MASK_RES] = 1;
                        flatBfsQueue[tail++] = curr + MASK_RES;
                    }
                }
            }
        }
    }

    // 将 deskCutCanvas (1024x1024) 上的新切口通过双线性插值折叠映射同步到展开纸张掩码
    function applyDeskCutToFlatPaper(pushUndo = true) {
        const deskImg = deskCutCtx.getImageData(0, 0, DESK_MASK_RES, DESK_MASK_RES).data;

        const planes = getCompiledFoldPlanes(foldHistory);
        const numFolds = planes.length;
        const span = getDeskHalfSpan() * 2;
        const invSpan = 1.0 / span;

        // 保存撤销快照
        if (pushUndo) {
            cutUndoStack.push(new Float32Array(flatCutMask));
            if (cutUndoStack.length > 20) cutUndoStack.shift();
        }

        let newlyCutPixels = 0;
        for (let y = 0; y < MASK_RES; y++) {
            const oz = ((y + 0.5) / MASK_RES - 0.5) * paperH;
            const yOffset = y * MASK_RES;
            for (let x = 0; x < MASK_RES; x++) {
                const idx = yOffset + x;
                if (flatCutMask[idx] >= 0.999) continue;

                const ox = ((x + 0.5) / MASK_RES - 0.5) * paperW;
                let curX = ox;
                let curZ = oz;

                for (let s = 0; s < numFolds; s++) {
                    const pl = planes[s];
                    const d = (curX - pl.p0x) * pl.nx + (curZ - pl.p0z) * pl.nz;
                    if (d > 0.0001) {
                        curX -= 2 * d * pl.nx;
                        curZ -= 2 * d * pl.nz;
                    }
                }

                // 双线性插值采样 deskCutCanvas 的 Alpha 通道
                const fx = (curX * invSpan + 0.5) * DESK_MASK_RES - 0.5;
                const fz = (curZ * invSpan + 0.5) * DESK_MASK_RES - 0.5;
                const x0 = Math.floor(fx);
                const z0 = Math.floor(fz);

                if (x0 >= 0 && x0 < DESK_MASK_RES - 1 && z0 >= 0 && z0 < DESK_MASK_RES - 1) {
                    const tx = fx - x0;
                    const tz = fz - z0;
                    const row0 = z0 * DESK_MASK_RES;
                    const row1 = (z0 + 1) * DESK_MASK_RES;

                    const a00 = deskImg[(row0 + x0) * 4 + 3];
                    const a10 = deskImg[(row0 + x0 + 1) * 4 + 3];
                    const a01 = deskImg[(row1 + x0) * 4 + 3];
                    const a11 = deskImg[(row1 + x0 + 1) * 4 + 3];

                    const alpha = ((a00 * (1 - tx) + a10 * tx) * (1 - tz) + (a01 * (1 - tx) + a11 * tx) * tz) / 255.0;
                    if (alpha > 0.01) {
                        const prevVal = flatCutMask[idx];
                        const newVal = Math.max(prevVal, alpha);
                        flatCutMask[idx] = newVal;
                        if (newVal >= 0.5 && prevVal < 0.5) {
                            flatCutFlags[idx] = 1;
                            newlyCutPixels++;
                        }
                    }
                }
            }
        }

        if (newlyCutPixels === 0) {
            if (pushUndo) cutUndoStack.pop();
            return false;
        }

        // 移除微小毛刺噪点
        removeFloatingPaperIslands();

        hasAnyCuts = true;
        rebuildCutMaskAndBorderCanvases();
        rebuildFoldedPaperSilhouette();
        updateCutToolbarState();
        return true;
    }

    // 清除剪切后的“选择保留/剪去部分”交互状态
    function dismissCutChoiceSession() {
        lastCutSession = null;
        if (cutChoiceBar) cutChoiceBar.classList.remove('show');
        clearCutCanvas();
    }

    // 在完成剪切后绘制“已剪去部分（半透明红虚影）”与“保留部分”的可点击标签，方便用户直观切换
    function drawPostCutSelectionOverlay() {
        if (!cutCtx || !lastCutSession) return;
        const w = window.innerWidth;
        const h = window.innerHeight;
        cutCtx.clearRect(0, 0, w, h);

        const span = getDeskHalfSpan() * 2;
        const cellSpan = span / SOLVER_RES;
        const paperY = 0.08 + foldHistory.length * 0.04;
        const cutGrid = lastCutSession.activeCutGrid;

        // 1. 绘制被剪除区域的半透明红色虚影轮廓，方便用户看清并点击切换
        cutCtx.save();
        cutCtx.beginPath();
        for (let gz = 0; gz < SOLVER_RES; gz++) {
            const row = gz * SOLVER_RES;
            let gx = 0;
            while (gx < SOLVER_RES) {
                if (cutGrid[row + gx] === 1) {
                    let endGx = gx;
                    while (endGx + 1 < SOLVER_RES && cutGrid[row + endGx + 1] === 1) {
                        endGx++;
                    }
                    const wx0 = ((gx / SOLVER_RES) - 0.5) * span;
                    const wx1 = (((endGx + 1) / SOLVER_RES) - 0.5) * span;
                    const wz0 = ((gz / SOLVER_RES) - 0.5) * span;
                    const wz1 = wz0 + cellSpan;

                    const p0 = toScreenPt(wx0, paperY, wz0);
                    const p1 = toScreenPt(wx1, paperY, wz0);
                    const p2 = toScreenPt(wx1, paperY, wz1);
                    const p3 = toScreenPt(wx0, paperY, wz1);

                    cutCtx.moveTo(p0.x, p0.y);
                    cutCtx.lineTo(p1.x, p1.y);
                    cutCtx.lineTo(p2.x, p2.y);
                    cutCtx.lineTo(p3.x, p3.y);
                    cutCtx.closePath();

                    gx = endGx + 1;
                } else {
                    gx++;
                }
            }
        }
        cutCtx.fillStyle = 'rgba(239, 68, 68, 0.24)';
        cutCtx.fill();
        cutCtx.restore();

        // 2. 绘制保留区域与剪去区域的悬浮交互胶囊标签
        const drawPillBadge = (screenPt, text, bgColor, borderColor) => {
            cutCtx.save();
            cutCtx.font = '600 12px "Segoe UI", sans-serif';
            const padX = 9;
            const textW = cutCtx.measureText(text).width;
            const bw = textW + padX * 2;
            const bh = 24;
            const bx = Math.max(8, Math.min(w - bw - 8, screenPt.x - bw / 2));
            const by = Math.max(8, Math.min(h - bh - 8, screenPt.y - bh / 2));

            cutCtx.beginPath();
            const r = 12;
            cutCtx.moveTo(bx + r, by);
            cutCtx.lineTo(bx + bw - r, by);
            cutCtx.quadraticCurveTo(bx + bw, by, bx + bw, by + r);
            cutCtx.lineTo(bx + bw, by + bh - r);
            cutCtx.quadraticCurveTo(bx + bw, by + bh, bx + bw - r, by + bh);
            cutCtx.lineTo(bx + r, by + bh);
            cutCtx.quadraticCurveTo(bx, by + bh, bx, by + bh - r);
            cutCtx.lineTo(bx, by + r);
            cutCtx.quadraticCurveTo(bx, by, bx + r, by);
            cutCtx.closePath();

            cutCtx.fillStyle = bgColor;
            cutCtx.shadowColor = 'rgba(0, 0, 0, 0.45)';
            cutCtx.shadowBlur = 8;
            cutCtx.fill();

            cutCtx.shadowBlur = 0;
            cutCtx.lineWidth = 1.5;
            cutCtx.strokeStyle = borderColor;
            cutCtx.stroke();

            cutCtx.fillStyle = '#ffffff';
            cutCtx.textAlign = 'center';
            cutCtx.textBaseline = 'middle';
            cutCtx.fillText(text, bx + bw / 2, by + bh / 2);
            cutCtx.restore();

            return { x: bx, y: by, w: bw, h: bh };
        };

        lastCutSession.cutBadgeRect = null;
        lastCutSession.keptBadgeRect = null;

        if (lastCutSession.keptCenter && lastCutSession.keptCenter.valid) {
            const sKept = toScreenPt(lastCutSession.keptCenter.x, paperY, lastCutSession.keptCenter.z);
            lastCutSession.keptBadgeRect = drawPillBadge(
                sKept,
                '✓ 保留',
                'rgba(16, 185, 129, 0.88)',
                'rgba(167, 243, 208, 0.9)'
            );
        }

        if (lastCutSession.cutCenter && lastCutSession.cutCenter.valid) {
            const sCut = toScreenPt(lastCutSession.cutCenter.x, paperY, lastCutSession.cutCenter.z);
            lastCutSession.cutBadgeRect = drawPillBadge(
                sCut,
                '✕ 剪去',
                'rgba(220, 38, 38, 0.88)',
                'rgba(254, 202, 202, 0.9)'
            );
        }
    }

    // 切换最近一次剪切的“剪去区域 ↔ 保留区域”
    function toggleCutSessionChoice() {
        if (!lastCutSession || isAnimating) return;

        lastCutSession.inverted = !lastCutSession.inverted;

        // 恢复到此刀剪切前的纸张状态与轮廓
        flatCutMask.set(lastCutSession.baseFlatCutMask);
        flatCutFlags.set(lastCutSession.baseFlatCutFlags);
        hasAnyCuts = lastCutSession.baseHasAnyCuts;
        paperSilhouette.set(lastCutSession.baseSilhouette);
        silhouetteBoundaryPts = lastCutSession.baseBoundaryPts.slice();

        // 以反转后的选项重新生成高清剪切遮罩并应用
        const valid = evaluateCurrentCutRegion(true, lastCutSession, lastCutSession.inverted);
        if (!valid) return;

        lastCutSession.activeCutGrid.set(previewCutGrid);
        lastCutSession.activeKeptGrid.set(previewKeptGrid);
        lastCutSession.cutCenter = computeGridVisualCenter(previewCutGrid);
        lastCutSession.keptCenter = computeGridVisualCenter(previewKeptGrid);

        applyDeskCutToFlatPaper(false);
        renderPaperTexture();
        drawPostCutSelectionOverlay();
        sfx.playCut();
    }

    // 根据 flatCutMask 生成经过边缘抗锯齿滤波的 cutMaskCanvas（黑色=剪除透明，供 paperAlphaTexture 遮罩使用）
    function rebuildCutMaskAndBorderCanvases() {
        if (!cutMaskCtx || !cutBorderCtx) return;
        cutMaskCtx.clearRect(0, 0, MASK_RES, MASK_RES);
        cutBorderCtx.clearRect(0, 0, MASK_RES, MASK_RES);

        if (!hasAnyCuts) return;

        // 对切口边缘执行 3x3 高斯平滑滤波，使切口等值线光滑圆润无锯齿
        smoothedCutMask.set(flatCutMask);
        for (let y = 1; y < MASK_RES - 1; y++) {
            const row = y * MASK_RES;
            for (let x = 1; x < MASK_RES - 1; x++) {
                const idx = row + x;
                const c = flatCutMask[idx];
                const n1 = flatCutMask[idx - 1];
                const n2 = flatCutMask[idx + 1];
                const n3 = flatCutMask[idx - MASK_RES];
                const n4 = flatCutMask[idx + MASK_RES];
                if (c !== n1 || c !== n2 || c !== n3 || c !== n4) {
                    const d1 = flatCutMask[idx - MASK_RES - 1];
                    const d2 = flatCutMask[idx - MASK_RES + 1];
                    const d3 = flatCutMask[idx + MASK_RES - 1];
                    const d4 = flatCutMask[idx + MASK_RES + 1];
                    smoothedCutMask[idx] = (4 * c + 2 * (n1 + n2 + n3 + n4) + (d1 + d2 + d3 + d4)) / 16.0;
                }
            }
        }

        const maskImg = cutMaskCtx.createImageData(MASK_RES, MASK_RES);
        const maskData = maskImg.data;

        for (let i = 0; i < MASK_RES * MASK_RES; i++) {
            const cutVal = smoothedCutMask[i];
            if (cutVal > 0.004) {
                // 在 alphaCanvas 上：黑色 (RGB=0) 代表剪除透明，Alpha 代表遮罩覆盖强度
                const p = i * 4;
                maskData[p] = 0;
                maskData[p + 1] = 0;
                maskData[p + 2] = 0;
                maskData[p + 3] = Math.min(255, Math.round(cutVal * 255));
            }
        }
        cutMaskCtx.putImageData(maskImg, 0, 0);
    }

    function clearCutMask() {
        flatCutFlags.fill(0);
        flatCutMask.fill(0);
        cutUndoStack.length = 0;
        hasAnyCuts = false;
        dismissCutChoiceSession();
        if (cutMaskCtx) cutMaskCtx.clearRect(0, 0, MASK_RES, MASK_RES);
        if (cutBorderCtx) cutBorderCtx.clearRect(0, 0, MASK_RES, MASK_RES);
        updateCutToolbarState();
    }

    function undoLastCut() {
        if (cutUndoStack.length === 0 || isAnimating) return;
        dismissCutChoiceSession();
        const prevMask = cutUndoStack.pop();
        flatCutMask.set(prevMask);

        hasAnyCuts = false;
        for (let i = 0; i < flatCutMask.length; i++) {
            if (flatCutMask[i] >= 0.5) {
                flatCutFlags[i] = 1;
                hasAnyCuts = true;
            } else {
                flatCutFlags[i] = 0;
            }
        }

        rebuildCutMaskAndBorderCanvases();
        rebuildFoldedPaperSilhouette();
        renderPaperTexture();
        updateCutToolbarState();
        sfx.playUnfoldSnap();
        showToast('已撤销');
    }

    function updateCutToolbarState() {
        if (undoCutBtn) {
            undoCutBtn.disabled = cutUndoStack.length === 0;
        }
    }

    function resizeCutCanvas() {
        if (!cutCanvas || !cutCtx) return;
        const dpr = window.devicePixelRatio || 1;
        const w = window.innerWidth;
        const h = window.innerHeight;
        cutCanvas.width = Math.round(w * dpr);
        cutCanvas.height = Math.round(h * dpr);
        cutCtx.resetTransform();
        cutCtx.scale(dpr, dpr);
    }

    function clearCutCanvas() {
        if (cutCtx) {
            cutCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        }
    }

    const _projVec = new THREE.Vector3();
    function toScreenPt(wx, wy, wz) {
        _projVec.set(wx, wy, wz);
        _projVec.project(camera);
        return {
            x: ((_projVec.x + 1) / 2) * window.innerWidth,
            y: ((-_projVec.y + 1) / 2) * window.innerHeight
        };
    }

    // 实时绘制剪纸预览（包括折纸表面精确裁剪的半透明红区 + 白色底衬鲜红虚线轨迹 + 剪刀图标）
    function drawCutPreview() {
        if (!cutCtx || !cutStrokeState || !cutStrokeState.pts2D || cutStrokeState.pts2D.length === 0) return;
        const w = window.innerWidth;
        const h = window.innerHeight;
        cutCtx.clearRect(0, 0, w, h);

        const pts2D = cutStrokeState.pts2D;
        const pts3D = cutStrokeState.pts3D;
        const s2 = pts2D[0];
        const c2 = pts2D[pts2D.length - 1];

        // 1. 求解当前绘制轨迹在折纸表面即将剪除的区域，并投影高亮显示在折纸范围内
        const hasValidCut = evaluateCurrentCutRegion(false);
        if (hasValidCut) {
            const span = getDeskHalfSpan() * 2;
            const cellSpan = span / SOLVER_RES;
            const paperY = 0.08 + foldHistory.length * 0.04;

            cutCtx.save();
            cutCtx.beginPath();
            for (let gz = 0; gz < SOLVER_RES; gz++) {
                const row = gz * SOLVER_RES;
                let gx = 0;
                while (gx < SOLVER_RES) {
                    if (previewCutGrid[row + gx] === 1) {
                        let endGx = gx;
                        while (endGx + 1 < SOLVER_RES && previewCutGrid[row + endGx + 1] === 1) {
                            endGx++;
                        }
                        const wx0 = ((gx / SOLVER_RES) - 0.5) * span;
                        const wx1 = (((endGx + 1) / SOLVER_RES) - 0.5) * span;
                        const wz0 = ((gz / SOLVER_RES) - 0.5) * span;
                        const wz1 = wz0 + cellSpan;

                        const p0 = toScreenPt(wx0, paperY, wz0);
                        const p1 = toScreenPt(wx1, paperY, wz0);
                        const p2 = toScreenPt(wx1, paperY, wz1);
                        const p3 = toScreenPt(wx0, paperY, wz1);

                        cutCtx.moveTo(p0.x, p0.y);
                        cutCtx.lineTo(p1.x, p1.y);
                        cutCtx.lineTo(p2.x, p2.y);
                        cutCtx.lineTo(p3.x, p3.y);
                        cutCtx.closePath();

                        gx = endGx + 1;
                    } else {
                        gx++;
                    }
                }
            }
            cutCtx.fillStyle = 'rgba(239, 68, 68, 0.34)';
            cutCtx.fill();
            cutCtx.restore();
        }

        // 2. 绘制剪刀虚线轨迹或几何形状轮廓
        cutCtx.save();
        if (currentCutTool === 'line') {
            const dx = c2.x - s2.x;
            const dy = c2.y - s2.y;
            const dist2 = Math.hypot(dx, dy);
            if (dist2 > 6) {
                const dirX = dx / dist2;
                const dirY = dy / dist2;
                const extLen = Math.max(w, h) * 1.5;
                const x1 = s2.x - dirX * extLen;
                const y1 = s2.y - dirY * extLen;
                const x2 = c2.x + dirX * extLen;
                const y2 = c2.y + dirY * extLen;

                cutCtx.setLineDash([14, 9]);
                cutCtx.lineWidth = 4.5;
                cutCtx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                cutCtx.beginPath();
                cutCtx.moveTo(x1, y1);
                cutCtx.lineTo(x2, y2);
                cutCtx.stroke();

                cutCtx.lineWidth = 2.8;
                cutCtx.strokeStyle = '#ef4444';
                cutCtx.stroke();
            }
        } else if (currentCutTool === 'heart' || currentCutTool === 'star' || currentCutTool === 'circle' || currentCutTool === 'petal') {
            const dx = c2.x - s2.x;
            const dy = c2.y - s2.y;
            const r = Math.hypot(dx, dy);
            if (r > 6) {
                const angle = Math.atan2(dy, dx) - Math.PI / 2;
                cutCtx.save();
                cutCtx.translate(s2.x, s2.y);
                cutCtx.rotate(angle);
                cutCtx.beginPath();
                if (currentCutTool === 'circle') {
                    cutCtx.arc(0, 0, r, 0, Math.PI * 2);
                } else if (currentCutTool === 'star') {
                    const spikes = 5;
                    for (let i = 0; i < spikes * 2; i++) {
                        const rad = i % 2 === 0 ? r : r * 0.42;
                        const a = (i * Math.PI) / spikes - Math.PI / 2;
                        const px = Math.cos(a) * rad;
                        const py = Math.sin(a) * rad;
                        if (i === 0) cutCtx.moveTo(px, py);
                        else cutCtx.lineTo(px, py);
                    }
                    cutCtx.closePath();
                } else if (currentCutTool === 'heart') {
                    const steps = 48;
                    for (let i = 0; i <= steps; i++) {
                        const t = (i / steps) * Math.PI * 2;
                        const hx = 16 * Math.pow(Math.sin(t), 3);
                        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                        const px = (hx / 16) * r;
                        const py = (hy / 16) * r;
                        if (i === 0) cutCtx.moveTo(px, py);
                        else cutCtx.lineTo(px, py);
                    }
                    cutCtx.closePath();
                } else if (currentCutTool === 'petal') {
                    const steps = 40;
                    for (let i = 0; i <= steps; i++) {
                        const t = (i / steps) * Math.PI * 2;
                        const px = r * 0.52 * Math.sin(t) * Math.pow(Math.sin(t / 2), 1.2);
                        const py = r * (1 - Math.cos(t)) * 0.5;
                        if (i === 0) cutCtx.moveTo(px, py);
                        else cutCtx.lineTo(px, py);
                    }
                    cutCtx.closePath();
                }
                cutCtx.setLineDash([10, 6]);
                cutCtx.lineWidth = 4.2;
                cutCtx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
                cutCtx.stroke();
                cutCtx.lineWidth = 2.5;
                cutCtx.strokeStyle = '#ef4444';
                cutCtx.stroke();
                cutCtx.restore();
            }
        } else {
            // 自由剪 ('free') 或 线条镂空 ('carve')：绘制经过平滑拟合后的自由曲线虚线
            const smooth3D = getSmoothedCutPoints(pts3D, false);
            const paperY = 0.09 + foldHistory.length * 0.04;
            const preview2D = smooth3D.length >= 2
                ? smooth3D.map(p => toScreenPt(p.x, paperY, p.z))
                : pts2D;

            cutCtx.setLineDash([12, 7]);
            cutCtx.lineCap = 'round';
            cutCtx.lineJoin = 'round';
            cutCtx.beginPath();
            cutCtx.moveTo(preview2D[0].x, preview2D[0].y);
            if (preview2D.length === 2) {
                cutCtx.lineTo(preview2D[1].x, preview2D[1].y);
            } else {
                for (let i = 1; i < preview2D.length - 1; i++) {
                    const mx = (preview2D[i].x + preview2D[i + 1].x) * 0.5;
                    const my = (preview2D[i].y + preview2D[i + 1].y) * 0.5;
                    cutCtx.quadraticCurveTo(preview2D[i].x, preview2D[i].y, mx, my);
                }
                const lastPt = preview2D[preview2D.length - 1];
                cutCtx.lineTo(lastPt.x, lastPt.y);
            }
            cutCtx.lineWidth = 4.5;
            cutCtx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
            cutCtx.stroke();

            cutCtx.lineWidth = 2.8;
            cutCtx.strokeStyle = '#ef4444';
            cutCtx.stroke();
        }
        cutCtx.setLineDash([]);

        // 起点圆点与终点剪刀图标
        cutCtx.beginPath();
        cutCtx.arc(s2.x, s2.y, 4.5, 0, Math.PI * 2);
        cutCtx.fillStyle = '#ef4444';
        cutCtx.fill();
        cutCtx.strokeStyle = '#ffffff';
        cutCtx.lineWidth = 2;
        cutCtx.stroke();

        cutCtx.font = '26px sans-serif';
        cutCtx.fillText('✂️', c2.x - 13, c2.y - 10);
        cutCtx.restore();
    }

    if (cutCanvas && cutCtx) {
        cutCanvas.addEventListener('pointerdown', (e) => {
            if (!isCutMode || isAnimating) return;
            try {
                cutCanvas.setPointerCapture(e.pointerId);
            } catch (_) {}

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObject(desk);
            if (hits.length === 0) return;

            const pt = hits[0].point;
            isDrawingCut = true;
            cutStrokeState = {
                tool: currentCutTool,
                pts3D: [{ x: pt.x, z: pt.z }],
                pts2D: [{ x: e.clientX, y: e.clientY }],
                hasMovedEnough: false
            };
        });

        cutCanvas.addEventListener('pointermove', (e) => {
            if (!isDrawingCut || !cutStrokeState) return;

            const start2D = cutStrokeState.pts2D[0];
            const moveDist2D = Math.hypot(e.clientX - start2D.x, e.clientY - start2D.y);

            // 当用户拖动超过 8px 时，自动确认上一次的区域选择并开始新的一刀绘制
            if (!cutStrokeState.hasMovedEnough && moveDist2D > 8) {
                cutStrokeState.hasMovedEnough = true;
                if (lastCutSession) {
                    dismissCutChoiceSession();
                }
            }

            if (!cutStrokeState.hasMovedEnough) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObject(desk);
            if (hits.length === 0) return;

            const pt = hits[0].point;
            const last3D = cutStrokeState.pts3D[cutStrokeState.pts3D.length - 1];
            const dist3 = Math.hypot(pt.x - last3D.x, pt.z - last3D.z);

            if (currentCutTool === 'line' || currentCutTool === 'heart' || currentCutTool === 'star' || currentCutTool === 'circle' || currentCutTool === 'petal') {
                cutStrokeState.pts3D[1] = { x: pt.x, z: pt.z };
                cutStrokeState.pts2D[1] = { x: e.clientX, y: e.clientY };
            } else {
                if (dist3 > 0.16) {
                    cutStrokeState.pts3D.push({ x: pt.x, z: pt.z });
                    cutStrokeState.pts2D.push({ x: e.clientX, y: e.clientY });
                }
            }
            drawCutPreview();
        });

        const stopCut = (e) => {
            if (!isDrawingCut) return;
            isDrawingCut = false;
            try {
                cutCanvas.releasePointerCapture(e.pointerId);
            } catch (_) {}

            // 若用户只是轻点屏幕（未拖动绘制新线），检测是否点击了刚剪完的纸面区域或胶囊标签以切换“保留/剪去”
            if (cutStrokeState && !cutStrokeState.hasMovedEnough) {
                const click2D = cutStrokeState.pts2D[0];
                const click3D = cutStrokeState.pts3D[0];
                cutStrokeState = null;

                if (lastCutSession) {
                    const hitRect = (r, x, y) => r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
                    if (hitRect(lastCutSession.cutBadgeRect, click2D.x, click2D.y) ||
                        hitRect(lastCutSession.keptBadgeRect, click2D.x, click2D.y)) {
                        toggleCutSessionChoice();
                        return;
                    }

                    const { gx, gz } = worldToSolverGrid(click3D.x, click3D.z);
                    const idx = gz * SOLVER_RES + gx;
                    if (lastCutSession.activeCutGrid[idx] === 1 || lastCutSession.activeKeptGrid[idx] === 1) {
                        toggleCutSessionChoice();
                        return;
                    }
                }
                return;
            }

            clearCutCanvas();

            if (!cutStrokeState || cutStrokeState.pts3D.length < 2) {
                cutStrokeState = null;
                return;
            }

            // 保存此刀剪切前的基准状态快照，供剪切后自由切换“剪去哪部分、保留哪部分”
            const baseFlatCutMask = new Float32Array(flatCutMask);
            const baseFlatCutFlags = new Uint8Array(flatCutFlags);
            const baseHasAnyCuts = hasAnyCuts;
            const baseSilhouette = new Uint8Array(paperSilhouette);
            const baseBoundaryPts = silhouetteBoundaryPts.slice();
            const savedStroke = {
                tool: currentCutTool,
                pts3D: cutStrokeState.pts3D.slice(),
                pts2D: cutStrokeState.pts2D.slice()
            };

            // 生成高清剪切掩码并应用到纸张
            const validRegion = evaluateCurrentCutRegion(true, savedStroke, false);
            cutStrokeState = null;

            if (!validRegion) {
                return;
            }

            const activeCutGrid = new Uint8Array(previewCutGrid);
            const activeKeptGrid = new Uint8Array(previewKeptGrid);
            const cutCenter = computeGridVisualCenter(activeCutGrid);
            const keptCenter = computeGridVisualCenter(activeKeptGrid);

            const applied = applyDeskCutToFlatPaper(true);
            if (!applied) {
                return;
            }

            // 激活剪切后区域选择会话
            lastCutSession = {
                tool: savedStroke.tool,
                pts3D: savedStroke.pts3D,
                pts2D: savedStroke.pts2D,
                inverted: false,
                baseFlatCutMask,
                baseFlatCutFlags,
                baseHasAnyCuts,
                baseSilhouette,
                baseBoundaryPts,
                activeCutGrid,
                activeKeptGrid,
                cutCenter,
                keptCenter,
                cutBadgeRect: null,
                keptBadgeRect: null
            };

            renderPaperTexture();
            drawPostCutSelectionOverlay();
            if (cutChoiceBar) cutChoiceBar.classList.add('show');
            sfx.playCut();
        };

        cutCanvas.addEventListener('pointerup', stopCut);
        cutCanvas.addEventListener('pointercancel', stopCut);
    }

    if (swapCutChoiceBtn) {
        swapCutChoiceBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleCutSessionChoice();
        });
    }

    if (confirmCutChoiceBtn) {
        confirmCutChoiceBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dismissCutChoiceSession();
        });
    }

    // 剪纸工具栏按钮事件绑定
    if (cutToolbar) {
        const toolBtns = cutToolbar.querySelectorAll('.cut-tool-btn[data-tool]');
        toolBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const tool = btn.getAttribute('data-tool');
                if (!tool) return;
                currentCutTool = tool;
                toolBtns.forEach(b => b.classList.toggle('active', b === btn));

                const tips = {
                    free: '自由剪',
                    carve: '线条镂空',
                    line: '直线剪',
                    heart: '心形',
                    star: '五角星',
                    circle: '圆形',
                    petal: '花瓣'
                };
                if (tips[tool]) showToast(tips[tool]);
            });
        });
    }

    if (undoCutBtn) {
        undoCutBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            undoLastCut();
        });
    }

    if (unfoldAfterCutBtn) {
        unfoldAfterCutBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isAnimating) return;
            isCutMode = false;
            updateCutModeUI();
            if (foldHistory.length > 0 || activeFold) {
                unfoldAll();
            }
        });
    }

    if (cutBtn) {
        cutBtn.addEventListener('click', () => {
            if (isAnimating) return;
            isCutMode = !isCutMode;
            updateCutModeUI();
        });
    }

    function updateCutModeUI() {
        const slidersEl = document.getElementById('slidersContainer');
        if (isCutMode) {
            cutBtn.classList.add('active');
            if (cutCanvas) cutCanvas.classList.add('active');
            if (cutToolbar) cutToolbar.classList.add('show');
            if (slidersEl) slidersEl.style.display = 'none';
            if (isDoodleMode) {
                isDoodleMode = false;
                if (penBtn) penBtn.classList.remove('active');
                if (doodleCanvas) doodleCanvas.classList.remove('active');
            }
            controls.enabled = false;
            rebuildFoldedPaperSilhouette();
            updateCutToolbarState();
            showToast('剪纸模式');
        } else {
            cutBtn.classList.remove('active');
            if (cutCanvas) cutCanvas.classList.remove('active');
            if (cutToolbar) cutToolbar.classList.remove('show');
            controls.enabled = true;
            isDrawingCut = false;
            cutStrokeState = null;
            dismissCutChoiceSession();
        }
    }

    // ==========================================
    // 8.3 形状切换、重置与尺寸规格滑动条
    // ==========================================
    const shapeBtn = document.getElementById('shapeBtn');
    const resetBtn = document.getElementById('resetBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const slidersContainer = document.getElementById('slidersContainer');
    const widthSlider = document.getElementById('widthSlider');
    const heightSlider = document.getElementById('heightSlider');
    const widthVal = document.getElementById('widthVal');
    const heightVal = document.getElementById('heightVal');

    function updateShapeBtnUI() {
        if (currentShape === 'circle') {
            shapeBtn.title = '切换为正方形纸';
            shapeBtn.innerHTML = `
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                    </svg>`;
            heightSlider.style.display = 'none';
            heightVal.style.display = 'none';
            widthSlider.min = '10';
            widthSlider.max = '40';
            widthSlider.value = Math.round(circleDiameter);
            widthVal.textContent = widthSlider.value;
        } else {
            shapeBtn.title = '切换为圆形纸';
            shapeBtn.innerHTML = `
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <circle cx="12" cy="12" r="9"/>
                    </svg>`;
            heightSlider.style.display = 'block';
            heightVal.style.display = 'block';
            widthSlider.min = '10';
            widthSlider.max = '60';
            widthSlider.value = Math.round(paperW);
            heightSlider.value = Math.round(paperH);
            widthVal.textContent = widthSlider.value;
            heightVal.textContent = heightSlider.value;
        }
    }

    shapeBtn.addEventListener('click', () => {
        if (isAnimating) return;
        const nextShape = currentShape === 'rect' ? 'circle' : 'rect';
        switchShape(nextShape);
    });

    function getDefaultCameraPosition(shape = currentShape) {
        const aspect = window.innerWidth / window.innerHeight;
        const isCircle = shape === 'circle';
        const baseDistance = isCircle ? 36 : 38;
        const zTilt = isCircle ? 2.5 : 4.0;
        const targetDistance = aspect < 1.0 ? baseDistance * Math.max(1, 1.15 / aspect) : baseDistance;
        const ratio = targetDistance / baseDistance;
        return new THREE.Vector3(0, targetDistance, zTilt * ratio);
    }

    function switchShape(newShape) {
        isAnimating = true;
        sfx.playUnfoldSnap();

        if (isCutMode) {
            isCutMode = false;
            updateCutModeUI();
        }

        currentShape = newShape;
        foldHistory.length = 0;
        activeFold = null;
        persistentFreeCreases.length = 0;
        clearCutMask();
        persistentHParts = 1;
        persistentVParts = 1;
        persistentCircleFolds = 0;
        currentSector = { start: 0, end: Math.PI * 2, targetBaseAngle: null };

        if (currentShape === 'circle') {
            paperW = circleDiameter;
            paperH = circleDiameter;
        } else {
            paperW = 24.0;
            paperH = 24.0;
        }

        paper.geometry.dispose();
        geometry = new THREE.PlaneGeometry(paperW, paperH, GRID_X, GRID_Z);
        origPositions = geometry.attributes.position.clone();
        paper.geometry = geometry;

        ghostPlane.geometry.dispose();
        ghostPlane.geometry = new THREE.PlaneGeometry(paperW, paperH);

        updateShapeBtnUI();

        renderPaperTexture();
        renderGhostTexture();
        updatePaperGeometry();

        const startTime = performance.now();
        const duration = 350;
        const startCamPos = camera.position.clone();
        const targetCamPos = getDefaultCameraPosition(newShape);
        const startTarget = controls.target.clone();
        const targetTarget = new THREE.Vector3(0, 0, 0);

        function animateCam(time) {
            const elapsed = time - startTime;
            const p = Math.min(elapsed / duration, 1.0);
            const ease = 1.0 - Math.pow(1.0 - p, 3);

            camera.position.lerpVectors(startCamPos, targetCamPos, ease);
            controls.target.lerpVectors(startTarget, targetTarget, ease);
            controls.update();

            if (p < 1.0) {
                requestAnimationFrame(animateCam);
            } else {
                isAnimating = false;
            }
        }
        requestAnimationFrame(animateCam);
    }

    // 平滑完全展开函数 (供双击手势及剪纸工具栏「展开」按钮调用)
    function unfoldAll() {
        if ((foldHistory.length === 0 && !activeFold) || isAnimating) return;
        isAnimating = true;
        sfx.playUnfoldSnap();

        const startTime = performance.now();
        const duration = 340;

        function animateUnfold(time) {
            const elapsed = time - startTime;
            const p = Math.min(elapsed / duration, 1.0);
            const ease = 1.0 - Math.pow(1.0 - p, 3);

            if (activeFold) {
                activeFold.angle = activeFold.angle * (1 - ease);
            }
            foldHistory.forEach(f => {
                f.angle = f.angle * (1 - ease);
            });
            updatePaperGeometry();

            if (p < 1.0) {
                requestAnimationFrame(animateUnfold);
            } else {
                isAnimating = false;
                foldHistory.forEach(f => {
                    if (f.isFree) addPersistentCrease(f);
                });
                if (activeFold && activeFold.isFree) {
                    addPersistentCrease(activeFold);
                }
                foldHistory.length = 0;
                activeFold = null;
                if (currentShape === 'circle') {
                    currentSector = { start: 0, end: Math.PI * 2, targetBaseAngle: null };
                }
                updatePaperGeometry();
                renderPaperTexture();
            }
        }
        requestAnimationFrame(animateUnfold);
    }

    settingsBtn.addEventListener('click', () => {
        if (isCutMode) {
            isCutMode = false;
            updateCutModeUI();
        }
        if (slidersContainer.style.display === 'none' || !slidersContainer.style.display) {
            slidersContainer.style.display = 'block';
            updateShapeBtnUI();
        } else {
            slidersContainer.style.display = 'none';
        }
    });

    function updateGeometryFromSliders() {
        if (currentShape === 'circle') {
            const newD = parseInt(widthSlider.value, 10);
            widthVal.textContent = newD;
            if (newD > 0 && newD !== circleDiameter) {
                circleDiameter = newD;
                paperW = circleDiameter;
                paperH = circleDiameter;
                foldHistory.length = 0;
                activeFold = null;
                persistentFreeCreases.length = 0;
                clearCutMask();
                persistentCircleFolds = 0;
                currentSector = { start: 0, end: Math.PI * 2 };

                paper.geometry.dispose();
                geometry = new THREE.PlaneGeometry(paperW, paperH, GRID_X, GRID_Z);
                origPositions = geometry.attributes.position.clone();
                paper.geometry = geometry;

                ghostPlane.geometry.dispose();
                ghostPlane.geometry = new THREE.PlaneGeometry(paperW, paperH);

                updatePaperGeometry();
                renderPaperTexture();
                renderGhostTexture();
            }
        } else {
            const newW = parseInt(widthSlider.value, 10);
            const newH = parseInt(heightSlider.value, 10);
            widthVal.textContent = newW;
            heightVal.textContent = newH;

            if (newW > 0 && newH > 0 && (newW !== paperW || newH !== paperH)) {
                paperW = newW;
                paperH = newH;
                foldHistory.length = 0;
                activeFold = null;
                persistentFreeCreases.length = 0;
                clearCutMask();
                persistentHParts = 1;
                persistentVParts = 1;

                paper.geometry.dispose();
                geometry = new THREE.PlaneGeometry(paperW, paperH, GRID_X, GRID_Z);
                origPositions = geometry.attributes.position.clone();
                paper.geometry = geometry;

                ghostPlane.geometry.dispose();
                ghostPlane.geometry = new THREE.PlaneGeometry(paperW, paperH);

                updatePaperGeometry();
                renderPaperTexture();
                renderGhostTexture();
            }
        }
    }

    widthSlider.addEventListener('input', updateGeometryFromSliders);
    heightSlider.addEventListener('input', updateGeometryFromSliders);

    // 重置按钮 (恢复初始平整纸张、清除所有折痕与剪切，恢复初始视角)
    resetBtn.addEventListener('click', () => {
        if (isAnimating) return;
        isAnimating = true;

        if (isCutMode) {
            isCutMode = false;
            updateCutModeUI();
        }

        sfx.playUnfoldSnap();
        const startTime = performance.now();
        const duration = 400;

        const startCamPos = camera.position.clone();
        const targetCamPos = getDefaultCameraPosition(currentShape);
        const startTarget = controls.target.clone();
        const targetTarget = new THREE.Vector3(0, 0, 0);

        function animateReset(time) {
            const elapsed = time - startTime;
            const p = Math.min(elapsed / duration, 1.0);
            const ease = 1.0 - Math.pow(1.0 - p, 3);

            camera.position.lerpVectors(startCamPos, targetCamPos, ease);
            controls.target.lerpVectors(startTarget, targetTarget, ease);
            controls.update();

            if (p < 1.0) {
                requestAnimationFrame(animateReset);
            } else {
                isAnimating = false;
                foldHistory.length = 0;
                activeFold = null;
                persistentFreeCreases.length = 0;
                clearCutMask();
                persistentHParts = 1;
                persistentVParts = 1;
                persistentCircleFolds = 0;
                currentSector = { start: 0, end: Math.PI * 2, targetBaseAngle: null };

                if (currentShape === 'circle') {
                    paperW = circleDiameter;
                    paperH = circleDiameter;
                } else {
                    paperW = 24.0;
                    paperH = 24.0;
                }

                paper.geometry.dispose();
                geometry = new THREE.PlaneGeometry(paperW, paperH, GRID_X, GRID_Z);
                origPositions = geometry.attributes.position.clone();
                paper.geometry = geometry;

                ghostPlane.geometry.dispose();
                ghostPlane.geometry = new THREE.PlaneGeometry(paperW, paperH);

                updateShapeBtnUI();

                updatePaperGeometry();
                renderPaperTexture();
                renderGhostTexture();
            }
        }
        requestAnimationFrame(animateReset);
    });

    // ==========================================
    // 9. 窗口自适应与渲染循环
    // ==========================================
    function updateCameraFit() {
        const aspect = window.innerWidth / window.innerHeight;
        camera.aspect = aspect;

        const defPos = getDefaultCameraPosition(currentShape);
        camera.position.copy(defPos);

        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (controls) {
            controls.target.set(0, 0, 0);
            controls.update();
        }
        resizeDoodleCanvas();
        resizeCutCanvas();
    }
    window.addEventListener('resize', updateCameraFit);

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    const whiteList = ["edui123.com", "edui.fun"];if (!whiteList.includes(window.location.hostname)) {window.location.href = "https://edui123.com";}
    // 首次加载初始化
    updateCameraFit();
    resizeDoodleCanvas();
    resizeCutCanvas();
    renderGhostTexture();
    renderPaperTexture();
    updatePaperGeometry();
    updateShapeBtnUI();
    updateFoldModeUI();
    animate();
</script>
</body>

</html>
