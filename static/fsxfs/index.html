<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>图解分数乘分数</title>
    <style>
        :root {
            --bg-color: #F4F3EC;
            --primary-blue: #2563eb;
            --primary-hover: #1d4ed8;
            --color-f1: #2563eb;
            /* 分数1（蓝色） */
            --color-f2: #e11d48;
            /* 分数2（洋红/红色） */
            --text-main: #1e293b;
            --text-muted: #64748b;
            --inactive-color: #cbd5e1;
            --border-color: #cbd5e1;
            --grid-border: #1e293b;
            --color-intersect-bg: transparent;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* 主舞台：图和算式水平居中显示，间距紧凑保留约 30px，右侧避让画笔工具栏 */
        .main-stage {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 100%;
            padding: 20px 80px 20px 30px;
            box-sizing: border-box;
            z-index: 10;
        }

        /* 左侧图解区域 */
        .diagram-wrapper {
            flex: 0 0 auto;
            width: min(600px, 48vw);
            max-height: 86vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.05));
        }

        .grid-outline {
            fill: #ffffff;
            stroke: var(--grid-border);
            stroke-width: 2.5px;
        }

        .edge-line {
            stroke: var(--grid-border);
            stroke-width: 2.5px;
            stroke-linecap: square;
            transition: stroke 0.2s, stroke-width 0.2s;
        }

        /* 分数1等分虚线（蓝色） */
        .grid-line-f1 {
            stroke: var(--color-f1);
            stroke-width: 1.8px;
            stroke-dasharray: 6 5;
            opacity: 0.85;
            pointer-events: none;
        }

        /* 分数2等分虚线（红色） */
        .grid-line-f2 {
            stroke: var(--color-f2);
            stroke-width: 1.8px;
            stroke-dasharray: 6 5;
            opacity: 0.85;
            pointer-events: none;
        }

        .area-col {
            fill: url(#hatch-f1);
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .area-intersect-bg {
            display: none;
        }

        .area-intersect-cross {
            fill: url(#hatch-f2);
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        /* 短刻度线 */
        .tick-line {
            stroke-width: 2.5px;
            stroke-linecap: round;
            pointer-events: none;
            transition: stroke 0.2s;
        }

        /* 上边与刻度呼吸效果（无背景色、无边框） */
        @keyframes edgeBreatheTop {
            0% {
                stroke: #2563eb;
                stroke-width: 2.5px;
                filter: drop-shadow(0 0 1px rgba(37, 99, 235, 0.4));
                opacity: 0.7;
            }

            50% {
                stroke: #1d4ed8;
                stroke-width: 4px;
                filter: drop-shadow(0 0 6px rgba(37, 99, 235, 0.9));
                opacity: 1;
            }

            100% {
                stroke: #2563eb;
                stroke-width: 2.5px;
                filter: drop-shadow(0 0 1px rgba(37, 99, 235, 0.4));
                opacity: 0.7;
            }
        }

        /* 右边与刻度呼吸效果（无背景色、无边框） */
        @keyframes edgeBreatheRight {
            0% {
                stroke: #e11d48;
                stroke-width: 2.5px;
                filter: drop-shadow(0 0 1px rgba(225, 29, 72, 0.4));
                opacity: 0.7;
            }

            50% {
                stroke: #be123c;
                stroke-width: 4px;
                filter: drop-shadow(0 0 6px rgba(225, 29, 72, 0.9));
                opacity: 1;
            }

            100% {
                stroke: #e11d48;
                stroke-width: 2.5px;
                filter: drop-shadow(0 0 1px rgba(225, 29, 72, 0.4));
                opacity: 0.7;
            }
        }

        .breathing-top {
            animation: edgeBreatheTop 1.2s infinite ease-in-out;
        }

        .breathing-right {
            animation: edgeBreatheRight 1.2s infinite ease-in-out;
        }

        /* 纯透明选边感应区（无边框、无填充色） */
        .edge-hit-area {
            fill: transparent !important;
            stroke: none !important;
            cursor: default;
            pointer-events: none;
        }

        .edge-hit-area.active-choice {
            cursor: pointer;
            pointer-events: auto;
        }

        /* 分数1等分块交互点击感应区（点击添加/取消阴影） */
        .f1-block-hit {
            fill: transparent;
            cursor: pointer;
            transition: fill 0.15s ease;
            pointer-events: auto;
        }

        .f1-block-hit:hover {
            fill: rgba(37, 99, 235, 0.08);
        }

        .f1-block-hit.shaded:hover {
            fill: rgba(37, 99, 235, 0.14);
        }

        /* 分数2第二层等分块交互点击感应区（点击添加/取消第二层阴影） */
        .f2-block-hit {
            fill: transparent;
            cursor: pointer;
            transition: fill 0.15s ease;
            pointer-events: auto;
        }

        .f2-block-hit:hover {
            fill: rgba(225, 29, 72, 0.08);
        }

        .f2-block-hit.shaded:hover {
            fill: rgba(225, 29, 72, 0.14);
        }

        /* 点击分母：对应的等分虚线变为实线段高亮发光（去除荧光模糊阴影，保持干净通透） */
        @keyframes lineGlowBlue {
            0%, 100% {
                stroke-width: 2.5px;
                opacity: 0.85;
            }

            50% {
                stroke-width: 3.2px;
                opacity: 1;
            }
        }

        @keyframes lineGlowRed {
            0%, 100% {
                stroke-width: 2.5px;
                opacity: 0.85;
            }

            50% {
                stroke-width: 3.2px;
                opacity: 1;
            }
        }

        @keyframes lineGlowDark {
            0%, 100% {
                stroke-width: 2.2px;
                opacity: 0.85;
            }

            50% {
                stroke-width: 2.8px;
                opacity: 1;
            }
        }

        .highlight-solid-f1 {
            stroke: var(--color-f1);
            stroke-width: 2.8px;
            stroke-linecap: round;
            stroke-dasharray: none !important;
            animation: lineGlowBlue 1.3s infinite ease-in-out;
            pointer-events: none;
        }

        .highlight-solid-f2 {
            stroke: var(--color-f2);
            stroke-width: 2.8px;
            stroke-linecap: round;
            stroke-dasharray: none !important;
            animation: lineGlowRed 1.3s infinite ease-in-out;
            pointer-events: none;
        }

        .highlight-solid-resDen {
            stroke: #334155;
            stroke-width: 2.4px;
            stroke-linecap: round;
            stroke-dasharray: none !important;
            animation: lineGlowDark 1.3s infinite ease-in-out;
            pointer-events: none;
        }

        /* 点击分子：对应的部分加入填充色呼吸高亮显示（柔和通透无重阴影） */
        @keyframes fillBreatheBlue {
            0%, 100% {
                fill: rgba(37, 99, 235, 0.12);
                stroke: rgba(37, 99, 235, 0.35);
                stroke-width: 1.5px;
            }

            50% {
                fill: rgba(37, 99, 235, 0.28);
                stroke: rgba(37, 99, 235, 0.65);
                stroke-width: 2px;
            }
        }

        @keyframes fillBreatheRed {
            0%, 100% {
                fill: rgba(225, 29, 72, 0.12);
                stroke: rgba(225, 29, 72, 0.35);
                stroke-width: 1.5px;
            }

            50% {
                fill: rgba(225, 29, 72, 0.28);
                stroke: rgba(225, 29, 72, 0.65);
                stroke-width: 2px;
            }
        }

        @keyframes fillBreatheIntersect {
            0%, 100% {
                fill: rgba(234, 88, 12, 0.18);
                stroke: rgba(234, 88, 12, 0.45);
                stroke-width: 1.5px;
            }

            50% {
                fill: rgba(234, 88, 12, 0.40);
                stroke: rgba(234, 88, 12, 0.8);
                stroke-width: 2.2px;
            }
        }

        .highlight-fill-num1 {
            animation: fillBreatheBlue 1.3s infinite ease-in-out;
            pointer-events: none;
        }

        .highlight-fill-num2 {
            animation: fillBreatheRed 1.3s infinite ease-in-out;
            pointer-events: none;
        }

        .highlight-fill-resNum {
            animation: fillBreatheIntersect 1.3s infinite ease-in-out;
            pointer-events: none;
        }

        /* 算式卡片高亮选中槽位样式（减弱荧光阴影，更柔和干净） */
        .frac-part.slot-highlighted-f1 {
            border-color: var(--color-f1) !important;
            border-style: solid !important;
            background: #eff6ff !important;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.18) !important;
        }

        .frac-part.slot-highlighted-f2 {
            border-color: var(--color-f2) !important;
            border-style: solid !important;
            background: #fff1f2 !important;
            box-shadow: 0 0 0 2px rgba(225, 29, 72, 0.18) !important;
        }

        .frac-part.slot-highlighted-res {
            border-color: #ea580c !important;
            border-style: solid !important;
            background: #fff7ed !important;
            box-shadow: 0 0 0 2px rgba(234, 88, 12, 0.18) !important;
        }

        .frac-part.slot-highlighted-resDen {
            border-color: #334155 !important;
            border-style: solid !important;
            background: #f8fafc !important;
            box-shadow: 0 0 0 2px rgba(51, 65, 85, 0.18) !important;
        }

        /* 右侧算式展示区 */
        .formula-panel {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .formula-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1.5px solid rgba(226, 232, 240, 0.9);
            border-radius: 20px;
            padding: 24px 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: auto;
        }

        .formula-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-size: 48px;
            font-weight: normal;
        }

        .frac-wrapper {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 82px;
        }

        .frac-wrapper.res {
            min-width: 96px;
        }

        .frac-part {
            width: 80px;
            min-width: 80px;
            height: 54px;
            padding: 2px 6px;
            border-radius: 12px;
            border: 1.5px dashed rgba(0, 0, 0, 0.08);
            background: #ffffff;
            transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
            line-height: 1.1;
            font-family: inherit;
            font-size: 40px;
            font-weight: normal;
            /* 分数去除粗体 */
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
        }

        .frac-part:hover {
            border-color: rgba(37, 99, 235, 0.35);
            background: #eff6ff;
        }

        .frac-part.active {
            border-color: var(--primary-blue) !important;
            border-style: solid !important;
            background: #eff6ff !important;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
        }

        /* 分数1（蓝色）边框淡到几乎看不到，默认纯净底色 */
        .frac-part.f1 {
            color: var(--color-f1);
            border-color: rgba(37, 99, 235, 0.1);
            background: #ffffff;
        }

        .frac-part.f1:hover {
            border-color: rgba(37, 99, 235, 0.3);
            background: #f8fbff;
        }

        /* 分数2（洋红）边框淡到几乎看不到，默认纯净底色 */
        .frac-part.f2 {
            color: var(--color-f2);
            border-color: rgba(225, 29, 72, 0.1);
            background: #ffffff;
        }

        .frac-part.f2:hover {
            border-color: rgba(225, 29, 72, 0.3);
            background: #fffafa;
        }

        /* 积结果状态（宽 96px，容纳更多位数不跳动，边框极淡） */
        .frac-part.res {
            width: 96px;
            min-width: 96px;
            color: #0f172a;
            border-style: solid;
            background: #ffffff;
            border-color: rgba(0, 0, 0, 0.08);
            cursor: pointer;
        }

        .frac-part.res:hover {
            background: #f8fafc;
            border-color: rgba(0, 0, 0, 0.22);
        }

        .frac-line {
            width: 100%;
            height: 4px;
            background-color: var(--text-main);
            margin: 6px 0;
            border-radius: 2px;
            transition: background-color 0.25s ease;
        }

        .operator {
            color: #475569;
            font-size: 40px;
            font-weight: normal;
        }

        /* 全屏白板手写画布 */
        #drawing-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 50;
            pointer-events: none;
        }

        #drawing-canvas.active {
            pointer-events: auto;
            cursor: crosshair;
        }

        /* 右侧垂直居中极简画笔与重置工具栏 */
        .vertical-toolbar {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.96);
            border: 1.5px solid rgba(203, 213, 225, 0.88);
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            padding: 10px 7px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 100;
            backdrop-filter: blur(14px);
        }

        .tool-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .tool-divider {
            width: 28px;
            height: 1.5px;
            background-color: var(--border-color);
            margin: 2px 0;
        }

        .tool-btn {
            border: 1px solid transparent;
            background: #f8fafc;
            color: #334155;
            width: 44px;
            height: 44px;
            padding: 3px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: all 0.15s;
        }

        .tool-btn span {
            font-size: 16px;
            line-height: 1;
        }

        .tool-btn label {
            font-size: 10.5px;
            line-height: 1;
            cursor: pointer;
        }

        .tool-btn:hover {
            background: #e2e8f0;
        }

        .tool-btn.active {
            background: #eff6ff;
            color: var(--primary-blue);
            border-color: var(--primary-blue);
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2);
        }

        .tool-btn.reset-btn {
            background: #fef2f2;
            color: #dc2626;
            border-color: #fecaca;
        }

        .tool-btn.reset-btn:hover {
            background: #fee2e2;
            transform: scale(1.05);
        }

        .tool-btn.reset-btn span {
            font-size: 18px;
            font-weight: bold;
        }

        .color-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
        }

        .color-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 1px #cbd5e1;
            transition: transform 0.15s;
        }

        .color-dot:hover {
            transform: scale(1.2);
        }

        .color-dot.active {
            box-shadow: 0 0 0 2px var(--primary-blue);
            transform: scale(1.18);
        }

        .tool-icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: #475569;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: all 0.15s;
        }

        .tool-icon-btn:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        .tool-icon-btn:active {
            transform: scale(0.94);
        }

        /* 触控屏专属虚拟数字键盘（去除了冗余 display-row） */
        .virtual-keypad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: transparent;
            z-index: 998;
            display: none;
        }

        .virtual-keypad {
            position: fixed;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 18px;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.16);
            padding: 12px 14px;
            z-index: 999;
            width: 250px;
            display: none;
            flex-direction: column;
            gap: 10px;
            border: 1.5px solid #cbd5e1;
            animation: popKeypad 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            backdrop-filter: blur(14px);
        }

        .virtual-keypad::before {
            content: '';
            position: absolute;
            top: -8px;
            left: var(--arrow-x, 50%);
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 8px solid rgba(255, 255, 255, 0.98);
            filter: drop-shadow(0 -2px 1px rgba(0, 0, 0, 0.08));
        }

        .virtual-keypad.place-above::before {
            top: auto;
            bottom: -8px;
            border-bottom: none;
            border-top: 8px solid rgba(255, 255, 255, 0.98);
            filter: drop-shadow(0 2px 1px rgba(0, 0, 0, 0.08));
        }

        @keyframes popKeypad {
            from {
                opacity: 0;
                transform: translateY(-4px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .keypad-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 4px 4px 4px;
            border-bottom: 1px solid #f1f5f9;
        }

        .keypad-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 0.3px;
        }

        .keypad-close {
            background: none;
            border: none;
            font-size: 22px;
            color: #64748b;
            cursor: pointer;
            width: 32px;
            height: 32px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.15s;
        }

        .keypad-close:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .keypad-grid button {
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            height: 52px;
            font-size: 23px;
            font-weight: 600;
            color: #0f172a;
            cursor: pointer;
            transition: all 0.12s;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .keypad-grid button:active {
            background: #e2e8f0;
            transform: scale(0.95);
        }

        .keypad-grid button.action {
            font-size: 16px;
            font-weight: 700;
            background: #f8fafc;
            color: #64748b;
        }

        .keypad-grid button.confirm {
            background: var(--primary-blue);
            color: #ffffff;
            border-color: var(--primary-blue);
            font-weight: 700;
            font-size: 16px;
        }

        .keypad-grid button.confirm:active {
            background: var(--primary-hover);
        }

        @media (max-width: 900px) {
            .main-stage {
                flex-direction: column;
                gap: 20px;
                padding: 16px;
            }

            .diagram-wrapper {
                width: 100%;
                height: 55%;
            }

            .formula-panel {
                width: 100%;
                height: 45%;
            }

            .formula-main {
                font-size: 32px;
                gap: 12px;
            }

            .frac-wrapper {
                min-width: 66px;
            }

            .frac-wrapper.res {
                min-width: 78px;
            }

            .frac-part {
                width: 64px;
                min-width: 64px;
                height: 44px;
                font-size: 28px;
                padding: 2px 4px;
            }

            .frac-part.res {
                width: 76px;
                min-width: 76px;
            }

            .operator {
                font-size: 28px;
            }

            .vertical-toolbar {
                right: 8px;
                transform: translateY(-50%) scale(0.85);
                transform-origin: center right;
            }
        }
    </style>
</head>

<body>
    <!-- 主舞台：图和算式水平居中显示 -->
    <main class="main-stage">
        <!-- 左侧：图形演示展示区 -->
        <div class="diagram-wrapper">
            <svg id="svg-canvas" viewBox="0 0 630 430" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <!-- 分数1蓝色单向斜线纹理（右上到左下，加粗至 1.4px，清晰饱满） -->
                    <pattern id="hatch-f1" width="10" height="10" patternTransform="rotate(45 0 0)"
                        patternUnits="userSpaceOnUse">
                        <line x1="0" y1="0" x2="0" y2="10" stroke="#2563eb" stroke-width="1.4" opacity="0.85" />
                    </pattern>
                    <!-- 分数2红色反向斜线纹理（左上到右下，加粗至 1.5px，清晰饱满） -->
                    <pattern id="hatch-f2" width="10" height="10" patternTransform="rotate(-45 0 0)"
                        patternUnits="userSpaceOnUse">
                        <line x1="0" y1="0" x2="0" y2="10" stroke="#e11d48" stroke-width="1.5" opacity="0.9" />
                    </pattern>

                    <!-- 动态画线裁剪区：实现垂直虚线从上往下展开、水平虚线从右往左展开 -->
                    <clipPath id="col-clip">
                        <rect id="col-clip-rect" x="25" y="30" width="570" height="360" />
                    </clipPath>
                    <clipPath id="row-clip">
                        <rect id="row-clip-rect" x="30" y="25" width="560" height="370" />
                    </clipPath>
                </defs>

                <!-- 1. 底层：整体矩形底板与外边框（纯白，默认无多余内容） -->
                <rect id="grid-outline" class="grid-outline" x="30" y="30" width="560" height="360" rx="3" ry="3">
                </rect>

                <!-- 2. 重叠交集区域浅色背景（柔和底色，在斜线之下） -->
                <rect id="rect-intersect-bg" class="area-intersect-bg" x="30" y="30" width="0" height="0" opacity="0">
                </rect>

                <!-- 3. 第一个分数的单向蓝色斜线群组（右上到左下） -->
                <g id="f1-hatch-group"></g>

                <!-- 4. 重叠交集反向红色斜线群组（左上到右下，原蓝色斜线自然贯穿，颜色绝不加深） -->
                <g id="intersect-cross-group"></g>

                <!-- 5. 完整等分线（按分数色彩呈现，并通过 clipPath 动画展开） -->
                <g id="col-lines" clip-path="url(#col-clip)"></g>
                <g id="row-lines" clip-path="url(#row-clip)"></g>

                <!-- 6. 独立上边框线与右边框线（用于呈现呼吸辉光效果） -->
                <line id="edge-line-top" class="edge-line" x1="30" y1="30" x2="590" y2="30" />
                <line id="edge-line-right" class="edge-line" x1="590" y1="30" x2="590" y2="390" />

                <!-- 7. 待选短刻度线群组（输入分母后与对应边同步呼吸） -->
                <g id="top-ticks-group"></g>
                <g id="right-ticks-group"></g>

                <!-- 8. 点击算式分子分母时的高亮脉冲层 -->
                <g id="highlight-layer"></g>

                <!-- 9. 第一个分数每个等分块的交互点击感应层（点击添加/取消阴影） -->
                <g id="f1-blocks-hit"></g>

                <!-- 10. 纯透明点击感应区（无边框、无填充色，仅供点击选边） -->
                <rect id="hit-top" class="edge-hit-area" x="20" y="10" width="580" height="42"
                    onclick="chooseEdge('top')" />
                <rect id="hit-right" class="edge-hit-area" x="568" y="20" width="44" height="380"
                    onclick="chooseEdge('right')" />
            </svg>
        </div>

        <!-- 右侧：乘法算式展示区 -->
        <div class="formula-panel">
            <div class="formula-card">
                <div class="formula-main" id="formula-main">
                    <!-- 由 JS 渲染 -->
                </div>
            </div>
        </div>
    </main>

    <!-- 全屏手写绘图画布 -->
    <canvas id="drawing-canvas"></canvas>

    <!-- 右侧垂直居中极简画笔与重置工具栏 -->

                <label>指针</label>
            </button>
            <button class="tool-btn" id="tool-pen" onclick="setWhiteboardMode('pen')" title="手写画笔">
                <span>✏️</span>
                <label>画笔</label>
            </button>
            <button class="tool-btn" id="tool-eraser" onclick="setWhiteboardMode('eraser')" title="橡皮擦（选中状态下再点击清空画笔笔迹）">
                <span>🧹</span>
                <label>橡皮</label>
            </button>
        </div>

        <div class="tool-divider"></div>

        <div class="color-group">

            <div class="color-dot" style="background-color: #2563eb;" onclick="setPenColor('#2563eb', this)" title="蓝色">
            </div>
            <div class="color-dot" style="background-color: #f59e0b;" onclick="setPenColor('#f59e0b', this)" title="黄色">
            </div>
            <div class="color-dot" style="background-color: #0f172a;" onclick="setPenColor('#0f172a', this)" title="黑色">
            </div>
        </div>

        <div class="tool-divider"></div>

        <!-- 合并后的清空与重置功能按钮 -->
        <button class="tool-btn reset-btn" onclick="resetAll()" title="清空全部数值与图解，恢复空白初始状态">
            <span>↺</span>
            <label>重置</label>
        </button>
    </div>

        </div>
    </div>
