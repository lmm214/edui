<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一张纸连续对折3次</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f4f8;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.92);
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .shape-selector {
            display: flex;
            background: #e8f0f8;
            padding: 4px;
            border-radius: 20px;
            gap: 4px;
        }

        .shape-btn {
            background: transparent;
            color: #556677;
            border: none;
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .shape-btn:hover:not(.active) {
            background: rgba(74, 144, 226, 0.15);
            color: #357abd;
            transform: none;
            box-shadow: none;
        }

        .shape-btn.active {
            background: #4a90e2;
            color: white;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.35);
        }

        .divider {
            width: 1px;
            height: 28px;
            background: #d4e0ec;
        }

        .action-btn {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .action-btn:hover:not(:disabled) {
            background: #357abd;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.3);
        }

        .action-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #btn-reset {
            background: #f0f4f8;
            color: #556677;
            border: 1px solid #d4e0ec;
        }

        #btn-reset:hover {
            background: #e2eaf2;
            color: #334455;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        #step-indicator {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.92);
            padding: 10px 28px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(10px);
            pointer-events: none;
            text-align: center;
        }
    </style>
    <!-- Dependencies -->
    <script src="js/three.js"></script>
    <script src="js/OrbitControls.js"></script>
    <script src="js/tween.js"></script>
</head>

<body>
    <div id="step-indicator">准备开始</div>
    <div id="canvas-container"></div>

    <div id="ui-container">
        <div class="shape-selector">
            <button class="shape-btn active" data-shape="person">半个小人</button>
            <button class="shape-btn" data-shape="butterfly">蝴蝶</button>
        </div>
        <div class="divider"></div>
        <button id="btn-next" class="action-btn">下一步</button>
        <button id="btn-reset" class="action-btn">重置</button>
    </div>
