<style>

@media(max-width:650px) and (max-height:620px){.sidebar{padding:9px;gap:7px}.shape{height:44px}.shape svg{height:18px}.section-label{margin-bottom:5px}.scene-heading h2{font-size:16px}.scene-heading p{display:none}.left{grid-template-rows:minmax(0,1fr) 112px}}

.shape-extras{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:center;gap:6px;margin-top:8px;min-height:30px}
.more-shapes{width:28px;height:28px;border:1px solid #ccd8bd;border-radius:50%;background:#f4f7ec;color:#648452;display:grid;place-items:center;padding:0;font-size:21px;line-height:1;margin-inline:auto}
.more-shapes:hover,.more-shapes[aria-expanded="true"]{background:#e9efd9;border-color:#96aa7a}
.shape-extras:has(.extra-shapes[hidden]) .more-shapes{grid-column:1/-1}
.extra-shapes:not([hidden]){display:contents}.extra-shapes[hidden]{display:none}
.shape-extras .shape{grid-column:2;grid-row:1;width:100%;height:30px;flex-direction:row;gap:7px;font-size:10px;border-radius:9px}.shape-extras .shape svg{width:24px;height:22px}.shape-extras .shape span{white-space:nowrap}

<main><div class="left"><section class="scene" id="scene" aria-label="三维骑行场景"><div class="scene-heading"><h2>如果车轮不是圆的？</h2><p>换一种车轮，和小朋友一起出发。</p></div><div class="view-switch" aria-label="观察视角"><button class="active" data-view="three" aria-pressed="true">立体视角</button><button data-view="side" aria-pressed="false">侧面观察</button></div><div class="scene-bottom"><div class="riding-badge"><span></span><span id="status">三角形车轮 · 等待开始</span></div><span class="scene-hint">拖动旋转视角 · 滚轮缩放</span></div><div class="error hidden" id="error"></div></section>
<section class="chart-card" id="chartCard"><div class="chart-title"><span id="chartTitle">轮心走过的路</span><span class="legend"><i></i>轮心<span class="body-legend" hidden><i></i>车身</span></span></div><div class="chart-wrap"><canvas id="chart" aria-label="轮心高度随滚动距离变化的实时曲线"></canvas></div><div class="chart-foot"><span id="chartAxis">↑ 轮心高度</span><span>滚动距离 →</span></div></section></div>
<aside class="sidebar"><section><div class="section-label"><span class="step">01</span>选一副特别的车轮</div><div class="shapes" role="group" aria-label="轮胎形状">
<button class="shape active" data-shape="triangle" aria-pressed="true"><svg viewBox="0 0 40 32"><path d="M20 3 36 29H4Z"/></svg><span>三角形</span></button>
<button class="shape" data-shape="square" aria-pressed="false"><svg viewBox="0 0 40 32"><path d="M7 3H33V29H7Z"/></svg><span>正方形</span></button>
<button class="shape" data-shape="pentagon" aria-pressed="false"><svg viewBox="0 0 40 32"><path d="M20 2 34.27 12.36 28.82 29.14 11.18 29.14 5.73 12.36Z"/></svg><span>正五边形</span></button>
<button class="shape" data-shape="hexagon" aria-pressed="false"><svg viewBox="0 0 40 32"><path d="M12 3H28L36 16 28 29H12L4 16Z"/></svg><span>正六边形</span></button>
<button class="shape" data-shape="ellipse" aria-pressed="false"><svg viewBox="0 0 40 32"><ellipse cx="20" cy="16" rx="17" ry="10" transform="rotate(-25 20 16)"/></svg><span>椭圆形</span></button>
<button class="shape" data-shape="circle" aria-pressed="false"><svg viewBox="0 0 40 32"><circle cx="20" cy="16" r="13"/></svg><span>圆形</span></button></div>
<div class="shape-extras"><button class="more-shapes" id="moreShapes" aria-label="展开更多车轮形状" aria-expanded="false" aria-controls="extraShapes" title="展开更多车轮形状">＋</button><div class="extra-shapes" id="extraShapes" hidden><button class="shape" data-shape="reuleaux" aria-pressed="false"><svg viewBox="0 0 40 40"><path d="M20 3 A32 32 0 0 1 36 30.71 A32 32 0 0 1 4 30.71 A32 32 0 0 1 20 3Z"/></svg><span>莱洛三角形</span></button><div class="experiment-toggles"><button class="experiment-button" id="vehicleToggle" aria-pressed="false">切换汽车</button><button class="experiment-button" id="couplingToggle" aria-pressed="false" disabled>固定轮轴</button><button class="experiment-button" id="roadToggle" aria-pressed="false" hidden>平直道路</button></div>
</div></div></section>
<div class="divider"></div><section><div class="section-label"><span class="step">02</span>调整骑行状态</div><div class="speed-title"><label for="speed">骑行速度</label><output class="speed-value" id="speedValue">1.0 ×</output></div><input id="speed" type="range" min="0.25" max="2" value="1" step="0.25"><div class="range-labels"><span>慢慢观察</span><span>加速骑行</span></div><label class="toggle-row" for="trail">显示轮心轨迹<input id="trail" type="checkbox" checked></label></section>
<div class="actions"><button class="play" id="play">▶ 开始骑行</button><button class="reset" id="reset" title="重新开始" aria-label="重新开始">↺</button></div></aside></main>
<footer class="footnote"><span>观察提示：哪一种车轮，能让轮心始终保持一样高？</span><span>理想化平路滚动 · 两轮同步 · 忽略形变</span></footer>
