<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>六上“工程问题” 线段图</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F4F3EC;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Source Han Sans CN", "Microsoft YaHei", sans-serif;
      color: #2D312E;
    }

    /* 主画布区域 */
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg.diagram {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 线段主体 */
    .math-line {
      stroke: #2A2D2B;
      stroke-width: 4px;
      stroke-linecap: square;
    }

    /* 两端仅上半部分的竖线刻度 */
    .cap-line {
      stroke: #2A2D2B;
      stroke-width: 4px;
      stroke-linecap: square;
    }

    /* 等分刻度短线 */
    .division-tick {
      stroke: #4A4E48;
      stroke-width: 2px;
      stroke-linecap: square;
      opacity: 0.9;
    }

    /* 左右两端外侧的甲、乙标签文字 */
    .end-label {
      font-size: 26px;
      font-weight: 700;
      fill: #2A2D2B;
      text-anchor: middle;
      dominant-baseline: central;
      transition: fill 0.2s, transform 0.2s;
    }

    .end-label.interactive {
      cursor: pointer;
    }

    #labelJia.interactive:hover,
    .end-label.label-jia.interactive:hover {
      fill: #D35400;
    }

    #labelYi.interactive:hover,
    .end-label.label-yi.interactive:hover {
      fill: #2471A3;
    }

    #labelJia.active,
    .end-label.label-jia.active {
      fill: #D35400;
    }

    #labelYi.active,
    .end-label.label-yi.active {
      fill: #2471A3;
    }

    /* 总长大括号 */
    .curly-brace {
      fill: none;
      stroke: #2A2D2B;
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .curly-brace.visible {
      opacity: 1;
      cursor: pointer;
    }

    /* 总长标注文字（紧贴大括号上方） */
    .total-label-group {
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .total-label-group.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .total-label-bg {
      fill: #F4F3EC;
      rx: 8px;
      transition: fill 0.15s;
    }

    .total-label-group:hover .total-label-bg {
      fill: #EAE8DE;
    }

    .total-label-text {
      font-size: 22px;
      font-weight: 700;
      fill: #1E201E;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: 0.5px;
    }

    /* 单段向下大括号 */
    .segment-curly-brace {
      fill: none;
      stroke: #D35400;
      stroke-width: 2.4px;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .segment-curly-brace.visible {
      opacity: 1;
    }

    /* 乙专属色大括号（在双大括号模式下更易辨识） */
    .segment-curly-brace.brace-yi {
      stroke: #2471A3;
    }

    /* HTML 数学算式徽标（支持竖向分数展示） */
    .math-badge {
      position: absolute;
      transform: translate(-50%, 0);
      background: #F4F3EC;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 20px;
      font-weight: 400;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 10;
      line-height: 1.2;
    }

    .math-badge.visible {
      opacity: 1;
    }

    .math-badge.badge-jia {
      color: #D35400;
    }

    .math-badge.badge-yi {
      color: #2471A3;
    }

    /* 合修算式徽标：位于线段上方居中，精致卡片风格 */
    .math-badge.combined {
      background: #FFFFFF;
      color: #1E201E;
      font-size: 23px;
      font-weight: 400;
      padding: 8px 22px;
      border-radius: 12px;
      border: 1.5px solid rgba(42, 45, 43, 0.12);
      box-shadow: 0 4px 14px rgba(42, 45, 43, 0.08);
      white-space: nowrap;
      transition: top 0.25s ease, opacity 0.25s ease;
    }

    /* 竖向分数结构：分子在上，横线居中，分母在下 */
    .math-frac {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      font-size: 0.85em;
      line-height: 1.05;
      margin: 0 4px;
    }

    .math-frac .frac-num {
      border-bottom: 1.5px solid currentColor;
      padding: 0 3px 2px 3px;
      font-weight: 400;
    }

    .math-frac .frac-den {
      padding: 2px 3px 0 3px;
      font-weight: 400;
    }

    /* 右侧垂直居中拍照留存按钮 */
    .camera-trigger-btn {
      position: fixed;
      right: 32px;
      top: 50%;
      transform: translateY(-50%);
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: #FFFFFF;
      border: 1px solid rgba(42, 45, 43, 0.08);
      box-shadow: 0 8px 24px rgba(42, 45, 43, 0.08), 0 2px 6px rgba(42, 45, 43, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 100;
    }

    .camera-trigger-btn:hover {
      transform: translateY(-50%) scale(1.05);
      box-shadow: 0 12px 28px rgba(42, 45, 43, 0.14);
      background: #FAFAF7;
    }

    .camera-trigger-btn:active {
      transform: translateY(-50%) scale(0.96);
    }

    .camera-trigger-btn svg {
      width: 28px;
      height: 28px;
      stroke: #2A2D2B;
      fill: none;
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s;
    }

    .camera-trigger-btn:hover svg {
      stroke: #D35400;
    }

    /* 右上角对比按钮 */
    .compare-trigger-btn {
      position: fixed;
      right: 32px;
      top: 32px;
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: #FFFFFF;
      border: 1px solid rgba(42, 45, 43, 0.08);
      box-shadow: 0 8px 24px rgba(42, 45, 43, 0.08), 0 2px 6px rgba(42, 45, 43, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 100;
    }

    .compare-trigger-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 12px 28px rgba(42, 45, 43, 0.14);
      background: #FAFAF7;
    }

    .compare-trigger-btn:active {
      transform: translateY(1px) scale(0.96);
    }

    .compare-trigger-btn svg {
      width: 28px;
      height: 28px;
      stroke: #2A2D2B;
      fill: none;
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s;
    }

    .compare-trigger-btn:hover svg {
      stroke: #2471A3;
    }

    /* 快照数量角标：仅作数量展示，去除点击进入比较 */
    .snapshot-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #D35400;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 800;
      min-width: 32px;
      height: 32px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      box-shadow: 0 4px 12px rgba(211, 84, 0, 0.45);
      border: 2.5px solid #FFFFFF;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 105;
    }

    .snapshot-badge.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* 拍照闪光灯全屏动效 */
    .shutter-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #FFFFFF;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: opacity 0.2s ease-out;
    }

    .shutter-flash.flashing {
      opacity: 0.65;
      transition: none;
    }

    /* 轻提示 Toast */
    .toast-notice {
      position: fixed;
      top: 36px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px) scale(0.95);
      background: rgba(42, 45, 43, 0.92);
      color: #FFFFFF;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.15);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 998;
      letter-spacing: 0.3px;
    }

    .toast-notice.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    /* 全屏多组快照对比（上下并排 1:1 截图记录，默认高度平均分为 3 行） */
    .fullscreen-compare-modal {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #F4F3EC;
      z-index: 500;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      overflow: hidden;
    }

    .fullscreen-compare-modal.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* 右上角浮动操作按钮（清空、关闭），去除顶部文字横条 */
    .compare-float-actions {
      position: absolute;
      top: 16px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 50;
    }

    .topbar-btn {
      height: 36px;
      padding: 0 16px;
      border-radius: 10px;
      border: 1px solid rgba(42, 45, 43, 0.15);
      background: rgba(255, 255, 255, 0.92);
      color: #2A2D2B;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 10px rgba(42, 45, 43, 0.08);
      transition: all 0.15s;
      outline: none;
    }

    .topbar-btn:hover {
      background: #FFFFFF;
      box-shadow: 0 4px 14px rgba(42, 45, 43, 0.12);
      transform: translateY(-1px);
    }

    .topbar-btn.close-btn {
      background: #2A2D2B;
      color: #FFFFFF;
      border-color: #2A2D2B;
    }

    .topbar-btn.close-btn:hover {
      background: #444945;
    }

    /* 3行容器：默认高度平均分为 3 行，全屏 100vh 铺满 */
    .compare-rows-container {
      width: 100%;
      height: 100vh;
      display: grid;
      grid-template-rows: repeat(3, 1fr);
      overflow-y: auto;
      background: #F4F3EC;
    }

    .compare-row {
      position: relative;
      width: 100%;
      height: 100%;
      border-bottom: 1px dashed rgba(42, 45, 43, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #F4F3EC;
    }

    .compare-row:last-child {
      border-bottom: none;
    }

    .compare-row-tag {
      position: absolute;
      left: 20px;
      top: 12px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(42, 45, 43, 0.14);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 400;
      color: #2A2D2B;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 4px 14px rgba(42, 45, 43, 0.08);
      z-index: 10;
      line-height: 1.3;
      max-width: 210px;
    }

    .compare-formula-row {
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    .compare-formula-row.jia {
      color: #D35400;
    }

    .compare-formula-row.yi {
      color: #2471A3;
    }

    .compare-formula-row.total {
      color: #1E201E;
      font-weight: 500;
      border-top: 1px solid rgba(42, 45, 43, 0.08);
      padding-top: 4px;
      margin-top: 1px;
    }

    .badge-clickable {
      cursor: pointer;
      pointer-events: auto;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .badge-clickable:hover {
      transform: translate(-50%, -3px) scale(1.08);
      box-shadow: 0 6px 16px rgba(42, 45, 43, 0.16);
      filter: brightness(0.97);
    }

    .badge-clickable:active {
      transform: translate(-50%, 0) scale(0.96);
    }

    .math-badge.badge-merged {
      background: #FFFFFF;
      color: #D35400;
      border: 1.5px solid rgba(211, 84, 0, 0.45);
      box-shadow: 0 4px 14px rgba(211, 84, 0, 0.15);
      padding: 6px 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
    }

    .compare-row-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #8C9188;
      font-size: 14px;
      gap: 8px;
      border: 2px dashed rgba(42, 45, 43, 0.12);
      margin: 12px 24px;
      border-radius: 16px;
      height: calc(100% - 24px);
      width: calc(100% - 48px);
      background: rgba(255, 255, 255, 0.35);
    }

    /* 右下角键盘按钮 */
    .keyboard-trigger-btn {
      position: fixed;
      right: 32px;
      bottom: 32px;
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: #FFFFFF;
      border: 1px solid rgba(42, 45, 43, 0.08);
      box-shadow: 0 8px 24px rgba(42, 45, 43, 0.08), 0 2px 6px rgba(42, 45, 43, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 100;
    }

    .keyboard-trigger-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 12px 28px rgba(42, 45, 43, 0.14);
      background: #FAFAF7;
    }

    .keyboard-trigger-btn:active {
      transform: translateY(1px) scale(0.96);
    }

    .keyboard-trigger-btn.active {
      background: #2A2D2B;
      box-shadow: 0 10px 24px rgba(42, 45, 43, 0.2);
    }

    .keyboard-trigger-btn.active svg {
      stroke: #FFFFFF;
    }

    .keyboard-trigger-btn svg {
      width: 28px;
      height: 28px;
      stroke: #2A2D2B;
      fill: none;
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s;
    }

    /* 纯虚拟数字键盘弹窗 */
    .keypad-modal {
      position: fixed;
      right: 32px;
      bottom: 104px;
      width: 280px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(42, 45, 43, 0.1);
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 20px 50px rgba(42, 45, 43, 0.15), 0 6px 16px rgba(42, 45, 43, 0.05);
      opacity: 0;
      transform: translateY(16px) scale(0.96);
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 99;
    }

    .keypad-modal.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    /* 数值显示条 */
    .display-row {
      display: flex;
      align-items: center;
      background: #F4F3EC;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 12px;
      border: 1.5px solid transparent;
      transition: border-color 0.2s;
    }

    .display-row:focus-within {
      border-color: #2A2D2B;
    }

    .display-val {
      flex: 1;
      font-size: 22px;
      font-weight: 700;
      color: #2A2D2B;
      border: none;
      background: transparent;
      outline: none;
      font-family: inherit;
      width: 100%;
    }

    .display-unit {
      font-size: 15px;
      font-weight: 600;
      color: #7B8078;
      margin-left: 6px;
      white-space: nowrap;
    }

    .clear-btn {
      background: none;
      border: none;
      color: #9A9E96;
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color 0.15s;
    }

    .clear-btn:hover {
      color: #2A2D2B;
    }

    /* 纯数字九宫格小键盘 */
    .key-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }

    .key-btn {
      height: 48px;
      border-radius: 12px;
      border: 1px solid rgba(42, 45, 43, 0.06);
      background: #FFFFFF;
      font-size: 20px;
      font-weight: 600;
      color: #2A2D2B;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: all 0.15s;
      box-shadow: 0 1px 3px rgba(42, 45, 43, 0.04);
    }

    .key-btn:hover {
      background: #F5F4ED;
      transform: translateY(-1px);
    }

    .key-btn:active {
      transform: translateY(1px);
      background: #E8E6DB;
    }

    /* 底部功能按钮条 */
    .action-row {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 8px;
    }

    .action-btn {
      height: 44px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .action-btn.clear-all {
      background: #F4F3EC;
      color: #555A52;
      border: 1px solid rgba(42, 45, 43, 0.06);
    }

    .action-btn.clear-all:hover {
      background: #EAE8DE;
      color: #2A2D2B;
    }

    .action-btn.confirm {
      background: #2A2D2B;
      color: #FFFFFF;
      border: 1px solid #2A2D2B;
      letter-spacing: 1px;
    }

    .action-btn.confirm:hover {
      background: #3F4440;
    }
  </style>
</head>

<body>

  <!-- 主交互场景 -->
  <div class="stage" id="stage">
    <svg class="diagram" id="diagram" xmlns="http://www.w3.org/2000/svg">
      <g id="lineGroup">
        <!-- 连续完整线段 -->
        <line id="mainLine" class="math-line" />

        <!-- 两端竖线（仅上半部分） -->
        <line id="leftCap" class="cap-line" />
        <line id="rightCap" class="cap-line" />

        <!-- 等分刻度短线组（点击甲、乙或路程时动态生成） -->
        <g id="divisionTicksGroup"></g>

        <!-- 左端外侧“甲”标签 -->
        <text id="labelJia" class="end-label" title="点击查看甲每天工作量（平均分为12段）">甲</text>

        <!-- 右端外侧“乙”标签 -->
        <text id="labelYi" class="end-label" title="点击查看乙每天工作量（平均分为18段）">乙</text>

        <!-- 总长大括号路径（上方，与端点短竖线保持独立空隙） -->
        <path id="totalBrace" class="curly-brace" />

        <!-- 总长文本标注（点击先显示甲乙每天工作量，再点击显示合修算式） -->
        <g id="totalLabelGroup" class="total-label-group" title="点击先显示甲乙每天工作量，再点击显示合修算式">
          <rect id="totalLabelBg" class="total-label-bg" />
          <text id="totalLabelText" class="total-label-text"></text>
        </g>

        <!-- 甲单段向下大括号 -->
        <path id="segmentBraceJia" class="segment-curly-brace" />

        <!-- 乙单段向下大括号 -->
        <path id="segmentBraceYi" class="segment-curly-brace brace-yi" />
      </g>
    </svg>

    <!-- HTML 算式徽标容器（支持竖向分数显示） -->
    <div id="segmentLabelJia" class="math-badge badge-jia"></div>
    <div id="segmentLabelYi" class="math-badge badge-yi"></div>
    <div id="combinedFormula" class="math-badge combined"></div>
  </div>

  <!-- 右侧垂直居中拍照留存按钮 -->
  <button id="cameraBtn" class="camera-trigger-btn" title="拍照留存当前内容" aria-label="拍照留存">
    <svg viewBox="0 0 24 24">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
      <circle cx="12" cy="13" r="4" />
    </svg>
    <span id="snapshotBadge" class="snapshot-badge" title="已记录快照数量">0</span>
  </button>

  <!-- 右上角“对比”按钮 -->
  <button id="compareBtn" class="compare-trigger-btn" title="进入对比界面" aria-label="进入对比界面">
    <svg viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="2" />
      <line x1="12" y1="4" x2="12" y2="20" />
      <line x1="7.5" y1="9" x2="7.5" y2="15" />
      <line x1="16.5" y1="9" x2="16.5" y2="15" />
    </svg>
  </button>

  <!-- 全屏拍照快门闪光层 -->
  <div id="shutterFlash" class="shutter-flash"></div>

  <!-- 轻量提示条 -->
  <div id="toastNotice" class="toast-notice"></div>

  <!-- 全屏多组快照对比（上下并排 1:1 截图记录，默认高度平均分为 3 行） -->
  <div id="fullscreenCompareModal" class="fullscreen-compare-modal">
    <!-- 右上角仅保留浮动按钮：清空、关闭 -->
    <div class="compare-float-actions">
      <button id="clearAllSnapshotsBtn" class="topbar-btn" title="清空全部快照">清空快照</button>
      <button id="closeCompareModalBtn" class="topbar-btn close-btn" title="关闭对比（返回白板）">✕ 关闭</button>
    </div>

    <!-- 默认高度平均分为 3 行的主容器（铺满 100vh） -->
    <div id="compareRowsContainer" class="compare-rows-container">
      <!-- 动态渲染 3 行，每行高度 1/3，1:1 显示对应快照的完整线段与算式 -->
    </div>
  </div>

  <!-- 右下角键盘按钮 -->
  <button id="keyboardBtn" class="keyboard-trigger-btn" title="标记总长" aria-label="键盘标注">

      <rect x="2" y="5" width="20" height="14" rx="3" />
      <line x1="6" y1="9" x2="6.01" y2="9" />
      <line x1="10" y1="9" x2="10.01" y2="9" />
      <line x1="14" y1="9" x2="14.01" y2="9" />
      <line x1="18" y1="9" x2="18.01" y2="9" />
      <line x1="6" y1="13" x2="6.01" y2="13" />
      <line x1="10" y1="13" x2="10.01" y2="13" />
      <line x1="14" y1="13" x2="14.01" y2="13" />
      <line x1="18" y1="13" x2="18.01" y2="13" />
      <line x1="8" y1="16" x2="16" y2="16" />
    </svg>
  </button>

  <!-- 纯虚拟数字键盘弹窗 -->
  <div id="keypadModal" class="keypad-modal">
    <!-- 显示输入 -->
    <div class="display-row">
      <input type="text" id="lengthInput" class="display-val" value="" placeholder="输入千米数" />
      <span class="display-unit" id="displayUnit">千米</span>

      <button class="key-btn" data-key="0">0</button>
      <button class="key-btn" data-key="backspace">⌫</button>

    <div class="action-row">
      <button class="action-btn clear-all" id="clearAllBtn">清空</button>
      <button class="action-btn confirm" id="confirmBtn">确定</button>
    </div>
  </div>
