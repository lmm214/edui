<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>小明和爷爷操场散步行程问题</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #F4F3EC;
      color: #0f172a;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 全屏 SVG：以 #F4F3EC 为底色 */
    svg#stage {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #F4F3EC;
      touch-action: none;
    }

    /* 页面顶部显著大标题 */
    .page-title {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: 1px;
      pointer-events: none;
      z-index: 20;
    }

    /* 右上角图例栏：2行显示，字号增大 */
    .top-right-legend {
      position: fixed;
      top: 20px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid #dedcd0;
      backdrop-filter: blur(12px);
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(44, 40, 30, 0.06);
      pointer-events: auto;
      z-index: 20;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
      color: #1e293b;
      white-space: nowrap;
    }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-ming { background: #2563eb; }
    .dot-ye { background: #dc2626; }

    /* 右侧笔工具栏（竖向悬浮面板） */
    .pen-toolbar {
      position: fixed;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px 8px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #dedcd0;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(44, 40, 30, 0.08);
      z-index: 25;
    }
    .tool-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 50%;
      background: transparent;
      color: #475569;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .tool-btn:hover {
      background: #F4F3EC;
      color: #0f172a;
    }
    .tool-btn.active {
      background: #ffffff;
      border-color: #cbd5e1;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }
    .color-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
    }
    .tool-btn.color-btn.active .color-dot {
      transform: scale(1.15);
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px currentColor;
    }
    .tool-divider {
      width: 20px;
      height: 1px;
      background: #dedcd0;
      margin: 2px 0;
    }

    /* 右下角操作区域（仅保留复位按钮与折叠配置菜单） */
    .bottom-right-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 30;
    }
    .corner-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 18px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #dedcd0;
      border-radius: 24px;
      color: #334155;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(44, 40, 30, 0.06);
      transition: all 0.2s ease;
    }
    .corner-btn:hover {
      background: #ffffff;
      border-color: #cbd5e1;
    }
    .corner-btn.config-btn {
      background: #1e293b;
      color: #ffffff;
      border-color: #1e293b;
    }
    .corner-btn.config-btn:hover {
      background: #0f172a;
    }

    /* 右下角折叠配置菜单面板（默认彻底隐藏） */
    .menu-popover {
      display: none;
      position: absolute;
      bottom: 54px;
      right: 0;
      width: 200px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #dedcd0;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 12px 32px rgba(44, 40, 30, 0.12);
      flex-direction: column;
      gap: 10px;
      z-index: 50;
    }
    .menu-popover.open {
      display: flex;
    }

    .menu-title {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.5px;
    }
    .mode-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .mode-option-btn {
      width: 100%;
      text-align: left;
      padding: 7px 10px;
      background: #F4F3EC;
      border: 1px solid #dedcd0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .mode-option-btn:hover {
      background: #eae8dd;
      color: #0f172a;
    }
    .mode-option-btn.active {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }
    .divider {
      height: 1px;
      background: #dedcd0;
      margin: 2px 0;
    }
    .config-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #334155;
      font-weight: 500;
    }
    .config-row input {
      width: 54px;
      padding: 4px 6px;
      background: #F4F3EC;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      color: #0f172a;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- 全屏 SVG 呈现容器 -->
  <svg id="stage" xmlns="http://www.w3.org/2000/svg">
    <!-- 跑道与刻度渲染层 -->
    <g id="trackLayer"></g>
    <!-- 手绘批注层（置于上层） -->
    <g id="drawLayer"></g>
  </svg>

  <!-- 页面顶部大字号标题 -->
  <div id="pageTitle" class="page-title">相背而行</div>

  <!-- 右上角图例（2行显示，字号放大） -->
  <div class="top-right-legend">
    <div class="legend-item">
      <span class="legend-dot dot-ming"></span>
      <span>小明 (8分/圈)</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot dot-ye"></span>
      <span>爷爷 (10分/圈)</span>
    </div>
  </div>

  <!-- 右侧笔工具栏（红、蓝、黑三色 + 拖拽模式 + 清除画迹） -->
  <div class="pen-toolbar">
    <button id="toolHand" class="tool-btn active" title="拖拽模式">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v5" />
        <path d="M14 10V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8" />
        <path d="M10 10.5V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8" />
        <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" />
      </svg>
    </button>
    <div class="tool-divider"></div>
    <button id="toolRed" class="tool-btn color-btn" title="红笔" data-color="#dc2626" style="color:#dc2626;">
      <span class="color-dot" style="background:#dc2626;"></span>
    </button>
    <button id="toolBlue" class="tool-btn color-btn" title="蓝笔" data-color="#2563eb" style="color:#2563eb;">
      <span class="color-dot" style="background:#2563eb;"></span>
    </button>
    <button id="toolBlack" class="tool-btn color-btn" title="黑笔" data-color="#0f172a" style="color:#0f172a;">
      <span class="color-dot" style="background:#0f172a;"></span>
    </button>
    <div class="tool-divider"></div>
    <button id="toolClear" class="tool-btn" title="清空标注">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
    </button>
  </div>

  <!-- 右下角操作区域（复位按钮 + 选项按钮） -->
  <div class="bottom-right-container">
    <button id="resetBtn" class="corner-btn">↺ 复位</button>
    <button id="menuToggleBtn" class="corner-btn config-btn">⚙ 选项</button>

    <!-- 简化的选项面板 -->
    <div id="menuPopover" class="menu-popover">
      <div class="menu-title">模式</div>
      <div class="mode-list">
        <button class="mode-option-btn active" data-mode="meet">1. 相背而行</button>
        <button class="mode-option-btn" data-mode="catch">2. 同向而行</button>
        <button class="mode-option-btn" data-mode="dual">3. 对比全览</button>
      </div>

      <div class="divider"></div>

      <div class="menu-title">每圈用时 (分)</div>
      <div class="config-row">
        <span>小明:</span>
        <input id="innerDivInput" type="number" min="2" max="60" value="8" />
      </div>
      <div class="config-row">
        <span>爷爷:</span>
        <input id="outerDivInput" type="number" min="2" max="60" value="10" />
      </div>
    </div>
  </div>
