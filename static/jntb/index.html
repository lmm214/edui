<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>还需要剪开哪条边？</title>
  <style>
    /* ==========================================================================
       长方体纸盒剪开展开教学演示 - 纯三维 CSS 变换单文件版
       统一教科书纸质底色，完全去除 Three.js，无外边框与阴影
       ========================================================================== */

    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-serif: "STKaiti", "KaiTi", "Songti SC", "SimSun", "Noto Serif SC", serif;

      /* 统一教科书纸质主背景色与盒面颜色 */
      --bg-page: #f7f6f0;
      --paper-face-fill: #e8f5cc;
      --paper-face-stroke: #5d4826;
      --paper-face-hover: #d2ee8a;
      --face-border-width: 1.5px; /* 精确边框粗细，用于相连各面精确重叠消融 */

      --text-main: #2b2216;
      --btn-bg: #e8e3d6;
      --btn-bg-hover: #ddd6c5;
      --slider-track: #ddd7ca;
      --slider-thumb: #b89b72;

      --color-highlight: #ea580c; /* 选中高亮醒目橙 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent !important; /* 禁止点击出现的默认高亮矩形框 */
      -webkit-touch-callout: none; /* 禁止长按弹出系统选择矩形框 */
    }

    *:focus,
    *:focus-visible {
      outline: none !important; /* 禁止点击时出现的默认聚焦矩形框/外边框 */
    }

    html, body {
      touch-action: manipulation; /* 禁止触摸屏双击缩放页面 */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none; /* 禁止点击拖动产生文字/图形选中矩形框 */
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      padding: 24px 20px 30px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 1080px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* --------------------------------------------------------------------------
       顶部标题：仅保留问题
       -------------------------------------------------------------------------- */
    .header {
      width: 100%;
      text-align: center;
      padding: 8px 0;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .page-title {
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 700;
      color: #2b2216;
      letter-spacing: 1.5px;
    }

    /* --------------------------------------------------------------------------
       主展示区：左图 3D CSS、弱化长箭头与单行文字、右图 2D
       -------------------------------------------------------------------------- */
    .diagram-board {
      width: 100%;
      background: transparent;
      border: none;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .diagram-panels {
      display: grid;
      grid-template-columns: 1fr minmax(170px, 200px) 1fr;
      align-items: center;
      gap: 16px;
      min-height: 400px;
    }

    @media (max-width: 860px) {
      .diagram-panels {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }

    .panel {
      background: transparent;
      border: none;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    /* --------------------------------------------------------------------------
       左侧：纯三维 CSS 纸盒 (Zero Three.js)
       -------------------------------------------------------------------------- */
    .scene-3d {
      width: 340px;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      background: transparent;
      user-select: none;
    }

    .box-3d {
      position: relative;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      /* 调整为精确俯视等轴测视角 (39.5deg)，使底面 4 号面呈现为与课本完全一致的窄长条，不多露但清晰可点 */
      transform: rotateX(calc(39.5deg * (1 - var(--progress, 0))))
                 rotateZ(calc(-45deg - 45deg * var(--progress, 0)))
                 translate(calc(-20px - 65px * var(--progress, 0)), calc(26px + 39px * var(--progress, 0)));
      will-change: transform;
    }

    /* 纸盒面通用样式 */
    .face-3d {
      position: absolute;
      background-color: var(--paper-face-fill);
      border: var(--face-border-width) solid var(--paper-face-stroke);
      backface-visibility: visible;
      transform-style: preserve-3d;
      transition: background-color 0.15s;
      box-sizing: border-box;
      cursor: pointer; /* 确保所有面均可直接点击与交互 */
    }

    .face-3d:hover,
    .face-3d.highlighted {
      background-color: var(--paper-face-hover);
    }

    /* 各面尺寸与位置定义 (S = 65px, H = 170px)
       相连各面通过叠合 1 条边框厚度 (var(--face-border-width))，
       彻底消除相连棱线双倍变粗的问题，保持全图所有棱线单层精致均匀 */

    /* 面 4: 基准面 (平铺在地面) */
    .face-4 {
      width: 170px;
      height: 65px;
      left: 0;
      top: -65px;
    }

    /* 4 号面热区辅助扩展，确保在窄长条透视下仍能轻松点中 */
    .face-4::after {
      content: '';
      position: absolute;
      left: 0;
      top: -6px;
      right: 0;
      bottom: 0;
    }

    /* 面 3: 平铺侧面 (底边与面 4 顶边重叠) */
    .face-3 {
      width: 170px;
      height: 65px;
      left: 0;
      top: calc(-130px + var(--face-border-width));
    }

    /* 面 2: 平铺侧面 (底边与面 3 顶边重叠) */
    .face-2 {
      width: 170px;
      height: 65px;
      left: 0;
      top: calc(-195px + 2 * var(--face-border-width));
    }

    /* 面 6 分支 A (剪开 5-6 棱时生效，铰链位于 x=0, y∈[-65px, 0]) */
    .hinge-6-from-4 {
      position: absolute;
      left: 0;
      top: -65px;
      width: 0;
      height: 65px;
      transform-style: preserve-3d;
      transform-origin: 0% 50%;
      transform: rotateY(calc(90deg * (1 - var(--progress, 0))));
      will-change: transform;
    }

    .face-6-a {
      width: 65px;
      height: 65px;
      /* 右边框与面 4 左边框重合叠入 */
      left: calc(-65px + var(--face-border-width));
      top: 0;
    }

    /* 面 5 与面 1 铰链分支 (铰链位于 y=0, x∈[0, 170px]) */
    .hinge-5 {
      position: absolute;
      left: 0;
      top: 0;
      width: 170px;
      height: 0;
      transform-style: preserve-3d;
      transform-origin: 50% 0%;
      transform: rotateX(calc(90deg * (1 - var(--progress, 0))));
      will-change: transform;
    }

    .face-5 {
      width: 170px;
      height: 65px;
      left: 0;
      /* 顶边框与面 4 底边框重合叠入 */
      top: calc(-1 * var(--face-border-width));
    }

    .face-1 {
      width: 65px;
      height: 65px;
      /* 左边框与面 5 右边框重叠，顶边与面 5 顶边齐平 */
      left: calc(170px - var(--face-border-width));
      top: calc(-1 * var(--face-border-width));
    }

    /* 面 6 分支 B (剪开 4-6 棱时生效，铰链位于面 5 的左边缘) */
    .hinge-6-from-5 {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 65px;
      transform-style: preserve-3d;
      transform-origin: 0% 50%;
      transform: rotateY(calc(90deg * (1 - var(--progress, 0))));
      display: none;
      will-change: transform;
    }

    .face-6-b {
      width: 65px;
      height: 65px;
      /* 右边框与面 5 左边框重叠 */
      left: calc(-65px + var(--face-border-width));
      top: calc(-1 * var(--face-border-width));
    }

    /* --------------------------------------------------------------------------
       候选可剪开的棱 (2选1，默认不高亮无杂线，点击后高亮显示在最上方)
       -------------------------------------------------------------------------- */
    .cut-edge {
      position: absolute;
      transform-style: preserve-3d;
      cursor: pointer;
      z-index: 40;
    }

    /* 棱 A: 5、6 面相交竖直前角棱 (立于原点，沿 +Z 向上延伸 65px，彻底消除向下杂线) */
    .cut-edge-56 {
      left: -22px;
      top: -22px;
      width: 44px;
      height: 90px;
      transform-origin: 22px 22px;
      transform: translate3d(-1px, 1px, 2px) rotateX(90deg);
    }

    .cut-edge-56 .edge-line {
      position: absolute;
      left: 20px;
      top: 22px;
      width: 4px;
      height: 65px;
      border-radius: 2px;
      background-color: transparent;
      pointer-events: none;
      transition: background-color 0.15s, box-shadow 0.15s;
    }

    /* 棱 B: 4、6 面相交底面横棱 (位于 x=0, y∈[-65px, 0]，点击区域大幅扩大，位于上层) */
    .cut-edge-46 {
      left: -22px;
      top: -77px;
      width: 44px;
      height: 90px;
      transform: translate3d(-1px, 0, 3px);
    }

    .cut-edge-46 .edge-line {
      position: absolute;
      left: 20px;
      top: 12px;
      width: 4px;
      height: 65px;
      border-radius: 2px;
      background-color: transparent;
      pointer-events: none;
      transition: background-color 0.15s, box-shadow 0.15s;
    }

    /* 鼠标悬停时的微光提示 (仅在未选中时提示可点击) */
    .cut-edge:not(.selected):hover .edge-line {
      background-color: rgba(217, 119, 6, 0.45);
      box-shadow: 0 0 8px rgba(217, 119, 6, 0.5);
    }

    /* 点击选中高亮状态 (2选1，高亮处于最上方，绝不被任何面遮挡) */
    .cut-edge.selected {
      z-index: 100;
    }

    .cut-edge.selected .edge-line {
      background-color: #ea580c !important;
      box-shadow: 0 0 12px rgba(234, 88, 12, 1), 0 0 4px #ffffff !important;
    }

    /* 展开过程中被剪开的棱淡出 */
    .cut-edge.is-cut {
      opacity: 0;
      pointer-events: none;
    }

    /* --------------------------------------------------------------------------
       中间：弱化长箭头与单行文字
       -------------------------------------------------------------------------- */
    .transition-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none;
    }

    .arrow-label {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 600;
      color: #3b2d1d;
      letter-spacing: 1.5px;
      white-space: nowrap; /* 确保文字单行显示不换行 */
    }

    .arrow-graphic {
      width: 100%;
      max-width: 180px; /* 箭头加长 */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .arrow-svg {
      width: 100%;
      height: 24px;
      opacity: 0.85; /* 弱化视觉对比度，柔和细腻 */
    }

    /* --------------------------------------------------------------------------
       右侧：2D 展开网格图
       -------------------------------------------------------------------------- */
    .net-2d-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: transparent;
    }

    .net-svg {
      width: 100%;
      max-width: 320px;
      height: auto;
    }

    .face-rect {
      fill: var(--paper-face-fill);
      stroke: var(--paper-face-stroke);
      stroke-width: 1.6;
      stroke-linejoin: round;
      transition: fill 0.2s;
    }

    .face-text {
      font-family: var(--font-serif);
      font-size: 32px;
      fill: var(--paper-face-stroke);
      text-anchor: middle;
      dominant-baseline: middle;
      user-select: none;
      pointer-events: none;
    }

    .net-face:hover .face-rect,
    .net-face.highlighted .face-rect {
      fill: var(--paper-face-hover);
    }

    /* --------------------------------------------------------------------------
       精简滑块控制条：左“复原”，中“滑块”，右“展开”
       限制长度不超过 400px 和页面宽度的 50%，默认未选棱时禁用
       -------------------------------------------------------------------------- */
    .slider-bar {
      width: 100%;
      max-width: min(400px, 50%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 8px 0;
      background: transparent;
      border: none;
      transition: opacity 0.2s;
    }

    /* 默认未点棱时禁用状态 */
    .slider-bar.is-disabled {
      opacity: 0.45;
    }

    .btn-control {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      background: var(--btn-bg);
      border: none;
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
      padding: 6px 18px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, transform 0.1s, opacity 0.2s;
      flex-shrink: 0;
    }

    .btn-control:hover:not(:disabled) {
      background: var(--btn-bg-hover);
      transform: translateY(-1px);
    }

    .btn-control:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-control:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .slider-track-wrap {
      flex: 1;
      display: flex;
      align-items: center;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: var(--slider-track);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    input[type="range"]:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--slider-thumb);
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    input[type="range"]:disabled::-webkit-slider-thumb {
      cursor: not-allowed;
      background: #c5bba8;
    }

    input[type="range"]:hover:not(:disabled)::-webkit-slider-thumb {
      transform: scale(1.2);
      background: #96754b;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 顶部标题：仅保留问题 -->
    <header class="header">
      <h1 class="page-title">还需要剪开几条边？</h1>
    </header>

    <!-- 主展示区：左图 3D CSS、中间长箭头与单行文字、右图 2D 网格 -->
    <main class="diagram-board">
      <div class="diagram-panels">
        <!-- 左图：三维 CSS 变换纸盒 -->
        <div class="panel panel-left">
          <div class="scene-3d">
            <div class="box-3d" id="box3d">
              <!-- 面 4: 基准底面 (平铺在地面) -->
              <div class="face-3d face-4" data-face="4" title="4号面"></div>

              <!-- 面 3: 平铺侧面 -->
              <div class="face-3d face-3" data-face="3" title="3号面"></div>

              <!-- 面 2: 平铺侧面 -->
              <div class="face-3d face-2" data-face="2" title="2号面"></div>

              <!-- 面 6 分支 A (剪开 5-6 棱时：面 6 铰接在面 4 底端) -->
              <div class="hinge-6-from-4" id="hinge6From4">
                <div class="face-3d face-6 face-6-a" data-face="6" title="6号面"></div>
              </div>

              <!-- 面 5 与面 1 铰链分支 (铰接在面 4 侧端) -->
              <div class="hinge-5" id="hinge5">
                <div class="face-3d face-5" data-face="5" title="5号面"></div>
                <div class="face-3d face-1" data-face="1" title="1号面"></div>
                <!-- 面 6 分支 B (剪开 4-6 棱时：面 6 铰接在面 5 侧端) -->
                <div class="hinge-6-from-5" id="hinge6From5">
                  <div class="face-3d face-6 face-6-b" data-face="6" title="6号面"></div>
                </div>
              </div>

              <!-- 候选可剪开的棱 (2选1，默认不高亮，点击后高亮) -->
              <!-- 棱 A: 5、6 面相交的前角竖棱 -->
              <div class="cut-edge cut-edge-56" id="edge56" title="点击选择剪开 5、6 面交棱">
                <div class="edge-line"></div>
              </div>

              <!-- 棱 B: 4、6 面相交的底面横棱 -->
              <div class="cut-edge cut-edge-46" id="edge46" title="点击选择剪开 4、6 面交棱">
                <div class="edge-line"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- 中间：长箭头与单行不换行文字 -->
        <div class="transition-indicator">
          <div class="arrow-label">剪开后的图形</div>
          <div class="arrow-graphic">
            <svg viewBox="0 0 200 24" class="arrow-svg">
              <path d="M 10,12 L 182,12 M 172,6 L 184,12 L 172,18" 
                    fill="none" 
                    stroke="#f97364" 
                    stroke-width="3" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <!-- 右图：2D 展开网格图 -->
        <div class="panel panel-right">
          <div class="net-2d-container">
            <svg id="netSvg" viewBox="0 0 360 380" class="net-svg">
              <g class="net-faces">
                <!-- 面 1: 顶面正方形 (位于面 5 上方) -->
                <g class="net-face" data-face="1" id="face2d-1">
                  <rect x="250" y="20" width="70" height="70" class="face-rect"/>
                  <text x="285" y="66" class="face-text">1</text>
                </g>

                <!-- 四个侧面横向排列: 2, 3, 4, 5 -->
                <!-- 面 2 -->
                <g class="net-face" data-face="2" id="face2d-2">
                  <rect x="40" y="90" width="70" height="190" class="face-rect"/>
                  <text x="75" y="195" class="face-text">2</text>
                </g>
                <!-- 面 3 -->
                <g class="net-face" data-face="3" id="face2d-3">
                  <rect x="110" y="90" width="70" height="190" class="face-rect"/>
                  <text x="145" y="195" class="face-text">3</text>
                </g>
                <!-- 面 4 -->
                <g class="net-face" data-face="4" id="face2d-4">
                  <rect x="180" y="90" width="70" height="190" class="face-rect"/>
                  <text x="215" y="195" class="face-text">4</text>
                </g>
                <!-- 面 5 -->
                <g class="net-face" data-face="5" id="face2d-5">
                  <rect x="250" y="90" width="70" height="190" class="face-rect"/>
                  <text x="285" y="195" class="face-text">5</text>
                </g>

                <!-- 面 6: 底面正方形 (位于面 4 下方) -->
                <g class="net-face" data-face="6" id="face2d-6">
                  <rect x="180" y="280" width="70" height="70" class="face-rect"/>
                  <text x="215" y="326" class="face-text">6</text>
                </g>
              </g>
            </svg>
          </div>
        </div>
      </div>

      <!-- 下方滑块控制区：左“复原”，中“滑块”，右“展开” (默认禁用，选中棱后解锁) -->
      <div class="slider-bar is-disabled" id="sliderBar" title="请先点击左图中的棱选择剪开方式">
        <button id="btnFoldBack" class="btn btn-control" disabled>复原</button>
        <div class="slider-track-wrap">
          <input type="range" id="unfoldSlider" min="0" max="100" value="0" step="1" disabled>
        </div>
        <button id="btnCutAndUnfold" class="btn btn-control" disabled>展开</button>
      </div>
    </main>
  </div>
