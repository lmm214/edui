<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>四年级上册数学课堂作业本P19的第4题</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #F4F3EC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* 3D 舞台视口 */
    .viewport {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1600px;
      perspective-origin: 50% 40%;
      overflow: hidden;
    }

    /* 三角形舞台容器 */
    .stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 960px;
      max-height: 820px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* SVG 矢量主层 */
    .origami-svg {
      width: 90%;
      height: 90%;
      overflow: visible;
      filter: drop-shadow(0 20px 35px rgba(15, 23, 42, 0.08));
      pointer-events: none;
    }

    /* 角标数字样式 */
    .angle-label {
      font-family: -apple-system, BlinkMacSystemFont, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 500;
      fill: #1e293b;
      user-select: none;
      pointer-events: none;
    }

    /* 绘图与交互 Canvas 层：置于全局最顶层，直接捕获所有手势 */
    .drawing-canvas {
      position: fixed;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      z-index: 30;
      touch-action: none;
      cursor: default;
    }

    /* 右侧极简居中工具栏 */
    .side-toolbar {
      position: absolute;
      right: 26px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 50;
    }

    .tool-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(15, 23, 42, 0.08);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      transition: all 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .tool-btn:hover {
      background: #ffffff;
      color: #ef4444;
      transform: scale(1.08);
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.15);
    }

    .tool-btn:active {
      transform: scale(0.92);
    }

    .tool-btn.active {
      background: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
      box-shadow: 0 4px 18px rgba(239, 68, 68, 0.35);
    }

    .tool-btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .tool-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- 全局统一事件捕获与绘图 Canvas -->
  <canvas class="drawing-canvas" id="drawCanvas"></canvas>

  <div class="viewport">
    <div class="stage-container" id="stageContainer">
      <svg class="origami-svg" viewBox="0 0 700 500" id="origamiSvg">
        <defs>
          <filter id="foldShadow" x="-20%" y="-20%" width="150%" height="150%">
            <feDropShadow dx="1" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.16"/>
          </filter>
        </defs>

        <!-- 0. 完整大三角形 ABC: 永久作为主三角形轮廓 (没有任何中间内线) -->
        <polygon id="fullTrianglePoly" points="70,430 169.2,83.9 612.2,430" 
                 fill="#ffffff" stroke="#0f172a" stroke-width="2.8" stroke-linejoin="round"/>

        <!-- 1. 原三角形顶部虚线痕迹 (附件图②样式: 顶部 AB、AD 显示虚线轮廓) -->
        <polygon id="dashedOutline" points="70,430 169.2,83.9 346,222" 
                 fill="none" stroke="#0f172a" stroke-width="2.6" stroke-dasharray="6,6" stroke-linejoin="round"/>

        <!-- 2. 折回时淡淡保留并隐去的虚线折叠印痕 (角 3 处的边 DA') -->
        <line id="ghostFoldEdge" x1="346" y1="222" x2="430" y2="430" 
              stroke="#94a3b8" stroke-width="2.4" stroke-dasharray="5,5" stroke-linecap="round"
              style="opacity: 0;"/>

        <!-- 3. 动态 3D 折叠灰色阴影面片: 如图②中灰色填充阴影，无中间内线描边 -->
        <polygon id="foldFlap" points="70,430 430,430 346,222" 
                 fill="#71717a" stroke="none"
                 filter="url(#foldShadow)"/>

        <!-- 4. 折叠片外边缘线 (折下时边 BA' 和 DA' 的黑色实线描边) -->
        <polyline id="foldEdges" points="70,430 430,430 346,222" 
                  fill="none" stroke="#0f172a" stroke-width="2.8" stroke-linejoin="round"/>

        <!-- 5. 中间对折线 BD (折叠时为实线，展开过程中平滑渐隐至完全消失，绝不在展开后留下内线) -->
        <line id="creaseLine" x1="70" y1="430" x2="346" y2="222" 
              stroke="#0f172a" stroke-width="2.8"/>

        <!-- 6. 角度弧线与标号 (更小、更紧贴近角，还原题目图精细比例) -->
        <!-- ∠1 紧贴原顶角 A(169.2, 83.9): r=20 -->
        <g id="angle1Group">
          <path id="arc1" d="M 163.7 103.1 A 20 20 0 0 0 185.0 96.2" 
                fill="none" stroke="#0f172a" stroke-width="1.8"/>
          <text id="label1" x="176" y="122" class="angle-label">1</text>
        </g>

        <!-- 折下显现的 ∠2, ∠3, ∠4 (紧贴折角) -->
        <g id="foldedAnglesGroup">
          <!-- ∠2 (紧贴 D 处左上方, r=24): 虚线 DA 与 折痕 BD 之间 -->
          <path d="M 327.1 207.2 A 24 24 0 0 0 326.8 236.4" fill="none" stroke="#0f172a" stroke-width="1.8"/>
          <text x="298" y="222" class="angle-label">2</text>

          <!-- ∠3 (紧贴 A' 处左上方, r=22): 边 BA' 与 A'D 之间 -->
          <path d="M 421.8 409.6 A 22 22 0 0 0 408.0 430.0" fill="none" stroke="#0f172a" stroke-width="1.8"/>
          <text x="384" y="414" class="angle-label">3</text>

          <!-- ∠4 (紧贴 D 处右下方, r=26): 折入边 DA' 与 DC 之间 -->
          <path d="M 355.7 246.1 A 26 26 0 0 0 366.5 238.0" fill="none" stroke="#0f172a" stroke-width="1.8"/>
          <text x="368" y="262" class="angle-label">4</text>
        </g>
      </svg>
    </div>
  </div>

  <!-- 右侧极简垂直居中悬浮工具栏 -->
  <aside class="side-toolbar">
    <button class="tool-btn" id="penBtn" title="画笔" aria-label="画笔">
      <svg viewBox="0 0 24 24">
        <path d="M12 19l7-7 3 3-7 7-3-3z"/>
        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
        <path d="M2 2l7.586 7.586"/>
        <circle cx="11" cy="11" r="2"/>
      </svg>
    </button>
    <button class="tool-btn" id="lineBtn" title="直线段" aria-label="直线段">
      <svg viewBox="0 0 24 24">
        <line x1="4" y1="20" x2="20" y2="4"/>
      </svg>
    </button>
    <!-- 撤销按钮 -->
    <button class="tool-btn" id="undoBtn" title="撤销" aria-label="撤销" disabled>
      <svg viewBox="0 0 24 24">
        <path d="M9 14L4 9l5-5"/>
        <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
      </svg>
    </button>
    <!-- 重做按钮 -->
    <button class="tool-btn" id="redoBtn" title="重做" aria-label="重做" disabled>
      <svg viewBox="0 0 24 24">
        <path d="M15 14l5-5-5-5"/>
        <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/>
      </svg>
    </button>
    <!-- 清空按钮 -->
    <button class="tool-btn" id="clearBtn" title="清空" aria-label="清空">
      <svg viewBox="0 0 24 24">
        <path d="M3 6h18"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        <line x1="10" y1="11" x2="10" y2="17"/>
        <line x1="14" y1="11" x2="14" y2="17"/>
      </svg>
    </button>
  </aside>
