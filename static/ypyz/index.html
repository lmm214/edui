<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>方中圆：叶子的面积</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }

    *:focus,
    *:active {
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }

    svg,
    svg * {
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }

    :root {
      --bg-color: #f1f5ec;
      /* 护眼柔和纸色豆沙绿 */
      --paper-color: #fafcf8;
      /* 正方形底板柔白 */
      --line-color: #222923;
      /* 墨黑边线 */
      --gray-leaf: rgba(140, 152, 142, 0.40);
      /* 最初纯色淡灰阴影 */
      --orange-fill: rgba(255, 155, 45, 0.26);
      /* 橙色单层阴影 */
      --orange-stroke: rgba(195, 85, 10, 0.85);
      --blue-fill: rgba(35, 145, 245, 0.26);
      /* 蓝色单层阴影 */
      --blue-stroke: rgba(20, 100, 180, 0.85);
      --text-color: #222923;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      touch-action: none;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 20px;
      position: relative;
      overflow: hidden;
      touch-action: none;
      cursor: default;
    }

    .container.panning {
      cursor: grabbing !important;
    }

    .canvas-viewport {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    /* 缩放与平移复位悬浮指示器 */
    .zoom-reset-badge {
      position: fixed;
      top: 20px;
      left: 24px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(160, 185, 165, 0.45);
      color: #2d382f;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity 0.2s ease, transform 0.2s ease, background 0.15s ease;
    }

    .zoom-reset-badge.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .zoom-reset-badge:hover {
      background: #ffffff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }

    .zoom-reset-badge .reset-icon {
      font-size: 14px;
      color: #1a6e38;
    }

    svg#mainSvg {
      width: 100%;
      height: 100%;
      max-width: 730px;
      max-height: 730px;
      overflow: visible;
      touch-action: none;
      transform: translateX(-50px);
      transition: max-width 0.22s ease, transform 0.22s ease;
    }

    body.mode-two-leaves svg#mainSvg {
      max-width: 1050px;
      max-height: 80vh;
      transform: translateX(0);
    }

    body.mode-four-leaves svg#mainSvg {
      max-width: 820px;
      max-height: 80vh;
      transform: translateX(0);
    }

    /* 正方形基准底框 */
    .base-square {
      fill: var(--paper-color);
      stroke: var(--line-color);
      stroke-width: 2.6;
      stroke-linejoin: round;
    }

    /* 最初纯色淡灰色叶片阴影 */
    .default-leaf {
      fill: var(--gray-leaf);
      stroke: var(--line-color);
      stroke-width: 2.4;
      stroke-linejoin: round;
    }

    /* 拖拽扇形通用属性 */
    .sector {
      cursor: grab;
      touch-action: none;
      mix-blend-mode: multiply;
      transition: filter 0.15s ease;
    }

    .sector:hover {
      filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.16));
    }

    .sector.dragging {
      cursor: grabbing;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.22));
    }

    /* 橙色扇形（左下角为圆心） */
    .sector-orange {
      fill: var(--orange-fill);
      stroke: var(--orange-stroke);
      stroke-width: 2.2;
      stroke-linejoin: round;
    }

    /* 蓝色扇形（右上角为圆心） */
    .sector-blue {
      fill: var(--blue-fill);
      stroke: var(--blue-stroke);
      stroke-width: 2.2;
      stroke-linejoin: round;
    }

    /* 尺寸标注 */
    .dim-line {
      stroke: var(--line-color);
      stroke-width: 1.6;
    }

    .dim-ext {
      stroke: #7f8e81;
      stroke-width: 1.2;
      stroke-dasharray: 4 3;
    }

    .dim-text {
      font-family: "Times New Roman", Times, "Cambria", serif;
      font-size: 26px;
      font-weight: 600;
      fill: var(--text-color);
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: 0.5px;
    }

    /* 模式切换组淡入淡出 */
    .view-group {
      transition: opacity 0.2s ease;
    }

    .view-hidden {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    /* 去阴影模式图层 */
    .fade-layer {
      transition: opacity 0.22s ease;
      will-change: opacity;
      pointer-events: none;
    }

    .fade-layer.removed {
      opacity: 0;
    }

    /* 隐形点击感应区（保证去阴影后点击仍能恢复，绝无高亮边框） */
    .click-proxy {
      fill: transparent;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    /* 旋转半片叶子交互属性 */
    .rotatable-leaf {
      cursor: grab;
      touch-action: none;
      transition: filter 0.15s ease;
    }

    .rotatable-leaf:hover {
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.20));
    }

    .rotatable-leaf.rotating {
      cursor: grabbing;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.28));
    }

    .rotatable-shape {
      fill: var(--gray-leaf);
      stroke: var(--line-color);
      stroke-width: 2.4;
      stroke-linejoin: round;
    }

    .rotate-proxy {
      fill: transparent;
      cursor: grab;
      touch-action: none;
    }

    .rotatable-leaf.rotating .rotate-proxy {
      cursor: grabbing;
    }

    /* 角度提示 HUD */
    .angle-badge {
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .angle-badge.visible {
      opacity: 1;
    }

    /* 底部居中水平画笔工具栏（水平居中对齐正方形底边与 6cm 标注） */
    .drawing-toolbar {
      position: fixed;
      left: calc(50% - 50px);
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 120;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(160, 185, 165, 0.45);
      border-radius: 24px;
      padding: 6px 10px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .tool-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 46px;
      height: 44px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: #334035;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease, color 0.15s ease;
    }

    .tool-btn:hover {
      background: #eef4ec;
    }

    .tool-btn:active {
      transform: scale(0.94);
    }

    .tool-btn.active {
      background: #fde8e8;
      color: #d32f2f;
      font-weight: 600;
      box-shadow: inset 0 0 0 1.2px rgba(211, 47, 47, 0.25);
    }

    .tool-btn svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    /* 全屏涂鸦画布 */
    .fullscreen-draw-svg {
      position: fixed;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      z-index: 110;
      pointer-events: none;
      overflow: visible;
    }

    .fullscreen-draw-svg.active {
      pointer-events: auto;
      cursor: crosshair;
    }

    /* 右下角操作区容器（剪刀按钮 + 更多菜单） */
    .bottom-action-container {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 圆形剪刀按钮（减正方形专属，位于更多按钮左边） */
    .scissor-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(160, 185, 165, 0.45);
      color: #2d382f;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .scissor-btn:hover {
      background: #ffffff;
      transform: scale(1.08);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
      color: #d32f2f;
    }

    .scissor-btn:active {
      transform: scale(0.92);
    }

    .scissor-btn.active {
      background: #fde8e8;
      color: #d32f2f;
      border-color: rgba(211, 47, 47, 0.4);
      box-shadow: 0 0 0 2px rgba(211, 47, 47, 0.2), 0 4px 12px rgba(211, 47, 47, 0.15);
    }

    .scissor-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* 右下角下拉更多菜单 */
    .more-menu-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .more-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(160, 185, 165, 0.45);
      color: #2d382f;
      font-size: 14px;
      font-weight: 500;
      padding: 9px 16px;
      border-radius: 22px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }

    .more-btn:hover {
      background: #ffffff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }

    .more-btn:active {
      transform: scale(0.96);
    }

    .more-btn .arrow-icon {
      font-size: 10px;
      transition: transform 0.2s ease;
    }

    .more-btn.open .arrow-icon {
      transform: rotate(180deg);
    }

    /* 下拉浮层 */
    .dropdown-panel {
      position: absolute;
      bottom: calc(100% + 8px);
      right: 0;
      min-width: 145px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(160, 185, 165, 0.45);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 6px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px) scale(0.96);
      transform-origin: bottom right;
      transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dropdown-panel.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 9px 12px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: #313d33;
      font-size: 13.5px;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s ease;
    }

    .dropdown-item:hover {
      background: #eef4ec;
    }

    .dropdown-item.active {
      color: #1a6e38;
      font-weight: 600;
      background: #e5f0e3;
    }

    .dropdown-item .check {
      font-size: 13px;
      opacity: 0;
    }

    .dropdown-item.active .check {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div class="container" id="mainContainer">
    <!-- 缩放与平移复位悬浮指示器 -->
    <button class="zoom-reset-badge" id="zoomResetBadge" title="双击空白处或点击复位视角">
      <span id="zoomPercentText">100%</span>
      <span class="reset-icon">↺</span>
    </button>

    <div class="canvas-viewport" id="canvasViewport">
      <svg viewBox="0 0 540 540" id="mainSvg">
        <defs>
          <!-- 尺寸标注箭头 -->
          <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
            <path d="M 9 1.5 L 2 5 L 9 8.5 z" fill="#222923" />
          </marker>
          <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 1 1.5 L 8 5 L 1 8.5 z" fill="#222923" />
          </marker>

          <!-- 1. 橙色扇形斜线：左上到右下的平行线组（\ 方向） -->
          <pattern id="hatch-orange-tl-br" width="18" height="18" patternUnits="userSpaceOnUse">
            <path d="M 0 0 L 18 18 M -4 14 L 4 22 M 14 -4 L 22 4" stroke="rgba(195, 85, 10, 0.42)" stroke-width="1.5"
              stroke-linecap="square" />
          </pattern>

          <!-- 2. 蓝色扇形斜线：右上到左下的平行线组（/ 方向） -->
          <pattern id="hatch-blue-tr-bl" width="18" height="18" patternUnits="userSpaceOnUse">
            <path d="M 18 0 L 0 18 M -4 4 L 4 -4 M 14 22 L 22 14" stroke="rgba(20, 100, 180, 0.42)" stroke-width="1.5"
              stroke-linecap="square" />
          </pattern>
        </defs>

        <!-- 1. 正方形底框（x=140, y=70, 边长=280） -->
        <g id="baseGroup">
          <rect x="140" y="70" width="280" height="280" class="base-square" />
        </g>

        <!-- 2. 边长 6 cm 标注（保留纯文字标注，去除边上的箭头线条和虚线） -->
        <g id="dimensionsGroup">
          <!-- 下方 6 cm -->
          <text x="280" y="375" class="dim-text">6 cm</text>

          <!-- 左侧 6 cm -->
          <text x="98" y="210" class="dim-text">6 cm</text>
        </g>

        <!-- 3. 默认静态原图状态：仅中间重叠的叶片区域带纯色淡灰色阴影 -->
        <g id="staticLeafGroup" class="view-group">
          <path d="M 140 70 A 280 280 0 0 1 420 350 A 280 280 0 0 1 140 70 Z" class="default-leaf" />
        </g>

        <!-- 4. 四分之一扇形可交互状态（自由拖拽、自动吸附） -->
        <g id="interactiveSectorsGroup" class="view-group view-hidden">
          <g id="sectorBL" class="sector" transform="translate(0, 0)">
            <path d="M 140 350 L 140 70 A 280 280 0 0 1 420 350 Z" class="sector-orange" />
            <path d="M 140 350 L 140 70 A 280 280 0 0 1 420 350 Z" fill="url(#hatch-orange-tl-br)"
              style="pointer-events: none;" />
          </g>

          <g id="sectorTR" class="sector" transform="translate(0, 0)">
            <path d="M 420 70 L 420 350 A 280 280 0 0 1 140 70 Z" class="sector-blue" />
            <path d="M 420 70 L 420 350 A 280 280 0 0 1 140 70 Z" fill="url(#hatch-blue-tr-bl)"
              style="pointer-events: none;" />
          </g>
        </g>

        <!-- 5. 减正方形模式：
           互不重叠分层3部分：左下角单层角、中间叶片、右上角单层角。
           3个局部阴影均可直接拖拽拖出到正方形外侧，靠近边缘时自动吸附！
      -->
        <g id="removeShadowGroup" class="view-group view-hidden">
          <!-- (1) 原地保留的淡橙色单层叶片（留在原地） -->
          <g id="centerOrangeStatic" style="pointer-events: none;">
            <path d="M 140 70 A 280 280 0 0 1 420 350 A 280 280 0 0 1 140 70 Z" fill="var(--orange-fill)" />
            <path d="M 140 70 A 280 280 0 0 1 420 350 A 280 280 0 0 1 140 70 Z" fill="url(#hatch-orange-tl-br)" />
            <path d="M 140 70 A 280 280 0 0 1 420 350 A 280 280 0 0 1 140 70 Z" fill="none" stroke="#222923"
              stroke-width="2.2" />
          </g>

          <!-- (2) 中间多出来的一层蓝色阴影可拖动块（移出一层蓝色的阴影到外侧） -->
          <g id="dragCenter" class="sector" transform="translate(0, 0)" style="mix-blend-mode: multiply;">
            <path d="M 140 70 A 280 280 0 0 1 420 350 A 280 280 0 0 1 140 70 Z" fill="var(--blue-fill)" />
            <path d="M 140 70 A 280 280 0 0 1 420 350 A 280 280 0 0 1 140 70 Z" fill="url(#hatch-blue-tr-bl)" />
            <path d="M 140 70 A 280 280 0 0 1 420 350 A 280 280 0 0 1 140 70 Z" fill="none" stroke="var(--blue-stroke)"
              stroke-width="2.2" />
          </g>

          <!-- (2) 左下角单层阴影角落可拖动块 -->
          <g id="dragBL" class="sector" transform="translate(0, 0)">
            <path d="M 140 70 L 140 350 L 420 350 A 280 280 0 0 1 140 70 Z" class="sector-orange" />
            <path d="M 140 70 L 140 350 L 420 350 A 280 280 0 0 1 140 70 Z" fill="url(#hatch-orange-tl-br)" />
          </g>

          <!-- (3) 右上角单层阴影角落可拖动块 -->
          <g id="dragTR" class="sector" transform="translate(0, 0)">
            <path d="M 140 70 L 420 70 L 420 350 A 280 280 0 0 0 140 70 Z" class="sector-blue" />
            <path d="M 140 70 L 420 70 L 420 350 A 280 280 0 0 0 140 70 Z" fill="url(#hatch-blue-tr-bl)" />
          </g>
        </g>

        <!-- 6. 半片叶子（减）模式：添加左上到右下的对角分割虚线，动态画出过程，点击可去除其中半片叶子 -->
        <g id="halfLeafGroup" class="view-group view-hidden">
          <!-- 上半片叶子（右上侧弓形：填充 + 外弧实线） -->
          <g id="halfUpperArea">
            <g id="halfUpperShadow" class="fade-layer">
              <path d="M 140 70 A 280 280 0 0 1 420 350 L 140 70 Z" fill="var(--gray-leaf)" />
              <path d="M 140 70 A 280 280 0 0 1 420 350" fill="none" stroke="var(--line-color)" stroke-width="2.4"
                stroke-linecap="round" />
            </g>
            <path d="M 140 70 A 280 280 0 0 1 420 350 L 140 70 Z" class="click-proxy" id="proxyHalfUpper" />
          </g>

          <!-- 下半片叶子（左下侧弓形：填充 + 外弧实线） -->
          <g id="halfLowerArea">
            <g id="halfLowerShadow" class="fade-layer">
              <path d="M 420 350 A 280 280 0 0 1 140 70 L 420 350 Z" fill="var(--gray-leaf)" />
              <path d="M 420 350 A 280 280 0 0 1 140 70" fill="none" stroke="var(--line-color)" stroke-width="2.4"
                stroke-linecap="round" />
            </g>
            <path d="M 420 350 A 280 280 0 0 1 140 70 L 420 350 Z" class="click-proxy" id="proxyHalfLower" />
          </g>

          <!-- 左上到右下的分割虚线（对角线，从左上到右下带动态绘制过程） -->
          <line id="halfDiagLine" x1="140" y1="70" x2="420" y2="350" stroke="#222923" stroke-width="2.2"
            stroke-dasharray="6 5" style="pointer-events: none;" />
        </g>

        <!-- 6b. 半片叶子（转）模式：左上到右下虚线动态画出，斜下方半片叶子绕左上角旋转并自动吸附 -->
        <g id="halfRotateGroup" class="view-group view-hidden">
          <!-- 上半片叶子（右上侧固定弓形：填充 + 外弧实线） -->
          <g style="pointer-events: none;">
            <path d="M 140 70 A 280 280 0 0 1 420 350 L 140 70 Z" fill="var(--gray-leaf)" />
            <path d="M 140 70 A 280 280 0 0 1 420 350" fill="none" stroke="var(--line-color)" stroke-width="2.4"
              stroke-linecap="round" />
          </g>

          <!-- 中间基准分割虚线（对角线，从左上到右下带动态绘制过程） -->
          <line id="rotateDiagLine" x1="140" y1="70" x2="420" y2="350" stroke="#222923" stroke-width="2.2"
            stroke-dasharray="6 5" style="pointer-events: none;" />

          <!-- 斜下方半片叶子（以左上角 140, 70 为圆心旋转，中间边为虚线） -->
          <g id="rotatingHalfLeaf" class="rotatable-leaf" transform="rotate(0, 140, 70)">
            <!-- 填充 -->
            <path d="M 420 350 A 280 280 0 0 1 140 70 L 420 350 Z" fill="var(--gray-leaf)" />
            <!-- 外弧实线 -->
