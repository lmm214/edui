<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>方中圆：一片叶子</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }
    *:focus, *:active {
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }
    svg, svg * {
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }

    :root {
      --bg-color: #f1f5ec;       /* 护眼柔和纸色豆沙绿 */
      --paper-color: #fafcf8;    /* 正方形底板柔白 */
      --line-color: #222923;     /* 墨黑边线 */
      --gray-leaf: rgba(140, 152, 142, 0.40);    /* 最初纯色淡灰阴影 */
      --orange-fill: rgba(255, 155, 45, 0.26);   /* 橙色单层阴影 */
      --orange-stroke: rgba(195, 85, 10, 0.85);
      --blue-fill: rgba(35, 145, 245, 0.26);     /* 蓝色单层阴影 */
      --blue-stroke: rgba(20, 100, 180, 0.85);
      --text-color: #222923;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      touch-action: none;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 20px;
      position: relative;
    }

    svg {
      width: 100%;
      height: 100%;
      max-width: 660px;
      max-height: 660px;
      overflow: visible;
      touch-action: none;
    }

    /* 正方形基准底框 */
    .base-square {
      fill: var(--paper-color);
      stroke: var(--line-color);
      stroke-width: 2.6;
      stroke-linejoin: round;
    }

    /* 最初纯色淡灰色叶片阴影 */
    .default-leaf {
      fill: var(--gray-leaf);
      stroke: var(--line-color);
      stroke-width: 2.4;
      stroke-linejoin: round;
    }

    /* 拖拽扇形通用属性 */
    .sector {
      cursor: grab;
      touch-action: none;
      mix-blend-mode: multiply;
      transition: filter 0.15s ease;
    }
    .sector:hover {
      filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.16));
    }
    .sector.dragging {
      cursor: grabbing;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.22));
    }

    /* 橙色扇形（左下角为圆心） */
    .sector-orange {
      fill: var(--orange-fill);
      stroke: var(--orange-stroke);
      stroke-width: 2.2;
      stroke-linejoin: round;
    }

    /* 蓝色扇形（右上角为圆心） */
    .sector-blue {
      fill: var(--blue-fill);
      stroke: var(--blue-stroke);
      stroke-width: 2.2;
      stroke-linejoin: round;
    }

    /* 尺寸标注 */
    .dim-line {
      stroke: var(--line-color);
      stroke-width: 1.6;
    }
    .dim-ext {
      stroke: #7f8e81;
      stroke-width: 1.2;
      stroke-dasharray: 4 3;
    }
    .dim-text {
      font-family: "Times New Roman", Times, "Cambria", serif;
      font-size: 26px;
      font-weight: 600;
      fill: var(--text-color);
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: 0.5px;
    }

    /* 模式切换组淡入淡出 */
    .view-group {
      transition: opacity 0.2s ease;
    }
    .view-hidden {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    /* 去阴影模式图层 */
    .fade-layer {
      transition: opacity 0.22s ease;
      will-change: opacity;
      pointer-events: none;
    }
    .fade-layer.removed {
      opacity: 0;
    }

    /* 隐形点击感应区（保证去阴影后点击仍能恢复，绝无高亮边框） */
    .click-proxy {
      fill: transparent;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    /* 右侧垂直居中工具栏 */
    .drawing-toolbar {
      position: fixed;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 120;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(160, 185, 165, 0.45);
      border-radius: 18px;
      padding: 8px 6px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .tool-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      width: 48px;
      height: 50px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: #334035;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease, color 0.15s ease;
    }
    .tool-btn:hover {
      background: #eef4ec;
    }
    .tool-btn:active {
      transform: scale(0.94);
    }
    .tool-btn.active {
      background: #fde8e8;
      color: #d32f2f;
      font-weight: 600;
      box-shadow: inset 0 0 0 1.2px rgba(211, 47, 47, 0.25);
    }
    .tool-btn svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    /* 顶层画板图层 */
    #drawOverlay {
      cursor: crosshair;
      touch-action: none;
    }

    /* 右下角下拉更多菜单 */
    .more-menu-container {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .more-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(160, 185, 165, 0.45);
      color: #2d382f;
      font-size: 14px;
      font-weight: 500;
      padding: 9px 16px;
      border-radius: 22px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }
    .more-btn:hover {
      background: #ffffff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }
    .more-btn:active {
      transform: scale(0.96);
    }
    .more-btn .arrow-icon {
      font-size: 10px;
      transition: transform 0.2s ease;
    }
    .more-btn.open .arrow-icon {
      transform: rotate(180deg);
    }

    /* 下拉浮层 */
    .dropdown-panel {
      position: absolute;
      bottom: calc(100% + 8px);
      right: 0;
      min-width: 145px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(160, 185, 165, 0.45);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 6px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px) scale(0.96);
      transform-origin: bottom right;
      transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dropdown-panel.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 9px 12px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: #313d33;
      font-size: 13.5px;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s ease;
    }
    .dropdown-item:hover {
      background: #eef4ec;
    }
    .dropdown-item.active {
      color: #1a6e38;
      font-weight: 600;
      background: #e5f0e3;
    }
    .dropdown-item .check {
      font-size: 13px;
      opacity: 0;
    }
    .dropdown-item.active .check {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <svg viewBox="0 0 540 540" id="mainSvg">
      <defs>
        <!-- 尺寸标注箭头 -->
        <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 9 1.5 L 2 5 L 9 8.5 z" fill="#222923" />
        </marker>
        <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 1 1.5 L 8 5 L 1 8.5 z" fill="#222923" />
        </marker>

        <!-- 1. 橙色扇形斜线：左上到右下的平行线组（\ 方向） -->
        <pattern id="hatch-orange-tl-br" width="18" height="18" patternUnits="userSpaceOnUse">
          <path d="M 0 0 L 18 18 M -4 14 L 4 22 M 14 -4 L 22 4" stroke="rgba(195, 85, 10, 0.42)" stroke-width="1.5" stroke-linecap="square" />
        </pattern>

        <!-- 2. 蓝色扇形斜线：右上到左下的平行线组（/ 方向） -->
        <pattern id="hatch-blue-tr-bl" width="18" height="18" patternUnits="userSpaceOnUse">
          <path d="M 18 0 L 0 18 M -4 4 L 4 -4 M 14 22 L 22 14" stroke="rgba(20, 100, 180, 0.42)" stroke-width="1.5" stroke-linecap="square" />
        </pattern>
      </defs>

      <!-- 1. 正方形底框（x=140, y=70, 边长=280） -->
      <g id="baseGroup">
        <rect x="140" y="70" width="280" height="280" class="base-square" />
      </g>

      <!-- 2. 边长 6 cm 标注（正下方与正左方） -->
      <g id="dimensionsGroup">
        <!-- 下方标注 -->
        <line x1="140" y1="350" x2="140" y2="395" class="dim-ext" />
        <line x1="420" y1="350" x2="420" y2="395" class="dim-ext" />
        <line x1="148" y1="388" x2="242" y2="388" class="dim-line" marker-start="url(#arrow-start)" />
        <line x1="318" y1="388" x2="412" y2="388" class="dim-line" marker-end="url(#arrow-end)" />
        <text x="280" y="388" class="dim-text">6 cm</text>

        <!-- 左侧标注 -->
        <line x1="140" y1="70" x2="95" y2="70" class="dim-ext" />
        <line x1="140" y1="350" x2="95" y2="350" class="dim-ext" />
        <line x1="102" y1="78" x2="102" y2="172" class="dim-line" marker-start="url(#arrow-start)" />
        <line x1="102" y1="248" x2="102" y2="342" class="dim-line" marker-end="url(#arrow-end)" />
        <text x="102" y="210" class="dim-text">6 cm</text>
      </g>

      <!-- 3. 默认静态原图状态：仅中间重叠的叶片区域带纯色淡灰色阴影 -->
      <g id="staticLeafGroup" class="view-group">
        <path d="M 140 70 A 280 280 0 0 1 420 350 A 280 280 0 0 1 140 70 Z" class="default-leaf" />
      </g>

      <!-- 4. 四分之一扇形可交互状态（自由拖拽、自动吸附） -->
      <g id="interactiveSectorsGroup" class="view-group view-hidden">
        <g id="sectorBL" class="sector" transform="translate(0, 0)">
          <path d="M 140 350 L 140 70 A 280 280 0 0 1 420 350 Z" class="sector-orange" />
          <path d="M 140 350 L 140 70 A 280 280 0 0 1 420 350 Z" fill="url(#hatch-orange-tl-br)" style="pointer-events: none;" />
        </g>

        <g id="sectorTR" class="sector" transform="translate(0, 0)">
          <path d="M 420 70 L 420 350 A 280 280 0 0 1 140 70 Z" class="sector-blue" />
          <path d="M 420 70 L 420 350 A 280 280 0 0 1 140 70 Z" fill="url(#hatch-blue-tr-bl)" style="pointer-events: none;" />
        </g>
      </g>

      <!-- 5. 减正方形模式：默认完整保持“四分之一扇形”样式（互不重叠分层3部分：右上、中间、左下）
           点击左下/右上：去除单层角落阴影；点击中间：去掉蓝色平行线层，最终保留淡橙色平行线叶片
      -->
      <g id="removeShadowGroup" class="view-group view-hidden">
        <!-- (1) 中间叶片区域：两层平行线交叉，点击可去掉一层平行线，最后保留淡橙色平行线 -->
        <g id="areaCenter">
          <!-- 中间淡橙色平行线层（左上到右下 \，减正方形最终保留层） -->
          <g id="centerOrangeLayer" class="fade-layer">
            <path d="M 140 70 A 280 280 0 0 1 420 350 A 280 280 0 0 1 140 70 Z" fill="var(--orange-fill)" />
            <path d="M 140 70 A 280 280 0 0 1 420 350 A 280 280 0 0 1 140 70 Z" fill="url(#hatch-orange-tl-br)" />
          </g>

          <!-- 中间蓝色平行线层（右上到左下 /） -->
          <g id="centerBlueLayer" class="fade-layer" style="mix-blend-mode: multiply;">
            <path d="M 140 70 A 280 280 0 0 1 420 350 A 280 280 0 0 1 140 70 Z" fill="var(--blue-fill)" />
            <path d="M 140 70 A 280 280 0 0 1 420 350 A 280 280 0 0 1 140 70 Z" fill="url(#hatch-blue-tr-bl)" />
          </g>

          <path d="M 140 70 A 280 280 0 0 1 420 350 A 280 280 0 0 1 140 70 Z" fill="none" stroke="#222923" stroke-width="2.2" style="pointer-events: none;" />
          <path d="M 140 70 A 280 280 0 0 1 420 350 A 280 280 0 0 1 140 70 Z" class="click-proxy" id="proxyCenter" />
        </g>

        <!-- (2) 左下角单层阴影角落 -->
        <g id="areaBL">
          <g id="cornerBLShadow" class="fade-layer">
            <path d="M 140 70 L 140 350 L 420 350 A 280 280 0 0 1 140 70 Z" class="sector-orange" />
            <path d="M 140 70 L 140 350 L 420 350 A 280 280 0 0 1 140 70 Z" fill="url(#hatch-orange-tl-br)" />
          </g>
          <path d="M 140 70 L 140 350 L 420 350 A 280 280 0 0 1 140 70 Z" class="click-proxy" id="proxyBL" />
        </g>

        <!-- (3) 右上角单层阴影角落 -->
        <g id="areaTR">
          <g id="cornerTRShadow" class="fade-layer">
            <path d="M 140 70 L 420 70 L 420 350 A 280 280 0 0 0 140 70 Z" class="sector-blue" />
            <path d="M 140 70 L 420 70 L 420 350 A 280 280 0 0 0 140 70 Z" fill="url(#hatch-blue-tr-bl)" />
          </g>
          <path d="M 140 70 L 420 70 L 420 350 A 280 280 0 0 0 140 70 Z" class="click-proxy" id="proxyTR" />
        </g>
      </g>

      <!-- 6. 半片叶子模式：添加左上到右下的对角分割虚线，点击可去除其中半片叶子 -->
      <g id="halfLeafGroup" class="view-group view-hidden">
        <!-- 上半片叶子（右上侧弓形） -->
        <g id="halfUpperArea">
          <path id="halfUpperShadow" d="M 140 70 A 280 280 0 0 1 420 350 L 140 70 Z" class="default-leaf fade-layer" />
          <path d="M 140 70 A 280 280 0 0 1 420 350 L 140 70 Z" class="click-proxy" id="proxyHalfUpper" />
        </g>

        <!-- 下半片叶子（左下侧弓形） -->
        <g id="halfLowerArea">
          <path id="halfLowerShadow" d="M 420 350 A 280 280 0 0 1 140 70 L 420 350 Z" class="default-leaf fade-layer" />
          <path d="M 420 350 A 280 280 0 0 1 140 70 L 420 350 Z" class="click-proxy" id="proxyHalfLower" />
        </g>

        <!-- 左上到右下的分割虚线（对角线） -->
        <line x1="140" y1="70" x2="420" y2="350" stroke="#222923" stroke-width="2.2" stroke-dasharray="6 5" style="pointer-events: none;" />
      </g>

      <!-- 7. 批注绘图层（画笔轨迹与直线，自适应缩放） -->
      <g id="drawLayer" style="pointer-events: none;"></g>

      <!-- 8. 绘图感应层（当画笔/线段激活时捕获事件） -->
      <rect id="drawOverlay" x="0" y="0" width="540" height="540" fill="transparent" style="pointer-events: auto;" />
    </svg>

    <!-- 右侧垂直居中工具栏：画笔、线段、清空（默认不激活画笔，点击后进入） -->
    <div class="drawing-toolbar">
      <button class="tool-btn" id="btnToolPen" title="画笔 (红色)">
        <svg viewBox="0 0 24 24">
          <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
        </svg>
        <span>画笔</span>
      </button>

      <button class="tool-btn" id="btnToolLine" title="绘制线段">
        <svg viewBox="0 0 24 24">
          <path d="M3.5 19.5l17-15M4 21a1.5 1.5 0 100-3 1.5 1.5 0 000 3zm16-15a1.5 1.5 0 100-3 1.5 1.5 0 000 3z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
        <span>线段</span>
      </button>

      <button class="tool-btn" id="btnToolClear" title="清空批注">
        <svg viewBox="0 0 24 24">
          <path d="M16 9v10H8V9h8m-1.5-6h-5l-1 1H5v2h14V4h-3.5l-1-1zM18 7H6v12c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7z"/>
        </svg>
        <span>清空</span>
      </button>
    </div>

    <!-- 右下角下拉菜单组件：排序为 一片叶子 -> 半片叶子 -> 四分之一扇形 -> 减正方形 -->
    <div class="more-menu-container">
      <div class="dropdown-panel" id="dropdownPanel">
        <button class="dropdown-item active" id="menuItemDefault">
          <span>一片叶子</span>
          <span class="check">✓</span>
        </button>
        <button class="dropdown-item" id="menuItemHalf">
          <span>半片叶子</span>
          <span class="check">✓</span>
        </button>
        <button class="dropdown-item" id="menuItemSectors">
          <span>四分之一扇形</span>
          <span class="check">✓</span>
        </button>
        <button class="dropdown-item" id="menuItemRemove">
          <span>减正方形</span>
          <span class="check">✓</span>
        </button>
      </div>
      <button class="more-btn" id="moreBtn">
        <span>更多</span>
        <span class="arrow-icon">▼</span>
      </button>
    </div>
