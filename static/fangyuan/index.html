<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方与圆</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="theme-light">
  <!-- 顶栏控制条 -->
  <header class="top-navbar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="18" x="3" y="3" rx="2" />
        <circle cx="12" cy="12" r="5" />
      </svg>
      <span class="brand-title">方与圆</span>
    </div>

    <!-- 图形切换与控制 -->
    <div class="control-toggles">
      <label class="toggle-btn" title="一键开关圆">
        <input type="checkbox" id="toggle-circle" checked>
        <span class="btn-chip chip-circle">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" />
          </svg>
          圆
        </span>
      </label>

      <label class="toggle-btn" title="一键开关外切正方形">
        <input type="checkbox" id="toggle-outer-square">
        <span class="btn-chip chip-outer">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2" />
          </svg>
          外切正方形
        </span>
      </label>

      <label class="toggle-btn" title="一键开关内切正方形">
        <input type="checkbox" id="toggle-inner-square">
        <span class="btn-chip chip-inner">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect width="13" height="13" x="5.5" y="5.5" rx="1.5" />
          </svg>
          内切正方形
        </span>
      </label>

      <label class="toggle-btn" title="显示对角线与中轴辅助虚线">
        <input type="checkbox" id="toggle-aux-lines">
        <span class="btn-chip chip-aux">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="M3 12h18" />
            <path d="M12 3v18" />
          </svg>
          辅助虚线
        </span>
      </label>

      <label class="toggle-btn" title="显示半径与标注">
        <input type="checkbox" id="toggle-radius-display" checked>
        <span class="btn-chip chip-radius">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 12h9" />
            <circle cx="12" cy="12" r="2.5" fill="currentColor" />
          </svg>
          半径显示
        </span>
      </label>
    </div>

    <!-- 右侧功能区 -->
    <div class="top-actions">
      <button id="btn-reset-view" class="btn-ghost" title="复位视角与图形">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
      </button>
      <button id="btn-theme-toggle" class="btn-ghost icon-only" title="切换主题 (亮色/暗色)">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2" />
          <path d="M12 20v2" />
          <path d="m4.93 4.93 1.41 1.41" />
          <path d="m17.66 17.66 1.41 1.41" />
          <path d="M2 12h2" />
          <path d="M20 12h2" />
          <path d="m6.34 17.66-1.41 1.41" />
          <path d="m19.07 4.93-1.41 1.41" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- 主 SVG 画板容器 -->
  <main class="canvas-container" id="canvas-container">
    <svg id="svg-workspace" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- 画布网格背景 -->
        <pattern id="grid-pattern-dark" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
        </pattern>
        <pattern id="grid-pattern-light" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="1" />
        </pattern>

        <!-- 45度旋转分解三角形高亮渐变 -->
        <linearGradient id="tri-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.05" />
        </linearGradient>
        <linearGradient id="tri-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#34d399" stop-opacity="0.05" />
        </linearGradient>
      </defs>

      <!-- 网格背景层 -->
      <rect id="grid-bg" width="100%" height="100%" fill="url(#grid-pattern-light)" />

      <!-- 主几何图形组 (居中坐标系 origin at center) -->
      <g id="viewport-group">
        <!-- 轴线 background coordinate lines (隐藏) -->
        <g id="axis-group" opacity="0.4" style="display: none;">
          <line id="axis-x" x1="-2000" y1="0" x2="2000" y2="0" stroke="currentColor" stroke-dasharray="4 4"
            stroke-width="1" />
          <line id="axis-y" x1="0" y1="-2000" x2="0" y2="2000" stroke="currentColor" stroke-dasharray="4 4"
            stroke-width="1" />
        </g>

        <!-- 外切正方形 (Outer Circumscribed Square) -->
        <g id="outer-square-group" class="geom-layer">
          <rect id="outer-square" class="shape-outer-square" x="-150" y="-150" width="300" height="300" rx="0" />
          <!-- 4个小正方形分割网格（45度推导时显示） -->
          <g id="outer-subquads" opacity="0">
            <line x1="-150" y1="0" x2="150" y2="0" stroke="currentColor" stroke-dasharray="3 3" />
            <line x1="0" y1="-150" x2="0" y2="150" stroke="currentColor" stroke-dasharray="3 3" />
          </g>
        </g>

        <!-- 内切正方形 45度旋转时的三角形区域分割高亮 -->
        <g id="triangles-proof-group" class="geom-layer" opacity="0">
          <path id="tri-top-left" class="proof-tri" d="" fill="url(#tri-grad-1)" stroke="none" />
          <path id="tri-top-right" class="proof-tri" d="" fill="url(#tri-grad-2)" stroke="none" />
          <path id="tri-bot-right" class="proof-tri" d="" fill="url(#tri-grad-1)" stroke="none" />
          <path id="tri-bot-left" class="proof-tri" d="" fill="url(#tri-grad-2)" stroke="none" />
        </g>

        <!-- 基础圆 (Circle) -->
        <g id="circle-group" class="geom-layer">
          <circle id="main-circle" class="shape-circle" cx="0" cy="0" r="150" />
        </g>

        <!-- 辅助虚线层 (Auxiliary Lines: Diagonals, Radius vectors, etc) -->
        <g id="aux-lines-group" class="geom-layer" style="display: none;">
          <line id="diag-line-1" x1="-150" y1="-150" x2="150" y2="150" class="aux-line" />
          <line id="diag-line-2" x1="150" y1="-150" x2="-150" y2="150" class="aux-line" />
        </g>

        <!-- 内切正方形 (Inscribed Square - Supports Rotation) -->
        <g id="inner-square-group" class="geom-layer">
          <polygon id="inner-square-poly" class="shape-inner-square" points="" />
          <!-- 内切正方形对角线 -->
          <line id="inner-diag-1" x1="0" y1="0" x2="0" y2="0" class="aux-line-inner" />
          <line id="inner-diag-2" x1="0" y1="0" x2="0" y2="0" class="aux-line-inner" />
        </g>

        <!-- 半径指示与标注层 (Radius Display Layer) -->
        <g id="radius-group" class="geom-layer">
          <line id="radius-line" class="radius-vector" x1="0" y1="0" x2="150" y2="0" />
          <circle id="center-point" cx="0" cy="0" r="4.5" class="center-dot" />
          <text id="center-label" x="-18" y="22" class="math-label center-text">O</text>

          <!-- 半径拖拽手柄与文本 -->
          <g id="radius-handle-group" cursor="ew-resize">
            <text id="radius-label" x="75" y="-12" class="math-label radius-text">r</text>
            <circle id="radius-handle" cx="150" cy="0" r="8" class="handle-dot" />
          </g>
        </g>

        <!-- Lucide rotate-cw：内切正方形旋转拖拽手柄 -->
        <svg id="rotation-handle" class="rotation-handle-icon" x="-14" y="-164" width="28" height="28"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-label="旋转内切正方形">
          <title>拖动旋转内切正方形</title>
          <path d="M21 12a9 9 0 1 1-2.64-6.36L21 8" />
          <path d="M21 3v5h-5" />
        </svg>

        <!-- 标注手绘图层 (User Pen Annotation Layer) -->
        <g id="annotation-layer"></g>

        <!-- 临时画笔预览 -->
        <g id="temp-annotation-layer"></g>
      </g>
    </svg>
  </main>

  <!-- 右侧垂直居中工具栏 (Vertical Centered Annotation Toolbar) -->
  <aside class="right-toolbar" id="right-toolbar">
    <div class="tool-section">
      <button class="tool-btn active" id="tool-select" data-tool="select" title="选择与交互移动 (V)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4l7.07 17 2.51-7.39L21 11.07z" />
        </svg>
        <span class="tool-tip">选择/移动</span>
      </button>

      <button class="tool-btn" id="tool-pen" data-tool="pen" title="画笔工具 (P)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
          <path d="m15 5 4 4" />
        </svg>
        <span class="tool-tip">画笔标记</span>
      </button>

      <button class="tool-btn" id="tool-eraser" data-tool="eraser" title="橡皮擦 (E)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21" />
          <path d="M22 21H7" />
          <path d="m5 11 9 9" />
        </svg>
        <span class="tool-tip">橡皮擦</span>
      </button>
    </div>

    <div class="tool-divider"></div>

    <!-- 调色板 (红 黄 蓝 绿 单列) 与 2 档粗细 -->
    <div class="tool-section color-section">
      <div class="color-palette">
        <button class="color-dot active" data-color="#ef4444" style="background:#ef4444" title="红色"></button>
        <button class="color-dot" data-color="#f59e0b" style="background:#f59e0b" title="黄色"></button>
        <button class="color-dot" data-color="#3b82f6" style="background:#3b82f6" title="蓝色"></button>
        <button class="color-dot" data-color="#10b981" style="background:#10b981" title="绿色"></button>
      </div>

      <div class="stroke-options">
        <button class="stroke-btn" data-size="3" title="细线 (3px)"><span class="stroke-preview s-thin"></span></button>
        <button class="stroke-btn active" data-size="7" title="粗线 (7px)"><span
            class="stroke-preview s-thick"></span></button>
      </div>
    </div>

    <div class="tool-divider"></div>

    <!-- 撤销与清空 -->
    <div class="tool-section">
      <button class="tool-btn" id="tool-undo" title="撤销标记 (Ctrl+Z)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 14 4 9l5-5" />
          <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" />
        </svg>
        <span class="tool-tip">撤销</span>
      </button>

      <button class="tool-btn danger" id="tool-clear" title="清空全部标记">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18" />
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
          <line x1="10" x2="10" y1="11" y2="17" />
          <line x1="14" x2="14" y1="11" y2="17" />
        </svg>
        <span class="tool-tip">清空标记</span>
      </button>
    </div>
  </aside>
  <script src="app.js"></script>
</body>

</html>
