<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小学数学互动课件 · 第一性原理全功能 Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#17324d', paper: '#fffdf5', chalk: '#167d74', sun: '#ffb703', coral: '#ef6f6c'
          },
          fontFamily: { sans: ['Nunito', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'] }
        }
      }
    };
  </script>
  <style>
    :root {
      --ink: #17324d;
      --paper: #fffdf5;
      --chalk: #167d74;
      --sun: #ffb703;
      --coral: #ef6f6c
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #edf6f4;
      color: var(--ink);
      font-size: 16px;
      font-family: Nunito, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    input {
      font: inherit
    }

    button {
      touch-action: manipulation
    }

    .dot-bg {
      background-image: radial-gradient(#b8d8d2 1.25px, transparent 1.25px);
      background-size: 24px 24px
    }

    .shell {
      width: 100%;
      height: 100dvh;
      padding: 10px clamp(8px, 1.2vw, 20px);
      overflow: hidden
    }

    .topbar {
      width: 100%;
      height: 64px;
      flex: 0 0 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 4px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: var(--sun);
      box-shadow: 4px 4px 0 var(--ink);
      font-size: 24px;
      transform: rotate(-2deg)
    }

    .tour-progress {
      max-width: 720px;
      flex: 1
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 950
    }

    .progress-meta #progressLabel {
      flex: 0 0 auto;
      width: auto;
      padding: 3px 8px;
      border-radius: 99px;
      background: var(--ink);
      color: #fff;
      line-height: 1.2
    }



    .tour-line {
      height: 8px;
      border: 2px solid var(--ink);
      border-radius: 99px;
      background: white;
      overflow: hidden
    }

    .tour-line>i {
      display: block;
      height: 100%;
      background: var(--chalk);
      width: 12.5%;
      transition: width .45s cubic-bezier(.2, .8, .2, 1)
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(105px, 190px) minmax(0, 1fr) minmax(105px, 190px);
      gap: clamp(10px, 1.15vw, 20px);
      align-items: center;
      justify-content: center
    }

    .notes {
      position: relative;
      z-index: 4;
      display: flex;
      min-height: 0;
      height: 100%;
      align-items: center
    }

    .note-stack {
      width: 100%;
      display: grid;
      gap: 12px
    }

    .guide-card {
      position: relative;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 22px;
      padding: 20px 16px;
      box-shadow: 7px 7px 0 rgba(23, 50, 77, .18);
      animation: pop .48s cubic-bezier(.2, .9, .25, 1.2) both;
      display: flex;
      flex-direction: column;
      justify-content: center
    }

    .guide-card::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px dashed rgba(23, 50, 77, .22);
      border-radius: 14px;
      pointer-events: none
    }

    .guide-index {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: .08em;
      color: #fff;
      background: var(--ink);
      border-radius: 99px;
      padding: 5px 9px;
      margin-bottom: 10px
    }

    .guide-card h3 {
      font-size: clamp(19px, 1.15vw, 23px);
      line-height: 1.3;
      margin: 0 0 12px;
      font-weight: 950
    }

    .guide-card p {
      font-size: clamp(16px, .9vw, 18px);
      line-height: 1.78;
      margin: 0;
      color: #49647c;
    }

    .guide-card .principle {
      display: inline-block;
      align-self: flex-start;
      margin-top: 15px;
      padding: 7px 10px;
      border-radius: 9px;
      background: #e7f7f4;
      color: #12665f;
      font-size: 13px;
      font-weight: 900
    }

    .guide-card.right {
      animation-delay: .12s
    }

    .arrow-anchor {
      position: absolute;
      top: 50%;
      width: 12px;
      height: 12px;
      border: 3px solid var(--ink);
      background: var(--sun);
      border-radius: 50%;
      transform: translateY(-50%)
    }

    .left-card .arrow-anchor {
      right: -8px
    }

    .right-card .arrow-anchor {
      left: -8px
    }

    .center-stack {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center
    }

    .window-wrap {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center
    }

    .browser {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      background: white;
      border: 3px solid var(--ink);
      border-radius: 22px;
      box-shadow: 10px 12px 0 rgba(23, 50, 77, .17);
      overflow: hidden
    }

    .browser-bar {
      height: 54px;
      border-bottom: 3px solid var(--ink);
      background: #f8eee0;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 11px
    }

    .traffic {
      display: flex;
      gap: 6px;
      flex: 0 0 auto
    }

    .traffic i {
      display: block;
      width: 12px;
      height: 12px;
      border: 2px solid var(--ink);
      border-radius: 50%
    }

    .traffic i:nth-child(1) {
      background: #ef6f6c
    }

    .traffic i:nth-child(2) {
      background: #ffcf56
    }

    .traffic i:nth-child(3) {
      background: #79c99e
    }

    .lesson-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 0;
      flex: 1;
      height: 34px;
      padding: 0 15px;
      border: 2px solid var(--ink);
      border-radius: 99px;
      background: #fff;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #526a7d
    }

    .lesson-title span {
      white-space: nowrap
    }

    .lesson-title #lessonName {
      color: var(--ink);
      font-weight: 950
    }

    .lesson-title #lessonMeta {
      overflow: hidden;
      text-overflow: ellipsis
    }

    .lesson-icon {
      font-size: 16px
    }

    .url-prefix {
      color: #81909c;
      font-size: 12px
    }

    .url-sep {
      color: #aeb9c1
    }

    .status-pills {
      display: flex;
      gap: 6px;
      align-items: center;
      flex: 0 0 auto
    }

    .pill {
      font-size: 11px;
      font-weight: 900;
      padding: 5px 8px;
      border-radius: 99px;
      background: #edf3f8
    }

    .pill.live {
      background: #ffe8e7;
      color: #a43a37
    }

    .live-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e84d48;
      margin-right: 3px;
      animation: pulse 1.4s infinite
    }

    .app {
      height: calc(100% - 54px);
      background: var(--paper);
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    .screen {
      position: relative;
      flex: 1;
      min-height: 0;
      padding: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .scene {
      width: 100%;
      height: 100%;
      min-width: 0;
      font-size: 17px;
      animation: sceneIn .38s ease both;
      transform-origin: center
    }

    .scene .text-xs {
      font-size: 14px !important;
      line-height: 1.5
    }

    .scene-grid {
      display: grid;
      grid-template-columns: 1.18fr .82fr;
      gap: 16px;
      height: 100%
    }

    .scene-grid>.card {
      height: 100%;
      display: flex;
      flex-direction: column
    }

    .scene-grid>.flex.flex-col {
      height: 100%
    }

    .scene-grid>.flex.flex-col>.card {
      flex: 1
    }

    .card {
      background: #fff;
      border: 2px solid #bdd4cf;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 4px 0 rgba(23, 50, 77, .07)
    }

    .card-title {
      font-weight: 950;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px
    }

    .tiny-label {
      font-size: 12px;
      background: #edf6f4;
      border-radius: 7px;
      padding: 4px 7px;
      color: #4d6c68;
      font-weight: 900
    }

    .objective {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      border: 2px solid var(--ink);
      border-radius: 16px;
      background: #fff7d9;
      box-shadow: 4px 4px 0 rgba(23, 50, 77, .12)
    }

    .objective b {
      display: block;
      font-size: 16px;
      margin-bottom: 3px
    }

    .objective p {
      margin: 0;
      font-size: 14px;
      color: #5d6f7d;
      line-height: 1.55
    }

    .intro-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      height: 100%
    }

    .intro-side {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 14px
    }

    .lesson-timeline {
      position: relative;
      display: grid;
      gap: 10px;
      padding-left: 26px
    }

    .lesson-timeline::before {
      content: "";
      position: absolute;
      left: 9px;
      top: 10px;
      bottom: 10px;
      width: 3px;
      border-radius: 3px;
      background: #b9d5cf
    }

    .timeline-step {
      position: relative;
      border: 2px solid #d3e1de;
      border-radius: 12px;
      background: #fff;
      padding: 9px 11px;
      font-size: 13px;
      font-weight: 900
    }

    .timeline-step::before {
      content: "";
      position: absolute;
      left: -24px;
      top: 50%;
      width: 13px;
      height: 13px;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: #fff;
      transform: translateY(-50%)
    }

    .timeline-step.active {
      border-color: var(--ink);
      background: #fff1b9
    }

    .timeline-step.active::before {
      background: var(--sun)
    }

    .timeline-step small {
      display: block;
      margin-top: 2px;
      color: #70818e;
      font-size: 10px
    }

    .chalk-board {
      background: #176a63;
      border: 5px solid #9b6b43;
      border-radius: 12px;
      color: #fff;
      padding: 20px;
      min-height: 290px;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .15);
      position: relative;
      overflow: hidden
    }

    .chalk-board::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .08;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 9px 9px;
      pointer-events: none
    }

    .chalk-board>* {
      position: relative;
      z-index: 1
    }

    .big-question {
      font-size: clamp(22px, 3vw, 36px);
      font-weight: 950;
      text-align: center;
      margin: 22px 0
    }

    .start-btn,
    .primary-btn {
      border: 2px solid var(--ink);
      border-radius: 13px;
      background: var(--sun);
      font-weight: 950;
      padding: 10px 15px;
      box-shadow: 3px 3px 0 var(--ink);
      transition: .16s
    }

    .start-btn:hover,
    .primary-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0 var(--ink)
    }

    .start-btn:active,
    .primary-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--ink)
    }

    .type-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .type-chip {
      border: 2px solid #c7d8d4;
      background: #fff;
      border-radius: 15px;
      padding: 12px;
      text-align: left;
      font-weight: 900;
      font-size: 13px
    }

    .type-chip span {
      display: block;
      font-size: 22px;
      margin-bottom: 5px
    }

    .type-chip.active {
      border-color: var(--ink);
      background: #dff5f0;
      box-shadow: 3px 3px 0 var(--ink)
    }

    .fraction-lab {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 22px;
      align-items: center;
      height: 100%
    }

    .fraction-lab #fractionVisual {
      height: 100%;
      display: flex;
      min-height: 0;
      flex-direction: column;
      justify-content: center
    }

    .pizza {
      width: min(340px, 72%);
      aspect-ratio: 1;
      border: 4px solid var(--ink);
      border-radius: 50%;
      margin: auto;
      position: relative;
      overflow: hidden;
      background: #f0eee8;
      box-shadow: 6px 7px 0 rgba(23, 50, 77, .13)
    }

    .fraction-pie {
      display: block;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg)
    }

    .fraction-sector {
      cursor: pointer;
      stroke: var(--ink);
      stroke-width: 2;
      fill: #f1eee5;
      transition: fill .18s, filter .18s
    }

    .fraction-sector:hover {
      filter: brightness(.96)
    }

    .fraction-sector.on {
      fill: var(--sun)
    }

    .fraction-sector:focus {
      outline: none;
      filter: drop-shadow(0 0 5px var(--coral))
    }

    .pizza-center {
      pointer-events: none;
      fill: #fff7d0;
      stroke: var(--ink);
      stroke-width: 2
    }

    .frac-readout {
      text-align: center
    }

    .frac-symbol {
      font-size: 4rem;
      font-weight: 950;
      line-height: 1.2;
    }

    .frac-symbol .bar {
      display: block;
      width: 52px;
      height: 4px;
      background: var(--ink);
      margin: 5px auto
    }

    .stepper {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 14px
    }

    .round-btn {
      width: 42px;
      height: 42px;
      border: 2px solid var(--ink);
      border-radius: 13px;
      background: #fff;
      font-size: 22px;
      font-weight: 950;
      box-shadow: 2px 2px 0 var(--ink)
    }

    .round-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none
    }

    .denoms {
      display: flex;
      gap: 7px;
      justify-content: center;
      margin-top: 9px
    }

    .denom-btn {
      border: 2px solid #b9cec9;
      background: white;
      border-radius: 9px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 900
    }

    .denom-btn.active {
      background: var(--ink);
      color: white;
      border-color: var(--ink)
    }

    .numberline {
      position: relative;
      height: 78px;
      margin: 18px 20px 0;
      touch-action: none;
      cursor: pointer
    }

    .numberline .axis {
      position: absolute;
      left: 0;
      right: 0;
      top: 29px;
      height: 5px;
      background: var(--ink);
      border-radius: 4px
    }

    .numberline .axis-fill {
      position: absolute;
      left: 0;
      top: 29px;
      height: 5px;
      border-radius: 4px;
      background: var(--coral);
      pointer-events: none
    }

    .tick {
      position: absolute;
      top: 20px;
      width: 3px;
      height: 23px;
      background: var(--ink);
      transform: translateX(-50%)
    }

    .tick-label {
      position: absolute;
      top: 49px;
      transform: translateX(-50%);
      font-size: 12px;
      font-weight: 900
    }

    .number-dot {
      position: absolute;
      top: 16px;
      width: 31px;
      height: 31px;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: var(--coral);
      transform: translateX(-50%);
      transition: left .18s cubic-bezier(.2, .8, .2, 1);
      box-shadow: 3px 3px 0 var(--ink);
      cursor: grab;
      touch-action: none
    }

    .number-dot.dragging {
      transition: none;
      cursor: grabbing;
      transform: translateX(-50%) scale(1.08)
    }

    .explain-box {
      border-left: 5px solid var(--chalk);
      background: #e8f6f3;
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
      color: #41605d
    }

    .formula {
      font-size: 24px;
      font-weight: 950;
      text-align: center;
      background: #f4f0ff;
      border: 2px dashed #9274c8;
      border-radius: 13px;
      padding: 11px
    }

    .geo-board {
      position: relative;
      display: grid;
      place-items: center;
      flex: 1;
      min-height: 220px;
      background-color: #f2faf8;
      background-image:
        linear-gradient(to right, rgba(155, 190, 183, 0.45) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(155, 190, 183, 0.45) 1px, transparent 1px);
      background-size: 30px 30px;
      border-radius: 16px;
      border: 2px dashed #9bbeb7;
      overflow: hidden;
    }

    .rectangle {
      position: relative;
      background: repeating-linear-gradient(45deg, #8cd8c8, #8cd8c8 14px, #9fe1d3 14px, #9fe1d3 28px);
      border: 4px solid var(--ink);
      transition: width .25s, height .25s
    }

    .dimension {
      position: absolute;
      font-size: 16px;
      font-weight: 950;
      color: var(--ink);
      background: transparent;
      border: none;
      padding: 0;
      text-shadow: 0 1px 3px rgba(255, 255, 255, 0.9), 0 -1px 3px rgba(255, 255, 255, 0.9), 1px 0 3px rgba(255, 255, 255, 0.9), -1px 0 3px rgba(255, 255, 255, 0.9);
      pointer-events: none;
    }

    .dimension.w {
      left: 50%;
      bottom: -24px;
      transform: translateX(-50%)
    }

    .dimension.h {
      right: -24px;
      top: 50%;
      transform: translateY(-50%)
    }

    .slider-row {
      display: grid;
      grid-template-columns: 32px 1fr 40px;
      align-items: center;
      gap: 9px;
      margin: 11px 0;
      font-size: 14px;
      font-weight: 900
    }

    #candyPoolVisual {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
      gap: 10px;
      place-items: center;
      align-content: center;
      justify-content: center;
      flex: 1;
      min-height: 160px;
      padding: 16px;
      background: #fffbeb;
      border-radius: 16px;
      border: 2px dashed #fcd34d;
      overflow-y: auto;
    }

    .candy-item {
      font-size: 32px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #ffffff;
      border: 2px solid #fde68a;
      box-shadow: 0 2px 5px rgba(217, 119, 6, 0.15);
      transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      user-select: none;
    }

    .candy-item:hover {
      transform: scale(1.15) rotate(6deg);
    }

    .slider-row input {
      accent-color: var(--chalk);
      width: 100%
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .metric {
      border: 2px solid var(--ink);
      border-radius: 14px;
      padding: 13px;
      text-align: center;
      background: #fff
    }

    .metric b {
      display: block;
      font-size: 29px
    }

    .metric span {
      font-size: 12px;
      color: #6e8190;
      font-weight: 900
    }

    .prediction {
      display: flex;
      gap: 8px
    }

    .prediction button {
      flex: 1;
      border: 2px solid #b9cec9;
      border-radius: 10px;
      background: white;
      padding: 9px;
      font-size: 13px;
      font-weight: 900
    }

    .prediction button.selected {
      background: #fff0b8;
      border-color: var(--ink);
      box-shadow: 2px 2px 0 var(--ink)
    }

    .equation {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 34px;

  <script>
    // Prevent right-click and long-press context menus globally
    window.addEventListener('contextmenu', e => e.preventDefault());

    let ropeInitialized = false;
    let updateRopeRaf = null;

    function initRopePhysics() {
      const container = document.getElementById('ropePhysics');
      if (!container) return;

      // Cleanup previous RAF if any
      if (updateRopeRaf) cancelAnimationFrame(updateRopeRaf);


      const pathCurve = document.getElementById('curve');
      const curveVisible = document.getElementById('curve-visible');
      const hitA = document.getElementById('hitA');
      const nodeA = document.getElementById('nodeA');
      const hitB = document.getElementById('hitB');
      const nodeB = document.getElementById('nodeB');

      const num_nodes = 73; // 72个间距，能被3和4整除，保证顶点精准匹配
      let total_length = ($('#ropePhysics')?.clientWidth || 800) * 0.6;
      let segment_length = total_length / (num_nodes - 1);
      let nodes = [];

      let cx = ($('#ropePhysics')?.clientWidth || 800) / 2;
      let cy = ($('#ropePhysics')?.clientHeight || 600) / 2;

      // 初始化节点，居中直线
      for (let i = 0; i < num_nodes; i++) {
        nodes.push({
          x: cx - total_length / 2 + i * segment_length,
          y: cy,
          old_x: cx - total_length / 2 + i * segment_length,
          old_y: cy
        });
      }

      let activeTouches = {};
      let globalHasDraggedNode = false;
      let isClosed = false;
      let currentShape = 'line';
      let isAnimating = false;
      let animationProgress = 0;
      let animationType = '';
      let targetShapeType = '';
      let morphStartNodes = [];
      let unfoldSource = '';

      function getShapeNodes(shapeType, foldT) {
        let P = total_length;
        let ncx = ($('#ropePhysics')?.clientWidth || 800) / 2;
        let ncy = ($('#ropePhysics')?.clientHeight || 600) / 2;
        let result = [];

        if (shapeType === 'line') {
          for (let i = 0; i < num_nodes; i++) {
            result.push({ x: ncx - P / 2 + i * segment_length, y: ncy });
          }
          return result;
        }

        if (shapeType === 'circle') {
          let R = P / (2 * Math.PI);
          let targetK = 1 / R;
          let k = targetK * foldT;
          for (let i = 0; i < num_nodes; i++) {
            let s = i * segment_length - P / 2;
            let x, y;
            if (k < 1e-5) {
              x = ncx + s;
              y = ncy;
            } else {
              let r = 1 / k;
              let alpha = s * k;
              x = ncx + r * Math.sin(alpha);
              y = ncy - r * (1 - Math.cos(alpha));
            }
            result.push({ x, y });
          }
          return result;
        }

        if (shapeType === 'square') {
          let a = P / 4;
          let theta = (Math.PI / 2) * foldT;
          for (let i = 0; i < num_nodes; i++) {
            let s = i * segment_length;
            let x, y;
            if (s <= 0.5 * a) {
              let d = 0.5 * a - s;
              let H2x = ncx - a / 2;
              let H2y = ncy;
              let H1x = H2x + a * (-Math.cos(theta));
              let H1y = H2y + a * (-Math.sin(theta));
              x = H1x + d * (-Math.cos(2 * theta));
              y = H1y + d * (-Math.sin(2 * theta));
            } else if (s <= 1.5 * a) {
              let d = 1.5 * a - s;
              let H2x = ncx - a / 2;
              let H2y = ncy;
              x = H2x + d * (-Math.cos(theta));
              y = H2y + d * (-Math.sin(theta));
            } else if (s <= 2.5 * a) {
              x = ncx + (s - 2 * a);
              y = ncy;
            } else if (s <= 3.5 * a) {
              let d = s - 2.5 * a;
              let H3x = ncx + a / 2;
              let H3y = ncy;
              x = H3x + d * Math.cos(theta);
              y = H3y + d * (-Math.sin(theta));
            } else {
              let d = s - 3.5 * a;
              let H3x = ncx + a / 2;
              let H3y = ncy;
              let H4x = H3x + a * Math.cos(theta);
              let H4y = H3y + a * (-Math.sin(theta));
              x = H4x + d * Math.cos(2 * theta);
              y = H4y + d * (-Math.sin(2 * theta));
            }
            result.push({ x: x, y: y });
          }
          return result;
        }

        if (shapeType === 'triangle') {
          let a = P / 3;
          let theta = ((2 * Math.PI) / 3) * foldT;
          for (let i = 0; i < num_nodes; i++) {
            let s = i * segment_length;
            let x, y;
            if (s <= a) {
              let d = a - s;
              x = ncx - a / 2 + d * (-Math.cos(theta));
              y = ncy + d * (-Math.sin(theta));
            } else if (s <= 2 * a) {
              x = ncx - 1.5 * a + s;
              y = ncy;
            } else {
              let d = s - 2 * a;
              x = ncx + a / 2 + d * Math.cos(theta);
              y = ncy + d * (-Math.sin(theta));
            }
            result.push({ x, y });
          }
          return result;
        }
        return result;

          const down = (e) => {
            isDragging = true;
            const pos = e.touches ? e.touches[0] : e;
            startX = pos.clientX; startY = pos.clientY;
            initLeft = parseInt(box.style.left) || 0; initTop = parseInt(box.style.top) || 0;
            box.style.zIndex = 10;
          };
          const move = (e) => {
            if (!isDragging) return;
            const pos = e.touches ? e.touches[0] : e;
            let nx = initLeft + (pos.clientX - startX);
            let ny = initTop + (pos.clientY - startY);
            // bounding box of area
            const aw = area.clientWidth, ah = area.clientHeight;
            if (nx < 0) nx = 0; if (ny < 0) ny = 0;
            if (nx > aw - 48) nx = aw - 48; if (ny > ah - 48) ny = ah - 48;

            boxes.forEach(other => {
              if (other === box) return;
              const ox = parseInt(other.style.left) || 0;
              const oy = parseInt(other.style.top) || 0;
              if (Math.abs(nx + 48 - ox) < 15 && Math.abs(ny - oy) < 48) nx = ox - 48;
              else if (Math.abs(nx - (ox + 48)) < 15 && Math.abs(ny - oy) < 48) nx = ox + 48;
              if (Math.abs(ny + 48 - oy) < 15 && Math.abs(nx - ox) < 48) ny = oy - 48;
              else if (Math.abs(ny - (oy + 48)) < 15 && Math.abs(nx - ox) < 48) ny = oy + 48;
            });
            box.style.left = nx + 'px'; box.style.top = ny + 'px';
            if (e.touches) e.preventDefault();
          };
          const up = () => { isDragging = false; box.style.zIndex = 1; };
          box.addEventListener('mousedown', down); window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);

    function bindFractionInteractions() {

      pizza.onclick = e => { const path = e.target.closest('[data-slice]'); if (!path) return; const i = Number(path.dataset.slice); state.fractionSelected.has(i) ? state.fractionSelected.delete(i) : state.fractionSelected.add(i); state.numerator = state.fractionSelected.size; updateFraction() };
      pizza.onkeydown = e => { if (!['Enter', ' '].includes(e.key)) return; const path = e.target.closest('[data-slice]'); if (path) { e.preventDefault(); path.dispatchEvent(new MouseEvent('click', { bubbles: true })) } };
      bindNumberlineDrag();
    }
    function bindNumberlineDrag() {
      const line = $('#numberline'), dot = $('#numberDot'); if (!line || !dot) return;
      const apply = e => { const r = line.getBoundingClientRect(), ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); setFractionCount(Math.round(ratio * state.denominator)) };
      const start = e => { e.preventDefault(); dot.classList.add('dragging'); const move = ev => apply(ev), up = ev => { apply(ev); removeEventListener('pointermove', move); removeEventListener('pointerup', up) }; addEventListener('pointermove', move); addEventListener('pointerup', up); apply(e) };
      line.onpointerdown = start; dot.onkeydown = e => { if (e.key === 'ArrowLeft') { e.preventDefault(); setFractionCount(state.numerator - 1) } if (e.key === 'ArrowRight') { e.preventDefault(); setFractionCount(state.numerator + 1) } };
    }

    function updateFraction() {
      $('#pizza').innerHTML = pizzaSlices(); $('#numText').textContent = state.numerator; $('#denText').textContent = state.denominator; renderNumberline();
      $('#fracExplain').innerHTML = `把一个整体平均分成 <b>${state.denominator}</b> 份，选中了其中 <b>${state.numerator}</b> 份，就是 <b>${state.numerator}/${state.denominator}</b>。`;
      bindNumberlineDrag();
    }
    function updateGeometry() {
      const r = $('#rectangle'); if (!r) return; r.style.width = `${state.geoW * 30}px`; r.style.height = `${state.geoH * 30}px`;
      $('#widthTag').textContent = state.geoW; $('#heightTag').textContent = state.geoH; $('#geoWVal').textContent = state.geoW; $('#geoHVal').textContent = state.geoH;
    }
    function captureGeoBoard() {
      const board = document.getElementById('geoBoard');
      const canvas = document.getElementById('geoCanvas');
      if (!board || !canvas) return canvas ? canvas.toDataURL() : '';

      const r = board.getBoundingClientRect();
      const w = Math.round(r.width);
      const h = Math.round(r.height);

      const snap = document.createElement('canvas');
      snap.width = w;
      snap.height = h;
      const ctx = snap.getContext('2d');

      // 1. Grid Background
      ctx.fillStyle = '#f2faf8';
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = 'rgba(155, 190, 183, 0.45)';
      ctx.lineWidth = 1;
      const step = 30;
      for (let x = 0; x <= w; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = 0; y <= h; y += step) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }

      // 2. Rectangle
      const rw = state.geoW * 30;
      const rh = state.geoH * 30;
      const rx = Math.round((w - rw) / 2);
      const ry = Math.round((h - rh) / 2);

      ctx.fillStyle = '#8cd8c8';
      ctx.fillRect(rx, ry, rw, rh);

      ctx.save();
      ctx.beginPath();
      ctx.rect(rx, ry, rw, rh);
      ctx.clip();
      ctx.strokeStyle = '#9fe1d3';
      ctx.lineWidth = 14;
      for (let p = -h - w; p < h + w; p += 28) {
        ctx.beginPath();
        ctx.moveTo(rx + p, ry);
        ctx.lineTo(rx + p + h, ry + h);
        ctx.stroke();
      }
      ctx.restore();

      ctx.strokeStyle = '#17324d';
      ctx.lineWidth = 4;
      ctx.strokeRect(rx, ry, rw, rh);

      // 3. Dimension numbers (no border, value only)
      ctx.font = '900 16px Nunito, "PingFang SC", sans-serif';
      ctx.fillStyle = '#17324d';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(String(state.geoW), w / 2, ry + rh + 7);

      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(state.geoH), rx + rw + 7, h / 2);

      // 4. Doodle Ink Canvas
      ctx.drawImage(canvas, 0, 0, w, h);

      return snap.toDataURL('image/png');
    }
    function checkDivision() {
      const q = $('#quotient'), r = $('#remainder'), box = $('#feedbackBox'), qv = Number(q.value), rv = Number(r.value); q.className = 'answer-box'; r.className = 'answer-box';
      if (qv === 4 && rv === 3) { q.classList.add('right'); r.classList.add('right'); box.className = 'feedback success'; box.innerHTML = '<b>✅ 正确！</b> 5 × 4 = 20，23 − 20 = 3，而且余数 3 小于除数 5。<div class="strategy-steps"><span>23</span><i>→</i><span>分成 5 组</span><i>→</i><span>每组 4</span><i>→</i><span>剩 3</span></div>'; confetti(); }
      else { q.classList.add('wrong'); r.classList.add('wrong'); box.className = 'feedback error'; let msg = rv >= 5 ? '余数不能大于或等于除数，否则还能继续分。' : qv === 5 ? '可能把“除数 5”直接写成了商。试试用乘法口诀找：5 × 几最接近 23？' : '先找 5 × 几小于且最接近 23，再用 23 减去这个积。'; box.innerHTML = `<b>🔎 暂时不对，但发现了有价值的线索：</b><br>${msg}`; }
    }

    function confetti() {
      const host = $('#screen'); const box = document.createElement('div'); box.className = 'confetti'; box.innerHTML = Array.from({ length: 26 }, (_, i) => `<i style="left:${Math.random() * 100}%;animation-delay:${Math.random() * .4}s;background:${['#ffb703', '#ef6f6c', '#167d74', '#7293d4'][i % 4]}"></i>`).join(''); host.appendChild(box); setTimeout(() => box.remove(), 2100);
    }
    function toast(text) { const t = $('#toast'); t.textContent = text; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 2200) }
    function fitLayout() {
      const wrap = $('.window-wrap'), browser = $('#browserWindow'), header = $('#pageHeader'); if (!wrap || !browser) return; const r = wrap.getBoundingClientRect(), width = Math.max(260, r.width - 14), height = Math.max(260, r.height - 16); browser.style.width = `${width}px`; browser.style.height = `${height}px`; if (header) header.style.width = `${width}px`;
    }
    function fitScene() {
      const screen = $('#screen'), scene = screen && screen.querySelector('.scene'); if (!screen || !scene) return;
      scene.style.zoom = '1'; scene.style.width = '100%'; scene.style.height = '100%'; scene.style.opacity = '1';
      const raw = Math.min(1, screen.clientWidth / Math.max(scene.scrollWidth, 1), screen.clientHeight / Math.max(scene.scrollHeight, 1));
      const scale = Number.isFinite(raw) ? Math.max(.58, raw) : 1;
      if (scale < .995) scene.style.zoom = String(scale);
    }
    function go(n) {
      clearInterval(state.mediaTimer); state.mediaTimer = null; state.mediaPlaying = false; cancelAnimationFrame(state.threeRaf); state.threeRaf = null; closeCollaboration();
      const nbC = document.getElementById('noteBoxContent'), nbT = document.getElementById('noteBoxTitle');
      if (nbC && nbT) { nbC.style.display = 'none'; nbT.style.display = 'block'; }
      state.step = n < 0 ? tour.length - 1 : n >= tour.length ? 0 : n; history.replaceState(null, '', `#step=${state.step + 1}`); render();
    }
    function drawArrows() {
      const stage = $('#stage'), group = $('#arrows'); if (!stage || innerWidth <= 860) { if (group) group.innerHTML = ''; return }
      document.querySelectorAll('.spotlight').forEach(x => x.classList.remove('spotlight'));
      const sr = stage.getBoundingClientRect(); let svg = '';
      ['left', 'right'].forEach(side => state.activeNotes.filter(note => note.side === side).forEach((note, slot) => {
        const anchor = $(`#${side}Anchor${slot}`), target = $(note.target); if (!anchor || !target) return; target.classList.add('spotlight');
        const a = anchor.getBoundingClientRect(), t = target.getBoundingClientRect();
        const x1 = a.left + a.width / 2 - sr.left, y1 = a.top + a.height / 2 - sr.top;
        const x2 = (side === 'left' ? t.left : t.right) - sr.left, y2 = t.top + t.height / 2 - sr.top; const bend = side === 'left' ? Math.min(x1 + 85, (x1 + x2) / 2) : Math.max(x1 - 85, (x1 + x2) / 2);
        const d = `M ${x1} ${y1} C ${bend} ${y1}, ${bend} ${y2}, ${x2} ${y2}`; svg += `<path class="arrow-path" d="${d}" marker-end="url(#arrowHead)"></path><circle class="arrow-halo" cx="${x2}" cy="${y2}" r="7"></circle>`;
      })); group.innerHTML = svg;
    }
    $('#prevBtn').onclick = () => go(state.step - 1); $('#nextBtn').onclick = () => go(state.step + 1);
    addEventListener('keydown', e => { if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return; if (e.key === 'ArrowRight') go(state.step + 1); if (e.key === 'ArrowLeft') go(state.step - 1) });
    addEventListener('resize', () => requestAnimationFrame(() => { fitLayout(); fitScene(); drawArrows() }));
    addEventListener('beforeunload', closeCollaboration);
    render();
  </script>
</body>
