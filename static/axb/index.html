<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>数轴 a × b</title>
  <style>
    :root {
      --bg-color: #FAF9F6;
      --axis-color: #1A1A1A;
      --tick-text: #222222;
      --point-a-color: #2563EB;
      --point-b-color: #EA580C;
      --point-c-color: #7C3AED;
      --panel-bg: rgba(255, 255, 255, 0.92);
      --panel-border: rgba(0, 0, 0, 0.08);
      --panel-shadow: 0 10px 30px -4px rgba(0, 0, 0, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
      --btn-hover: #f1f1ee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent !important;
      tap-highlight-color: transparent !important;
    }

    *:focus, *:active {
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }

    button, .tool-btn, .bottom-action-btn, .drag-point-top, .point-c-bottom, .square-badge, .format-option {
      -webkit-tap-highlight-color: transparent !important;
      -webkit-focus-ring-color: transparent !important;
      outline: none !important;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      position: relative;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent !important;
    }

    /* 顶部居中设问标题 */
    .top-title {
      position: fixed;
      top: 36px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      font-size: 26px;
      font-weight: 400;
      color: #1A1A1A;
      letter-spacing: 0.5px;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }

    .top-title .math-font {
      font-size: 32px;
      font-weight: 600;
      padding: 0 1px;
    }

    /* SVG 容器 */
    #axisContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* 交互图层（点拖拽） */
    #interactiveLayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: auto;
      touch-action: none;
      -webkit-tap-highlight-color: transparent !important;
    }

    /* 全屏手写画笔画布（极速流畅渲染） */
    #paintCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 30;
      pointer-events: none;
      cursor: crosshair;
      touch-action: none;
      -webkit-tap-highlight-color: transparent !important;
    }

    #paintCanvas.active {
      pointer-events: auto;
    }

    /* 数学字体 */
    .math-font {
      font-family: "KaTeX_Math", "Times New Roman", "Cambria Math", Georgia, serif;
      font-style: italic;
    }

    /* ==================== 动态点 a, b (数轴上方) ==================== */
    .drag-point-top {
      position: absolute;
      transform: translate(-50%, -100%);
      cursor: grab;
      touch-action: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 25;
      pointer-events: auto;
    }

    /* 拖拽状态：仅改变光标，绝不添加任何多余阴影或抖动 */
    .drag-point-top:active,
    .drag-point-top.dragging {
      cursor: grabbing;
      filter: none !important;
      box-shadow: none !important;
      outline: none !important;
    }

    /* 小正方形 Badge（字号38px，正方形58px） */
    .square-badge {
      width: 58px;
      height: 58px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 600;
      border: 3px solid currentColor;
      background: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: relative;
    }

    .drag-point-top:active .square-badge,
    .drag-point-top.dragging .square-badge {
      box-shadow: 0 2px 8px rgba(0,0,0,0.06) !important;
      transform: none !important;
    }

    /* ==================== 数值与假分数展示排版系统 ==================== */
    .point-val-tag {
      position: absolute;
      left: 50%;
      transform: translateX(-50%) scale(0.95);
      color: currentColor;
      background: transparent !important;
      box-shadow: none !important;
      border: none !important;
      padding: 0;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 点 a, b 数值位于正方形正上方（留14px呼吸间距） */
    .drag-point-top .point-val-tag {
      bottom: calc(100% + 14px);
      top: auto;
    }

    /* 点 c 数值位于正方形正下方（留14px呼吸间距） */
    .point-c-bottom .point-val-tag {
      top: calc(100% + 14px);
      bottom: auto;
    }

    /* 仅在点击右下角“显示”激活 show-all-values 时才展示数值 */
    #interactiveLayer.show-all-values .point-val-tag {
      opacity: 1 !important;
      visibility: visible !important;
      transform: translateX(-50%) scale(1) !important;
    }

    /* 整数与小数大字号 (40px) */
    .val-num {
      font-size: 40px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.5px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 纯 CSS 分数排版组件（仅真分数与假分数，无带分数） */
    .fraction-display {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    /* 分数主体（分子、水平线、分母） */
    .frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      padding: 0 2px;
    }

    /* 分子与分母字号严格为 32px */
    .frac-num, .frac-den {
      display: block;
      font-size: 32px;
      font-weight: 600;
      line-height: 1;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .frac-num {
      padding-bottom: 4px;
    }

    .frac-den {
      padding-top: 4px;
    }

    /* 分数横线 (3.5px) */
    .frac-bar {
      display: block;
      width: 100%;
      min-width: 26px;
      height: 3.5px;
      background-color: currentColor;
      border-radius: 2px;
    }

    /* 竖直指引线 */
    .pin-line-top {
      width: 2.5px;
      height: 32px;
      background: currentColor;
    }

    /* 精确落在数轴轴线正中的 10px 实心圆点 */
    .pin-head-top {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
      margin-bottom: -5px;
      flex-shrink: 0;
    }

    /* 点 a 个性化（海波蓝） */
    #pointHandleA {
      color: var(--point-a-color);
    }
    #pointHandleA .square-badge {
      color: var(--point-a-color);
    }
    #pointHandleA .point-val-tag {
      color: var(--point-a-color);
    }

    /* 点 b 个性化（橙红色） */
    #pointHandleB {
      color: var(--point-b-color);
    }
    #pointHandleB .square-badge {
      color: var(--point-b-color);
    }
    #pointHandleB .point-val-tag {
      color: var(--point-b-color);
    }

    /* ==================== 字母 c 结果点 (数轴下方) ==================== */
    .point-c-bottom {
      position: absolute;
      transform: translate(-50%, 0);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 22;
      color: var(--point-c-color);
      pointer-events: auto;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1), transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .point-c-bottom.visible {
      opacity: 1;
      visibility: visible;
    }

    .pin-head-bottom {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
      margin-top: -5px;
      flex-shrink: 0;
    }

    .pin-line-bottom {
      width: 2.5px;
      height: 52px;
      background: currentColor;
    }

    .point-c-bottom .square-badge {
      color: var(--point-c-color);
    }

    /* ==================== 左下角“小数 / 分数”切换组件 ==================== */
    .format-switch {
      position: fixed;
      bottom: 24px;
      left: 28px;
      z-index: 50;
      height: 44px;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      padding: 3px;
      display: flex;
      flex-direction: row;
      align-items: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      touch-action: manipulation;
    }

    .format-option {
      height: 38px;
      padding: 0 16px;
      border-radius: 19px;
      border: none;
      background: transparent;
      color: #4B5563;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
      touch-action: manipulation;
    }

    .format-option:hover {
      color: #111827;
    }

    .format-option.active {
      background: #18181B;
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    /* ==================== 画笔工具条 (底部居中水平放置) ==================== */
    .drawing-toolbar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 30px;
      padding: 7px 18px;
      box-shadow: var(--panel-shadow);
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      touch-action: auto;
    }

    .tool-btn {
      height: 38px;
      padding: 0 12px;
      border-radius: 19px;
      border: 1.5px solid transparent;
      background: transparent;
      color: #374151;
      cursor: pointer;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      gap: 6px;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    .tool-btn:hover {
      background: var(--btn-hover);
      color: #111827;
    }

    .tool-btn.active {
      background: #18181B;
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(0,0,0,0.14);
    }

    .tool-btn svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tool-divider-v {
      width: 1px;
      height: 20px;
      background: rgba(0, 0, 0, 0.1);
      margin: 0 2px;
    }

    /* 调色板（默认红色，无黑色） */
    .color-palette {
      display: flex;
      flex-direction: row;
      gap: 10px;
      align-items: center;
    }

    .color-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #FFFFFF;
      box-shadow: 0 1px 4px rgba(0,0,0,0.18);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      touch-action: manipulation;
    }

    .color-dot:hover {
      transform: scale(1.15);
    }

    .color-dot.active {
      transform: scale(1.25);
      box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 3.5px #18181B;
    }

    /* 撤销与清除按钮 */
    .tool-btn:active {
      transform: scale(0.96);
    }

    /* ==================== 右下角“显示”按钮 ==================== */
    .bottom-action-btn {
      position: fixed;
      bottom: 24px;
      right: 28px;
      z-index: 50;
      height: 44px;
      padding: 0 24px;
      border-radius: 22px;
      border: 1px solid var(--panel-border);
      background: #18181B;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      touch-action: manipulation;
    }

    .bottom-action-btn:hover {
      background: #27272A;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
    }

    .bottom-action-btn.active {
      background: var(--point-c-color);
      border-color: rgba(124, 58, 237, 0.3);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.3);
    }

    .btn-badge {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10B981;
    }

    .bottom-action-btn.active .btn-badge {
      background: #FCD34D;
    }

    /* 画笔切换弱提示 */
    #drawHint {
      position: fixed;
      top: 86px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 45;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 13px;
      color: #4B5563;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    #drawHint.show {
      opacity: 1;
    }

    @media (max-width: 640px) {
      .top-title {
        top: 20px;
        font-size: 19px;
      }
      .top-title .math-font {
        font-size: 24px;
      }
      #drawHint {
        top: 66px;
      }
      .format-switch {
        bottom: 20px;
        left: 14px;
      }
      .bottom-action-btn {
        bottom: 20px;
        right: 14px;
        padding: 0 18px;
      }
    }
  </style>
</head>
<body>

  <!-- 顶上居中显示设问 -->
  <div class="top-title">
    <span class="math-font">a</span> × <span class="math-font">b</span> = <span class="math-font">c</span>，请你在数轴上标出点 <span class="math-font">c</span> 的位置？
  </div>

  <!-- SVG 绘制底层数轴 (仅 0 ~ 2 刻度，左右留出适宜空白) -->
  <svg id="axisContainer" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- 纯黑锐利箭头，完全对照 SCR-20260920-rxxw.png -->
      <marker id="axisArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
        <path d="M 1 2 L 11 6 L 1 10 L 3.5 6 Z" fill="#1A1A1A"/>
      </marker>
    </defs>
    <!-- 主轴横线 -->
    <path id="axisLine" stroke="#1A1A1A" stroke-width="3" stroke-linecap="square" marker-end="url(#axisArrow)"/>
    
    <!-- 刻度线组（仅 0, 1, 2）与下方数字 -->
    <g id="ticksGroup"></g>
    <g id="labelsGroup"></g>
  </svg>

  <!-- 全屏手写画笔画布（desynchronized 极速渲染） -->
  <canvas id="paintCanvas"></canvas>

  <!-- 交互层：点 a, b (上方小正方形) 与 c (下方小正方形) -->
  <div id="interactiveLayer">
    <!-- 点 a (数轴上方小正方形) -->
    <div id="pointHandleA" class="drag-point-top" title="拖拽调整点 a 的位置">
      <div class="point-val-tag" id="tagA"></div>
      <div class="square-badge math-font">a</div>
      <div class="pin-line-top"></div>
      <div class="pin-head-top"></div>
    </div>

    <!-- 点 b (数轴上方小正方形) -->
    <div id="pointHandleB" class="drag-point-top" title="拖拽调整点 b 的位置">
      <div class="point-val-tag" id="tagB"></div>
      <div class="square-badge math-font">b</div>
      <div class="pin-line-top"></div>
      <div class="pin-head-top"></div>
    </div>

    <!-- 点 c = a × b (数轴下方小正方形) -->
    <div id="pointHandleC" class="point-c-bottom" title="乘积 c = a × b">
      <div class="pin-head-bottom"></div>
      <div class="pin-line-bottom"></div>
      <div class="square-badge math-font">c</div>
      <div class="point-val-tag" id="tagC"></div>
    </div>
  </div>

  <!-- 提示 -->
  <div id="drawHint">已开启画笔涂鸦模式</div>

  <!-- 左下角“小数、分数”切换按钮（默认分数） -->
  <div class="format-switch" id="formatSwitch">
    <button class="format-option active" id="btnFrac" data-mode="fraction">分数</button>
    <button class="format-option" id="btnDec" data-mode="decimal">小数</button>
  </div>

  <!-- 画笔工具条 (底部居中水平放置，默认红色，无粗细调整与黑色) -->
  <div class="drawing-toolbar" id="drawingToolbar">
    <!-- 拖动模式 -->
    <button class="tool-btn active" id="btnSelectMode" title="选择与拖动模式 (V)">
      <svg viewBox="0 0 24 24">
        <path d="M4 4l7 17 2.5-6.5L20 12z"/>
      </svg>
      <span>拖动</span>
    </button>

    <!-- 画笔模式 -->
    <button class="tool-btn" id="btnPenMode" title="画笔涂鸦模式 (P)">
      <svg viewBox="0 0 24 24">
        <path d="M12 19l7-7 3 3-7 7-3-3z"/>
        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18z"/>
        <path d="M2 2l7.586 7.586"/>
        <circle cx="11" cy="11" r="2"/>
      </svg>
      <span>画笔</span>
    </button>

    <div class="tool-divider-v"></div>

    <!-- 常用颜色（默认红色，无黑色） -->
    <div class="color-palette" id="colorPalette">
      <div class="color-dot active" data-color="#DC2626" style="background-color: #DC2626;" title="重点红 (默认)"></div>
      <div class="color-dot" data-color="#2563EB" style="background-color: #2563EB;" title="海波蓝"></div>
      <div class="color-dot" data-color="#F59E0B" style="background-color: #F59E0B;" title="荧光橙黄"></div>
      <div class="color-dot" data-color="#10B981" style="background-color: #10B981;" title="清新绿"></div>
    </div>

    <div class="tool-divider-v"></div>

    <!-- 撤销按钮 -->
    <button class="tool-btn" id="btnUndo" title="撤销上一笔 (Ctrl+Z)">
      <svg viewBox="0 0 24 24">
        <path d="M9 14L4 9l5-5"/>
        <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
      </svg>
      <span>撤销</span>
    </button>

    <!-- 清除画板 -->
    <button class="tool-btn" id="btnClear" title="清除所有画迹 (C)">
      <svg viewBox="0 0 24 24">
        <path d="M3 6h18"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        <line x1="10" y1="11" x2="10" y2="17"/>
        <line x1="14" y1="11" x2="14" y2="17"/>
      </svg>
      <span>清除</span>
    </button>
  </div>

  <!-- 右下角“显示”切换按钮 -->
  <button class="bottom-action-btn" id="btnToggleProd">
    <span class="btn-badge"></span>
    <span id="btnToggleProdText">显示</span>
